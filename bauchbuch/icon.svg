<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bauchbuch">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2029"/>
      <stop offset="1" stop-color="#141013"/>
    </linearGradient>
    <linearGradient id="blatt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3d0"/>
      <stop offset="1" stop-color="#f06a9e"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#ff7fb0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff7fb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#hg)"/>
  <rect width="512" height="512" rx="112" fill="url(#schein)"/>

  <!-- Ein aufgeschlagenes Buch: zwei Seiten, die sich am Bund treffen. -->
  <g id="marke" fill="url(#blatt)">
    <path d="M250 176c-30-22-76-30-122-26a10 10 0 0 0-9 10v170a10 10 0 0 0 11 10c40-4 82 3 108 22 6 5 12 1 12-6z"/>
    <path d="M262 176c30-22 76-30 122-26a10 10 0 0 1 9 10v170a10 10 0 0 1-11 10c-40-4-82 3-108 22-6 5-12 1-12-6z"/>
    <!-- Der Eintrag von heute: drei Zeilen auf der rechten Seite. -->
    <g fill="#141013" opacity="0.42">
      <rect x="292" y="204" width="76" height="13" rx="6.5"/>
      <rect x="292" y="238" width="60" height="13" rx="6.5"/>
      <rect x="292" y="272" width="70" height="13" rx="6.5"/>
    </g>
  </g>
</svg>
