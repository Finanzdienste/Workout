<style>
/*
 * Ein Blatt für alles. Keine Voreinstellung von außen, kein Baukasten.
 *
 * Dunkel als Grundton, und das hat hier einen Grund über den Geschmack hinaus:
 * Ein Magentagebuch wird oft nachts aufgemacht, wenn jemand davon wach
 * geworden ist. Ein weißes Bild ist in diesem Moment eine Zumutung.
 *
 * Die Farben liegen als Variablen auf :root, die Farbwahl ändert nur die
 * Akzente – Hintergrund, Linien und die Ampel von grün bis rot bleiben, damit
 * ein Verlauf in jeder Einstellung gleich zu lesen ist.
 */

:root {
  /* Der Grund bleibt dunkel und wird nur warm getönt statt neutral grau: Ein
     rosa Akzent auf blaustichigem Grau wird schmutzig, auf einem Grund mit
     einem Hauch Rot bleibt er rosa. */
  --bg: #141013;
  --bg-elev: #1c171b;
  --bg-elev-2: #251f24;
  --line: #362c33;
  --text: #efe9ec;
  --muted: #a5959e;
  --accent: #ff7fb0;
  --accent-weich: #ff7fb022;
  /* Die Ampel des Verlaufs. Vier Stufen, und sie bleiben in jeder Farbwahl
     gleich: Ein Kalender, dessen Farben mit dem Design wandern, ist nach dem
     dritten Umstellen nicht mehr zu lesen.

     --leicht ist bewusst kein Grün und auch nicht die Akzentfarbe. Vorher war
     es die – und weil der Grundton dieser App salbeigrün ist, sahen ein
     beschwerdefreier Tag und ein Tag mit Stärke 2 im Monatsraster fast gleich
     aus. Genau diese beiden auseinanderzuhalten ist der Zweck des Rasters. */
  --ok: #58c48c;
  --leicht: #c2bd57;
  --warn: #dda03f;
  --bad: #e07268;
  /* Damit der Browser auch seine eigenen Bedienelemente dunkel zeichnet –
     ohne das stehen die Datums- und Uhrzeitfelder als weiße Kästen im
     dunklen Blatt. */
  color-scheme: dark;
  --radius: 14px;
  --tabbar-h: 60px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

:root[data-theme="flieder"] { --accent: #c79bec; --accent-weich: #c79bec22; }
:root[data-theme="koralle"] { --accent: #ff8f7a; --accent-weich: #ff8f7a22; }
:root[data-theme="salbei"]  { --accent: #6dbf9a; --accent-weich: #6dbf9a22; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  /* Kein Ziehen-zum-Neuladen: Am oberen Rand nach unten zu wischen lud sonst
     die Seite neu und warf aus dem Bogen, den man gerade ausfüllt. */
  overscroll-behavior-y: contain;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

body.bogen-auf { overflow: hidden; }

button { font: inherit; color: inherit; }
h2, h3 { margin: 0 0 8px; }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }

/* ---------- Kopf ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-in {
  max-width: 680px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.brand { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .3px; }
.brand::before {
  content: "";
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
}
.brand-sub { margin: 0; font-size: 12px; color: var(--muted); }

/* ---------- Rumpf ---------- */
.view {
  max-width: 680px;
  margin: 0 auto;
  padding: 14px 14px calc(var(--tabbar-h) + var(--safe-b) + 22px);
}
.view:focus { outline: none; }

.karte {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.karte.warn { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg-elev)); }
.karte.hinweis { background: none; }

.klein { font-size: 13px; color: var(--muted); }
.klein.warnend { color: var(--warn); }
.leer {
  color: var(--muted);
  text-align: center;
  padding: 26px 10px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  margin-bottom: 12px;
}
.feld-name { font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
.reihe { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.reihe-zeit { margin-bottom: 4px; }

/* ---------- Knöpfe ---------- */
.btn {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 14px;
  cursor: pointer;
  min-height: 44px;
}
.btn:disabled { opacity: .35; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #1a1014; font-weight: 600; }
.btn-ghost { background: none; }
.btn-danger { background: none; border-color: var(--bad); color: var(--bad); }
.btn-block { display: block; width: 100%; }
.btn-rund { width: 44px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 1; }

.feld {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 12px;
  color: var(--text);
  min-height: 44px;
  font: inherit;
}
.feld-breit { display: block; width: 100%; }
.feld:focus-visible, .btn:focus-visible, .marke:focus-visible, .stufe:focus-visible,
.tab:focus-visible, .feld-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Tagkopf ---------- */
.tagkopf { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.tagkopf-mitte { flex: 1; text-align: center; }
.tagkopf-mitte h2 { margin: 0; }
.tag-datum {
  background: none; border: none; color: var(--muted);
  font: inherit; font-size: 13px; padding: 0;
}

.strang-text {

  cursor: pointer; font: inherit; min-height: 36px;
}
.strang-text b { font-weight: 600; display: block; font-size: 15px; }
.zeile-tags { display: block; font-size: 12px; color: var(--muted); }
.strang-weg {
  background: none; border: none; color: var(--muted);
  font-size: 22px; line-height: 1; cursor: pointer;
  width: 36px; height: 36px; border-radius: 50%;
}
.strang-weg:active { background: var(--bg-elev-2); }

.marken { display: flex; flex-wrap: wrap; gap: 6px; }
.marke {

}

.vier { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.vier-btn {
  background: var(--bg-elev-2); border: 1px solid var(--line);
  border-radius: 9px; padding: 9px 2px; font-size: 12px; cursor: pointer; min-height: 42px;
}
.vier-btn.an { background: var(--accent-weich); border-color: var(--accent); }

.wahl { display: flex; gap: 6px; flex-wrap: wrap; }

.marken-eng { margin-top: 6px; }

.zutat-rolle { flex: none; min-height: 38px; padding: 6px 8px; font-size: 13px; }

.rollen { list-style: none; margin: 8px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); }
.rollen li {
  display: flex; justify-content: space-between; gap: 8px;

}
.rollen li > .klein { white-space: nowrap; }

/* ---------- Kacheln und Tafel ---------- */
.kacheln { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.kachel {
  background: var(--bg-elev); border: 1px solid var(--line);

}

/* ---------- Rat für heute ---------- */
.rat > h3 { margin-bottom: 10px; }

<script type="module">
/* ===== js/datum.js ===== */
/*
 * Datum und Uhrzeit – die unterste Schicht. Hängt von nichts ab.
 *
 * Ein Tagebuch rechnet dauernd mit Zeit, und zwar mit *örtlicher* Zeit: Wer um
 * halb elf abends isst und um eins nachts Beschwerden bekommt, hat einen
 * Zusammenhang erlebt, den keine Tagesgrenze zerschneiden darf. Deshalb steht
 * hier neben dem Datum auch der Zeitpunkt – Datum plus Uhrzeit, zusammen
 * gerechnet.
 *
 * Alles in Ortszeit, nichts in UTC. Die Alternative wäre ein Eintrag, der nach
 * einer Reise oder der Zeitumstellung auf einem anderen Tag steht als dem, an
 * dem er gemacht wurde.
 */

const WOCHENTAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
  'August', 'September', 'Oktober', 'November', 'Dezember'];

/** Kürzel der Wochentage, montags zuerst – so steht ein Kalender hierzulande. */
const WOCHE_KOPF = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

const pad2 = (n) => String(n).padStart(2, '0');

function zuISO(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function heuteISO() {
  return zuISO(new Date());
}

/** Aktuelle Uhrzeit als "HH:MM". */
function jetztUhr() {
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function ausISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function plusTage(iso, tage) {
  if (!tage) return iso;
  const d = ausISO(iso);
  d.setDate(d.getDate() + tage);
  return zuISO(d);
}

/** Ganze Tage von isoA bis isoB; positiv, wenn isoB später liegt. */
function tageDazwischen(isoA, isoB) {
  return Math.round((ausISO(isoB) - ausISO(isoA)) / 86400000);
}

/**
 * Ein Zeitpunkt aus Datum und Uhrzeit, als Millisekunden.
 *
 * Fehlt die Uhrzeit oder ist sie unbrauchbar, gilt Mittag statt Mitternacht:
 * Ein Eintrag ohne Uhrzeit soll innerhalb seines Tages liegen und nicht am
 * Rand, wo er beim Rechnen mit Zeitfenstern in den Vortag rutscht.
 */
function zeitpunkt(iso, uhr) {
  const d = ausISO(iso);
  const m = /^(\d{1,2}):(\d{2})$/.exec(uhr || '');
  if (m) d.setHours(Number(m[1]), Number(m[2]), 0, 0);
  else d.setHours(12, 0, 0, 0);
  return d.getTime();
}

/** Stunden von a nach b; positiv, wenn b später liegt. */
function stundenDazwischen(a, b) {
  return (b - a) / 3600000;
}

/** Minuten seit Mitternacht – zum Sortieren innerhalb eines Tages. */
function minutenAmTag(uhr) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(uhr || '');
  return m ? Number(m[1]) * 60 + Number(m[2]) : 12 * 60;
}

function fmtDatum(iso, lang) {
  const d = ausISO(iso);
  const wd = WOCHENTAGE[d.getDay()];
  if (lang) return `${wd}, ${d.getDate()}. ${MONATE[d.getMonth()]} ${d.getFullYear()}`;
  return `${wd}, ${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.`;
}

function fmtMonat(iso) {
  const d = ausISO(iso);
  return `${MONATE[d.getMonth()]} ${d.getFullYear()}`;
}

/** "heute", "gestern" oder das Datum – für Überschriften. */
function fmtTag(iso) {
  const abstand = tageDazwischen(iso, heuteISO());
  if (abstand === 0) return 'heute';
  if (abstand === 1) return 'gestern';
  if (abstand === -1) return 'morgen';
  return fmtDatum(iso, true);
}

/** Erster Tag des Monats, in dem `iso` liegt. */
function monatsStart(iso) {
  return `${iso.slice(0, 7)}-01`;
}

/** `n` Monate weiter, immer auf den Ersten. Über Jahresgrenzen hinweg. */
function plusMonate(iso, n) {
  const d = ausISO(monatsStart(iso));
  d.setMonth(d.getMonth() + n);
  return zuISO(d);
}

/**
 * Alle Tage, die ein Monatsraster zeigt: ganze Wochen von Montag bis Sonntag,
 * vorn und hinten mit den Nachbarmonaten aufgefüllt.
 */
function monatsRaster(iso) {
  const erster = ausISO(monatsStart(iso));
  const vorlauf = (erster.getDay() + 6) % 7;          // Mo = 0
  // Monatslänge über den Abstand zum nächsten Ersten. Math.round, weil eine
  // Zeitumstellung im Monat sonst eine Stunde fehlen ließe.
  const laenge = Math.round((ausISO(plusMonate(iso, 1)) - erster) / 86400000);
  const felder = Math.ceil((vorlauf + laenge) / 7) * 7;
  const raus = [];
  for (let i = 0; i < felder; i++) {
    const d = new Date(erster);
    d.setDate(d.getDate() - vorlauf + i);
    raus.push(zuISO(d));
  }
  return raus;
}

/**
 * Grobe Tageszeit einer Uhrzeit. Für die Frage, wann die Beschwerden kommen –
 * nachts ist eine andere Auskunft als nach dem Mittagessen.
 */
function tageszeit(uhr) {
  const m = minutenAmTag(uhr);
  if (m < 5 * 60) return 'nacht';
  if (m < 11 * 60) return 'morgen';
  if (m < 15 * 60) return 'mittag';
  if (m < 19 * 60) return 'nachmittag';
  return 'abend';
}

const TAGESZEIT_NAME = {
  nacht: 'nachts',
  morgen: 'morgens',
  mittag: 'mittags',
  nachmittag: 'nachmittags',
  abend: 'abends',
};

/*
 * Text und Zahlen fürs Auge. Hängt von nichts ab und darf deshalb überall
 * benutzt werden.
 */

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/** Zahl in deutscher Schreibweise, ohne unnötige Null hinter dem Komma. */
function fmtZahl(n, stellen = 1) {
  if (!Number.isFinite(n)) return '–';
  return Number.isInteger(n) ? String(n) : String(+n.toFixed(stellen)).replace('.', ',');
}

function mehrzahl(n, eins, viele) {
  return `${n} ${n === 1 ? eins : viele}`;
}

/**
 * Lange Eingaben kürzen, ohne mitten im Wort abzubrechen.
 *
 * Gebraucht in der Tagesliste: „Was gegessen?" ist ein freies Feld, und
 * jemand, der ein ganzes Menü hineinschreibt, soll die Liste nicht sprengen.
 */
function kuerze(s, max = 60) {
  const t = String(s).trim();
  if (t.length <= max) return t;
  const schnitt = t.slice(0, max);
  const luecke = schnitt.lastIndexOf(' ');
  return `${(luecke > max * 0.6 ? schnitt.slice(0, luecke) : schnitt).trimEnd()} …`;
}

/**

 * Eingetragen wird frei: „Pantoprazol 20mg", „pantoprazol", „Panto". Deshalb
 * wird kleingeschrieben verglichen und geprüft, ob eines der Beispiele im

 */
function wissenZu(name) {
  const gesucht = String(name || '').toLowerCase().trim();
  if (!gesucht) return null;
  return ALLE.find((g) => g.beispiele.some((b) => gesucht.includes(b.toLowerCase())))
    || ALLE.find((g) => gesucht.includes(g.gruppe.toLowerCase()))

}

/* ===== js/klang.js ===== */
/*
 * Töne – erzeugt, nicht geladen.
 *
 * Die Atemübung führt jemand mit geschlossenen Augen durch. Der Ton ist dann
 * nicht Beiwerk, sondern die ganze Bedienoberfläche: Er sagt, wann eingeatmet
 * wird, wann gehalten und wann ausgeatmet.
 *
 * Deshalb keine Audiodateien. Eine Datei wäre ein Download, in der
 * Ein-Datei-Fassung ein halbes Megabyte base64, und ohne Netz womöglich gar
 * nicht da. Hier entstehen die Töne im Browser aus einem Oszillator: ein paar
 * Zeilen, kein Byte Ladelast, funktioniert offline und in der einen Datei
 * gleichermaßen.
 *
 * Klanglich bewusst weich: Sinuston, sanft ein- und ausgeblendet. Ein harter
 * Anschlag reißt genau die Anspannung wieder hoch, gegen die die Übung läuft.
 */

let kontext = null;

/**
 * Den Tonkontext holen – und zwar erst, wenn wirklich ein Ton kommen soll.
 *
 * Browser lassen Audio nur nach einer Nutzergeste zu. Ein Kontext, der beim
 * Laden der Seite entsteht, startet gesperrt und bleibt es; einer, der beim
 * Druck auf „Start" entsteht, läuft.
 */
function holeKontext() {
  if (kontext) return kontext;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    kontext = new AC();
  } catch {
    return null;
  }
  return kontext;
}

/** Nach einer Pause im Hintergrund steht der Kontext still. */
function weckKlang() {
  const k = holeKontext();
  if (k && k.state === 'suspended') k.resume().catch(() => {});
  return !!k;
}

/**
 * Ein einzelner weicher Ton.
 *
 * @param {number} hz     Tonhöhe
 * @param {number} dauer  Sekunden
 * @param {number} laut   0 bis 1
 */
function ton(hz, dauer = 0.35, laut = 0.18) {
  const k = holeKontext();
  if (!k) return;
  if (k.state === 'suspended') k.resume().catch(() => {});
  const jetzt = k.currentTime;
  const osz = k.createOscillator();
  const huelle = k.createGain();
  osz.type = 'sine';
  osz.frequency.setValueAtTime(hz, jetzt);
  // Ein- und ausblenden über je 60 ms. Ohne das knackt es an beiden Enden,
  // und ein Knacken im Ohr ist bei geschlossenen Augen doppelt unangenehm.
  huelle.gain.setValueAtTime(0.0001, jetzt);
  huelle.gain.exponentialRampToValueAtTime(laut, jetzt + 0.06);
  huelle.gain.setValueAtTime(laut, jetzt + Math.max(0.07, dauer - 0.06));
  huelle.gain.exponentialRampToValueAtTime(0.0001, jetzt + dauer);
  osz.connect(huelle).connect(k.destination);
  osz.start(jetzt);
  osz.stop(jetzt + dauer + 0.02);
}

/*
 * Die Töne der Atemübung. Drei Höhen, die man auch schlaftrunken
 * auseinanderhält: aufwärts heißt einatmen, gleichbleibend heißt halten,
 * abwärts heißt ausatmen.
 */
const KLAENGE = {
  ein: () => { ton(523.25, 0.3); setTimeout(() => ton(659.25, 0.34), 110); },
  halten: () => ton(587.33, 0.22, 0.12),
  aus: () => { ton(523.25, 0.3); setTimeout(() => ton(392.0, 0.5), 110); },
  fertig: () => {
    ton(523.25, 0.5, 0.16);
    setTimeout(() => ton(659.25, 0.5, 0.16), 160);
    setTimeout(() => ton(783.99, 0.9, 0.16), 320);
  },
  tick: () => ton(880, 0.06, 0.05),
};

/** Ein kurzer Rüttler, wo das Gerät ihn kann – hilft, wenn es leise sein muss. */
function ruettel(muster) {
  try {
    if (navigator.vibrate) navigator.vibrate(muster);
  } catch { /* dann eben nicht */ }
}

/* ===== js/atem.js ===== */
/*
 * Atemübungen – die Daten dazu, nicht der Ablauf.
 *
 * Warum in einem Magentagebuch: Bauch und Nervensystem hängen zusammen, und
 * zwar in beide Richtungen. Langes Ausatmen schaltet messbar auf den Teil des
 * Nervensystems um, unter dem der Darm arbeitet statt stillzustehen. Bei
 * stressgebundenen Beschwerden ist das keine Beschäftigungstherapie, sondern
 * das Mittel, das man ohne Rezept und ohne Nebenwirkung hat.
 *
 * Deshalb ist bei allen Übungen hier das Ausatmen mindestens so lang wie das
 * Einatmen. Umgekehrt – kurz aus, lang ein – täte das Gegenteil.
 *
 * Reine Daten, keine Abhängigkeiten. Wer die Übung *ausführt*, ist js/app.js;
 * getaktet wird sie mit den Tönen aus js/klang.js.
 */

/**
 * Eine Übung besteht aus Phasen. `sek: 0` heißt: Phase fällt weg.
 *
 * `runden` ist der Vorschlag, nicht die Vorschrift – wer mehr will, stellt um.
 */
const UEBUNGEN = [
  {
    id: '478',
    name: '4–7–8',
    zweck: 'Zum Runterkommen und zum Einschlafen',
    beschreibung: 'Vier Sekunden durch die Nase ein, sieben halten, acht durch '

      + 'die Verpackung. Wenn sieben Sekunden Halten zu lang sind, ist es keine '
      + 'schlechtere Übung, wenn man kürzer macht.',
    runden: 4,
    phasen: [
      { art: 'ein', sek: 4, wort: 'Einatmen' },
      { art: 'halten', sek: 7, wort: 'Halten' },
      { art: 'aus', sek: 8, wort: 'Ausatmen' },
    ],
  },
  {
    id: 'box',
    name: 'Quadrat',
    zweck: 'Wenn der Kopf rattert',
    beschreibung: 'Vier ein, vier halten, vier aus, vier halten. Der gleiche '
      + 'Takt in alle vier Richtungen gibt dem Denken etwas zu tun, ohne es zu '
      + 'beschäftigen.',
    runden: 6,
    phasen: [
      { art: 'ein', sek: 4, wort: 'Einatmen' },
      { art: 'halten', sek: 4, wort: 'Halten' },
      { art: 'aus', sek: 4, wort: 'Ausatmen' },
      { art: 'halten', sek: 4, wort: 'Halten' },
    ],
  },
  {
    id: 'kohaerenz',
    name: 'Gleichmaß',
    zweck: 'Für zwischendurch, auch im Sitzen am Schreibtisch',
    beschreibung: 'Fünfeinhalb Sekunden ein, fünfeinhalb aus, ohne Halten – gut '
      + 'sechs Atemzüge in der Minute. Der Takt, bei dem Puls und Atem in einen '
      + 'gemeinsamen Rhythmus fallen. Unauffällig genug für den Bus.',
    runden: 10,
    phasen: [
      { art: 'ein', sek: 5.5, wort: 'Einatmen' },
      { art: 'aus', sek: 5.5, wort: 'Ausatmen' },
    ],
  },
  {
    id: 'bauch',
    name: 'Bauchatmung',
    zweck: 'Direkt auf den Bauch, bei Druck und Krämpfen',
    beschreibung: 'Eine Hand auf den Bauch, vier Sekunden so einatmen, dass sich '
      + 'die Hand hebt und nicht die Schulter, sechs Sekunden aus. Das Zwerchfell '
      + 'massiert dabei, was darunter liegt.',
    runden: 8,
    phasen: [
      { art: 'ein', sek: 4, wort: 'Einatmen, Bauch hebt sich' },
      { art: 'aus', sek: 6, wort: 'Ausatmen, Bauch senkt sich' },
    ],
  },
];

const MAP = Object.fromEntries(UEBUNGEN.map((u) => [u.id, u]));

function uebungVon(id) {
  return MAP[id] || UEBUNGEN[0];
}

/** Wie lange eine Runde dauert, in Sekunden. */
function rundenDauer(uebung) {
  return uebung.phasen.reduce((s, p) => s + p.sek, 0);
}

/** Die ganze Übung, in Sekunden – für die Anzeige „etwa 2 Minuten". */
function gesamtDauer(uebung, runden) {
  return rundenDauer(uebung) * (runden || uebung.runden);
}

function dauerText(sekunden) {
  const m = Math.round(sekunden / 60);
  if (sekunden < 90) return `${Math.round(sekunden)} Sekunden`;
  return `${m} Minuten`;
}

/**
 * Der Ablauf als flache Liste: jede Phase jeder Runde, einmal ausgerollt.
 *
 * Ausgerollt statt gerechnet, weil der Ablauf dadurch selbst zum Prüfgegenstand
 * wird – man kann ihn ansehen und nachzählen, statt einer Schleife zu glauben.
 */
function ablauf(uebung, runden) {
  const n = runden || uebung.runden;
  const schritte = [];
  for (let r = 1; r <= n; r++) {
    uebung.phasen.forEach((p, i) => {
      schritte.push({
        runde: r,
        von: n,
        art: p.art,
        wort: p.wort,
        sek: p.sek,
        letzte: r === n && i === uebung.phasen.length - 1,
      });
    });
  }
  return schritte;
}

/* ===== js/zyklus.js ===== */
/*
 * Der Zyklus – gerechnet aus dem, was eingetragen wurde, und aus nichts sonst.
 *
 * Warum das in ein Magentagebuch gehört: Bei vielen Menschen schwanken
 * Übelkeit, Blähungen, Sodbrennen und Appetit mit dem Zyklus, und wer das
 * nicht mitzählt, sucht die Ursache vier Wochen lang im Essen. Ein Muster, das
 * sich alle vier Wochen wiederholt, sieht man nur, wenn man weiß, wo die
 * Wochen anfangen.
 *
 * WOFÜR DAS HIER NICHT TAUGT, und das ist keine Formalie:
 *
 *   * **Nicht zur Verhütung.** Der Eisprung wird hier nicht gemessen, sondern
 *     aus der halben Zykluslänge geschätzt. Er verschiebt sich, und zwar
 *     gerade dann, wenn jemand krank ist oder unter Druck steht – also genau
 *     in den Zeiträumen, um die es in dieser App geht.
 *   * **Nicht als Vorhersage.** „Nächste Periode am …" steht nirgends. Eine
 *     Zahl, die aus drei beobachteten Zyklen stammt, sieht genauso aus wie
 *     eine, die aus dreißig stammt – und wird genauso geglaubt.
 *
 * Was hier steht, ist eine Einordnung des *vergangenen* Verlaufs: In welcher
 * Phase lag ein bestimmter Tag, gemessen an den eingetragenen Blutungstagen.
 */

/** Ab hier gilt ein Tag als Blutungstag – Schmierblutung zählt mit. */
const BLUTUNG_AB = 1;

/**
 * Eine Lücke von so vielen Tagen trennt zwei Zyklen.
 *
 * Zwei Tage Pause mitten in der Periode sind nichts Ungewöhnliches; würde man
 * schon daraus einen neuen Zyklus machen, käme eine Zykluslänge von vier Tagen
 * heraus. Drei Tage ist die übliche Grenze.
 */
const LUECKE = 3;

const PHASEN = [
  { id: 'menstruation', name: 'Periode' },
  { id: 'follikel', name: 'erste Zyklushälfte' },
  { id: 'ovulation', name: 'Zyklusmitte' },
  { id: 'luteal', name: 'zweite Zyklushälfte' },
];

const PHASEN_MAP = Object.fromEntries(PHASEN.map((p) => [p.id, p]));

function phasenName(id) {
  return PHASEN_MAP[id] ? PHASEN_MAP[id].name : id;
}

/** Alle eingetragenen Blutungstage, aufsteigend. */
function blutungsTage(tage) {
  return Object.keys(tage || {})
    .filter((iso) => Number(tage[iso] && tage[iso].blutung) >= BLUTUNG_AB)
    .sort();
}

/**
 * Die beobachteten Zyklen: [{ start, laenge }].
 *
 * Ein Zyklus beginnt am ersten Blutungstag nach einer Lücke. Seine Länge ist
 * der Abstand zum nächsten Anfang – der letzte Zyklus hat deshalb keine, er
 * läuft noch.
 */
function zyklen(tage) {
  const bt = blutungsTage(tage);
  if (!bt.length) return [];
  const starts = [bt[0]];
  const blutungsEnden = [];
  for (let i = 1; i < bt.length; i++) {
    if (tageDazwischen(bt[i - 1], bt[i]) >= LUECKE) {
      blutungsEnden.push(bt[i - 1]);
      starts.push(bt[i]);
    }
  }
  blutungsEnden.push(bt[bt.length - 1]);
  return starts.map((start, i) => ({
    start,
    blutungBis: blutungsEnden[i],
    blutungsTage: tageDazwischen(start, blutungsEnden[i]) + 1,
    laenge: i + 1 < starts.length ? tageDazwischen(start, starts[i + 1]) : null,
  }));
}

/**
 * Die mittlere Zykluslänge aus den abgeschlossenen Zyklen.
 *
 * Ohne abgeschlossenen Zyklus gibt es keine – dann liefert das hier `null`,
 * und alles, was darauf aufbaut, hält den Mund. 28 als stille Annahme
 * einzusetzen wäre bequem und falsch: Es gibt genug Menschen, bei denen 24
 * oder 34 der Normalfall ist, und deren Phasen lägen dann durchgehend daneben.
 */
function mittlereLaenge(tage) {
  const fertig = zyklen(tage).filter((z) => z.laenge && z.laenge >= 15 && z.laenge <= 60);
  if (!fertig.length) return null;
  return Math.round(fertig.reduce((s, z) => s + z.laenge, 0) / fertig.length);
}

/** Wie stark die Zykluslänge schwankt – die Spanne zwischen kürzestem und längstem. */
function schwankung(tage) {
  const laengen = zyklen(tage).map((z) => z.laenge)
    .filter((l) => l && l >= 15 && l <= 60);
  if (laengen.length < 2) return null;
  return { von: Math.min(...laengen), bis: Math.max(...laengen), anzahl: laengen.length };
}

/**
 * Der Zyklustag eines Datums: 1 am ersten Blutungstag.
 *
 * `null`, wenn der Tag vor dem ersten eingetragenen Zyklus liegt oder mehr als
 * zwei Monate hinter seinem Anfang – dann ist die Zuordnung geraten, nicht
 * gerechnet.
 */
function zyklusTag(tage, iso) {
  const alle = zyklen(tage);
  let letzter = null;
  for (const z of alle) {
    if (z.start <= iso) letzter = z;
  }
  if (!letzter) return null;
  const tag = tageDazwischen(letzter.start, iso) + 1;
  return tag >= 1 && tag <= 60 ? tag : null;
}

/**
 * Die Phase eines Tages.
 *
 * Grob und offen gesagt grob: Die Periode kommt aus den Eintragungen, die
 * Mitte wird aus der halben Zykluslänge geschätzt, der Rest teilt sich davor
 * und danach auf. Feiner geht es ohne Temperatur- oder Hormonmessung nicht,
 * und feiner zu *tun* wäre schlimmer als grob zu sein.
 */
function phaseVon(tage, iso) {
  const tag = zyklusTag(tage, iso);
  if (!tag) return null;
  const tagInfo = (tage || {})[iso];
  if (Number(tagInfo && tagInfo.blutung) >= BLUTUNG_AB) return 'menstruation';
  const laenge = mittlereLaenge(tage);
  if (!laenge) return null;
  const mitte = Math.round(laenge / 2);
  if (tag >= mitte - 2 && tag <= mitte + 2) return 'ovulation';
  return tag < mitte ? 'follikel' : 'luteal';
}

/**
 * Beschwerdestärke je Zyklusphase.
 *
 * Die eigentliche Auskunft dieses Moduls. Zurück kommt für jede Phase, in der
 * überhaupt etwas notiert wurde: wie viele Tage, wie stark im Mittel, und wie
 * viele davon mit Beschwerden. Ohne Schwelle und ohne Urteil – die Fallzahlen
 * stehen daneben, damit man selbst sieht, ob drei Tage oder dreißig gemeint
 * sind.
 */
function phasenBilanz(eintraege, tage, tagesWert) {
  const eimer = Object.fromEntries(PHASEN.map((p) => [p.id, { tage: 0, summe: 0, mit: 0 }]));
  const gesehen = new Set();
  const alleTage = new Set([
    ...Object.keys(tage || {}),
    ...eintraege.map((e) => e.am),
  ]);
  alleTage.forEach((iso) => {
    if (gesehen.has(iso)) return;
    gesehen.add(iso);
    const p = phaseVon(tage, iso);
    if (!p) return;
    const t = tagesWert(eintraege, iso, tage);
    if (!t.notiert) return;
    eimer[p].tage += 1;
    eimer[p].summe += t.wert;
    if (t.wert > 0) eimer[p].mit += 1;
  });
  return PHASEN
    .filter((p) => eimer[p.id].tage > 0)
    .map((p) => ({
      phase: p.id,
      name: p.name,
      tage: eimer[p.id].tage,
      schnitt: eimer[p.id].summe / eimer[p.id].tage,
      anteil: eimer[p.id].mit / eimer[p.id].tage,
    }));
}

/**
 * Reicht das für eine Aussage?
 *
 * Zwei abgeschlossene Zyklen sind die Untergrenze, unter der eine Phase
 * bestenfalls ein Zufall ist. Steht hier `false`, zeigt die App die Zahlen
 * trotzdem – aber ohne den Satz, dass daraus etwas folgt.
 */
function belastbar(tage) {
  return zyklen(tage).filter((z) => z.laenge).length >= 2;
}

/** Der Stand von heute, für die Tagesansicht. */
function heutigerStand(tage, iso) {
  const tag = zyklusTag(tage, iso);
  if (!tag) return null;
  return {
    tag,
    phase: phaseVon(tage, iso),
    laenge: mittlereLaenge(tage),
    // Nur zur Einordnung des Heute, nicht als Vorhersage: Wie weit ist der
    // Zyklus, gemessen an der bisherigen mittleren Länge.
    seitAnfang: plusTage(iso, -(tag - 1)),
  };
}

/* ===== js/chart.js ===== */
/*
 * Ein Balkendiagramm als SVG-Zeichenkette. Ohne Bibliothek, ohne Leinwand.
 *
 * Warum SVG und nicht <canvas>: Die Tafel wird zusammen mit dem übrigen HTML
 * neu gezeichnet, sobald sich der Zustand ändert. Eine Leinwand müsste dafür
 * nach jedem Rendern eigens angemalt werden – bei einer Zeichenkette fällt
 * dieser zweite Schritt weg, und die Tafel kann nicht „vergessen" werden.
 *
 * Ein Tag ohne Eintragung ist etwas anderes als ein Tag ohne Beschwerden.
 * Deshalb zwei getrennte Darstellungen: kein Balken, aber ein Grundstrich für
 * „nichts eingetragen", ein flacher Strich in Grün für „eingetragen, aber
 * beschwerdefrei". Wer das zusammenwirft, liest aus einer Lücke im Tagebuch
 * einen guten Tag heraus.
 */

const TAFEL_HOCH = 100;
const TAFEL_MAX = 10;

/**
 * @param {{am: string, wert: number|null, notiert: boolean}[]} punkte
 * @param {{titel?: string, hinweis?: string}} opt
 */
function verlaufTafel(punkte, opt = {}) {
  if (!punkte.length) return '';
  const n = punkte.length;
  const breite = 300;
  const spalte = breite / n;
  const balken = Math.max(1.5, Math.min(spalte * 0.62, 10));

  const stuecke = punkte.map((p, i) => {
    const x = i * spalte + (spalte - balken) / 2;
    if (!p.notiert) {
      return `<rect x="${x.toFixed(2)}" y="${TAFEL_HOCH - 1.5}" width="${balken.toFixed(2)}" height="1.5" `
        + `rx="0.75" fill="var(--line)"><title>${fmtDatum(p.am)}: nichts eingetragen</title></rect>`;
    }
    const wert = Math.max(0, Math.min(TAFEL_MAX, p.wert || 0));
    const h = Math.max(2, (wert / TAFEL_MAX) * TAFEL_HOCH);
    const farbe = wert === 0 ? 'var(--ok)' : (wert >= 7 ? 'var(--bad)' : (wert >= 4 ? 'var(--warn)' : 'var(--leicht)'));
    return `<rect x="${x.toFixed(2)}" y="${(TAFEL_HOCH - h).toFixed(2)}" width="${balken.toFixed(2)}" `
      + `height="${h.toFixed(2)}" rx="${(balken / 2.5).toFixed(2)}" fill="${farbe}">`
      + `<title>${fmtDatum(p.am)}: ${wert === 0 ? 'beschwerdefrei' : `Stärke ${wert}`}</title></rect>`;
  }).join('');

  // Hilfslinie bei 5 – ohne Bezugspunkt sagt die Höhe eines Balkens nichts.
  const mitte = `<line x1="0" y1="${TAFEL_HOCH / 2}" x2="${breite}" y2="${TAFEL_HOCH / 2}" `
    + 'stroke="var(--line)" stroke-width="0.6" stroke-dasharray="3 3"/>';

  return `<figure class="tafel">
    ${opt.titel ? `<figcaption class="tafel-titel">${opt.titel}</figcaption>` : ''}
    <svg viewBox="0 0 ${breite} ${TAFEL_HOCH}" preserveAspectRatio="none" role="img"
         aria-label="${opt.titel || 'Verlauf'}: Balken je Tag, Höhe ist die stärkste Beschwerde von 0 bis 10">
      ${mitte}${stuecke}
    </svg>
    <div class="tafel-fuss">
      <span>${fmtDatum(punkte[0].am)}</span>
      ${opt.hinweis ? `<span class="tafel-hinweis">${opt.hinweis}</span>` : ''}
      <span>${fmtDatum(punkte[n - 1].am)}</span>
    </div>
  </figure>`;
}

/**
 * Ein waagerechter Vergleichsbalken: mit Auslöser gegen ohne.
 *
 * Zwei Balken übereinander statt einer Differenzzahl, weil die Differenz allein
 * täuscht – „2 Punkte mehr" heißt bei einem Grundpegel von 1 etwas anderes als
 * bei einem von 7.
 */
function vergleichBalken(mit, ohne) {
  const anteil = (v) => `${Math.max(1.5, Math.min(100, (v / TAFEL_MAX) * 100)).toFixed(1)}%`;
  return `<div class="vgl">
    <div class="vgl-zeile"><span class="vgl-mark">danach</span>
      <span class="vgl-spur"><i style="width:${anteil(mit)};background:var(--warn)"></i></span>
      <b>${mit.toFixed(1).replace('.', ',')}</b></div>
    <div class="vgl-zeile"><span class="vgl-mark">sonst</span>
      <span class="vgl-spur"><i style="width:${anteil(ohne)};background:var(--muted)"></i></span>
      <b>${ohne.toFixed(1).replace('.', ',')}</b></div>
  </div>`;
}

/* ===== js/store.js ===== */
/*
 * Der Speicher. Alles, was eingetragen wird, liegt hier – und nur hier.
 *
 * Es gibt keinen Server, kein Konto und keine Anmeldung. Der gesamte Zustand
 * steht im localStorage dieses einen Browsers auf diesem einen Gerät. Das ist
 * keine Sparmaßnahme, sondern die Bauart: Ein Tagebuch über den eigenen Körper
 * soll nirgendwohin gehen, wo es jemand anders lesen könnte, und was nie
 * verschickt wird, kann auch nicht abhandenkommen.
 *
 * Die Kehrseite steht ehrlich in der App: Ein gelöschter Browser-Speicher
 * nimmt alles mit. Dagegen hilft nur die Sicherung unter „Mehr" – deshalb
 * erinnert die App daran, und deshalb ist der Export eine gewöhnliche
 * JSON-Datei, die man auch ohne diese App noch lesen kann.
 */

const KEY = 'bauchbuch.state.v1';

const VORGABE = {
  // Alle Eintragungen in einer Liste, nach Zeitpunkt sortiert gehalten.
  // Ein Eintrag ist immer { id, am, um, art } plus die Felder seiner Art:
  //   essen       { was, zutaten: [{ id, rolle }], portion: 'klein'|'normal'|'gross' }
  //   beschwerde  { staerke: 0..10, arten: [beschwerdeId], notiz }
  //   medikament  { mittel, dosis }
  //   notiz       { text }
  eintraege: [],
  // Was für einen ganzen Tag gilt, nicht für einen Zeitpunkt. Welche Angaben
  // es gibt, steht in TAGESFRAGEN (js/daten.js):
  // { 'YYYY-MM-DD': { stimmung, stress, schlaf, bewegung, blutung, sex, notiz } }
  tage: {},
  // In wie vielen Stunden nach einer Mahlzeit eine Beschwerde ihr noch
  // zugerechnet wird. Vier Stunden sind der Vorschlag, nicht das Gesetz –
  // wer weiß, dass es bei ihm später kommt, stellt es unter Mehr um.
  fenster: 4,
  // Ab wie vielen Mahlzeiten mit einem Auslöser die Auswertung überhaupt
  // etwas dazu sagt. Darunter ist jede Aussage Zufall, und eine App, die aus
  // zwei Fällen eine Regel macht, schadet mehr als sie nützt.
  mindestFaelle: 5,
  // Verbesserungsvorschläge zur App selbst: [{ id, am, text, erledigt }].
  // Bewusst neben den Eintragungen und nicht in ihnen – eine Idee ist kein
  // Tagebucheintrag und hat in keiner Auswertung etwas zu suchen.
  ideen: [],
  eigeneAusloeser: [],   // [{ id: 'x:...', name }]
  zuletztMittel: [],     // zuletzt eingetragene Medikamente, als Vorschlag
  // Welche Tagesfragen erscheinen. Im Auslieferungszustand alle – wer eine
  // davon nicht beantworten will, schaltet sie unter Mehr ab.
  tagesfragen: ['stimmung', 'stress', 'schlaf', 'bewegung', 'blutung', 'sex'],
  atemUebung: '478',     // zuletzt gewählte Atemübung
  atemRunden: null,      // eigene Rundenzahl; null = Vorschlag der Übung
  ton: true,             // Ton bei der Atemübung – der einzige der App
  theme: 'rosa',
  begruesst: false,
  tab: 'heute',
  lastBackup: null,      // { on, anzahl } – wann zuletzt gesichert wurde
};

const klon = (o) => JSON.parse(JSON.stringify(o));

let zustand = laden();
const hoerer = new Set();

function laden() {
  try {
    const roh = localStorage.getItem(KEY);
    if (!roh) return klon(VORGABE);
    const gelesen = JSON.parse(roh);
    const s = Object.assign(klon(VORGABE), gelesen);
    // Wer schon etwas eingetragen hat, hat die Begrüßung hinter sich – auch
    // wenn der Stand aus einer Fassung stammt, die den Schlüssel noch nicht
    // kannte. Sonst stünde die Einführung eines Tages wieder vor dem Tagebuch.
    if (!('begruesst' in gelesen) && s.eintraege.length) s.begruesst = true;
    s.eintraege = sortiert((Array.isArray(s.eintraege) ? s.eintraege : []).map(mahlzeitFrisch));
    return s;
  } catch {
    return klon(VORGABE);
  }
}

/**
 * Eine Mahlzeit auf den heutigen Stand bringen.
 *
 * Früher standen die Zutaten als bloße Liste von IDs unter `tags`. Seit sie
 * eine Rolle tragen – Hauptzutat, Beilage, Topping … –, stehen sie unter
 * `zutaten`. Umgerechnet wird beim Laden und beim Einlesen einer Sicherung,
 * also an genau den zwei Stellen, an denen fremde Daten hereinkommen.
 *
 * Alte Eintragungen bekommen `haupt`. Das ist die einzig ehrliche Annahme:
 * Wer damals „Zwiebel" angekreuzt hat, hat nicht gesagt, es sei nur ein Hauch
 * gewesen – und die harmlosere Rolle nachträglich zu unterstellen, würde alte
 * Auffälligkeiten stillschweigend kleinrechnen.
 *
 * `tags` fällt dabei weg, damit es die Angabe nur an einer Stelle gibt. Was an
 * dieser Umrechnung vorbeikommt, fängt zutatenVon() in js/auswertung.js ab.
 */
function mahlzeitFrisch(e) {
  if (!e || e.art !== 'essen' || Array.isArray(e.zutaten)) return e;
  const { tags, ...rest } = e;
  return {
    ...rest,
    zutaten: (Array.isArray(tags) ? tags : [])
      .filter((id) => typeof id === 'string')
      .map((id) => ({ id, rolle: 'haupt' })),
  };
}

/** Nach Tag und Uhrzeit. Die Liste wird nirgends anders sortiert. */
function sortiert(liste) {
  return [...liste].sort((a, b) => (a.am === b.am
    ? minutenAmTag(a.um) - minutenAmTag(b.um)
    : (a.am < b.am ? -1 : 1)));
}

/* ---------- Schreiben ---------- */

let schreibUhr = null;

/**
 * Warum nicht gespeichert werden kann – und das sind zwei verschiedene Lagen.
 *
 *   'gesperrt'  Der Browser lässt gar nicht erst speichern: privates Fenster,
 *               eingebettete Ansicht, blockierte Website-Daten. Nichts bleibt,
 *               aber es war auch nie etwas da.
 *
 *   'voll'      Es ging bisher, und jetzt nicht mehr. Das ist die gefährliche
 *               Lage: Monate an Eintragungen liegen gespeichert, der heutige
 *               Eintrag kommt nicht mehr dazu. Hier gehört der Rat zur
 *               Sicherung hin, sofort und deutlich.
 */
function warumNicht(fehler) {
  // Chrome/Safari melden QuotaExceededError, Firefox NS_ERROR_DOM_QUOTA_REACHED,
  // ältere Fassungen nur den Code 22. Alles andere ist eine Sperre.
  const name = fehler && (fehler.name || '');
  const code = fehler && fehler.code;
  return (name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED'
    || code === 22 || code === 1014) ? 'voll' : 'gesperrt';
}

let speicherGeht = true;
let speicherFehler = null;

try {
  localStorage.setItem(`${KEY}.probe`, '1');
  localStorage.removeItem(`${KEY}.probe`);
} catch {
  // Beim Start ist auch ein voller Speicher eine Sperre: Es gibt noch nichts
  // zu retten, und der Rat wäre derselbe wie bei jeder anderen Ursache.
  speicherGeht = false;
  speicherFehler = 'gesperrt';
}

/** false, wenn der Browser nichts speichern kann – Eintragungen sind flüchtig. */
function kannSpeichern() { return speicherGeht; }

/** 'gesperrt', 'voll' oder null – siehe warumNicht(). */
function speicherGrund() { return speicherGeht ? null : speicherFehler; }

function schreibe() {
  schreibUhr = null;
  const vorher = speicherGeht;
  try {
    localStorage.setItem(KEY, JSON.stringify(zustand));
    speicherGeht = true;
    speicherFehler = null;
  } catch (e) {
    speicherGeht = false;
    speicherFehler = warumNicht(e);
  }
  // Beim Wechsel melden, in *beide* Richtungen: Der Schreibvorgang läuft nach
  // dem Zeichnen, die Warnung stünde sonst einen Eintrag zu spät da – und
  // bliebe nach dem Aufräumen kleben, bis zufällig etwas anderes neu zeichnet.
  if (speicherGeht !== vorher) melde();
}

function merke() {
  clearTimeout(schreibUhr);
  schreibUhr = setTimeout(schreibe, 120);
}

/**
 * Ausstehenden Schreibvorgang sofort ausführen. Nötig, bevor die App in den
 * Hintergrund geht: mobile Browser verwerfen die Seite dort ohne Vorwarnung,
 * und der letzte Eintrag wäre verloren.
 */
function sofortSchreiben() {
  if (schreibUhr === null) return;
  clearTimeout(schreibUhr);
  schreibe();
}

function melde() {
  hoerer.forEach((fn) => fn(zustand));
}

function horche(fn) {
  hoerer.add(fn);
  return () => hoerer.delete(fn);
}

function zustandLesen() { return zustand; }

/* ---------- Eintragungen ---------- */

/**
 * Eine Kennung, die auch dann eindeutig bleibt, wenn zwei Einträge in
 * derselben Millisekunde entstehen – beim Einlesen einer Sicherung etwa, oder
 * wenn jemand schnell hintereinander tippt.
 */
let zaehler = 0;
function neueId() {
  zaehler += 1;
  return `e${Date.now().toString(36)}${zaehler.toString(36)}`;
}

/**
 * Einen Eintrag anlegen. Datum und Uhrzeit sind optional und stehen sonst auf
 * jetzt – der Normalfall ist „ich trage gerade ein, was gerade war".
 */
function eintragen(eintrag) {
  const neu = {
    id: neueId(),
    am: eintrag.am || heuteISO(),
    um: eintrag.um || jetztUhr(),
    ...eintrag,
  };
  zustand.eintraege = sortiert([...zustand.eintraege, neu]);
  merke();
  melde();
  return neu.id;
}

function eintragAendern(id, patch) {
  const i = zustand.eintraege.findIndex((e) => e.id === id);
  if (i < 0) return;
  zustand.eintraege[i] = { ...zustand.eintraege[i], ...patch, id };
  zustand.eintraege = sortiert(zustand.eintraege);
  merke();
  melde();
}

function eintragLoeschen(id) {
  const vorher = zustand.eintraege.length;
  zustand.eintraege = zustand.eintraege.filter((e) => e.id !== id);
  if (zustand.eintraege.length === vorher) return;
  merke();
  melde();
}

function eintragVon(id) {
  return zustand.eintraege.find((e) => e.id === id) || null;
}

/** Alle Eintragungen eines Tages, in zeitlicher Reihenfolge. */
function eintraegeAm(iso) {
  return zustand.eintraege.filter((e) => e.am === iso);
}

/** Der Tag der jüngsten Eintragung – oder heute, wenn es keine gibt. */
function letzterTag() {
  const e = zustand.eintraege;
  return e.length ? e[e.length - 1].am : heuteISO();
}

/**
 * Wann zuletzt etwas eingetragen wurde, als Zeitpunkt. Die Tagesansicht
 * braucht das, um „seit 6 Stunden nichts" sagen zu können.
 */
function letzterZeitpunkt() {
  const e = zustand.eintraege;
  return e.length ? zeitpunkt(e[e.length - 1].am, e[e.length - 1].um) : null;
}

/* ---------- Tagesangaben ---------- */

function tagLesen(iso) {
  return zustand.tage[iso] || {};
}

function tagSetzen(iso, patch) {
  const neu = { ...tagLesen(iso), ...patch };
  // Einen leeren Tag gar nicht erst anlegen: Sonst wächst `tage` mit jedem
  // angetippten und wieder abgewählten Regler, und die Sicherung füllt sich
  // mit Zeilen, die nichts aussagen. Geprüft wird über alle Felder, nicht über
  // eine feste Liste – sonst hinterlässt jede neue Tagesfrage leere Tage.
  const leer = Object.values(neu).every((v) => v === null || v === undefined
    || v === '' || (typeof v === 'string' && !v.trim()));
  if (leer) delete zustand.tage[iso];
  else zustand.tage[iso] = neu;
  merke();
  melde();
}

/* ---------- Einstellungen ---------- */

function einstellen(schluessel, wert) {
  if (!(schluessel in VORGABE)) return;
  zustand[schluessel] = wert;
  merke();
  melde();
}

/** Ein eigener Auslöser. Doppelte Namen führen auf denselben Eintrag zurück. */
function ausloeserAnlegen(id, name) {
  if (zustand.eigeneAusloeser.some((a) => a.id === id)) return;
  zustand.eigeneAusloeser = [...zustand.eigeneAusloeser, { id, name }];
  merke();
  melde();
}

/**
 * Einen eigenen Auslöser wieder loswerden.
 *
 * Er verschwindet aus der Auswahl, aber nicht aus den Eintragungen, in denen
 * er steht. Das ist Absicht: Ein Tagebuch rückwirkend zu verändern, weil eine
 * Auswahlliste sich geändert hat, wäre das Gegenteil von dem, wofür man es
 * führt.
 */
function ausloeserLoeschen(id) {
  zustand.eigeneAusloeser = zustand.eigeneAusloeser.filter((a) => a.id !== id);
  merke();
  melde();
}

/** Ein benutztes Mittel als Vorschlag merken – die fünf jüngsten. */
function mittelMerken(name) {
  const sauber = String(name).trim();
  if (!sauber) return;
  zustand.zuletztMittel = [sauber, ...zustand.zuletztMittel.filter((m) => m !== sauber)].slice(0, 5);
  merke();
}

/* ---------- Ideen zur App ---------- */

function ideeAnlegen(text) {
  const sauber = String(text || '').trim();
  if (!sauber) return null;
  const neu = { id: neueId(), am: heuteISO(), text: sauber, erledigt: false };
  zustand.ideen = [neu, ...zustand.ideen];
  merke();
  melde();
  return neu.id;
}

/** Abgehakt oder wieder offen. Gelöscht wird eine Idee dadurch nicht. */
function ideeUmschalten(id) {
  const i = zustand.ideen.findIndex((x) => x.id === id);
  if (i < 0) return;
  zustand.ideen[i] = { ...zustand.ideen[i], erledigt: !zustand.ideen[i].erledigt };
  merke();
  melde();
}

function ideeLoeschen(id) {
  const vorher = zustand.ideen.length;
  zustand.ideen = zustand.ideen.filter((x) => x.id !== id);
  if (zustand.ideen.length === vorher) return;
  merke();
  melde();
}

/* ---------- Sicherung ---------- */

function alsJSON() {
  return JSON.stringify(zustand, null, 2);
}

function sicherungNotiert() {
  zustand.lastBackup = { on: heuteISO(), anzahl: zustand.eintraege.length };
  merke();
  melde();
}

/**
 * Sicherung einlesen.
 *
 * Geprüft wird nicht aus Misstrauen, sondern weil eine halb passende Datei
 * sonst still einen Zustand hinterlässt, in dem die App merkwürdig wird –
 * `eintraege` als Zeichenkette etwa. Alles Unbekannte fällt weg, alles
 * Bekannte wird auf seinen Typ gebracht, und jeder einzelne Eintrag muss
 * mindestens Datum und Art haben, sonst fliegt er raus.
 */
function ausJSON(text) {
  const gelesen = JSON.parse(text);
  if (!gelesen || typeof gelesen !== 'object' || Array.isArray(gelesen)
      || !Array.isArray(gelesen.eintraege)) {
    throw new Error('Unerwartetes Format – die Liste "eintraege" fehlt.');
  }
  const frisch = klon(VORGABE);
  Object.keys(VORGABE).forEach((k) => {
    const v = gelesen[k];
    if (v === undefined || v === null) return;
    const soll = VORGABE[k];
    if (Array.isArray(soll) !== Array.isArray(v)) return;
    if (soll !== null && typeof soll !== typeof v) return;
    frisch[k] = v;
  });
  frisch.eintraege = sortiert(gelesen.eintraege.filter((e) => (
    e && typeof e === 'object' && typeof e.am === 'string' && typeof e.art === 'string'
  )).map((e) => mahlzeitFrisch({ ...e, id: e.id || neueId() })));
  frisch.ideen = frisch.ideen.filter((x) => x && typeof x === 'object' && typeof x.text === 'string')
    .map((x) => ({ ...x, id: x.id || neueId(), erledigt: !!x.erledigt }));
  if (!Number.isFinite(frisch.fenster) || frisch.fenster <= 0) frisch.fenster = VORGABE.fenster;
  zustand = frisch;
  merke();
  melde();
  return frisch.eintraege.length;
}

function allesLoeschen() {
  zustand = klon(VORGABE);
  // Die Begrüßung nicht noch einmal: Wer gerade bewusst alles gelöscht hat,
  // weiß, was die App ist.
  zustand.begruesst = true;
  try { localStorage.removeItem(KEY); } catch { /* dann eben nicht */ }
  merke();
  melde();
}

const store = { allesLoeschen, alsJSON, ausJSON, ausloeserAnlegen, ausloeserLoeschen, einstellen, eintraegeAm, eintragAendern, eintragLoeschen, eintragVon, eintragen, horche, ideeAnlegen, ideeLoeschen, ideeUmschalten, kannSpeichern, letzterTag, letzterZeitpunkt, mittelMerken, sicherungNotiert, sofortSchreiben, speicherGrund, tagLesen, tagSetzen, zustandLesen };

/* ===== js/auswertung.js ===== */
/*
 * Die Rechenschicht: aus Eintragungen Muster machen.
 *
 * Reine Funktionen, keine Anzeige, kein Speicherzugriff – alles kommt als
 * Argument herein. Das ist nicht Ordnungsliebe: Diese Datei ist der einzige
 * Ort, an dem die App etwas *behauptet*, und Behauptungen über den eigenen
 * Körper muss man einzeln nachrechnen können. Genau das tut tests/rechnen.mjs.
 *
 * Die Grundfrage lautet immer gleich: Geht es nach Mahlzeiten mit einem
 * bestimmten Merkmal schlechter als nach Mahlzeiten ohne? Verglichen wird
 * also nicht gegen Null, sondern gegen den eigenen Alltag. Ohne diesen
 * Vergleich fände man bei jedem Menschen mit täglichen Beschwerden jedes
 * Lebensmittel „auffällig", das er täglich isst.
 *
 * Drei Regeln, die verhindern, dass daraus Kaffeesatzleserei wird:
 *
 *   1. Mindestens `mindestFaelle` Mahlzeiten *mit* dem Merkmal und ebenso
 *      viele *ohne*. Aus drei Fällen wird hier keine Aussage.
 *   2. Die Fallzahl steht immer daneben, auch wenn sie unbequem ist.
 *   3. Es heißt „auffällig", nicht „verursacht". Was hier herauskommt, ist
 *      ein Anhaltspunkt fürs Gespräch beim Arzt, keine Diagnose.
 */


/** Späte Mahlzeit ab dieser Stunde – siehe UMSTAENDE in js/daten.js. */
const SPAET_AB = 20;

/**
 * Die Zutaten einer Mahlzeit als [{ id, rolle }].
 *
 * Seit die Rolle dazugehört, stehen sie unter `zutaten`. Vorher war es eine
 * bloße Liste von IDs unter `tags`. Der Speicher rechnet alte Stände beim
 * Laden um (siehe mahlzeitFrisch in js/store.js) – die Zeile hier ist der
 * zweite Riegel, für alles, was an dieser Umrechnung vorbeikommt: eine
 * Sicherung aus einer älteren Fassung, ein von Hand gesetzter Zustand, ein
 * Test, der die Rechenschicht direkt aufruft.
 */
function zutatenVon(eintrag) {
  if (Array.isArray(eintrag.zutaten)) {
    return eintrag.zutaten
      .filter((z) => z && typeof z.id === 'string')
      .map((z) => ({ id: z.id, rolle: z.rolle || ROLLE_VORGABE }));
  }
  if (Array.isArray(eintrag.tags)) {
    return eintrag.tags.map((id) => ({ id, rolle: ROLLE_VORGABE }));
  }
  return [];
}

/**
 * Alle Merkmale einer Mahlzeit: die Zutaten plus die beiden Umstände, die
 * sich aus Portion und Uhrzeit von selbst ergeben.
 *
 * Die Rolle spielt hier bewusst *keine* Rolle: Für die Frage „war es drin?"
 * zählt jede Zutat gleich. Was die Rolle unterscheidet, steht getrennt in
 * rollenBilanz() – und zwar mit Fallzahlen, statt still eine Gewichtung in
 * die Hauptzahl zu rechnen, die niemand nachvollziehen könnte.
 */
function merkmale(eintrag) {
  if (eintrag.art !== 'essen') return [];
  const raus = zutatenVon(eintrag).map((z) => z.id);
  if (eintrag.portion === 'gross') raus.push('gross');
  const std = Number(String(eintrag.um || '').split(':')[0]);
  if (Number.isFinite(std) && std >= SPAET_AB) raus.push('spaet');
  return [...new Set(raus)];
}

/**
 * Die Beschwerden, die einer Mahlzeit im Zeitfenster folgen.
 *
 * `> 0` und nicht `>= 0`: Eine Beschwerde, die zur selben Minute eingetragen
 * ist wie die Mahlzeit, war schon da. Sie der Mahlzeit zuzurechnen hieße, die
 * Ursache nach der Wirkung zu suchen.
 */
function folgende(eintraege, mahlzeit, fensterStunden) {
  const t0 = zeitpunkt(mahlzeit.am, mahlzeit.um);
  return eintraege.filter((e) => {
    if (e.art !== 'beschwerde') return false;
    const abstand = stundenDazwischen(t0, zeitpunkt(e.am, e.um));
    return abstand > 0 && abstand <= fensterStunden;
  });
}

/** Die stärkste Beschwerde im Fenster, oder 0, wenn keine kam. */
function wertNach(eintraege, mahlzeit, fensterStunden) {
  const nach = folgende(eintraege, mahlzeit, fensterStunden);
  return nach.reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0);
}

/**
 * Die Bilanz je Auslöser.
 *
 * Ein Auslöser taucht nur auf, wenn er überhaupt vorkommt. Ob genug Fälle
 * beisammen sind, sagt `genug` – die Zeile wird trotzdem geliefert, denn „noch
 * 2 Mahlzeiten, dann kann ich etwas dazu sagen" ist eine nützliche Auskunft.
 *
 * @param {object[]} eintraege  alle Eintragungen
 * @param {{fenster: number, mindestFaelle: number, eigene: object[]}} opt
 */
function ausloeserBilanz(eintraege, opt = {}) {
  const fenster = opt.fenster || 4;
  const mindest = opt.mindestFaelle || 5;
  const mahlzeiten = eintraege.filter((e) => e.art === 'essen');
  if (!mahlzeiten.length) return [];

  // Einmal für alle Mahlzeiten rechnen, nicht je Auslöser neu: Bei einem Jahr
  // Tagebuch und zwei Dutzend Auslösern wäre das sonst das Quadrat davon.
  const bewertet = mahlzeiten.map((m) => ({
    m,
    merkmale: new Set(merkmale(m)),
    wert: wertNach(eintraege, m, fenster),
  }));

  const bekannt = new Set(ALLE_AUSLOESER.map((a) => a.id));
  (opt.eigene || []).forEach((a) => bekannt.add(a.id));
  // Auch Auslöser zählen, die nur in alten Eintragungen stehen – etwa ein
  // eigener, den jemand später aus der Auswahl entfernt hat.
  bewertet.forEach((b) => b.merkmale.forEach((id) => bekannt.add(id)));

  const zeilen = [];
  bekannt.forEach((id) => {
    const mit = bewertet.filter((b) => b.merkmale.has(id));
    if (!mit.length) return;
    const ohne = bewertet.filter((b) => !b.merkmale.has(id));
    const schnitt = (liste) => (liste.length
      ? liste.reduce((s, b) => s + b.wert, 0) / liste.length : 0);
    const quote = (liste) => (liste.length
      ? liste.filter((b) => b.wert > 0).length / liste.length : 0);
    const schnittMit = schnitt(mit);
    const schnittOhne = schnitt(ohne);
    zeilen.push({
      id,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: schnittMit - schnittOhne,
      quoteMit: quote(mit),
      quoteOhne: quote(ohne),
      genug: mit.length >= mindest && ohne.length >= mindest,
      fehlt: Math.max(0, mindest - mit.length),
      zuletzt: mit[mit.length - 1].m.am,
    });
  });

  // Auffälligstes zuerst; bei gleicher Differenz die größere Fallzahl, weil
  // sie mehr wert ist.
  return zeilen.sort((a, b) => (b.differenz - a.differenz) || (b.faelle - a.faelle));
}

/**
 * Wie ein Ergebnis zu lesen ist. Eine halbe Stufe Unterschied ist Rauschen,
 * und es als Fund darzustellen wäre die eine Art, mit der so eine App
 * tatsächlich schaden kann: Wer daraufhin ein Lebensmittel streicht, isst
 * einseitiger, ohne dass es ihm besser geht.
 */
function einstufung(zeile) {
  if (!zeile.genug) return 'zuwenig';
  if (zeile.differenz >= 2) return 'auffaellig';
  if (zeile.differenz >= 1) return 'moeglich';
  if (zeile.differenz <= -1) return 'unauffaellig';
  return 'neutral';
}

const EINSTUFUNG_WORT = {
  auffaellig: 'auffällig',
  moeglich: 'möglicherweise',
  neutral: 'kein Unterschied',
  unauffaellig: 'eher unauffällig',
  zuwenig: 'zu wenige Fälle',
};

/**
 * Ein auffälliger Auslöser, aufgeschlüsselt nach der Rolle, in der er vorkam.
 *
 * Das ist die Auskunft, für die es die Rollen gibt: „Zwiebel" ist keine
 * Antwort, wenn sie achtmal die Suppe war und viermal drei Ringe obendrauf.
 * Zurück kommt jede Rolle, die überhaupt vorkam, mit ihrer Fallzahl – ohne
 * Schwelle und ohne Urteil, denn eine Aufschlüsselung hat naturgemäß kleinere
 * Zahlen als das Ganze, und wer sie liest, soll das sehen.
 */
function rollenBilanz(eintraege, id, fensterStunden) {
  const treffer = eintraege.filter((e) => e.art === 'essen'
    && zutatenVon(e).some((z) => z.id === id));
  const raus = [];
  ROLLEN.forEach((r) => {
    const mit = treffer.filter((e) => zutatenVon(e)
      .some((z) => z.id === id && z.rolle === r.id));
    if (!mit.length) return;
    const summe = mit.reduce((sum, e) => sum + wertNach(eintraege, e, fensterStunden), 0);
    raus.push({ rolle: r.id, faelle: mit.length, schnitt: summe / mit.length });
  });
  return raus.sort((a, b) => b.schnitt - a.schnitt);
}

/* ---------- Die übrigen Faktoren ---------- */

/**
 * Wie viele Stunden vor einer Beschwerde zuletzt gegessen wurde.
 *
 * `null`, wenn an dem Tag und dem davor gar nichts eingetragen ist – dann ist
 * die Angabe nicht „lange her", sondern unbekannt, und das sind zwei
 * verschiedene Dinge.
 */
function stundenSeitEssen(eintraege, beschwerde) {
  const t = zeitpunkt(beschwerde.am, beschwerde.um);
  let letzte = null;
  eintraege.filter((e) => e.art === 'essen').forEach((e) => {
    const te = zeitpunkt(e.am, e.um);
    if (te < t && (letzte === null || te > letzte)) letzte = te;
  });
  if (letzte === null) return null;
  const std = stundenDazwischen(letzte, t);
  return std <= 24 ? std : null;
}

/**
 * Kommen die Beschwerden nach dem Essen oder nüchtern?
 *
 * Das ist die erste Frage, die im Sprechzimmer gestellt wird, und die
 * schwerste aus dem Kopf zu beantworten. Aus dem Tagebuch fällt sie ab.
 */
function essensbezug(eintraege, nahStunden = 2, fernStunden = 4) {
  const beschwerden = eintraege.filter((e) => e.art === 'beschwerde');
  let nah = 0;
  let fern = 0;
  let unbekannt = 0;
  beschwerden.forEach((b) => {
    const std = stundenSeitEssen(eintraege, b);
    if (std === null) unbekannt += 1;
    else if (std <= nahStunden) nah += 1;
    else if (std >= fernStunden) fern += 1;
  });
  const bewertbar = nah + fern;
  return {
    gesamt: beschwerden.length,
    nachDemEssen: nah,
    nuechtern: fern,
    unbekannt,
    anteilNachDemEssen: bewertbar ? nah / bewertbar : 0,
    anteilNuechtern: bewertbar ? fern / bewertbar : 0,
    bewertbar,
  };
}

/**
 * Ein Tagesfaktor gegen die Beschwerdestärke: Tage mit viel gegen Tage mit
 * wenig davon.
 *
 * Dieselbe Logik wie bei den Auslösern und aus demselben Grund: Verglichen
 * wird gegen den eigenen Alltag, nicht gegen null. Wer an jedem zweiten Tag
 * angespannt ist, hätte sonst „Anspannung" als Dauerbefund.
 */
function faktorBilanz(eintraege, tage, frageId, tagesWertFn) {
  const hoch = [];
  const niedrig = [];
  Object.keys(tage || {}).forEach((iso) => {
    const wert = tage[iso] ? tage[iso][frageId] : null;
    if (wert === null || wert === undefined) return;
    const t = tagesWertFn(eintraege, iso, tage);
    if (!t.notiert) return;
    if (Number(wert) >= 3) hoch.push(t.wert);
    else if (Number(wert) <= 1) niedrig.push(t.wert);
  });
  const schnitt = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  return {
    id: frageId,
    hoch: { tage: hoch.length, schnitt: schnitt(hoch) },
    niedrig: { tage: niedrig.length, schnitt: schnitt(niedrig) },
    differenz: schnitt(hoch) - schnitt(niedrig),
    genug: hoch.length >= 4 && niedrig.length >= 4,
  };
}

/** Wie oft eine Beschwerdeart unter allen Beschwerden vorkommt, als Anteil. */
function artAnteil(eintraege, arten) {
  const alle = eintraege.filter((e) => e.art === 'beschwerde');
  if (!alle.length) return { anteil: 0, anzahl: 0, gesamt: 0 };
  const treffer = alle.filter((e) => (e.arten || []).some((a) => arten.includes(a)));
  return { anteil: treffer.length / alle.length, anzahl: treffer.length, gesamt: alle.length };
}

/* ---------- Was oft vorkommt ---------- */

/**
 * Die Zutaten nach Häufigkeit, die meistbenutzte zuerst.
 *
 * Die Auswahlliste beim Eintragen ist sechzehn Marken lang plus eigene. Wer
 * jeden Tag Kaffee einträgt, soll ihn nicht jeden Tag suchen – und eine
 * Eingabe, die drei Sekunden dauert statt fünfzehn, wird auch an einem
 * schlechten Tag noch gemacht. Genau daran hängt, ob das Tagebuch Lücken hat.
 */
function haeufigeZutaten(eintraege) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'essen').forEach((e) => {
    zutatenVon(e).forEach((z) => zaehler.set(z.id, (zaehler.get(z.id) || 0) + 1));
  });
  return zaehler;
}

/**
 * Die häufigsten Mahlzeiten im Klartext, als Vorschlag fürs Textfeld.
 *
 * Verglichen wird kleingeschrieben und ohne Randleerzeichen, angezeigt wird
 * die zuletzt benutzte Schreibweise – sonst stünde „haferbrei" neben
 * „Haferbrei" und beide wären halb so häufig.
 */
function haeufigeGerichte(eintraege, anzahl = 6) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'essen').forEach((e) => {
    const roh = String(e.was || '').trim();
    if (!roh) return;
    const schluessel = roh.toLowerCase();
    const v = zaehler.get(schluessel) || { text: roh, anzahl: 0 };
    v.text = roh;
    v.anzahl += 1;
    zaehler.set(schluessel, v);
  });
  return [...zaehler.values()]
    .filter((g) => g.anzahl > 1)
    .sort((a, b) => b.anzahl - a.anzahl)
    .slice(0, anzahl);
}

/* ---------- Verlauf ---------- */

/**
 * Der Tageswert: die stärkste Beschwerde des Tages.
 *
 * `notiert` unterscheidet den beschwerdefreien Tag vom Tag ohne Eintrag. Für
 * die Auswertung ist das der wichtigste Unterschied überhaupt – aus einer
 * Lücke im Tagebuch einen guten Tag zu machen, verschiebt jede Statistik nach
 * unten, und zwar genau in den Wochen, in denen es jemandem zu schlecht ging,
 * um etwas einzutragen.
 */
function tagesWert(eintraege, iso, tage = {}) {
  const amTag = eintraege.filter((e) => e.am === iso);
  const beschwerden = amTag.filter((e) => e.art === 'beschwerde');
  const notiert = amTag.length > 0 || !!tage[iso];
  const max = beschwerden.reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0);
  const summe = beschwerden.reduce((s, e) => s + (Number(e.staerke) || 0), 0);
  return {
    am: iso,
    notiert,
    wert: max,
    schnitt: beschwerden.length ? summe / beschwerden.length : 0,
    anzahl: beschwerden.length,
    mahlzeiten: amTag.filter((e) => e.art === 'essen').length,
    medikamente: amTag.filter((e) => e.art === 'medikament').length,
  };
}

/** Eine Reihe von Tageswerten, lückenlos von `von` bis `bis`. */
function verlaufReihe(eintraege, von, bis, tage = {}) {
  const raus = [];
  const n = tageDazwischen(von, bis);
  for (let i = 0; i <= n; i++) raus.push(tagesWert(eintraege, plusTage(von, i), tage));
  return raus;
}

/**
 * Beschwerden nach Tageszeit. Beantwortet die Frage, die im Sprechzimmer
 * immer kommt: nüchtern oder nach dem Essen, tagsüber oder nachts.
 */
function nachTageszeit(eintraege) {
  const faecher = Object.keys(TAGESZEIT_NAME);
  const eimer = Object.fromEntries(faecher.map((k) => [k, { anzahl: 0, summe: 0 }]));
  eintraege.filter((e) => e.art === 'beschwerde').forEach((e) => {
    const f = eimer[tageszeit(e.um)];
    f.anzahl += 1;
    f.summe += Number(e.staerke) || 0;
  });
  return faecher.map((k) => ({
    id: k,
    name: TAGESZEIT_NAME[k],
    anzahl: eimer[k].anzahl,
    schnitt: eimer[k].anzahl ? eimer[k].summe / eimer[k].anzahl : 0,
  })).filter((f) => f.anzahl > 0).sort((a, b) => b.anzahl - a.anzahl);
}

/** Wie oft welche Beschwerdeart angekreuzt wurde. */
function nachArt(eintraege) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'beschwerde').forEach((e) => {
    (e.arten || []).forEach((a) => zaehler.set(a, (zaehler.get(a) || 0) + 1));
  });
  return [...zaehler.entries()].map(([id, anzahl]) => ({ id, anzahl }))
    .sort((a, b) => b.anzahl - a.anzahl);
}

/**
 * Die laufende Serie beschwerdefreier Tage, rückwärts ab `bis`.
 *
 * Ein Tag ohne Eintragung beendet die Serie nicht, aber er zählt auch nicht
 * mit – sonst wäre die längste Serie die längste Pause vom Tagebuch.
 */
function serieOhne(eintraege, tage, bis) {
  let iso = bis;
  let zaehler = 0;
  for (let i = 0; i < 400; i++) {
    const t = tagesWert(eintraege, iso, tage);
    if (t.notiert) {
      if (t.wert > 0) break;
      zaehler += 1;
    }
    iso = plusTage(iso, -1);
  }
  return zaehler;
}

/** Die großen Zahlen für die Übersicht und den Bericht. */
function gesamtZahlen(eintraege, tage, von, bis) {
  const reihe = verlaufReihe(eintraege, von, bis, tage);
  const notiert = reihe.filter((t) => t.notiert);
  const mit = notiert.filter((t) => t.wert > 0);
  return {
    tage: reihe.length,
    notierteTage: notiert.length,
    tageMitBeschwerden: mit.length,
    anteil: notiert.length ? mit.length / notiert.length : 0,
    schnitt: notiert.length ? notiert.reduce((s, t) => s + t.wert, 0) / notiert.length : 0,
    hoechster: notiert.reduce((m, t) => Math.max(m, t.wert), 0),
    mahlzeiten: reihe.reduce((s, t) => s + t.mahlzeiten, 0),
    medikamente: reihe.reduce((s, t) => s + t.medikamente, 0),
  };
}

/* ===== js/bild.js ===== */
/*
 * Das Bild: so weit Richtung Diagnose, wie ein Tagebuch ehrlich kommt.
 *
 * Diese Datei sagt nicht, was jemand hat. Sie sagt, wonach das aussieht, was
 * er eingetragen hat – und zwar in den Begriffen, die in einer Praxis benutzt
 * werden, damit das Gespräch dort nicht bei null anfängt.
 *
 * Warum nicht weiter? Weil weiter geraten wäre. Gastritis, Magengeschwür,
 * Refluxkrankheit, funktionelle Dyspepsie und ein Reizdarm machen im Tagebuch
 * teils dasselbe Bild. Auseinander hält sie eine Magenspiegelung, ein Test auf
 * Helicobacter, ein Blutbild, ein Atemtest – Dinge, die man nicht eintippen
 * kann. Eine App, die sich trotzdem für eine entscheidet, nimmt der
 * Untersuchung ihre Frage weg und der Nutzerin die Möglichkeit zu merken, dass
 * es etwas anderes ist.
 *
 * Was hier deshalb steht, ist dreierlei:
 *
 *   1. **Warnzeichen.** Der einzige Teil, der wirklich dringt. Wo Blut,
 *      Gewichtsverlust oder eine Schluckstörung im Tagebuch stehen, gehört ein
 *      klarer Satz hin und keine Statistik.
 *   2. **Muster mit Belegen.** „Säuretypisch, in 78 % der Einträge Brennen
 *      oder Sodbrennen, davon 12 von 15 nachts" – eine Beschreibung, die man
 *      nachrechnen und vorlesen kann.
 *   3. **Was dahinterstecken kann und was es unterscheidet.** Also welche
 *      Untersuchung welche Frage beantwortet. Das ist die nützlichste Zeile
 *      des ganzen Programms.
 */


/*
 * ---------------------------------------------------------------------------
 * 1. Warnzeichen
 * ---------------------------------------------------------------------------
 *
 * Sie stehen als eigene Liste im Beschwerdebogen, getrennt von der Frage, wie
 * es sich anfühlt. Ein Warnzeichen ist keine Ausprägung von „Brennen", es ist
 * eine andere Art von Angabe – und es darf nie in einer Statistik verschwinden.
 *
 * `dringlichkeit`:
 *   'sofort'  heute, notfalls über die 112 oder eine Notaufnahme
 *   'zeitnah' in den nächsten Tagen ein Termin, nicht „irgendwann mal"
 */
const WARNZEICHEN = [
  {
    id: 'bluterbrechen',
    name: 'Blut erbrochen oder kaffeesatzartiges Erbrechen',
    dringlichkeit: 'sofort',
    warum: 'Das kann eine Blutung im Magen oder in der Speiseröhre sein.',
  },
  {
    id: 'teerstuhl',
    name: 'Schwarzer, klebriger Stuhl',
    dringlichkeit: 'sofort',
    warum: 'Schwarzer Stuhl kann verdautes Blut sein. (Eisentabletten, Heidelbeeren '
      + 'und Bismut färben ihn ebenfalls dunkel – das gehört dazugesagt, aber '
      + 'geklärt wird das dort und nicht hier.)',
  },
  {
    id: 'ausstrahlung',
    name: 'Schmerz strahlt in Arm, Kiefer oder Rücken aus, mit Luftnot oder kaltem Schweiß',
    dringlichkeit: 'sofort',
    warum: 'Beschwerden in der Magengegend können vom Herzen kommen, besonders '
      + 'bei Frauen. Das ist der eine Fall, in dem Abwarten teuer wird.',
  },
  {
    id: 'blutstuhl',
    name: 'Frisches Blut im Stuhl',
    dringlichkeit: 'zeitnah',
    warum: 'Gehört abgeklärt, auch wenn Hämorrhoiden die häufigste Ursache sind.',
  },
  {
    id: 'schlucken',
    name: 'Schluckstörung, Essen bleibt stecken',
    dringlichkeit: 'zeitnah',
    warum: 'Eine Enge in der Speiseröhre wird nicht von selbst besser.',
  },
  {
    id: 'gewicht',
    name: 'Ungewollter Gewichtsverlust',
    dringlichkeit: 'zeitnah',
    warum: 'Abnehmen, ohne es zu wollen, ist immer eine eigene Frage wert.',
  },
  {
    id: 'erbrechen',
    name: 'Anhaltendes Erbrechen',
    dringlichkeit: 'zeitnah',
    warum: 'Länger als ein, zwei Tage: Es geht dabei auch Flüssigkeit verloren.',
  },
  {
    id: 'nachtschmerz',
    name: 'Schmerz weckt nachts auf',
    dringlichkeit: 'zeitnah',
    warum: 'Beschwerden, die aus dem Schlaf reißen, unterscheiden sich von '
      + 'solchen, die tagsüber kommen und gehen.',
  },
  {
    id: 'blaesse',
    name: 'Auffällige Blässe, Schwäche oder Luftnot bei Anstrengung',
    dringlichkeit: 'zeitnah',
    warum: 'Zeichen, die zu einer Blutarmut passen – ein Blutbild klärt das in '
      + 'einer Viertelstunde.',
  },
  {
    id: 'fieber',
    name: 'Fieber dazu',
    dringlichkeit: 'zeitnah',
    warum: 'Fieber gehört nicht zu einer gereizten Magenschleimhaut.',
  },
];

const WARN_MAP = Object.fromEntries(WARNZEICHEN.map((w) => [w.id, w]));

function warnzeichenVon(id) {
  return WARN_MAP[id] || null;
}

/**
 * Welche Warnzeichen im Tagebuch stehen – mit Datum und Häufigkeit.
 *
 * Ohne Zeitgrenze und ohne Schwelle: Ein einziges Mal Blut erbrochen ist ein
 * einziges Mal zu viel, und ein Eintrag von vor drei Monaten, der nie
 * abgeklärt wurde, ist keine alte Nachricht.
 */
function warnungen(eintraege) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'beschwerde').forEach((e) => {
    (e.warnzeichen || []).forEach((id) => {
      const w = WARN_MAP[id];
      if (!w) return;
      const v = zaehler.get(id) || { ...w, anzahl: 0, zuerst: e.am, zuletzt: e.am };
      v.anzahl += 1;
      if (e.am < v.zuerst) v.zuerst = e.am;
      if (e.am > v.zuletzt) v.zuletzt = e.am;
      zaehler.set(id, v);
    });
  });
  // Das Dringende zuerst, sonst nach Häufigkeit.
  const rang = { sofort: 0, zeitnah: 1 };
  return [...zaehler.values()]
    .sort((a, b) => (rang[a.dringlichkeit] - rang[b.dringlichkeit]) || (b.anzahl - a.anzahl));
}

/*
 * ---------------------------------------------------------------------------
 * 2. Die Muster
 * ---------------------------------------------------------------------------
 *
 * Jedes Muster prüft ein paar Bedingungen an den eigenen Daten. Jede erfüllte
 * Bedingung bringt Punkte *und* einen Beleg im Klartext – ein Punktestand ohne
 * Begründung wäre ein Orakel. Angezeigt wird nur, was mindestens zwei Belege
 * hat: Ein einzelner Treffer ist noch kein Bild.
 */

const SAEURE_ARTEN = ['brennen', 'sodbrennen', 'aufstossen'];
const FUELLE_ARTEN = ['druck', 'uebelkeit', 'appetit'];
const DARM_ARTEN = ['blaehung', 'krampf'];

const pz = (x) => `${Math.round(x * 100)} %`;

function musterSaeure(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, SAEURE_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.5) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Brennen, `
      + `Sodbrennen oder Aufstoßen (${pz(a.anteil)}).`);
  }
  const nacht = d.zeiten.find((z) => z.id === 'nacht');
  const abend = d.zeiten.find((z) => z.id === 'abend');
  const spaet = (nacht ? nacht.anzahl : 0) + (abend ? abend.anzahl : 0);
  const gesamtZeiten = d.zeiten.reduce((s, z) => s + z.anzahl, 0);
  if (gesamtZeiten >= 5 && spaet / gesamtZeiten >= 0.4) {
    punkte += 1;
    belege.push(`${spaet} von ${gesamtZeiten} Beschwerden traten abends oder nachts auf.`);
  }
  const spaetEssen = d.bilanz.find((b) => b.id === 'spaet');
  if (spaetEssen && spaetEssen.genug && spaetEssen.differenz >= 1) {
    punkte += 1;
    belege.push('Nach spätem Essen war es im Mittel deutlich schlechter als sonst.');
  }
  return { punkte, belege };
}

function musterFuelle(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, FUELLE_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.5) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Völlegefühl, `
      + `Übelkeit oder fehlenden Appetit (${pz(a.anteil)}).`);
  }
  if (d.essen.bewertbar >= 8 && d.essen.anteilNachDemEssen >= 0.6) {
    punkte += 2;
    belege.push(`${d.essen.nachDemEssen} von ${d.essen.bewertbar} zuordenbaren `
      + `Beschwerden kamen innerhalb von zwei Stunden nach dem Essen.`);
  }
  const gross = d.bilanz.find((b) => b.id === 'gross');
  if (gross && gross.genug && gross.differenz >= 1) {
    punkte += 1;
    belege.push('Nach großen Portionen war es im Mittel schlechter als nach kleinen.');
  }
  return { punkte, belege };
}

function musterNuechtern(d) {
  const belege = [];
  let punkte = 0;
  if (d.essen.bewertbar >= 8 && d.essen.anteilNuechtern >= 0.5) {
    // Höher gewichtet als die anderen Muster, und das mit Absicht: „Brennen"
    // haben fast alle, aber *wann* es kommt, ist die spezifische Angabe. Sie
    // trennt den Nüchternschmerz vom Völlegefühl nach dem Essen – und das sind
    // zwei verschiedene Sprechstunden.
    punkte += 4;
    belege.push(`${d.essen.nuechtern} von ${d.essen.bewertbar} zuordenbaren `
      + `Beschwerden kamen erst vier Stunden oder länger nach der letzten Mahlzeit.`);
    // Die Gegenprobe gehört dazu: Dass es *nicht* nach dem Essen kommt, ist
    // hier der halbe Befund, und ohne ihn stünde die Aussage auf einem Bein.
    punkte += 1;
    belege.push(`Nur ${d.essen.nachDemEssen} davon kamen innerhalb von zwei `
      + `Stunden nach einer Mahlzeit.`);
  }
  const nacht = d.zeiten.find((z) => z.id === 'nacht');
  if (nacht && nacht.anzahl >= 3) {
    punkte += 1;
    belege.push(`${nacht.anzahl}-mal traten Beschwerden nachts auf.`);
  }
  return { punkte, belege };
}

function musterDarm(d) {
  const belege = [];
  let punkte = 0;
  const a = artAnteil(d.eintraege, DARM_ARTEN);
  if (a.gesamt >= 5 && a.anteil >= 0.4) {
    punkte += 2;
    belege.push(`In ${a.anzahl} von ${a.gesamt} Eintragungen ging es um Blähungen `
      + `oder Krämpfe (${pz(a.anteil)}).`);
  }
  ['huelsen', 'milch', 'rohkost', 'vollkorn'].forEach((id) => {
    const b = d.bilanz.find((x) => x.id === id);
    if (b && b.genug && b.differenz >= 1) {
      punkte += 1;
      belege.push(`Auffällig nach Mahlzeiten mit ${d.name(id)} `
        + `(${b.faelle} Mahlzeiten damit, ${b.gegenFaelle} ohne).`);
    }
  });
  return { punkte, belege };
}

function musterNsar(d) {
  const belege = [];
  let punkte = 0;
  if (d.nsarTage >= 3) {
    punkte += 3;
    belege.push(`An ${d.nsarTage} Tagen wurde ein entzündungshemmendes `
      + `Schmerzmittel eingetragen (Ibuprofen, Diclofenac, ASS oder ähnlich).`);
    if (d.nsarSchnitt > d.schnittGesamt + 0.5) {
      punkte += 1;
      belege.push(`An diesen Tagen lag die Beschwerdestärke bei `
        + `${d.nsarSchnitt.toFixed(1).replace('.', ',')} statt `
        + `${d.schnittGesamt.toFixed(1).replace('.', ',')}.`);
    }
  }
  return { punkte, belege };
}

function musterStress(d) {
  const belege = [];
  let punkte = 0;
  [['stress', 'Anspannung'], ['schlaf', 'schlechtem Schlaf'], ['stimmung', 'gedrückter Stimmung']]
    .forEach(([id, wort]) => {
      const f = d.faktoren[id];
      if (f && f.genug && f.differenz >= 1) {
        punkte += 2;
        belege.push(`An Tagen mit ${wort} lag die Beschwerdestärke bei `
          + `${f.hoch.schnitt.toFixed(1).replace('.', ',')} statt `
          + `${f.niedrig.schnitt.toFixed(1).replace('.', ',')} `
          + `(${f.hoch.tage} gegen ${f.niedrig.tage} Tage).`);
      }
    });
  return { punkte, belege };
}

function musterZyklus(d) {
  const belege = [];
  let punkte = 0;
  if (!d.zyklusBelastbar || d.phasen.length < 2) return { punkte, belege };
  const sortiert = [...d.phasen].sort((a, b) => b.schnitt - a.schnitt);
  const hoch = sortiert[0];
  const tief = sortiert[sortiert.length - 1];
  if (hoch.schnitt - tief.schnitt >= 1.5 && hoch.tage >= 4 && tief.tage >= 4) {
    punkte += 3;
    belege.push(`In der Phase „${hoch.name}" lag die Beschwerdestärke bei `
      + `${hoch.schnitt.toFixed(1).replace('.', ',')} (${hoch.tage} Tage), `
      + `in der Phase „${tief.name}" bei ${tief.schnitt.toFixed(1).replace('.', ',')} `
      + `(${tief.tage} Tage).`);
  }
  return { punkte, belege };
}
