<style>
/*
 * Ein Blatt für alles. Keine Voreinstellung von außen, kein Baukasten.
 *
 * Dunkel als Grundton, und das hat hier einen Grund über den Geschmack hinaus:
 * Ein Magentagebuch wird oft nachts aufgemacht, wenn jemand davon wach
 * geworden ist. Ein weißes Bild ist in diesem Moment eine Zumutung.
 *
 * Die Farben liegen als Variablen auf :root, die Farbwahl ändert nur die
 * Akzente – Hintergrund, Linien und die Ampel von grün bis rot bleiben, damit
 * ein Verlauf in jeder Einstellung gleich zu lesen ist.
 */

:root {
  /* Der Grund bleibt dunkel und wird nur warm getönt statt neutral grau: Ein
     rosa Akzent auf blaustichigem Grau wird schmutzig, auf einem Grund mit
     einem Hauch Rot bleibt er rosa. */
  --bg: #141013;
  --bg-elev: #1c171b;
  --bg-elev-2: #251f24;
  --line: #362c33;
  --text: #efe9ec;
  --muted: #a5959e;
  --accent: #ff7fb0;
  --accent-weich: #ff7fb022;
  /* Die Ampel des Verlaufs. Vier Stufen, und sie bleiben in jeder Farbwahl
     gleich: Ein Kalender, dessen Farben mit dem Design wandern, ist nach dem
     dritten Umstellen nicht mehr zu lesen.

     --leicht ist bewusst kein Grün und auch nicht die Akzentfarbe. Vorher war
     es die – und weil der Grundton dieser App salbeigrün ist, sahen ein
     beschwerdefreier Tag und ein Tag mit Stärke 2 im Monatsraster fast gleich
     aus. Genau diese beiden auseinanderzuhalten ist der Zweck des Rasters. */
  --ok: #58c48c;
  --leicht: #c2bd57;
  --warn: #dda03f;
  --bad: #e07268;
  /* Damit der Browser auch seine eigenen Bedienelemente dunkel zeichnet –
     ohne das stehen die Datums- und Uhrzeitfelder als weiße Kästen im
     dunklen Blatt. */
  color-scheme: dark;
  --radius: 14px;
  --tabbar-h: 60px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

:root[data-theme="flieder"] { --accent: #c79bec; --accent-weich: #c79bec22; }
:root[data-theme="koralle"] { --accent: #ff8f7a; --accent-weich: #ff8f7a22; }
:root[data-theme="salbei"]  { --accent: #6dbf9a; --accent-weich: #6dbf9a22; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  /* Kein Ziehen-zum-Neuladen: Am oberen Rand nach unten zu wischen lud sonst
     die Seite neu und warf aus dem Bogen, den man gerade ausfüllt. */
  overscroll-behavior-y: contain;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

body.bogen-auf { overflow: hidden; }

button { font: inherit; color: inherit; }
h2, h3 { margin: 0 0 8px; }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }

/* ---------- Kopf ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-in {
  max-width: 680px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.brand { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .3px; }
.brand::before {
  content: "";
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
}
.brand-sub { margin: 0; font-size: 12px; color: var(--muted); }

/* ---------- Rumpf ---------- */
.view {
  max-width: 680px;
  margin: 0 auto;
  padding: 14px 14px calc(var(--tabbar-h) + var(--safe-b) + 22px);
}
.view:focus { outline: none; }

.karte {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.karte.warn { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg-elev)); }
.karte.hinweis { background: none; }

.klein { font-size: 13px; color: var(--muted); }
.klein.warnend { color: var(--warn); }
.leer {
  color: var(--muted);
  text-align: center;
  padding: 26px 10px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  margin-bottom: 12px;
}
.feld-name { font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
.reihe { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.reihe-zeit { margin-bottom: 4px; }

/* ---------- Knöpfe ---------- */
.btn {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 14px;
  cursor: pointer;
  min-height: 44px;
}
.btn:disabled { opacity: .35; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #1a1014; font-weight: 600; }
.btn-ghost { background: none; }
.btn-danger { background: none; border-color: var(--bad); color: var(--bad); }
.btn-block { display: block; width: 100%; }
.btn-rund { width: 44px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 1; }

.feld {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 12px;
  color: var(--text);
  min-height: 44px;
  font: inherit;
}
.feld-breit { display: block; width: 100%; }
.feld:focus-visible, .btn:focus-visible, .marke:focus-visible, .stufe:focus-visible,
.tab:focus-visible, .feld-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Tagkopf ---------- */
.tagkopf { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.tagkopf-mitte { flex: 1; text-align: center; }
.tagkopf-mitte h2 { margin: 0; }
.tag-datum {
  background: none; border: none; color: var(--muted);
  font: inherit; font-size: 13px; padding: 0;
}

<script type="module">
/* ===== js/datum.js ===== */
/*
 * Datum und Uhrzeit – die unterste Schicht. Hängt von nichts ab.
 *
 * Ein Tagebuch rechnet dauernd mit Zeit, und zwar mit *örtlicher* Zeit: Wer um
 * halb elf abends isst und um eins nachts Beschwerden bekommt, hat einen
 * Zusammenhang erlebt, den keine Tagesgrenze zerschneiden darf. Deshalb steht
 * hier neben dem Datum auch der Zeitpunkt – Datum plus Uhrzeit, zusammen
 * gerechnet.
 *
 * Alles in Ortszeit, nichts in UTC. Die Alternative wäre ein Eintrag, der nach
 * einer Reise oder der Zeitumstellung auf einem anderen Tag steht als dem, an
 * dem er gemacht wurde.
 */

const WOCHENTAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
  'August', 'September', 'Oktober', 'November', 'Dezember'];

/** Kürzel der Wochentage, montags zuerst – so steht ein Kalender hierzulande. */
const WOCHE_KOPF = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

const pad2 = (n) => String(n).padStart(2, '0');

function zuISO(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function heuteISO() {
  return zuISO(new Date());
}

/** Aktuelle Uhrzeit als "HH:MM". */
function jetztUhr() {
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function ausISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function plusTage(iso, tage) {
  if (!tage) return iso;
  const d = ausISO(iso);
  d.setDate(d.getDate() + tage);
  return zuISO(d);
}

/** Ganze Tage von isoA bis isoB; positiv, wenn isoB später liegt. */
function tageDazwischen(isoA, isoB) {
  return Math.round((ausISO(isoB) - ausISO(isoA)) / 86400000);
}

/**
 * Ein Zeitpunkt aus Datum und Uhrzeit, als Millisekunden.
 *
 * Fehlt die Uhrzeit oder ist sie unbrauchbar, gilt Mittag statt Mitternacht:
 * Ein Eintrag ohne Uhrzeit soll innerhalb seines Tages liegen und nicht am
 * Rand, wo er beim Rechnen mit Zeitfenstern in den Vortag rutscht.
 */
function zeitpunkt(iso, uhr) {
  const d = ausISO(iso);
  const m = /^(\d{1,2}):(\d{2})$/.exec(uhr || '');
  if (m) d.setHours(Number(m[1]), Number(m[2]), 0, 0);
  else d.setHours(12, 0, 0, 0);
  return d.getTime();
}

/** Stunden von a nach b; positiv, wenn b später liegt. */
function stundenDazwischen(a, b) {
  return (b - a) / 3600000;
}

/** Minuten seit Mitternacht – zum Sortieren innerhalb eines Tages. */
function minutenAmTag(uhr) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(uhr || '');
  return m ? Number(m[1]) * 60 + Number(m[2]) : 12 * 60;
}

function fmtDatum(iso, lang) {
  const d = ausISO(iso);
  const wd = WOCHENTAGE[d.getDay()];
  if (lang) return `${wd}, ${d.getDate()}. ${MONATE[d.getMonth()]} ${d.getFullYear()}`;
  return `${wd}, ${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.`;
}

function fmtMonat(iso) {
  const d = ausISO(iso);
  return `${MONATE[d.getMonth()]} ${d.getFullYear()}`;
}

/** "heute", "gestern" oder das Datum – für Überschriften. */
function fmtTag(iso) {
  const abstand = tageDazwischen(iso, heuteISO());
  if (abstand === 0) return 'heute';
  if (abstand === 1) return 'gestern';
  if (abstand === -1) return 'morgen';
  return fmtDatum(iso, true);
}

/** Erster Tag des Monats, in dem `iso` liegt. */
function monatsStart(iso) {
  return `${iso.slice(0, 7)}-01`;
}

/** `n` Monate weiter, immer auf den Ersten. Über Jahresgrenzen hinweg. */
function plusMonate(iso, n) {
  const d = ausISO(monatsStart(iso));
  d.setMonth(d.getMonth() + n);
  return zuISO(d);
}

/**
 * Alle Tage, die ein Monatsraster zeigt: ganze Wochen von Montag bis Sonntag,
 * vorn und hinten mit den Nachbarmonaten aufgefüllt.
 */
function monatsRaster(iso) {
  const erster = ausISO(monatsStart(iso));
  const vorlauf = (erster.getDay() + 6) % 7;          // Mo = 0
  // Monatslänge über den Abstand zum nächsten Ersten. Math.round, weil eine
  // Zeitumstellung im Monat sonst eine Stunde fehlen ließe.
  const laenge = Math.round((ausISO(plusMonate(iso, 1)) - erster) / 86400000);
  const felder = Math.ceil((vorlauf + laenge) / 7) * 7;
  const raus = [];
  for (let i = 0; i < felder; i++) {
    const d = new Date(erster);
    d.setDate(d.getDate() - vorlauf + i);
    raus.push(zuISO(d));
  }
  return raus;
}

/**
 * Grobe Tageszeit einer Uhrzeit. Für die Frage, wann die Beschwerden kommen –
 * nachts ist eine andere Auskunft als nach dem Mittagessen.
 */
function tageszeit(uhr) {
  const m = minutenAmTag(uhr);
  if (m < 5 * 60) return 'nacht';
  if (m < 11 * 60) return 'morgen';
  if (m < 15 * 60) return 'mittag';
  if (m < 19 * 60) return 'nachmittag';
  return 'abend';
}

const TAGESZEIT_NAME = {
  nacht: 'nachts',
  morgen: 'morgens',
  mittag: 'mittags',
  nachmittag: 'nachmittags',
  abend: 'abends',
};

/* ===== js/text.js ===== */
/*
 * Text und Zahlen fürs Auge. Hängt von nichts ab und darf deshalb überall
 * benutzt werden.
 */

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/** Zahl in deutscher Schreibweise, ohne unnötige Null hinter dem Komma. */
function fmtZahl(n, stellen = 1) {
  if (!Number.isFinite(n)) return '–';
  return Number.isInteger(n) ? String(n) : String(+n.toFixed(stellen)).replace('.', ',');
}

function mehrzahl(n, eins, viele) {
  return `${n} ${n === 1 ? eins : viele}`;
}

/**
 * Lange Eingaben kürzen, ohne mitten im Wort abzubrechen.
 *
 * Gebraucht in der Tagesliste: „Was gegessen?" ist ein freies Feld, und
 * jemand, der ein ganzes Menü hineinschreibt, soll die Liste nicht sprengen.
 */
function kuerze(s, max = 60) {
  const t = String(s).trim();
  if (t.length <= max) return t;
  const schnitt = t.slice(0, max);
  const luecke = schnitt.lastIndexOf(' ');
  return `${(luecke > max * 0.6 ? schnitt.slice(0, luecke) : schnitt).trimEnd()} …`;
}

/* ===== js/daten.js ===== */
/*
 * Die Kataloge: was man ankreuzen kann.
 *
 * Zwei Listen tragen die App. Die eine sagt, was in einer Mahlzeit stecken
 * kann und als Magenreiz gilt; die andere, wie sich Beschwerden anfühlen.
 * Beide sind absichtlich kurz. Eine Liste mit hundert Einträgen wird nicht
 * ausgefüllt, und was nicht ausgefüllt wird, taucht in keiner Auswertung auf.
 *
 * Wichtig zur Einordnung: Die Auswahl hier ist kein medizinisches Urteil. Sie
 * sammelt, was in der Ernährungsberatung bei Magenbeschwerden üblicherweise
 * zur Sprache kommt – als *Verdachtsliste*, damit man beim Eintragen nicht
 * jedes Mal überlegen muss. Ob etwas davon bei einem bestimmten Menschen
 * tatsächlich stört, sagt allein sein eigener Verlauf. Genau dafür ist die
 * App da, und genau deshalb steht in der Auswertung immer die Fallzahl daneben.
 *
 * `id` ist der Schlüssel im Speicher und darf sich nie ändern – daran hängen
 * alle bereits gemachten Eintragungen. Namen dürfen sich ändern.
 */

const AUSLOESER = [
  { id: 'kaffee', name: 'Kaffee', icon: '☕' },
  { id: 'alkohol', name: 'Alkohol', icon: '🍷' },
  { id: 'scharf', name: 'Scharf gewürzt', icon: '🌶️' },
  { id: 'fett', name: 'Fettig, frittiert', icon: '🍟' },
  { id: 'zitrus', name: 'Zitrus, Saures', icon: '🍋' },
  { id: 'tomate', name: 'Tomate', icon: '🍅' },
  { id: 'zwiebel', name: 'Zwiebel, Knoblauch', icon: '🧅' },
  { id: 'kohlensaeure', name: 'Kohlensäure', icon: '🥤' },
  { id: 'suess', name: 'Süßes, Schokolade', icon: '🍫' },
  { id: 'milch', name: 'Milchprodukte', icon: '🥛' },
  { id: 'rohkost', name: 'Rohkost, Salat', icon: '🥗' },
  { id: 'huelsen', name: 'Hülsenfrüchte, Kohl', icon: '🫘' },
  { id: 'vollkorn', name: 'Vollkorn', icon: '🌾' },
  { id: 'geraeuchert', name: 'Geräuchert, gepökelt', icon: '🥓' },
  { id: 'minze', name: 'Pfefferminze', icon: '🌿' },
  { id: 'nikotin', name: 'Nikotin', icon: '🚬' },
];

/**
 * Zwei Merkmale, die keine Zutat sind, sondern die Umstände: die Portion und
 * die späte Stunde. Beide gelten als Magenreiz und werden in der Auswertung
 * genauso behandelt wie eine Zutat – deshalb stehen sie hier mit derselben
 * Struktur, aber getrennt: Beim Eintragen kreuzt man sie nicht an, sie ergeben
 * sich aus der Portionsangabe und der Uhrzeit.
 */
const UMSTAENDE = [
  { id: 'gross', name: 'Große Portion', icon: '🍽️' },
  { id: 'spaet', name: 'Spät gegessen (nach 20 Uhr)', icon: '🌙' },
];

/** Alles, was die Auswertung als möglichen Auslöser kennt. */
const ALLE_AUSLOESER = [...AUSLOESER, ...UMSTAENDE];

const BESCHWERDEN = [
  { id: 'brennen', name: 'Brennen', icon: '🔥' },
  { id: 'druck', name: 'Druck, Völlegefühl', icon: '🪨' },
  { id: 'uebelkeit', name: 'Übelkeit', icon: '🤢' },
  { id: 'sodbrennen', name: 'Sodbrennen', icon: '🌋' },
  { id: 'aufstossen', name: 'Aufstoßen', icon: '💨' },
  { id: 'blaehung', name: 'Blähungen', icon: '🎈' },
  { id: 'krampf', name: 'Krämpfe', icon: '⚡' },
  { id: 'appetit', name: 'Kein Appetit', icon: '🍽️' },
];

const PORTIONEN = [
  { id: 'klein', name: 'klein' },
  { id: 'normal', name: 'normal' },
  { id: 'gross', name: 'groß' },
];

/**
 * Vorschläge fürs Medikamentenfeld – nur Vorschläge. Das Feld bleibt frei
 * beschreibbar, weil jede Vorgabe hier irgendwann an dem vorbeigeht, was
 * jemand tatsächlich einnimmt.
 */
const MITTEL_VORSCHLAEGE = [
  'Pantoprazol', 'Omeprazol', 'Esomeprazol', 'Antazidum', 'Sucralfat',
  'Iberogast', 'Kamillentee', 'Heilerde',
];

/** Wie stark, in Worten. Die Zahl allein sagt nach vier Wochen nichts mehr. */
const STAERKE_WORT = [
  'keine', 'kaum spürbar', 'sehr leicht', 'leicht', 'merklich', 'mittel',
  'deutlich', 'stark', 'sehr stark', 'kaum auszuhalten', 'unerträglich',
];

const NACH_ID = (liste) => Object.fromEntries(liste.map((x) => [x.id, x]));

const AUSLOESER_MAP = NACH_ID(ALLE_AUSLOESER);
const BESCHWERDE_MAP = NACH_ID(BESCHWERDEN);

/**
 * Ein Auslöser zu seiner ID – auch für eigene, die der Nutzer angelegt hat.
 *
 * Eigene Auslöser bekommen die Vorsilbe `x:`; damit kann keine spätere
 * Erweiterung der Liste oben eine bereits vergebene eigene ID überschreiben.
 */
function ausloeserVon(id, eigene = []) {
  if (AUSLOESER_MAP[id]) return AUSLOESER_MAP[id];
  const selbst = eigene.find((e) => e.id === id);
  return selbst ? { ...selbst, icon: selbst.icon || '•' } : null;
}

function ausloeserName(id, eigene = []) {
  const a = ausloeserVon(id, eigene);
  return a ? a.name : id;
}

function beschwerdeVon(id) {
  return BESCHWERDE_MAP[id] || null;
}

function beschwerdeName(id) {
  const b = beschwerdeVon(id);
  return b ? b.name : id;
}

/** Aus einem freien Namen eine eigene Auslöser-ID machen. */
function eigeneId(name) {
  const rumpf = String(name).toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return `x:${rumpf || 'eigen'}`;
}

/* ===== js/chart.js ===== */
/*
 * Ein Balkendiagramm als SVG-Zeichenkette. Ohne Bibliothek, ohne Leinwand.
 *
 * Warum SVG und nicht <canvas>: Die Tafel wird zusammen mit dem übrigen HTML
 * neu gezeichnet, sobald sich der Zustand ändert. Eine Leinwand müsste dafür
 * nach jedem Rendern eigens angemalt werden – bei einer Zeichenkette fällt
 * dieser zweite Schritt weg, und die Tafel kann nicht „vergessen" werden.
 *
 * Ein Tag ohne Eintragung ist etwas anderes als ein Tag ohne Beschwerden.
 * Deshalb zwei getrennte Darstellungen: kein Balken, aber ein Grundstrich für
 * „nichts eingetragen", ein flacher Strich in Grün für „eingetragen, aber
 * beschwerdefrei". Wer das zusammenwirft, liest aus einer Lücke im Tagebuch
 * einen guten Tag heraus.
 */

const TAFEL_HOCH = 100;
const TAFEL_MAX = 10;

/**
 * @param {{am: string, wert: number|null, notiert: boolean}[]} punkte
 * @param {{titel?: string, hinweis?: string}} opt
 */
function verlaufTafel(punkte, opt = {}) {
  if (!punkte.length) return '';
  const n = punkte.length;
  const breite = 300;
  const spalte = breite / n;
  const balken = Math.max(1.5, Math.min(spalte * 0.62, 10));

  const stuecke = punkte.map((p, i) => {
    const x = i * spalte + (spalte - balken) / 2;
    if (!p.notiert) {
      return `<rect x="${x.toFixed(2)}" y="${TAFEL_HOCH - 1.5}" width="${balken.toFixed(2)}" height="1.5" `
        + `rx="0.75" fill="var(--line)"><title>${fmtDatum(p.am)}: nichts eingetragen</title></rect>`;
    }
    const wert = Math.max(0, Math.min(TAFEL_MAX, p.wert || 0));
    const h = Math.max(2, (wert / TAFEL_MAX) * TAFEL_HOCH);
    const farbe = wert === 0 ? 'var(--ok)' : (wert >= 7 ? 'var(--bad)' : (wert >= 4 ? 'var(--warn)' : 'var(--leicht)'));
    return `<rect x="${x.toFixed(2)}" y="${(TAFEL_HOCH - h).toFixed(2)}" width="${balken.toFixed(2)}" `
      + `height="${h.toFixed(2)}" rx="${(balken / 2.5).toFixed(2)}" fill="${farbe}">`
      + `<title>${fmtDatum(p.am)}: ${wert === 0 ? 'beschwerdefrei' : `Stärke ${wert}`}</title></rect>`;
  }).join('');

  // Hilfslinie bei 5 – ohne Bezugspunkt sagt die Höhe eines Balkens nichts.
  const mitte = `<line x1="0" y1="${TAFEL_HOCH / 2}" x2="${breite}" y2="${TAFEL_HOCH / 2}" `
    + 'stroke="var(--line)" stroke-width="0.6" stroke-dasharray="3 3"/>';

  return `<figure class="tafel">
    ${opt.titel ? `<figcaption class="tafel-titel">${opt.titel}</figcaption>` : ''}
    <svg viewBox="0 0 ${breite} ${TAFEL_HOCH}" preserveAspectRatio="none" role="img"
         aria-label="${opt.titel || 'Verlauf'}: Balken je Tag, Höhe ist die stärkste Beschwerde von 0 bis 10">
      ${mitte}${stuecke}
    </svg>
    <div class="tafel-fuss">
      <span>${fmtDatum(punkte[0].am)}</span>
      ${opt.hinweis ? `<span class="tafel-hinweis">${opt.hinweis}</span>` : ''}
      <span>${fmtDatum(punkte[n - 1].am)}</span>
    </div>
  </figure>`;
}

/**
 * Ein waagerechter Vergleichsbalken: mit Auslöser gegen ohne.
 *
 * Zwei Balken übereinander statt einer Differenzzahl, weil die Differenz allein
 * täuscht – „2 Punkte mehr" heißt bei einem Grundpegel von 1 etwas anderes als
 * bei einem von 7.
 */
function vergleichBalken(mit, ohne) {
  const anteil = (v) => `${Math.max(1.5, Math.min(100, (v / TAFEL_MAX) * 100)).toFixed(1)}%`;
  return `<div class="vgl">
    <div class="vgl-zeile"><span class="vgl-mark">danach</span>
      <span class="vgl-spur"><i style="width:${anteil(mit)};background:var(--warn)"></i></span>
      <b>${mit.toFixed(1).replace('.', ',')}</b></div>
    <div class="vgl-zeile"><span class="vgl-mark">sonst</span>
      <span class="vgl-spur"><i style="width:${anteil(ohne)};background:var(--muted)"></i></span>
      <b>${ohne.toFixed(1).replace('.', ',')}</b></div>
  </div>`;
}

/* ===== js/store.js ===== */
/*
 * Der Speicher. Alles, was eingetragen wird, liegt hier – und nur hier.
 *
 * Es gibt keinen Server, kein Konto und keine Anmeldung. Der gesamte Zustand
 * steht im localStorage dieses einen Browsers auf diesem einen Gerät. Das ist
 * keine Sparmaßnahme, sondern die Bauart: Ein Tagebuch über den eigenen Körper
 * soll nirgendwohin gehen, wo es jemand anders lesen könnte, und was nie
 * verschickt wird, kann auch nicht abhandenkommen.
 *
 * Die Kehrseite steht ehrlich in der App: Ein gelöschter Browser-Speicher
 * nimmt alles mit. Dagegen hilft nur die Sicherung unter „Mehr" – deshalb
 * erinnert die App daran, und deshalb ist der Export eine gewöhnliche
 * JSON-Datei, die man auch ohne diese App noch lesen kann.
 */

const KEY = 'bauchbuch.state.v1';

const VORGABE = {
  // Alle Eintragungen in einer Liste, nach Zeitpunkt sortiert gehalten.
  // Ein Eintrag ist immer { id, am, um, art } plus die Felder seiner Art:
  //   essen       { was, tags: [ausloeserId], portion: 'klein'|'normal'|'gross' }
  //   beschwerde  { staerke: 0..10, arten: [beschwerdeId], notiz }
  //   medikament  { mittel, dosis }
  //   notiz       { text }
  eintraege: [],
  // Was für einen ganzen Tag gilt, nicht für einen Zeitpunkt:
  // { 'YYYY-MM-DD': { stress: 0..4, schlaf: 0..4, notiz } }
  tage: {},
  // In wie vielen Stunden nach einer Mahlzeit eine Beschwerde ihr noch
  // zugerechnet wird. Vier Stunden sind der Vorschlag, nicht das Gesetz –
  // wer weiß, dass es bei ihm später kommt, stellt es unter Mehr um.
  fenster: 4,
  // Ab wie vielen Mahlzeiten mit einem Auslöser die Auswertung überhaupt
  // etwas dazu sagt. Darunter ist jede Aussage Zufall, und eine App, die aus
  // zwei Fällen eine Regel macht, schadet mehr als sie nützt.
  mindestFaelle: 5,
  eigeneAusloeser: [],   // [{ id: 'x:...', name }]
  zuletztMittel: [],     // zuletzt eingetragene Medikamente, als Vorschlag
  theme: 'rosa',
  begruesst: false,
  tab: 'heute',
  lastBackup: null,      // { on, anzahl } – wann zuletzt gesichert wurde
};

const klon = (o) => JSON.parse(JSON.stringify(o));

let zustand = laden();
const hoerer = new Set();

function laden() {
  try {
    const roh = localStorage.getItem(KEY);
    if (!roh) return klon(VORGABE);
    const gelesen = JSON.parse(roh);
    const s = Object.assign(klon(VORGABE), gelesen);
    // Wer schon etwas eingetragen hat, hat die Begrüßung hinter sich – auch
    // wenn der Stand aus einer Fassung stammt, die den Schlüssel noch nicht
    // kannte. Sonst stünde die Einführung eines Tages wieder vor dem Tagebuch.
    if (!('begruesst' in gelesen) && s.eintraege.length) s.begruesst = true;
    s.eintraege = sortiert(Array.isArray(s.eintraege) ? s.eintraege : []);
    return s;
  } catch {
    return klon(VORGABE);
  }
}

/** Nach Tag und Uhrzeit. Die Liste wird nirgends anders sortiert. */
function sortiert(liste) {
  return [...liste].sort((a, b) => (a.am === b.am
    ? minutenAmTag(a.um) - minutenAmTag(b.um)
    : (a.am < b.am ? -1 : 1)));
}

/* ---------- Schreiben ---------- */

let schreibUhr = null;

/**
 * Warum nicht gespeichert werden kann – und das sind zwei verschiedene Lagen.
 *
 *   'gesperrt'  Der Browser lässt gar nicht erst speichern: privates Fenster,
 *               eingebettete Ansicht, blockierte Website-Daten. Nichts bleibt,
 *               aber es war auch nie etwas da.
 *
 *   'voll'      Es ging bisher, und jetzt nicht mehr. Das ist die gefährliche
 *               Lage: Monate an Eintragungen liegen gespeichert, der heutige
 *               Eintrag kommt nicht mehr dazu. Hier gehört der Rat zur
 *               Sicherung hin, sofort und deutlich.
 */
function warumNicht(fehler) {
  // Chrome/Safari melden QuotaExceededError, Firefox NS_ERROR_DOM_QUOTA_REACHED,
  // ältere Fassungen nur den Code 22. Alles andere ist eine Sperre.
  const name = fehler && (fehler.name || '');
  const code = fehler && fehler.code;
  return (name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED'
    || code === 22 || code === 1014) ? 'voll' : 'gesperrt';
}

let speicherGeht = true;
let speicherFehler = null;

try {
  localStorage.setItem(`${KEY}.probe`, '1');
  localStorage.removeItem(`${KEY}.probe`);
} catch {
  // Beim Start ist auch ein voller Speicher eine Sperre: Es gibt noch nichts
  // zu retten, und der Rat wäre derselbe wie bei jeder anderen Ursache.
  speicherGeht = false;
  speicherFehler = 'gesperrt';
}

/** false, wenn der Browser nichts speichern kann – Eintragungen sind flüchtig. */
function kannSpeichern() { return speicherGeht; }

/** 'gesperrt', 'voll' oder null – siehe warumNicht(). */
function speicherGrund() { return speicherGeht ? null : speicherFehler; }

function schreibe() {
  schreibUhr = null;
  const vorher = speicherGeht;
  try {
    localStorage.setItem(KEY, JSON.stringify(zustand));
    speicherGeht = true;
    speicherFehler = null;
  } catch (e) {
    speicherGeht = false;
    speicherFehler = warumNicht(e);
  }
  // Beim Wechsel melden, in *beide* Richtungen: Der Schreibvorgang läuft nach
  // dem Zeichnen, die Warnung stünde sonst einen Eintrag zu spät da – und
  // bliebe nach dem Aufräumen kleben, bis zufällig etwas anderes neu zeichnet.
  if (speicherGeht !== vorher) melde();
}

function merke() {
  clearTimeout(schreibUhr);
  schreibUhr = setTimeout(schreibe, 120);
}

/**
 * Ausstehenden Schreibvorgang sofort ausführen. Nötig, bevor die App in den
 * Hintergrund geht: mobile Browser verwerfen die Seite dort ohne Vorwarnung,
 * und der letzte Eintrag wäre verloren.
 */
function sofortSchreiben() {
  if (schreibUhr === null) return;
  clearTimeout(schreibUhr);
  schreibe();
}

function melde() {
  hoerer.forEach((fn) => fn(zustand));
}

function horche(fn) {
  hoerer.add(fn);
  return () => hoerer.delete(fn);
}

function zustandLesen() { return zustand; }

/* ---------- Eintragungen ---------- */

/**
 * Eine Kennung, die auch dann eindeutig bleibt, wenn zwei Einträge in
 * derselben Millisekunde entstehen – beim Einlesen einer Sicherung etwa, oder
 * wenn jemand schnell hintereinander tippt.
 */
let zaehler = 0;
function neueId() {
  zaehler += 1;
  return `e${Date.now().toString(36)}${zaehler.toString(36)}`;
}

/**
 * Einen Eintrag anlegen. Datum und Uhrzeit sind optional und stehen sonst auf
 * jetzt – der Normalfall ist „ich trage gerade ein, was gerade war".
 */
function eintragen(eintrag) {
  const neu = {
    id: neueId(),
    am: eintrag.am || heuteISO(),
    um: eintrag.um || jetztUhr(),
    ...eintrag,
  };
  zustand.eintraege = sortiert([...zustand.eintraege, neu]);
  merke();
  melde();
  return neu.id;
}

function eintragAendern(id, patch) {
  const i = zustand.eintraege.findIndex((e) => e.id === id);
  if (i < 0) return;
  zustand.eintraege[i] = { ...zustand.eintraege[i], ...patch, id };
  zustand.eintraege = sortiert(zustand.eintraege);
  merke();
  melde();
}

function eintragLoeschen(id) {
  const vorher = zustand.eintraege.length;
  zustand.eintraege = zustand.eintraege.filter((e) => e.id !== id);
  if (zustand.eintraege.length === vorher) return;
  merke();
  melde();
}

function eintragVon(id) {
  return zustand.eintraege.find((e) => e.id === id) || null;
}

/** Alle Eintragungen eines Tages, in zeitlicher Reihenfolge. */
function eintraegeAm(iso) {
  return zustand.eintraege.filter((e) => e.am === iso);
}

/** Der Tag der jüngsten Eintragung – oder heute, wenn es keine gibt. */
function letzterTag() {
  const e = zustand.eintraege;
  return e.length ? e[e.length - 1].am : heuteISO();
}

/**
 * Wann zuletzt etwas eingetragen wurde, als Zeitpunkt. Die Tagesansicht
 * braucht das, um „seit 6 Stunden nichts" sagen zu können.
 */
function letzterZeitpunkt() {
  const e = zustand.eintraege;
  return e.length ? zeitpunkt(e[e.length - 1].am, e[e.length - 1].um) : null;
}

/* ---------- Tagesangaben ---------- */

function tagLesen(iso) {
  return zustand.tage[iso] || { stress: null, schlaf: null, notiz: '' };
}

function tagSetzen(iso, patch) {
  const vorher = tagLesen(iso);
  const neu = { ...vorher, ...patch };
  // Einen leeren Tag gar nicht erst anlegen: Sonst wächst `tage` mit jedem
  // angetippten und wieder abgewählten Regler, und die Sicherung füllt sich
  // mit Zeilen, die nichts aussagen.
  if (neu.stress === null && neu.schlaf === null && !String(neu.notiz || '').trim()) {
    delete zustand.tage[iso];
  } else {
    zustand.tage[iso] = neu;
  }
  merke();
  melde();
}

/* ---------- Einstellungen ---------- */

function einstellen(schluessel, wert) {
  if (!(schluessel in VORGABE)) return;
  zustand[schluessel] = wert;
  merke();
  melde();
}

/** Ein eigener Auslöser. Doppelte Namen führen auf denselben Eintrag zurück. */
function ausloeserAnlegen(id, name) {
  if (zustand.eigeneAusloeser.some((a) => a.id === id)) return;
  zustand.eigeneAusloeser = [...zustand.eigeneAusloeser, { id, name }];
  merke();
  melde();
}

/**
 * Einen eigenen Auslöser wieder loswerden.
 *
 * Er verschwindet aus der Auswahl, aber nicht aus den Eintragungen, in denen
 * er steht. Das ist Absicht: Ein Tagebuch rückwirkend zu verändern, weil eine
 * Auswahlliste sich geändert hat, wäre das Gegenteil von dem, wofür man es
 * führt.
 */
function ausloeserLoeschen(id) {
  zustand.eigeneAusloeser = zustand.eigeneAusloeser.filter((a) => a.id !== id);
  merke();
  melde();
}

/** Ein benutztes Mittel als Vorschlag merken – die fünf jüngsten. */
function mittelMerken(name) {
  const sauber = String(name).trim();
  if (!sauber) return;
  zustand.zuletztMittel = [sauber, ...zustand.zuletztMittel.filter((m) => m !== sauber)].slice(0, 5);
  merke();
}

/* ---------- Sicherung ---------- */

function alsJSON() {
  return JSON.stringify(zustand, null, 2);
}

function sicherungNotiert() {
  zustand.lastBackup = { on: heuteISO(), anzahl: zustand.eintraege.length };
  merke();
  melde();
}

/**
 * Sicherung einlesen.
 *
 * Geprüft wird nicht aus Misstrauen, sondern weil eine halb passende Datei
 * sonst still einen Zustand hinterlässt, in dem die App merkwürdig wird –
 * `eintraege` als Zeichenkette etwa. Alles Unbekannte fällt weg, alles
 * Bekannte wird auf seinen Typ gebracht, und jeder einzelne Eintrag muss
 * mindestens Datum und Art haben, sonst fliegt er raus.
 */
function ausJSON(text) {
  const gelesen = JSON.parse(text);
  if (!gelesen || typeof gelesen !== 'object' || Array.isArray(gelesen)
      || !Array.isArray(gelesen.eintraege)) {
    throw new Error('Unerwartetes Format – die Liste "eintraege" fehlt.');
  }
  const frisch = klon(VORGABE);
  Object.keys(VORGABE).forEach((k) => {
    const v = gelesen[k];
    if (v === undefined || v === null) return;
    const soll = VORGABE[k];
    if (Array.isArray(soll) !== Array.isArray(v)) return;
    if (soll !== null && typeof soll !== typeof v) return;
    frisch[k] = v;
  });
  frisch.eintraege = sortiert(gelesen.eintraege.filter((e) => (
    e && typeof e === 'object' && typeof e.am === 'string' && typeof e.art === 'string'
  )).map((e) => ({ ...e, id: e.id || neueId() })));
  if (!Number.isFinite(frisch.fenster) || frisch.fenster <= 0) frisch.fenster = VORGABE.fenster;
  zustand = frisch;
  merke();
  melde();
  return frisch.eintraege.length;
}

function allesLoeschen() {
  zustand = klon(VORGABE);
  // Die Begrüßung nicht noch einmal: Wer gerade bewusst alles gelöscht hat,
  // weiß, was die App ist.
  zustand.begruesst = true;
  try { localStorage.removeItem(KEY); } catch { /* dann eben nicht */ }
  merke();
  melde();
}

const store = { allesLoeschen, alsJSON, ausJSON, ausloeserAnlegen, ausloeserLoeschen, einstellen, eintraegeAm, eintragAendern, eintragLoeschen, eintragVon, eintragen, horche, kannSpeichern, letzterTag, letzterZeitpunkt, mittelMerken, sicherungNotiert, sofortSchreiben, speicherGrund, tagLesen, tagSetzen, zustandLesen };

/* ===== js/auswertung.js ===== */
/*
 * Die Rechenschicht: aus Eintragungen Muster machen.
 *
 * Reine Funktionen, keine Anzeige, kein Speicherzugriff – alles kommt als
 * Argument herein. Das ist nicht Ordnungsliebe: Diese Datei ist der einzige
 * Ort, an dem die App etwas *behauptet*, und Behauptungen über den eigenen
 * Körper muss man einzeln nachrechnen können. Genau das tut tests/rechnen.mjs.
 *
 * Die Grundfrage lautet immer gleich: Geht es nach Mahlzeiten mit einem
 * bestimmten Merkmal schlechter als nach Mahlzeiten ohne? Verglichen wird
 * also nicht gegen Null, sondern gegen den eigenen Alltag. Ohne diesen
 * Vergleich fände man bei jedem Menschen mit täglichen Beschwerden jedes
 * Lebensmittel „auffällig", das er täglich isst.
 *
 * Drei Regeln, die verhindern, dass daraus Kaffeesatzleserei wird:
 *
 *   1. Mindestens `mindestFaelle` Mahlzeiten *mit* dem Merkmal und ebenso
 *      viele *ohne*. Aus drei Fällen wird hier keine Aussage.
 *   2. Die Fallzahl steht immer daneben, auch wenn sie unbequem ist.
 *   3. Es heißt „auffällig", nicht „verursacht". Was hier herauskommt, ist
 *      ein Anhaltspunkt fürs Gespräch beim Arzt, keine Diagnose.
 */


/** Späte Mahlzeit ab dieser Stunde – siehe UMSTAENDE in js/daten.js. */
const SPAET_AB = 20;

/**
 * Alle Merkmale einer Mahlzeit: angekreuzte Auslöser plus die beiden
 * Umstände, die sich aus Portion und Uhrzeit von selbst ergeben.
 */
function merkmale(eintrag) {
  if (eintrag.art !== 'essen') return [];
  const raus = Array.isArray(eintrag.tags) ? [...eintrag.tags] : [];
  if (eintrag.portion === 'gross') raus.push('gross');
  const std = Number(String(eintrag.um || '').split(':')[0]);
  if (Number.isFinite(std) && std >= SPAET_AB) raus.push('spaet');
  return [...new Set(raus)];
}

/**
 * Die Beschwerden, die einer Mahlzeit im Zeitfenster folgen.
 *
 * `> 0` und nicht `>= 0`: Eine Beschwerde, die zur selben Minute eingetragen
 * ist wie die Mahlzeit, war schon da. Sie der Mahlzeit zuzurechnen hieße, die
 * Ursache nach der Wirkung zu suchen.
 */
function folgende(eintraege, mahlzeit, fensterStunden) {
  const t0 = zeitpunkt(mahlzeit.am, mahlzeit.um);
  return eintraege.filter((e) => {
    if (e.art !== 'beschwerde') return false;
    const abstand = stundenDazwischen(t0, zeitpunkt(e.am, e.um));
    return abstand > 0 && abstand <= fensterStunden;
  });
}

/** Die stärkste Beschwerde im Fenster, oder 0, wenn keine kam. */
function wertNach(eintraege, mahlzeit, fensterStunden) {
  const nach = folgende(eintraege, mahlzeit, fensterStunden);
  return nach.reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0);
}

/**
 * Die Bilanz je Auslöser.
 *
 * Ein Auslöser taucht nur auf, wenn er überhaupt vorkommt. Ob genug Fälle
 * beisammen sind, sagt `genug` – die Zeile wird trotzdem geliefert, denn „noch
 * 2 Mahlzeiten, dann kann ich etwas dazu sagen" ist eine nützliche Auskunft.
 *
 * @param {object[]} eintraege  alle Eintragungen
 * @param {{fenster: number, mindestFaelle: number, eigene: object[]}} opt
 */
function ausloeserBilanz(eintraege, opt = {}) {
  const fenster = opt.fenster || 4;
  const mindest = opt.mindestFaelle || 5;
  const mahlzeiten = eintraege.filter((e) => e.art === 'essen');
  if (!mahlzeiten.length) return [];

  // Einmal für alle Mahlzeiten rechnen, nicht je Auslöser neu: Bei einem Jahr
  // Tagebuch und zwei Dutzend Auslösern wäre das sonst das Quadrat davon.
  const bewertet = mahlzeiten.map((m) => ({
    m,
    merkmale: new Set(merkmale(m)),
    wert: wertNach(eintraege, m, fenster),
  }));

  const bekannt = new Set(ALLE_AUSLOESER.map((a) => a.id));
  (opt.eigene || []).forEach((a) => bekannt.add(a.id));
  // Auch Auslöser zählen, die nur in alten Eintragungen stehen – etwa ein
  // eigener, den jemand später aus der Auswahl entfernt hat.
  bewertet.forEach((b) => b.merkmale.forEach((id) => bekannt.add(id)));

  const zeilen = [];
  bekannt.forEach((id) => {
    const mit = bewertet.filter((b) => b.merkmale.has(id));
    if (!mit.length) return;
    const ohne = bewertet.filter((b) => !b.merkmale.has(id));
    const schnitt = (liste) => (liste.length
      ? liste.reduce((s, b) => s + b.wert, 0) / liste.length : 0);
    const quote = (liste) => (liste.length
      ? liste.filter((b) => b.wert > 0).length / liste.length : 0);
    const schnittMit = schnitt(mit);
    const schnittOhne = schnitt(ohne);
    zeilen.push({
      id,
      faelle: mit.length,
      gegenFaelle: ohne.length,
      schnittMit,
      schnittOhne,
      differenz: schnittMit - schnittOhne,
      quoteMit: quote(mit),
      quoteOhne: quote(ohne),
      genug: mit.length >= mindest && ohne.length >= mindest,
      fehlt: Math.max(0, mindest - mit.length),
      zuletzt: mit[mit.length - 1].m.am,
    });
  });

  // Auffälligstes zuerst; bei gleicher Differenz die größere Fallzahl, weil
  // sie mehr wert ist.
  return zeilen.sort((a, b) => (b.differenz - a.differenz) || (b.faelle - a.faelle));
}

/**
 * Wie ein Ergebnis zu lesen ist. Eine halbe Stufe Unterschied ist Rauschen,
 * und es als Fund darzustellen wäre die eine Art, mit der so eine App
 * tatsächlich schaden kann: Wer daraufhin ein Lebensmittel streicht, isst
 * einseitiger, ohne dass es ihm besser geht.
 */
function einstufung(zeile) {
  if (!zeile.genug) return 'zuwenig';
  if (zeile.differenz >= 2) return 'auffaellig';
  if (zeile.differenz >= 1) return 'moeglich';
  if (zeile.differenz <= -1) return 'unauffaellig';
  return 'neutral';
}

const EINSTUFUNG_WORT = {
  auffaellig: 'auffällig',
  moeglich: 'möglicherweise',
  neutral: 'kein Unterschied',
  unauffaellig: 'eher unauffällig',
  zuwenig: 'zu wenige Fälle',
};

/* ---------- Verlauf ---------- */

/**
 * Der Tageswert: die stärkste Beschwerde des Tages.
 *
 * `notiert` unterscheidet den beschwerdefreien Tag vom Tag ohne Eintrag. Für
 * die Auswertung ist das der wichtigste Unterschied überhaupt – aus einer
 * Lücke im Tagebuch einen guten Tag zu machen, verschiebt jede Statistik nach
 * unten, und zwar genau in den Wochen, in denen es jemandem zu schlecht ging,
 * um etwas einzutragen.
 */
function tagesWert(eintraege, iso, tage = {}) {
  const amTag = eintraege.filter((e) => e.am === iso);
  const beschwerden = amTag.filter((e) => e.art === 'beschwerde');
  const notiert = amTag.length > 0 || !!tage[iso];
  const max = beschwerden.reduce((m, e) => Math.max(m, Number(e.staerke) || 0), 0);
  const summe = beschwerden.reduce((s, e) => s + (Number(e.staerke) || 0), 0);
  return {
    am: iso,
    notiert,
    wert: max,
    schnitt: beschwerden.length ? summe / beschwerden.length : 0,
    anzahl: beschwerden.length,
    mahlzeiten: amTag.filter((e) => e.art === 'essen').length,
    medikamente: amTag.filter((e) => e.art === 'medikament').length,
  };
}

/** Eine Reihe von Tageswerten, lückenlos von `von` bis `bis`. */
function verlaufReihe(eintraege, von, bis, tage = {}) {
  const raus = [];
  const n = tageDazwischen(von, bis);
  for (let i = 0; i <= n; i++) raus.push(tagesWert(eintraege, plusTage(von, i), tage));
  return raus;
}

/**
 * Beschwerden nach Tageszeit. Beantwortet die Frage, die im Sprechzimmer
 * immer kommt: nüchtern oder nach dem Essen, tagsüber oder nachts.
 */
function nachTageszeit(eintraege) {
  const faecher = Object.keys(TAGESZEIT_NAME);
  const eimer = Object.fromEntries(faecher.map((k) => [k, { anzahl: 0, summe: 0 }]));
  eintraege.filter((e) => e.art === 'beschwerde').forEach((e) => {
    const f = eimer[tageszeit(e.um)];
    f.anzahl += 1;
    f.summe += Number(e.staerke) || 0;
  });
  return faecher.map((k) => ({
    id: k,
    name: TAGESZEIT_NAME[k],
    anzahl: eimer[k].anzahl,
    schnitt: eimer[k].anzahl ? eimer[k].summe / eimer[k].anzahl : 0,
  })).filter((f) => f.anzahl > 0).sort((a, b) => b.anzahl - a.anzahl);
}

/** Wie oft welche Beschwerdeart angekreuzt wurde. */
function nachArt(eintraege) {
  const zaehler = new Map();
  eintraege.filter((e) => e.art === 'beschwerde').forEach((e) => {
    (e.arten || []).forEach((a) => zaehler.set(a, (zaehler.get(a) || 0) + 1));
  });
  return [...zaehler.entries()].map(([id, anzahl]) => ({ id, anzahl }))
    .sort((a, b) => b.anzahl - a.anzahl);
}

/**
 * Die laufende Serie beschwerdefreier Tage, rückwärts ab `bis`.
 *
 * Ein Tag ohne Eintragung beendet die Serie nicht, aber er zählt auch nicht
 * mit – sonst wäre die längste Serie die längste Pause vom Tagebuch.
 */
function serieOhne(eintraege, tage, bis) {
  let iso = bis;
  let zaehler = 0;
  for (let i = 0; i < 400; i++) {
    const t = tagesWert(eintraege, iso, tage);
    if (t.notiert) {
      if (t.wert > 0) break;
      zaehler += 1;
    }
    iso = plusTage(iso, -1);
  }
  return zaehler;
}

/** Die großen Zahlen für die Übersicht und den Bericht. */
function gesamtZahlen(eintraege, tage, von, bis) {
  const reihe = verlaufReihe(eintraege, von, bis, tage);
  const notiert = reihe.filter((t) => t.notiert);
  const mit = notiert.filter((t) => t.wert > 0);
  return {
    tage: reihe.length,
    notierteTage: notiert.length,
    tageMitBeschwerden: mit.length,
    anteil: notiert.length ? mit.length / notiert.length : 0,
    schnitt: notiert.length ? notiert.reduce((s, t) => s + t.wert, 0) / notiert.length : 0,
    hoechster: notiert.reduce((m, t) => Math.max(m, t.wert), 0),
    mahlzeiten: reihe.reduce((s, t) => s + t.mahlzeiten, 0),
    medikamente: reihe.reduce((s, t) => s + t.medikamente, 0),
  };
}

/* ===== js/bericht.js ===== */
/*
 * Der Ausdruck für den Arzttermin.
 *
 * Zehn Minuten Sprechstunde und die Frage „und, wie war es?" – darauf ist
 * niemand aus dem Kopf vorbereitet. Diese Datei macht aus Wochen an
 * Eintragungen eine Seite Text: Zeitraum, wie viele Tage mit Beschwerden, wie
 * stark, wann, was auffällig war, welche Mittel genommen wurden.
 *
 * Bewusst reiner Text und kein PDF: Text lässt sich in jede Mail einfügen, auf
 * jedem Gerät ausdrucken und vorher noch ändern. Und was man ändern kann,
 * liest man vorher – bei einem erzeugten PDF tut das erfahrungsgemäß niemand.
 *
 * Der Bericht behauptet nichts. Er zählt, und er sagt dazu, wie oft. Die
 * Einordnung macht die Praxis.
 */




const prozent = (x) => `${Math.round(x * 100)} %`;

/**
 * @param {object} zustand  der gesamte Speicherzustand
 * @param {string} von, bis ISO-Daten, einschließlich
 */
function arztBericht(zustand, von, bis) {
  const { eintraege, tage } = zustand;
  const imZeitraum = eintraege.filter((e) => e.am >= von && e.am <= bis);
  const z = gesamtZahlen(imZeitraum, tage, von, bis);
  const zeilen = [];
  const sag = (s = '') => zeilen.push(s);

  sag('Magen-Tagebuch');
  sag(`Zeitraum: ${fmtDatum(von, true)} bis ${fmtDatum(bis, true)} `
    + `(${mehrzahl(tageDazwischen(von, bis) + 1, 'Tag', 'Tage')})`);
  sag();

  if (!z.notierteTage) {
    sag('In diesem Zeitraum wurde nichts eingetragen.');
    return zeilen.join('\n');
  }

  sag('ÜBERSICHT');
  sag(`  Tage mit Eintragung        ${z.notierteTage} von ${z.tage}`);
  sag(`  Tage mit Beschwerden       ${z.tageMitBeschwerden} (${prozent(z.anteil)} der eingetragenen Tage)`);
  sag(`  Stärke im Mittel           ${fmtZahl(z.schnitt)} von 10`);
  sag(`  Höchster Wert              ${z.hoechster} von 10 (${STAERKE_WORT[z.hoechster] || ''})`);
  sag(`  Mahlzeiten eingetragen     ${z.mahlzeiten}`);
  sag(`  Medikamenteneinnahmen      ${z.medikamente}`);
  sag();

  const arten = nachArt(imZeitraum);
  if (arten.length) {
    sag('BESCHWERDEN NACH ART');
    arten.slice(0, 8).forEach((a) => {
      sag(`  ${beschwerdeName(a.id).padEnd(24)} ${mehrzahl(a.anzahl, 'Mal', 'Mal')}`);
    });
    sag();
  }

  const zeiten = nachTageszeit(imZeitraum);
  if (zeiten.length) {
    sag('BESCHWERDEN NACH TAGESZEIT');
    zeiten.forEach((t) => {
      sag(`  ${t.name.padEnd(24)} ${String(t.anzahl).padStart(3)} Mal, `
        + `im Mittel ${fmtZahl(t.schnitt)}`);
    });
    sag();
  }

  const bilanz = ausloeserBilanz(imZeitraum, {
    fenster: zustand.fenster,
    mindestFaelle: zustand.mindestFaelle,
    eigene: zustand.eigeneAusloeser,
  }).filter((b) => b.genug && einstufung(b) !== 'neutral' && einstufung(b) !== 'unauffaellig');

  if (bilanz.length) {
    sag(`AUFFÄLLIG IM ZEITRAUM VON ${zustand.fenster} STUNDEN NACH DEM ESSEN`);
    sag('  (Vergleich: mittlere Beschwerdestärke danach gegen alle übrigen Mahlzeiten)');
    bilanz.slice(0, 8).forEach((b) => {
      sag(`  ${ausloeserName(b.id, zustand.eigeneAusloeser).padEnd(24)} `
        + `${fmtZahl(b.schnittMit)} gegen ${fmtZahl(b.schnittOhne)} `
        + `(${b.faelle} Mahlzeiten damit, ${b.gegenFaelle} ohne)`);
    });
    sag();
  }

  const mittel = new Map();
  imZeitraum.filter((e) => e.art === 'medikament').forEach((e) => {
    const name = (e.mittel || 'ohne Angabe').trim();
    mittel.set(name, (mittel.get(name) || 0) + 1);
  });
  if (mittel.size) {
    sag('EINGENOMMENE MITTEL');
    [...mittel.entries()].sort((a, b) => b[1] - a[1]).forEach(([name, n]) => {
      sag(`  ${name.padEnd(24)} ${mehrzahl(n, 'Mal', 'Mal')}`);
    });
    sag();
  }

  const notizen = imZeitraum.filter((e) => e.art === 'notiz' && String(e.text || '').trim());
  if (notizen.length) {
    sag('NOTIZEN');
    notizen.slice(-12).forEach((e) => sag(`  ${fmtDatum(e.am)} ${e.um}  ${e.text.trim()}`));
    sag();
  }

  sag('---');
  sag('Selbst geführtes Tagebuch. Die Zahlen sind gezählt, nicht gedeutet;');
  sag('„auffällig" heißt hier nur: nach diesen Mahlzeiten stand im Mittel ein');
  sag('höherer Wert als nach den übrigen.');
  return zeilen.join('\n');
}

/** Dateiname für den Bericht – ohne Umlaute, damit ihn jedes System annimmt. */
function berichtName(von, bis) {
  return `magen-tagebuch-${von}-bis-${bis}.txt`;
}

/* ==================== Bausteine ==================== */

const knopf = (act, text, klasse = '', extra = '') => `<button type="button" class="btn ${klasse}" data-act="${act}" ${extra}>${text}</button>`;

/** Eine Reihe an- und abwählbarer Marken. */
function marken(liste, gewaehlt, act) {
  return `<div class="marken">${liste.map((m) => `
    <button type="button" class="marke${gewaehlt.includes(m.id) ? ' an' : ''}"
            data-act="${act}" data-id="${esc(m.id)}" aria-pressed="${gewaehlt.includes(m.id)}">
      ${m.icon ? `<span class="marke-i">${m.icon}</span>` : ''}${esc(m.name)}
    </button>`).join('')}</div>`;
}

/** Die Skala von 0 bis 10. Elf Knöpfe statt eines Schiebereglers: Ein Regler
 *  trifft man auf dem Handy nicht genau, und „war es jetzt 6 oder 7" ist
 *  genau die Frage, die eine Eintragung wertlos macht. */
function skala(wert) {
  let raus = '<div class="skala" role="group" aria-label="Stärke von 0 bis 10">';
  for (let i = 0; i <= 10; i++) {
    const stufe = i === 0 ? 'null' : (i >= 7 ? 'hoch' : (i >= 4 ? 'mittel' : 'tief'));
    raus += `<button type="button" class="stufe s-${stufe}${i === wert ? ' an' : ''}"
      data-act="staerke" data-n="${i}" aria-pressed="${i === wert}"
      aria-label="Stärke ${i}: ${STAERKE_WORT[i]}">${i}</button>`;
  }
  return `${raus}</div><p class="skala-wort">${STAERKE_WORT[wert] ?? ''}</p>`;
}

/** Vier Stufen für Stress und Schlaf. `null` heißt: nicht beantwortet. */
function vierStufen(act, wert, worte) {
  return `<div class="vier">${worte.map((w, i) => `
    <button type="button" class="vier-btn${wert === i ? ' an' : ''}"
            data-act="${act}" data-n="${i}" aria-pressed="${wert === i}">${w}</button>`).join('')}</div>`;
}

const STRESS_WORT = ['ruhig', 'geht so', 'angespannt', 'viel', 'sehr viel'];
const SCHLAF_WORT = ['gut', 'ok', 'mäßig', 'schlecht', 'kaum'];

const ART_ICON = { essen: '🍽️', beschwerde: '🔥', medikament: '💊', notiz: '✏️' };

function zeileText(e, eigene) {
  if (e.art === 'essen') {
    const tags = (e.tags || []).map((t) => ausloeserName(t, eigene)).join(', ');
    const portion = e.portion && e.portion !== 'normal' ? ` · ${e.portion === 'gross' ? 'große' : 'kleine'} Portion` : '';
    return `<b>${esc(kuerze(e.was || 'Mahlzeit'))}</b>${portion}`
      + (tags ? `<span class="zeile-tags">${esc(tags)}</span>` : '');
  }
  if (e.art === 'beschwerde') {
    const arten = (e.arten || []).map(beschwerdeName).join(', ');
    return `<b>Stärke ${e.staerke} – ${STAERKE_WORT[e.staerke] || ''}</b>`
      + (arten ? `<span class="zeile-tags">${esc(arten)}</span>` : '')
      + (e.notiz ? `<span class="zeile-tags">${esc(kuerze(e.notiz))}</span>` : '');

  if (e.art === 'medikament') {

}

  const bilanz = t.notiert ? `<div class="karte tagbilanz">
    <div class="gross ${t.wert === 0 ? 'gut' : (t.wert >= 7 ? 'schlecht' : 'mittel')}">
      ${t.wert === 0 ? 'beschwerdefrei' : `Stärke ${t.wert}`}
    </div>
    <p class="klein">${mehrzahl(t.mahlzeiten, 'Mahlzeit', 'Mahlzeiten')},
      ${mehrzahl(t.anzahl, 'Beschwerde', 'Beschwerden')}${t.medikamente ? `, ${mehrzahl(t.medikamente, 'Medikament', 'Medikamente')}` : ''}</p>
  </div>` : '';

  const umstaende = `<div class="karte">
    <h3>Wie war der Tag sonst?</h3>
    <p class="feld-name">Anspannung</p>
    ${vierStufen('stress', tagInfo.stress, STRESS_WORT)}
    <p class="feld-name">Schlaf</p>
    ${vierStufen('schlaf', tagInfo.schlaf, SCHLAF_WORT)}
  </div>`;

  return kopf + bilanz + anlegen + zeilen + umstaende;
}

/* ==================== Reiter: Verlauf ==================== */

function verlaufAnsicht(s) {
  const bis = heuteISO();
  const von = plusTage(bis, -(ui.zeitraum - 1));
  const reihe = verlaufReihe(s.eintraege, von, bis, s.tage);
  const z = gesamtZahlen(s.eintraege, s.tage, von, bis);
  const serie = serieOhne(s.eintraege, s.tage, bis);

  const wahl = `<div class="wahl">${[14, 30, 90].map((n) => `
    <button type="button" class="wahl-btn${ui.zeitraum === n ? ' an' : ''}"
            data-act="zeitraum" data-n="${n}">${n} Tage</button>`).join('')}</div>`;

  const zahlen = `<div class="kacheln">
    <div class="kachel"><b>${z.notierteTage}</b><span>Tage notiert</span></div>
    <div class="kachel"><b>${z.notierteTage ? `${Math.round(z.anteil * 100)} %` : '–'}</b><span>davon mit Beschwerden</span></div>
    <div class="kachel"><b>${z.notierteTage ? fmtZahl(z.schnitt) : '–'}</b><span>Stärke im Mittel</span></div>
    <div class="kachel"><b>${serie}</b><span>${serie === 1 ? 'Tag' : 'Tage'} frei in Folge</span></div>
  </div>`;

  const tafel = z.notierteTage
    ? verlaufTafel(reihe, { titel: 'Stärkste Beschwerde je Tag', hinweis: '0 – 10' })
    : '<p class="leer">Noch keine Eintragungen in diesem Zeitraum.</p>';

  // --- Monatsraster ---
  const felder = monatsRaster(ui.monat).map((iso) => {
    const t = tagesWert(s.eintraege, iso, s.tage);
    const fremd = iso.slice(0, 7) !== ui.monat.slice(0, 7);
    const stufe = !t.notiert ? 'leer' : (t.wert === 0 ? 'gut' : (t.wert >= 7 ? 'schlecht' : (t.wert >= 4 ? 'mittel' : 'leicht')));
    return `<button type="button" class="rfeld f-${stufe}${fremd ? ' fremd' : ''}${iso === heuteISO() ? ' heute' : ''}"
      data-act="tag-waehlen" data-iso="${iso}"
      aria-label="${fmtDatum(iso, true)}: ${t.notiert ? (t.wert === 0 ? 'beschwerdefrei' : `Stärke ${t.wert}`) : 'nichts eingetragen'}">
      <span>${Number(iso.slice(8))}</span></button>`;
  }).join('');

  const raster = `<div class="karte">
    <div class="monatkopf">
      ${knopf('monat-blaettern', '‹', 'btn-rund', 'data-d="-1" aria-label="Monat zurück"')}
      <h3>${esc(fmtMonat(ui.monat))}</h3>
      ${knopf('monat-blaettern', '›', 'btn-rund', `data-d="1" ${monatsStart(heuteISO()) === ui.monat ? 'disabled' : ''} aria-label="Monat vor"`)}
    </div>
    <div class="wochekopf">${WOCHE_KOPF.map((w) => `<span>${w}</span>`).join('')}</div>
    <div class="raster">${felder}</div>
    <div class="legende">
      <span><i class="f-gut"></i> frei</span><span><i class="f-leicht"></i> 1–3</span>
      <span><i class="f-mittel"></i> 4–6</span><span><i class="f-schlecht"></i> 7–10</span>
      <span><i class="f-leer"></i> nichts eingetragen</span>
    </div>
  </div>`;

  return `${wahl}${zahlen}<div class="karte">${tafel}</div>${raster}`;
}

/* ==================== Reiter: Muster ==================== */

function musterAnsicht(s) {
  const bilanz = ausloeserBilanz(s.eintraege, {
    fenster: s.fenster,
    mindestFaelle: s.mindestFaelle,
    eigene: s.eigeneAusloeser,
  });
  const mahlzeiten = s.eintraege.filter((e) => e.art === 'essen').length;

  const erklaerung = `<div class="karte hinweis">
    <h3>Wie das gelesen wird</h3>
    <p>Verglichen wird die mittlere Beschwerdestärke in den
    <b>${s.fenster} Stunden</b> nach Mahlzeiten <b>mit</b> einem Merkmal gegen
    alle übrigen Mahlzeiten. Eine Zeile erscheint erst ab
    ${s.mindestFaelle} Fällen auf beiden Seiten.</p>
    <p class="klein">Das ist eine Häufigkeit, keine Ursache. Wer an einem
    schlechten Tag ohnehin anders isst, findet sich hier wieder, ohne dass das
    Essen schuld wäre. Der Zettel ist für das Gespräch in der Praxis gedacht,
    nicht als Ersatz dafür.</p>
  </div>`;

  if (!mahlzeiten) {
    return `<p class="leer">Noch keine Mahlzeit eingetragen. Sobald ein paar
      Tage beisammen sind, steht hier, was auffällt.</p>${erklaerung}`;
  }

  const fertig = bilanz.filter((b) => b.genug);
  const offen = bilanz.filter((b) => !b.genug);

  const zeile = (b) => {
    const art = einstufung(b);
    return `<li class="fund f-${art}">
      <div class="fund-kopf">
        <b>${esc(ausloeserName(b.id, s.eigeneAusloeser))}</b>
        <span class="fund-urteil">${EINSTUFUNG_WORT[art]}</span>
      </div>
      ${vergleichBalken(b.schnittMit, b.schnittOhne)}
      <p class="klein">${mehrzahl(b.faelle, 'Mahlzeit', 'Mahlzeiten')} damit,
        ${b.gegenFaelle} ohne · danach ${Math.round(b.quoteMit * 100)} % mit
        Beschwerden, sonst ${Math.round(b.quoteOhne * 100)} %</p>
    </li>`;
  };

  const gefunden = fertig.length
    ? `<ul class="funde">${fertig.map(zeile).join('')}</ul>`
    : `<p class="leer">Noch reicht es für keine Aussage. Nach
       ${mehrzahl(mahlzeiten, 'Mahlzeit', 'Mahlzeiten')} braucht es je Merkmal
       ${s.mindestFaelle} Fälle mit und ${s.mindestFaelle} ohne.</p>`;

  const wartet = offen.length ? `<div class="karte zaehlt">
    <h3>Zählt noch</h3>
    <ul class="wartend">${offen.slice(0, 12).map((b) => `<li>
      <span>${esc(ausloeserName(b.id, s.eigeneAusloeser))}</span>
      <span class="klein">${b.faelle} von ${s.mindestFaelle}</span>
    </li>`).join('')}</ul>
  </div>` : '';

  const zeiten = nachTageszeit(s.eintraege);
  const wann = zeiten.length ? `<div class="karte">
    <h3>Wann es auftritt</h3>
    <ul class="wartend">${zeiten.map((t) => `<li>
      <span>${t.name}</span>
      <span class="klein">${mehrzahl(t.anzahl, 'Mal', 'Mal')}, im Mittel ${fmtZahl(t.schnitt)}</span>
    </li>`).join('')}</ul>
  </div>` : '';

  const arten = nachArt(s.eintraege);
  const wie = arten.length ? `<div class="karte">
    <h3>Womit es sich meldet</h3>
    <ul class="wartend">${arten.map((a) => `<li>
      <span>${esc(beschwerdeName(a.id))}</span>
      <span class="klein">${mehrzahl(a.anzahl, 'Mal', 'Mal')}</span>
    </li>`).join('')}</ul>
  </div>` : '';

  return gefunden + wartet + wann + wie + erklaerung;
}

/* ==================== Zeichnen ==================== */

function male() {
  const s = store.zustandLesen();
  document.documentElement.dataset.theme = s.theme || 'rosa';

  if (!s.begruesst) {
    viewEl.innerHTML = willkommen();
    tabbarEl.hidden = true;
    return;
  }
  tabbarEl.hidden = false;

  const warnung = !store.kannSpeichern() ? `<div class="karte warn">
    <h3>${store.speicherGrund() === 'voll' ? 'Der Speicher ist voll' : 'Es kann nicht gespeichert werden'}</h3>
    <p class="klein">${store.speicherGrund() === 'voll'
    ? 'Neue Eintragungen kommen nicht mehr dazu. Jetzt unter „Mehr" sichern, danach ältere Einträge löschen.'
    : 'Dieser Browser lässt keine Website-Daten zu – ein privates Fenster oder eine eingebettete Ansicht. Alles Eingetragene ist nach dem Schließen weg.'}</p>
  </div>` : '';

  const tab = REITER.some((r) => r.id === s.tab) ? s.tab : 'heute';
  const inhalt = { heute: tagAnsicht, verlauf: verlaufAnsicht, muster: musterAnsicht, mehr: mehrAnsicht }[tab];
  viewEl.innerHTML = warnung + inhalt(s) + bogenHTML(s);

  tabbarEl.innerHTML = REITER.map((r) => `
    <button type="button" class="tab${r.id === tab ? ' an' : ''}" id="tab-${r.id}"
            data-act="tab" data-tab="${r.id}" role="tab" aria-selected="${r.id === tab}"
            aria-controls="view"><span class="ti">${r.icon}</span><span>${r.name}</span></button>`).join('');

  // Der Bogen soll benutzbar sein, ohne dass die Seite dahinter mitscrollt.
  document.body.classList.toggle('bogen-auf', !!ui.bogen);
}

/*
 * Neu zeichnen, aber höchstens einmal je Durchlauf.
 *
 * Eine Aktion ändert oft beides: den Speicher und den flüchtigen Zustand hier.
 * Der Speicher meldet sich von selbst (store.horche), die Aktion zeichnet
 * danach ihre eigene Änderung – das wären zwei Durchgänge und ein sichtbares
 * Flackern. Die Sammelstelle hier macht daraus einen.
 */
let gemeldet = false;
function zeichne() {
  if (gemeldet) return;
  gemeldet = true;
  queueMicrotask(() => { gemeldet = false; male(); });
}

/* ==================== Eingaben ==================== */

function bogenOeffnen(art, id) {
  const vorlage = {
    essen: { was: '', tags: [], portion: 'normal' },
    beschwerde: { staerke: 4, arten: [], notiz: '' },
    medikament: { mittel: '', dosis: '' },
    notiz: { text: '' },
  }[art];
  const alt = id ? store.eintragVon(id) : null;
  ui.bogen = {
    art,
    id: id || null,
    entwurf: alt
      ? { ...vorlage, ...alt }
      : { ...vorlage, art, am: ui.tag, um: ui.tag === heuteISO() ? jetztUhr() : '12:00' },
  };
  zeichne();
}

function bogenSpeichern() {
  const b = ui.bogen;
  if (!b) return;
  const e = { ...b.entwurf, art: b.art };
  if (b.art === 'essen' && !String(e.was || '').trim() && !(e.tags || []).length) {
    melden('Bitte etwas eintragen oder ankreuzen.');
    return;
  }
  if (b.art === 'medikament' && !String(e.mittel || '').trim()) {
    melden('Welches Mittel?');
    return;
  }
  if (b.art === 'notiz' && !String(e.text || '').trim()) {
    melden('Die Notiz ist leer.');
    return;
  }
  if (b.art === 'medikament') store.mittelMerken(e.mittel);
  if (b.id) store.eintragAendern(b.id, e);
  else store.eintragen(e);
  ui.tag = e.am;
  ui.bogen = null;
  melden(b.id ? 'Geändert.' : 'Eingetragen.');
  zeichne();
}

/** Ein Wert im Entwurf, ohne dass der Bogen dabei den Fokus verliert. */
function entwurf(patch, neuZeichnen = true) {
  if (!ui.bogen) return;
  Object.assign(ui.bogen.entwurf, patch);
  if (neuZeichnen) zeichne();
}

function umschalten(feld, id) {
  if (!ui.bogen) return;
  const liste = ui.bogen.entwurf[feld] || [];
  entwurf({ [feld]: liste.includes(id) ? liste.filter((x) => x !== id) : [...liste, id] });
}

/* ---------- Sicherung ---------- */

function datenAusgeben(text, name, typ) {
  const blob = new Blob([text], { type: typ });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Nicht sofort freigeben: Manche Browser holen die Datei erst danach ab.
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/**
 * In die Zwischenablage – und wenn der Browser das nicht erlaubt, wenigstens
 * das Feld markieren. Von Hand kopieren kann man immer.
 */
async function kopiere(text, wahl) {
  try {
    await navigator.clipboard.writeText(text || '');
    melden('Kopiert.');
  } catch {
    const feld = viewEl.querySelector(wahl);
    if (feld) { feld.focus(); feld.select(); }
    melden('Bitte von Hand kopieren.');
  }
}

function sicherungLaden() {
  const feld = document.createElement('input');
  feld.type = 'file';
  feld.accept = 'application/json,.json';
  feld.addEventListener('change', () => {
    const datei = feld.files && feld.files[0];
    if (!datei) return;
    const leser = new FileReader();
    leser.onload = () => {
      try {
        const anzahl = store.ausJSON(String(leser.result));
        melden(`${mehrzahl(anzahl, 'Eintrag', 'Einträge')} eingelesen.`);
      } catch (fehler) {
        melden(`Ging nicht: ${fehler.message}`);
      }
      zeichne();
    };
    leser.readAsText(datei);
  });
  feld.click();
}

/* ==================== Ein Empfänger für alles ==================== */

const AKTION = {
  los: () => { store.einstellen('begruesst', true); zeichne(); },
  tab: (el) => {
    store.einstellen('tab', el.dataset.tab);
    ui.bericht = null;
    ui.sicherung = null;
    zeichne();
  },

  neu: (el) => bogenOeffnen(el.dataset.art),
  bearbeiten: (el) => {
    const e = store.eintragVon(el.dataset.id);
    if (e) bogenOeffnen(e.art, e.id);
  },
  loeschen: (el) => {
    store.eintragLoeschen(el.dataset.id);
    melden('Gelöscht.');
    zeichne();
  },
  'bogen-zu': () => { ui.bogen = null; zeichne(); },
  'bogen-speichern': bogenSpeichern,
  staerke: (el) => entwurf({ staerke: Number(el.dataset.n) }),
  portion: (el) => entwurf({ portion: el.dataset.id }),
  tag: (el) => umschalten('tags', el.dataset.id),
  beschwerdeart: (el) => umschalten('arten', el.dataset.id),
  'mittel-vorschlag': (el) => entwurf({ mittel: el.dataset.id }),

  'tag-blaettern': (el) => {
    ui.tag = plusTage(ui.tag, Number(el.dataset.d));
    zeichne();
  },
  'tag-waehlen': (el) => {
    ui.tag = el.dataset.iso;
    store.einstellen('tab', 'heute');
    zeichne();
  },
  'monat-blaettern': (el) => {
    ui.monat = plusMonate(ui.monat, Number(el.dataset.d));
    zeichne();
  },
  zeitraum: (el) => { ui.zeitraum = Number(el.dataset.n); zeichne(); },

  stress: (el) => {
    const n = Number(el.dataset.n);
    const jetzt = store.tagLesen(ui.tag).stress;
    store.tagSetzen(ui.tag, { stress: jetzt === n ? null : n });
    zeichne();
  },
  schlaf: (el) => {
    const n = Number(el.dataset.n);
    const jetzt = store.tagLesen(ui.tag).schlaf;
    store.tagSetzen(ui.tag, { schlaf: jetzt === n ? null : n });
    zeichne();
  },

  fenster: (el) => { store.einstellen('fenster', Number(el.dataset.n)); zeichne(); },
  mindest: (el) => { store.einstellen('mindestFaelle', Number(el.dataset.n)); zeichne(); },
  theme: (el) => { store.einstellen('theme', el.dataset.id); zeichne(); },

  'ausloeser-neu': () => {
    const feld = document.getElementById('neuerAusloeser');
    const name = (feld.value || '').trim();
    if (!name) { melden('Kein Name eingegeben.'); return; }
    store.ausloeserAnlegen(eigeneId(name), name);
    feld.value = '';
    melden(`„${name}" steht jetzt zur Auswahl.`);
    zeichne();
  },
  'ausloeser-weg': (el) => { store.ausloeserLoeschen(el.dataset.id); zeichne(); },

  export: () => {
    datenAusgeben(store.alsJSON(), `bauchbuch-${heuteISO()}.json`, 'application/json');
    store.sicherungNotiert();
    melden('Sicherung erstellt.');
    zeichne();
  },
  import: sicherungLaden,
  'sicherung-text': () => {
    ui.sicherung = store.alsJSON();
    store.sicherungNotiert();
    zeichne();
  },
  'sicherung-zu': () => { ui.sicherung = null; zeichne(); },
  'sicherung-kopieren': () => kopiere(ui.sicherung, '.bericht'),

  bericht: (el) => {
    const s = store.zustandLesen();
    const bis = heuteISO();
    ui.bericht = arztBericht(s, plusTage(bis, -(Number(el.dataset.n) - 1)), bis);
    zeichne();
  },
  'bericht-zu': () => { ui.bericht = null; zeichne(); },
  'bericht-kopieren': () => kopiere(ui.bericht, '.bericht'),
  'bericht-laden': () => {
    const bis = heuteISO();
    datenAusgeben(ui.bericht || '', berichtName(plusTage(bis, -29), bis), 'text/plain');
  },

  'alles-weg': () => {
    // Zwei Fragen sind eine zu viel, keine ist eine zu wenig: Der Knopf steht
    // unter „Mehr" und löscht Monate.
    if (!window.confirm('Wirklich alles löschen? Das lässt sich nicht rückgängig machen.')) return;
    store.allesLoeschen();
    ui.bericht = null;
    melden('Alles gelöscht.');
    zeichne();
  },
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = AKTION[el.dataset.act];
  if (!fn) return;
  // Textfelder tragen ebenfalls data-act, ihre Werte kommen über 'input'.
  if (el.matches('input, textarea')) return;
  ev.preventDefault();
  fn(el);
});

/*
 * Texteingaben laufen über 'input' und zeichnen *nicht* neu – ein Neuzeichnen
 * bei jedem Tastendruck nähme dem Feld den Fokus und die Schreibmarke.
 */
document.addEventListener('input', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const wert = el.value;
  switch (el.dataset.act) {
    case 'was': entwurf({ was: wert }, false); break;
    case 'notiz': entwurf({ notiz: wert }, false); break;
    case 'mittel': entwurf({ mittel: wert }, false); break;
    case 'dosis': entwurf({ dosis: wert }, false); break;
    case 'text': entwurf({ text: wert }, false); break;
    case 'uhr': entwurf({ um: wert }, false); break;
    case 'bogen-datum': entwurf({ am: wert }, false); break;
    case 'tag-datum':
      if (/^\d{4}-\d{2}-\d{2}$/.test(wert)) { ui.tag = wert; zeichne(); }
      break;
    default: break;
  }
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && ui.bogen) { ui.bogen = null; zeichne(); }
});

/*
 * Vor dem Verschwinden schreiben. Mobile Browser verwerfen die Seite im
 * Hintergrund ohne Vorwarnung, und der letzte Eintrag hängt bis zu 120 ms in
 * der Warteschlange.
 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') store.sofortSchreiben();
});
window.addEventListener('pagehide', () => store.sofortSchreiben());

// Auch Änderungen, die keine Aktion ausgelöst hat, müssen ankommen – allen
// voran der Wechsel auf „kann nicht mehr speichern", den der Schreibvorgang
// selbst feststellt.
store.horche(zeichne);

male();

/* Ohne Netz benutzbar. Aus einer Datei heraus (file://) gibt es keinen
 * Service Worker – dort ist die App ohnehin schon vollständig da. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* dann eben nicht */ });
  });
}
</script>
