<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141013">
<meta name="description" content="Ernährungs- und Beschwerdetagebuch für den Magen. Alles bleibt auf dem Gerät.">
<!-- Kein Robots-Eintrag nötig: Die Seite enthält keine Daten. Die stehen im
     Browser dessen, der sie benutzt, und kommen dort nie heraus. -->
<title>Bauchbuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <h1 class="brand">Bauchbuch</h1>
    <p class="brand-sub">bleibt auf diesem Gerät</p>
  </div>
</header>

<main id="view" class="view" role="tabpanel" tabindex="-1" aria-labelledby="tab-heute"></main>

<!-- Die Reiter füllt js/app.js. Sie stehen trotzdem hier: Seite und Skript
     können aus unterschiedlich alten Zwischenspeichern stammen, und eine leere
     Leiste mit einem älteren Skript wäre eine App ohne Navigation. -->
<nav class="tabbar" id="tabbar" role="tablist">
  <button type="button" class="tab" id="tab-heute" data-act="tab" data-tab="heute" role="tab" aria-controls="view"><span class="ti">📓</span><span>Tag</span></button>
  <button type="button" class="tab" id="tab-verlauf" data-act="tab" data-tab="verlauf" role="tab" aria-controls="view"><span class="ti">📅</span><span>Verlauf</span></button>
  <button type="button" class="tab" id="tab-muster" data-act="tab" data-tab="muster" role="tab" aria-controls="view"><span class="ti">🔍</span><span>Muster</span></button>
  <button type="button" class="tab" id="tab-mehr" data-act="tab" data-tab="mehr" role="tab" aria-controls="view"><span class="ti">⚙️</span><span>Mehr</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
