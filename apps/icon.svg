<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Meine Apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40586f"/>
      <stop offset="1" stop-color="#2b3d4f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Vier Kacheln für die Apps; drei leuchten grün (benutzt), eine ist
       grau (still) – genau die Frage der Seite. -->
  <g>
    <rect x="112" y="112" width="128" height="128" rx="30" fill="#5cc98b"/>
    <rect x="272" y="112" width="128" height="128" rx="30" fill="#5cc98b"/>
    <rect x="112" y="272" width="128" height="128" rx="30" fill="#5cc98b"/>
    <rect x="272" y="272" width="128" height="128" rx="30" fill="#8796a5"/>
  </g>
</svg>
