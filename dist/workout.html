/* ------------------------------------------------------------------ *
 * Anwenden
 * ------------------------------------------------------------------ */

const EMPTY = new Set();

/** Vereinigung aller gesperrten Übungen. */
function blocked(active) {
  const out = new Set();
  active.forEach((id) => {
    const inj = BY_ID.get(id);
    if (inj) inj.avoid.forEach((x) => out.add(x));
  });
  return out;
}

/**
 * Ersatz für eine gesperrte Übung, oder null.
 *
 * Vorschläge mehrerer Beschwerden werden der Reihe nach geprüft; der erste,
 * der nicht selbst gesperrt ist, gewinnt. Ist keiner frei, fällt die Übung weg.
 *
 * `taboo` sind Übungen, die hier zwar erlaubt, aber gerade unpassend sind –
 * in der App die, die eine Muskelgruppe ein zweites Mal innerhalb der
 * Erholungszeit direkt träfen. Ein Ersatz, der die 48 Stunden bricht, ist
 * keiner.
 */
function substitute(exId, active, block, taboo) {
  for (const id of active) {
    const inj = BY_ID.get(id);
    const to = inj && inj.swap[exId];
    if (to && !block.has(to) && !taboo.has(to)) return to;
  }
  return null;
}

/**
 * Übungsliste eines Trainings unter den aktiven Beschwerden.
 *
 * Rückgabe je Eintrag: `{ id, sets, from }` – `from` ist gesetzt, wenn getauscht
 * wurde. Fällt eine Übung ersatzlos weg, fehlt sie in der Liste; ihre Sätze
 * stehen in `dropped`.
 *
 * Landen zwei Einträge auf derselben Übung, werden ihre Sätze zusammengelegt –
 * zweimal dieselbe Zeile im selben Training wäre nur verwirrend.
 */
function applyInjuries(items, active, taboo = EMPTY) {
  const block = blocked(active);
  if (!block.size) return { items: items.map((i) => ({ ...i })), dropped: [], swapped: [] };

  const out = [];
  const dropped = [];
  const swapped = [];
  items.forEach((item) => {
    if (!block.has(item.id)) {
      out.push({ ...item });
      return;
    }
    const to = substitute(item.id, active, block, taboo);
    if (!to) {
      // Warum nichts kam, macht einen Unterschied: gar kein Vorschlag ist
      // etwas anderes als einer, der erst am Folgetag wieder ginge.
      const wegen = active.some((id) => {
        const inj = BY_ID.get(id);
        const alt = inj && inj.swap[item.id];
        return alt && !block.has(alt) && taboo.has(alt);
      });
      dropped.push({ ...item, reason: wegen ? 'rest' : 'none' });
      return;
    }
    swapped.push({ from: item.id, to, sets: item.sets });
    const same = out.find((x) => x.id === to);
    if (same) same.sets += item.sets;
    else out.push({ id: to, sets: item.sets, from: item.id });
  });
  return { items: out, dropped, swapped };
}

/**
 * Was die Auswahl im Schnitt pro Woche kostet.
 *
 * Gerechnet über den ganzen Plan, damit die Zahl nicht vom heutigen Tag
 * abhängt: Sätze je Muskelgruppe mit und ohne Beschwerden, umgerechnet auf
 * eine Woche. Die angepasste Fassung kommt fertig herein – sie hängt an den
 * Nachbartagen und wird deshalb an einer Stelle in der App gerechnet, nicht
 * hier noch einmal.
 */
function weeklyImpact(plan, adjusted, byId, mode, weeks) {
  const sum = (list) => {
    const acc = {};
    list.forEach((it) => {
      const shares = byId.get(it.id)[mode].shares;
      Object.entries(shares).forEach(([m, s]) => { acc[m] = (acc[m] || 0) + it.sets * s; });
    });
    return acc;
  };
  const before = {};
  const after = {};
  plan.forEach((w, i) => {
    const a = sum(w.ex);
    const b = sum(adjusted[i]);
    Object.entries(a).forEach(([m, v]) => { before[m] = (before[m] || 0) + v; });
    Object.entries(b).forEach(([m, v]) => { after[m] = (after[m] || 0) + v; });
  });
  const out = {};
  Object.keys(before).forEach((m) => {
    out[m] = { before: before[m] / weeks, after: (after[m] || 0) / weeks };
  });
  return out;
}

/**
 * Freigabe abwarten? Bei Bruch, Riss und Bandscheibenvorfall entscheidet nicht
 * der Trainingsplan, wann wieder bewegt wird.
 */
function needsClearance(id) {
  const inj = BY_ID.get(id);
  return !!inj && ['bruch', 'riss', 'vorfall'].includes(inj.kind);
}

/**
 * Übungen, die bei der aktuellen Auswahl gut tun – ohne Doppelte, in der
 * Reihenfolge der angehakten Beschwerden.
 *
 * Zu jeder steht dabei, wegen welcher Beschwerde sie in der Liste ist, und ob
 * eine davon erst eine ärztliche Freigabe braucht.
 */
function careFor(active) {
  const out = new Map();
  active.forEach((id) => {
    const inj = BY_ID.get(id);
    if (!inj) return;
    (inj.care || []).forEach((key) => {
      if (!CARE[key]) return;
      const seen = out.get(key) || { key, ...CARE[key], wegen: [], clearance: false };
      seen.wegen.push(inj.name);
      seen.clearance = seen.clearance || needsClearance(id);
      out.set(key, seen);
    });
  });
  return [...out.values()];
}

/** Von Hand notierte Wechselwirkungen, die auf die Auswahl passen. */
function combosFor(active) {
  const set = new Set(active);
  return COMBOS.filter((c) => c.when.every((id) => set.has(id)));
}

/* ===== js/audio.js ===== */
/*
 * Töne der App.
 *
 * Alles wird per Web Audio erzeugt, nichts geladen: keine zusätzliche Datei,
 * kein Netz, kein Zwischenspeicher, der veralten könnte. Ein Ton ist eine
 * Folge von Sinus-Tönen [Frequenz, Versatz in s, Dauer in s, Lautstärke].
 *
 * Zwei Dinge sind hier wichtiger, als sie aussehen:
 *
 *   Freischalten.  Mobile Browser lassen Ton nur zu, wenn der AudioContext auf
 *                  eine Berührung zurückgeht. Deshalb entsteht er beim ersten
 *                  Tippen (Training starten, Satz abhaken) und nicht beim Laden.
 *
 *   Vorausplanen.  Das Pausensignal wird nicht per setTimeout ausgelöst,
 *                  sondern beim Start der Pause fest auf die Uhr des
 *                  AudioContext gelegt. Diese Uhr läuft weiter, wenn die Seite
 *                  in den Hintergrund gerät – Zeitgeber der Seite werden dort
 *                  ausgebremst oder ganz eingefroren. Damit der Browser den
 *                  Kontext dabei nicht schlafen legt, läuft bis zum Signal ein
 *                  unhörbarer Trägerton mit (siehe traeger()).
 */

const SOUNDS = {
  // Training beginnt – aufsteigender Dreiklang.
  start: [[523.25, 0, 0.14], [659.25, 0.11, 0.14], [783.99, 0.22, 0.34]],
  // Satz abgehakt – kurzer, leiser Tupfer. Kommt 20-mal pro Training vor.
  // Erst stand hier ein einzelner Ton bei 1245 Hz; der war den Mithörenden im
  // Raum zu fiepsig. Jetzt eine Oktave tiefer und mit einem leisen Grundton
  // darunter: gleiche Kürze, wärmerer Klang.
  set: [[523.25, 0, 0.1, 0.13], [261.63, 0, 0.12, 0.05]],
  // Übung fertig, nächste kommt.
  exercise: [[659.25, 0, 0.1], [987.77, 0.1, 0.24]],
  // Fertig machen – fünf Sekunden vor Schluss. Zwei kurze, tiefere Tupfer:
  // erkennbar anders als das Signal selbst, sonst steht man zu früh auf.
  ready: [[587.33, 0, 0.09, 0.18], [587.33, 0.16, 0.09, 0.18]],
  // Pause vorbei – das lauteste Signal, es muss quer durch den Raum kommen.
  rest: [[880, 0, 0.24, 0.35], [1320, 0.28, 0.26, 0.35]],
  // Workout komplett.
  done: [[523.25, 0, 0.14], [659.25, 0.13, 0.14], [783.99, 0.26, 0.14], [1046.5, 0.39, 0.55]],
  // Training beendet oder abgebrochen – absteigend, ohne Feierlichkeit.
  stop: [[587.33, 0, 0.16], [440, 0.14, 0.34]],
};

let ctx = null;
let geplant = [];     // vorausgelegte Signale: [{ quellen, at }]
let traegerTon = null;

/** AudioContext anlegen – nur aus einer Berührung heraus aufrufen. */
function initAudio() {
  if (ctx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try { ctx = new Ctx(); } catch { ctx = null; }
}

function wecken() {
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
}

function ton(at, [f, versatz, dauer, laut = 0.22]) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const t0 = at + versatz;
  osc.type = 'sine';
  osc.frequency.value = f;
  // Exponentiell, nicht linear: so klingt der Ton aus, statt abgeschnitten zu
  // werden – ein hartes Ende knackt hörbar.
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(laut, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dauer);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dauer + 0.02);
  return osc;
}

/**
 * Unhörbarer Trägerton, solange ein Signal aussteht.
 *
 * Ein Browser, dessen Seite im Hintergrund ist und nichts hörbar tut, darf den
 * AudioContext anhalten und die Seite einfrieren – dann käme das Pausensignal
 * gar nicht oder erst beim Zurückschalten. Läuft dagegen Ton, gilt die Seite
 * als aktiv. 30 Hz bei einem Tausendstel Lautstärke gibt kein Handylautsprecher
 * wieder, im Signalweg ist es aber vorhanden.
 */
function traeger(an) {
  if (an) {
    if (traegerTon || !ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 30;
    gain.gain.value = 0.001;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    traegerTon = osc;
  } else if (traegerTon) {
    try { traegerTon.stop(); } catch { /* schon gestoppt */ }
    traegerTon = null;
  }
}

/** Ton sofort abspielen. Ohne freigeschalteten Kontext passiert nichts. */
function playSound(name) {
  if (!ctx || !SOUNDS[name]) return;
  wecken();
  SOUNDS[name].forEach((t) => ton(ctx.currentTime + 0.02, t));
}

/**
 * Töne vorausplanen, fest auf die Uhr des AudioContext gelegt.
 *
 * `plan` ist eine Liste [Name, Sekunden ab jetzt]. Mehrere auf einmal, weil zu
 * einer Pause zwei gehören: die Vorwarnung und das Signal selbst. Alles Frühere
 * wird dabei verworfen – es gibt immer nur eine laufende Pause.
 *
 * Gibt zurück, ob es geklappt hat; sonst muss der Aufrufer sich anders helfen.
 */
function scheduleSound(plan) {
  initAudio();
  if (!ctx) return false;
  wecken();
  cancelSound();
  plan.forEach(([name, secs]) => {
    if (!SOUNDS[name] || secs < 0) return;
    const at = ctx.currentTime + secs;
    geplant.push({ at, quellen: SOUNDS[name].map((t) => ton(at, t)) });
  });
  if (!geplant.length) return false;
  traeger(true);
  return true;
}

/**
 * Vorausgelegte Signale verwerfen – Pause übersprungen, verlängert, aus.
 *
 * Was gerade spielt, bleibt: Ein Ton, der schon begonnen hat, würde sonst
 * mitten im Klang abgeschnitten – und genau das passiert am Ende der Pause,
 * wo endRest() eine Viertelsekunde nach dem Signal aufräumt.
 */
function cancelSound() {
  const jetzt = ctx ? ctx.currentTime : 0;
  geplant.forEach((g) => {
    if (g.at <= jetzt) return;
    g.quellen.forEach((osc) => { try { osc.stop(); } catch { /* egal */ } });
  });
  geplant = [];
  traeger(false);
}

// Zurück aus dem Hintergrund: iOS legt den Kontext beim Wegschalten schlafen,
// und ein schlafender Kontext bleibt es, bis ihn jemand weckt.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) wecken();
});

/** Gibt es überhaupt einen Rückkanal? Ohne URL bleibt alles lokal. */
const hatServer = () => !!(CONFIG.url && CONFIG.key);

/* ===== js/telemetry.js ===== */
/*
 * Der Rückkanal.
 *
 * Die App ist ohne ihn vollständig: kein Konto, kein Server, alles im Browser.
 * Er beantwortet genau eine Frage, die von innen nicht zu beantworten ist – wie
 * die App bei den Leuten läuft, denen der Link geschickt wurde: Wer nutzt sie,
 * mit welchem Fokus, wie oft, welche Übungen.
 *
 * Drei Regeln, an denen sich das entscheidet:
 *
 *   Sichtbar.    Wer die App einrichtet, liest in einem Satz, was rausgeht und
 *                an wen, und hat den Schalter direkt daneben. Unter Mehr steht
 *                dasselbe noch einmal, mitsamt dem Tag der letzten Meldung und
 *                dem, was der Server geantwortet hat, falls es schiefging.
 *   Abschaltbar. Ein Tipp, und es geht nichts mehr raus – rückwirkend gelöscht
 *                wird auf Wunsch auch (loeschen()).
 *   Wenig.       Es geht nur, was in der App ohnehin auf dem Bildschirm steht:
 *                Name, Fokus, Erfahrung, Einheiten, Sätze, Volumen, Serie,
 *                letztes Training, Sätze je Übung, wie oft weitergeschickt und
 *                wie viele Freundes-Stände übernommen wurden – dazu eine
 *                Zufallszahl als Kennung dieses Geräts. Keine Uhrzeiten (der
 *                Server vermerkt den Tag der Meldung), keine Adressen, keine
 *                Kennungen von außerhalb dieser App.
 *
 * Technisch ist es eine Supabase-Tabelle mit einer Zeile je Gerät (upsert auf
 * die zufällige Geräte-ID). Auf die Tabelle selbst hat der öffentliche Schlüssel
 * kein Recht: Geschrieben wird über die Funktion melde(), gelöscht über
 * entferne(), gelesen über admin_liste() mit Passwort – siehe README.
 */

const TABELLE = 'nutzung';

/** Zufällige Kennung dieses Geräts – ohne Bezug zu irgendetwas anderem. */
function geraeteId(vorhanden) {
  if (vorhanden) return vorhanden;
  if (crypto.randomUUID) return crypto.randomUUID();
  // Ohne randomUUID (ältere Browser) trotzdem echter Zufall: Die Kennung ist
  // das Einzige, was die eigene Zeile von fremden trennt – Math.random() wäre
  // dafür zu wenig.
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const hex = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
}

/**
 * Die alten anon-Schlüssel sind JWTs und gehören zusätzlich in den
 * Authorization-Kopf. Die neuen (sb_publishable_…) sind keine – dort ist der
 * Kopf bestenfalls wirkungslos, und ein Versuch damit verschleiert nur die
 * eigentliche Antwort.
 */
const istJwt = () => !/^sb_/.test(CONFIG.key);

function kopf(mitBearer = true) {
  const h = { 'Content-Type': 'application/json', apikey: CONFIG.key };
  if (mitBearer && istJwt()) h.Authorization = `Bearer ${CONFIG.key}`;
  return h;
}

/**
 * Eine Anfrage – und beim JWT-Schlüssel notfalls ein zweiter Versuch ohne den
 * Authorization-Kopf, falls das Projekt ihn abweist.
 */
async function senden(pfad, optionen, mitBearer = true) {
  // Zehn Sekunden, dann ist gut. Ohne Schranke bliebe die Anfrage bei einem
  // Server, der die Verbindung offen lässt, für immer stehen – und "Jetzt
  // melden" gäbe nie eine Antwort.
  const abbruch = new AbortController();
  const uhr = setTimeout(() => abbruch.abort(), 10000);
  try {
    const res = await fetch(`${CONFIG.url}${pfad}`, {
      ...optionen,
      signal: abbruch.signal,
      headers: { ...kopf(mitBearer), ...(optionen.headers || {}) },
    });
    if (!res.ok && mitBearer && istJwt() && (res.status === 401 || res.status === 403)) {
      return senden(pfad, optionen, false);
    }
    return res;
  } finally {
    clearTimeout(uhr);
  }
}

/**
 * Die Fehlermeldung des Servers in einem Satz – PostgREST antwortet als JSON.
 *
 * Der `code` kommt mit: Er trennt auf einen Blick, wer geantwortet hat. PGRST…
 * ist PostgREST selbst (Funktion fehlt, Spalte fehlt), fünfstellige Ziffern
 * sind Postgres-Fehlercodes – 42501 etwa heißt "darf nicht".
 */
async function grund(res) {
  try {
    const roh = await res.text();
    if (!roh) return `Fehler ${res.status}`;
    try {
      const j = JSON.parse(roh);
      const text = j.message || j.msg || j.error || roh;
      return `${res.status}: ${text}${j.code ? ` [${j.code}]` : ''}`.slice(0, 200);
    } catch {
      return `${res.status}: ${roh}`.slice(0, 200);
    }
  } catch {
    return `Fehler ${res.status}`;
  }
}

/** Antwortet der Server "diese Funktion kenne ich nicht"? */
const fehltFunktion = (res, text) => res.status === 404
  || (res.status === 400 && /PGRST202|function|schema cache/i.test(text || ''));

/**
 * Stand melden. Fehler sind hier keine Fehler: Kein Netz, Server weg, Tabelle
 * anders – die App darf davon nichts merken, sie ist ohne den Server vollständig.
 *
 * Zurück kommt trotzdem, *warum* es nicht ging: { ok, status, msg }. Das steht
 * dann unter Mehr, sonst sucht man den Fehler auf der falschen Seite.
 */
export async function melden(zeile) {
  if (!hatServer()) return { ok: false, status: 0, msg: 'Kein Server eingetragen' };
  try {
    // Der Weg über die Funktion braucht keine Rechte auf der Tabelle – und
    // damit auch keine Regeln, die für die richtige Rolle greifen müssen.
    const res = await senden('/rest/v1/rpc/melde', {
      method: 'POST',
      body: JSON.stringify({ zeile }),
    });
    if (res.ok) return { ok: true, status: res.status, msg: '' };
    const msg = await grund(res);
    if (!fehltFunktion(res, msg)) return { ok: false, status: res.status, msg };

    // Ältere Einrichtung ohne die Funktion: direkt in die Tabelle, wie bisher.
    const alt = await senden(`/rest/v1/${TABELLE}`, {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([zeile]),
    });
    if (alt.ok) return { ok: true, status: alt.status, msg: '' };
    // Beide Wege dicht: Dann gehört beides in die Meldung. Der Satz "melde
    // fehlt" allein führte sonst in die Irre, wenn die Tabelle den eigentlichen
    // Grund nennt – und umgekehrt.
    return { ok: false, status: alt.status, msg: `${msg} · direkt in die Tabelle: ${await grund(alt)}` };
  } catch (e) {
    // fetch wirft nur bei Netz oder CORS – der Status bleibt unbekannt.
    return { ok: false, status: 0, msg: `Keine Verbindung (${e && e.message ? e.message : 'Netz oder CORS'})` };
  }
}

/**
 * Eigene Zeile löschen – der Weg zurück, wenn jemand doch nicht mag.
 *
 * Auch das läuft über eine Funktion. Ein DELETE über die Tabelle meldet nämlich
 * auch dann Erfolg, wenn es null Zeilen getroffen hat – und "Gelöscht" wäre
 * dann gelogen.
 */
export async function loeschen(id) {
  if (!hatServer() || !id) return { ok: false, zeilen: 0, msg: 'Nichts zu löschen' };
  try {
    const res = await senden('/rest/v1/rpc/entferne', {
      method: 'POST',
      body: JSON.stringify({ geraet: id }),
    });
    if (res.ok) {
      // Ältere Fassungen der Funktion geben nichts zurück; dann gilt "erledigt".
      const roh = (await res.text()).trim();
      const zahl = roh === '' || roh === 'null' ? null : Number(roh);
      return { ok: true, zeilen: Number.isFinite(zahl) ? zahl : null, msg: '' };
    }
    const msg = await grund(res);
    if (!fehltFunktion(res, msg)) return { ok: false, zeilen: 0, msg };

    // Alte Einrichtung: über die Tabelle, und zwar so, dass sich nachsehen
    // lässt, ob wirklich etwas wegging.
    const alt = await senden(`/rest/v1/${TABELLE}?id=eq.${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: { Prefer: 'return=representation' },
    });
    if (!alt.ok) return { ok: false, zeilen: 0, msg: await grund(alt) };
    const weg = await alt.json().catch(() => null);
    return { ok: true, zeilen: Array.isArray(weg) ? weg.length : null, msg: '' };
  } catch (e) {
    return { ok: false, zeilen: 0, msg: `Keine Verbindung (${e && e.message ? e.message : 'Netz'})` };
  }
}

/**
 * Die Liste für den Betreiber.
 *
 * Läuft über eine Datenbankfunktion mit Passwort, nicht über einen zweiten
 * Schlüssel: Ein Schlüssel mit Leserecht müsste in der App liegen und damit bei
 * allen, die den Link haben. Das Passwort kennt nur, wer es eingibt.
 */
export async function adminListe(passwort) {
  if (!hatServer()) throw new Error('Kein Server eingetragen');
  let res;
  try {
    res = await senden('/rest/v1/rpc/admin_liste', {
      method: 'POST',
      body: JSON.stringify({ pass: passwort }),
    });
  } catch (e) {
    throw new Error(`Keine Verbindung (${e && e.message ? e.message : 'Netz'})`);
  }
  // "nope" wirft nur die Funktion selbst, und zwar bei falschem Passwort. Der
  // Fehlercode taugt dafür nicht: 42501 vergibt Postgres auch für ein fehlendes
  // Ausführungsrecht – eine kaputte Einrichtung sähe dann aus wie ein Tippfehler.
  if (!res.ok) {
    const text = await grund(res);
    const falsch = /\bnope\b/.test(text) && !/permission denied/i.test(text);
    throw new Error(falsch ? 'Passwort falsch' : text);
  }
  const daten = await res.json();
  if (!Array.isArray(daten)) throw new Error('Passwort falsch');
  return daten;
}

/* ===== js/store.js ===== */
const KEY = 'workout.state.v1';

const DEFAULT_STATE = {
  mode: 'db',            // global default: 'db' (Hanteln) | 'bw' (Bodyweight)
  keepModePerWorkout: true,
  shift: 0,              // Tage, um die der noch offene Plan verschoben ist
  useExerciseRest: true, // Pause je Übung statt einer festen Länge
  restSeconds: 90,       // feste Pause, wenn useExerciseRest aus ist; 0 = keine
  shareCount: 0,         // wie oft der Link oder der Stand weitergeschickt wurde
  share: true,           // Stand an den Betreiber melden (nur wenn js/config.js einen Server nennt)
  deviceId: null,        // zufällige Kennung dieses Geräts für genau diese Meldung
  lastShare: null,       // { on, ok, msg } – wann zuletzt gemeldet wurde und was schiefging
  tabs: ['stats'],       // frei wählbare Reiter unten; Dashboard und Mehr stehen immer
  level: 'geuebt',       // Erfahrung: anfaenger | geuebt | fortgeschritten – skaliert die Startgewichte
  focus: 'standard',     // Trainingsfokus – welche Planvariante gilt (siehe js/data.js)
  theme: 'orange',       // Farbdesign: orange | rosa | blau | gruen | violett
  name: '',              // Anzeigename – steht nur in diesem Browser, kein Konto
  greeted: false,        // Willkommensseite gesehen
  sound: true,           // Töne: Pausenende, Start, Übung fertig, Workout komplett
  soundSets: true,       // zusätzlich ein kurzer Ton bei jedem abgehakten Satz
  notify: false,         // Systemhinweis am Pausenende, wenn die App im Hintergrund ist
  rest: null,            // laufende Pause: { endsAt, total, next }
  weights: {},           // Arbeitsgewicht je Übung in kg, vom Nutzer gepflegt
  bands: {},             // Bandstärke je Übung: 'gelb' (leicht) oder 'rot' (schwer)
  friends: {},           // zuletzt geschickter Stand anderer: { id: { n, w, s, kg, r, p, d, am } }
  customs: [],           // eigene Einheiten: [{ id: 'c1', name, ex: [{id, sets}] }]
  session: null,         // laufendes Training: { n }
  clock: null,           // Uhr der Einheit: { n, on, spent, since } – siehe startSession()
  lastBackup: null,      // { on, done } – Stand der letzten Sicherung
  // Stand der zuletzt erzeugten Kalenderdatei: { on, shift, seq }. Aus `shift`
  // ergibt sich, ob die Termine im Kalender noch stimmen; `seq` zählt hoch,
  // damit ein erneuter Import die alten Termine überschreibt statt sie stehen
  // zu lassen.
  lastIcs: null,
  rounds: [],            // abgeschlossene Durchläufe: [{ finishedOn, log }]
  // Angehakte Verletzungen als IDs aus js/injuries.js. Sie gelten für alle
  // kommenden Trainings, bis der Haken wieder weg ist – nicht nur für heute.
  injuries: [],
  tab: 'dashboard',      // zuletzt sichtbarer Tab, damit ein Neuladen nicht herausreißt
  // Zusätzliche Wiederholungen im Bodyweight-Modus, je Übung. Dort gibt es
  // kein Gewicht, das man erhöhen könnte – die Steigerung sind die Wdh.
  bwPlus: {},
  // { [workoutNo]: { db: {exId: [{w,r,done}]}, bw: {...}, mode, startedOn } }
  log: {},
};

function clone(o) { return JSON.parse(JSON.stringify(o)); }

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return clone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    const state = Object.assign(clone(DEFAULT_STATE), parsed);
    // Das Betreiber-Passwort lag früher hier. Es gehört in den Tab-Speicher
    // (siehe adminPassMerken in js/app.js) und nicht in eine Sicherungsdatei –
    // ein alter Stand wird deshalb beim Laden davon befreit.
    if ('adminPass' in state) delete state.adminPass;
    // Wer schon etwas gespeichert hat, ist nicht neu hier: Die Willkommensseite
    // fragt nach dem Namen und erklärt die App – für jemanden, der seit Wochen
    // trainiert, wäre sie eine Zumutung. Der Schlüssel fehlt genau dann, wenn
    // der Stand aus einer Fassung vor der Seite stammt.
    if (!('greeted' in parsed)) {
      state.greeted = true;
      // Und dann fehlt auch der Name. Diese App ist für einen bestimmten
      // Menschen gebaut, und dessen Stand ist genau der, in dem `greeted` noch
      // nicht vorkam – also trägt er sich hier selbst ein. Wer den Namen nicht
      // will, ändert ihn unter Mehr in einer Zeile.
      if (!state.name) state.name = 'Tobi';
    }
    return state;
  } catch {
    return clone(DEFAULT_STATE);
  }
}

let saveTimer = null;

/**
 * Einmal vorab prüfen, statt auf den ersten fehlgeschlagenen Schreibvorgang zu
 * warten: In privaten Fenstern und manchen eingebetteten Ansichten ist der
 * Speicher gesperrt, und dann darf die App das nicht stillschweigend schlucken.
 */
let storageOk = (() => {
  try {
    localStorage.setItem(`${KEY}.probe`, '1');
    localStorage.removeItem(`${KEY}.probe`);
    return true;
  } catch {
    return false;
  }
})();

/** false, wenn der Browser nichts speichern kann – Eintragungen sind flüchtig. */
function canPersist() { return storageOk; }

function write() {
  saveTimer = null;
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageOk = true;
  } catch {
    storageOk = false; // Speicher voll oder gesperrt
  }
}

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(write, 120);
}

/**
 * Ausstehenden Schreibvorgang sofort ausführen. Nötig, bevor die App in den
 * Hintergrund geht: mobile Browser verwerfen die Seite dort ohne Vorwarnung,
 * und der letzte abgehakte Satz wäre sonst verloren.
 */
function flush() {
  if (saveTimer === null) return;
  clearTimeout(saveTimer);
  write();
}

function emit() {
  listeners.forEach((fn) => fn(state));
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function getState() { return state; }

function setMode(mode) {
  state.mode = mode === 'bw' ? 'bw' : 'db';
  persist();
  emit();
}

/** Modus, in dem ein konkretes Workout bearbeitet wird. */
function workoutMode(n) {
  const entry = state.log[n];
  if (state.keepModePerWorkout && entry && entry.mode) return entry.mode;
  return state.mode;
}

function setWorkoutMode(n, mode) {
  const entry = ensure(n);
  entry.mode = mode;
  state.mode = mode;
  persist();
  emit();
}

function ensure(n) {
  if (!state.log[n]) state.log[n] = { db: {}, bw: {}, mode: state.mode };
  const e = state.log[n];
  if (!e.db) e.db = {};
  if (!e.bw) e.bw = {};
  return e;
}

/** Satz-Array für eine Übung in einem Workout; legt es bei Bedarf an. */
function getSets(n, mode, exId, setCount) {
  const bucket = ensure(n)[mode];
  let arr = bucket[exId];
  if (!Array.isArray(arr)) arr = bucket[exId] = [];
  while (arr.length < setCount) arr.push({ w: '', r: '', done: false });
  // Gekürzt wird nur, was leer ist. Seit die Erfahrungsstufe die Satzzahl
  // bestimmt (drei Sätze für Geübte, zwei für Anfänger), würde ein Wechsel
  // sonst rückwirkend den dritten Satz jeder protokollierten Übung löschen –
  // eine Einstellung darf keine Trainingsgeschichte wegräumen.
  const leer = (x) => !x.done && x.w === '' && x.r === '';
  while (arr.length > setCount && leer(arr[arr.length - 1])) arr.pop();
  return arr;
}

/** Wurde an diesem Workout überhaupt schon etwas eingetragen oder abgehakt? */
function isStarted(n) {
  const e = state.log[n];
  if (!e) return false;
  return ['db', 'bw'].some((m) => Object.values(e[m] || {}).some(
    (arr) => Array.isArray(arr) && arr.some((s) => s.done || s.w !== '' || s.r !== ''),
  ));
}

/** Tag, an dem tatsächlich trainiert wurde – oder null, solange nichts erfasst ist. */
function startedOn(n) {
  const e = state.log[n];
  return (e && e.startedOn) || null;
}

/** Hält fest, wann eine Einheit begonnen wurde, bzw. löst die Markierung wieder. */
function syncStartedOn(n) {
  const e = state.log[n];
  if (!e) return;
  if (isStarted(n)) {
    if (!e.startedOn) e.startedOn = todayISO();
  } else {
    delete e.startedOn;
  }
}

/**
 * Laufende Pause setzen oder beenden. Gespeichert wird der Endzeitpunkt, nicht
 * die Restdauer – so stimmt die Anzeige auch, wenn das Handy zwischendurch
 * gesperrt war und die App erst später wieder in den Vordergrund kommt.
 */
function setRest(rest) {
  state.rest = rest;
  persist();
  emit();
}

/** Arbeitsgewicht einer Übung; null, solange der Nutzer nichts geändert hat. */
function weightOf(exId) {
  const w = state.weights[exId];
  return typeof w === 'number' ? w : null;
}

function setWeight(exId, kg) {
  // Auf Viertelkilo runden, nicht auf halbe: die Gewichtsschritte gehen je
  // Übung, und die kleinen liegen bei 1,25 kg. Mit halben Kilo wurde aus dem
  // Vorschlag "auf 21,25 kg" beim Annehmen still 21,5.
  const v = Math.max(0, Math.round(kg * 4) / 4);
  state.weights[exId] = v;
  persist();
  emit();
  return v;
}

/* Die Uhr des Trainings.
 *
 * Sie misst nicht die Zeit seit dem Startknopf, sondern die Zeit, die wirklich
 * trainiert wurde: Sie läuft, solange die App offen ist oder eine Pause läuft,
 * und steht, wenn beides nicht zutrifft. Wer zwischendurch aufs Handy verzichtet
 * oder die App weglegt, bekommt sonst eine Einheit von zwei Stunden angezeigt,
 * in der er vierzig Minuten trainiert hat.
 *
 * `clock` hält deshalb zwei Zahlen: `spent` ist die schon gezählte Zeit in
 * Millisekunden, `since` der Zeitpunkt, seit dem sie wieder läuft (oder null,
 * wenn sie steht). Beides hängt an der Einheit und am Tag, damit Fortsetzen
 * kein Neuanfang ist – und damit am nächsten Morgen nicht eine zwölfstündige
 * Einheit dasteht.
 */

function startSession(n) {
  const c = state.clock;
  const weiter = c && c.n === n && c.on === todayISO();
  state.clock = {
    n, on: todayISO(), spent: weiter ? c.spent : 0, since: Date.now(),
  };
  state.session = { n };
  persist();
  emit();
}

function endSession() {
  clockStop();
  state.session = null;
  persist();
  emit();
}

/** Uhr anhalten – App im Hintergrund und keine Pause, oder Training beendet. */
function clockStop() {
  const c = state.clock;
  if (!c || c.since === null) return;
  state.clock = { ...c, spent: c.spent + (Date.now() - c.since), since: null };
  persist();
}

/** Uhr weiterlaufen lassen – App wieder da. */
function clockStart() {
  const c = state.clock;
  if (!state.session || !c || c.since !== null) return;
  state.clock = { ...c, since: Date.now() };
  persist();
}

/**
 * Beim Laden der Seite: die Lücke seit dem letzten Mal nicht mitzählen.
 *
 * Normalerweise hält `pagehide` die Uhr an, bevor die Seite verschwindet. Wird
 * der Browser abgeschossen oder das Handy hart ausgeschaltet, bleibt `since`
 * stehen – und ohne diese Zeile stünden beim nächsten Öffnen die Stunden
 * dazwischen in der Einheit.
 */
function clockResync() {
  const c = state.clock;
  if (!c || c.since === null) return;
  state.clock = { ...c, since: Date.now() };
  persist();
}

/** Bisher gezählte Trainingszeit der laufenden Einheit, in Sekunden. */
function sessionSeconds() {
  const c = state.clock;
  if (!c) return 0;
  return Math.floor((c.spent + (c.since ? Date.now() - c.since : 0)) / 1000);
}

/**
 * Verschiebung des offenen Plans in Tagen.
 *
 * Auch negativ: Die Termine kommen aus der Excel und liegen unter Umständen in
 * der Zukunft. Vorher war hier eine Untergrenze von 0 – wer früher anfangen
 * wollte als die Tabelle vorsah, konnte nur warten.
 */
function setShift(days) {
  const v = Math.round(Number(days) || 0);
  if (v === state.shift) return;
  state.shift = v;
  persist();
  emit();
}

/** Nur lesen – legt nichts an, damit reines Blättern den Speicher nicht füllt. */
function peekSets(n, mode, exId) {
  const e = state.log[n];
  const arr = e && e[mode] && e[mode][exId];
  return Array.isArray(arr) ? arr : null;
}

function updateSet(n, mode, exId, setCount, index, patch) {
  const arr = getSets(n, mode, exId, setCount);
  Object.assign(arr[index], patch);
  ensure(n).mode = mode;
  syncStartedOn(n);
  persist();
  emit();
}

function resetWorkout(n, mode) {
  const e = state.log[n];
  if (!e) return;
  e[mode] = {};
  if (e.done === mode) delete e.done;
  // Verworfen ist verworfen: Der nächste Anlauf an dieser Einheit fängt die
  // Zeit wieder bei null an.
  if (state.clock && state.clock.n === n) state.clock = null;
  syncStartedOn(n);
  persist();
  emit();
}

function completeWorkout(n, mode, exList) {

    // Gewicht zählt: in der Verlaufskurve und in der Steigerungsserie.

  emit();

/* Reha-Übungen einer Einheit. Sie hängen am Workout, nicht am Tag: Gemacht

function toggleCare(n, key) {
  const e = ensure(n);
  const care = e.care || (e.care = {});
  if (care[key]) delete care[key];
  else care[key] = true;
  syncStartedOn(n);
  persist();
  emit();
}

/**
 * Einheit für erledigt erklären, auch wenn nicht jeder Satz steht.
 *
 * "Abschließen" heißt genau das: Ich bin für heute fertig. Wer den letzten Satz
 * Wadenheben weglässt, hat trotzdem trainiert – und der Tag soll im Kalender

  emit();

/* Eigene Einheiten. Sie stehen neben dem Plan, nicht darin: Der Plan rechnet

/* Bandstärke statt Gewicht. Am Band gibt es keine Kilo, aber zwei Bänder –

function setSetting(key, value) {

  persist();
  emit();

/** Hält fest, dass gesichert wurde – gemessen an der Zahl erledigter Einheiten. */
function markBackup(done) {

  persist();
  emit();

/**
 * Plan von vorn beginnen. Der bisherige Verlauf wandert in `rounds`, die

function restartPlan(shiftDays) {

    // und Workout 3 im Beinplan hat andere Übungen als Workout 3 im
    // ausgewogenen. Ohne diesen Vermerk ließe sich ein Verlauf in einen Plan
    // zurückholen, in den er nicht gehört.
    state.rounds.push({ finishedOn: todayISO(), log: state.log, focus: state.focus });
  }
  state.log = {};
  state.session = null;
  state.clock = null;
  state.rest = null;
  state.shift = Math.round(Number(shiftDays) || 0);
  persist();
  emit();
}

/**
 * Den zuletzt abgelegten Verlauf zurückholen.
 *
 * `restartPlan` ist die einzige Stelle, an der ein Protokoll verschwindet – und
 * sie hängt an einer einzigen Rückfrage, die man auch aus Versehen wegklickt
 * (der Wechsel des Trainingsfokus geht denselben Weg). Ohne Rückweg wäre das
 * eine Falltür.
 *
 * Zusammengeführt wird pro Einheit: Was seit dem Neustart abgehakt wurde, bleibt
 * stehen; alles andere kommt zurück.
 *
 * Nur aus demselben Trainingsfokus: siehe restoreRound() weiter unten.
 */
function restoreRound() {
  const runde = restorable();
  if (!runde) return false;
  state.rounds = state.rounds.filter((r) => r !== runde);
  const zurueck = runde.log || {};
  Object.keys(zurueck).forEach((n) => {
    if (!state.log[n]) state.log[n] = zurueck[n];
  });
  persist();
  emit();
  return true;
}

/**
 * Der zuletzt abgelegte Verlauf, der in den heutigen Plan gehört – oder null.
 *
 * Ein Protokoll ist nach Workout-Nummer abgelegt, die Übungen dahinter stehen
 * aber im Plan. Aus einem anderen Fokus zurückgeholt, markierte es Einheiten
 * als erledigt, die jemand nie gemacht hat. Verläufe ohne Vermerk stammen aus
 * einer Fassung, die nur einen Plan kannte, und gelten deshalb als passend.
 */
function restorable() {
  const liste = state.rounds || [];
  for (let i = liste.length - 1; i >= 0; i--) {
    const r = liste[i];
    if (!r.focus || r.focus === (state.focus || 'standard')) return r;
  }
  return null;
}

/** Hält fest, dass eine Kalenderdatei erzeugt wurde, und zählt SEQUENCE hoch. */
function markIcs(count = 0) {
  const seq = (state.lastIcs && state.lastIcs.seq) || 0;
  // `count` merkt sich, wie viele Termine in der Datei standen. Beim nächsten
  // Export weiß die App damit, welche Nummern abzusagen sind.
  state.lastIcs = { on: todayISO(), shift: state.shift, seq: seq + 1, count };
  persist();
  emit();
  return state.lastIcs;
}

/**
 * Alles für die Sicherung – bis auf das Betreiber-Passwort.
 *
 * Eine Sicherungsdatei wird weitergegeben, auf einen anderen Rechner, in eine
 * Cloud, per Mail an sich selbst. Das Passwort für die Übersicht hat darin
 * nichts zu suchen; es öffnet die Daten aller anderen. Es steht ohnehin nicht
 * mehr im Zustand – die Zeile hier ist der Riegel für alte Stände, die es noch
 * mitschleppen.
 */
function exportJSON() {
  const { adminPass, ...rest } = state;
  return JSON.stringify(rest, null, 2);
}

/**
 * Sicherung einlesen.
 *
 * Geprüft wird nicht aus Misstrauen, sondern weil eine halb passende Datei
 * sonst still einen Zustand hinterlässt, in dem die App merkwürdig wird –
 * `injuries` als Zeichenkette etwa, oder ein `log` voller Fremdformate. Alles
 * Unbekannte fällt weg, alles Bekannte wird auf seinen Typ gebracht.
 */
function importJSON(text) {
  const parsed = JSON.parse(text);
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)
      || !parsed.log || typeof parsed.log !== 'object' || Array.isArray(parsed.log)) {
    throw new Error('Unerwartetes Format – "log" fehlt.');
  }
  const fresh = clone(DEFAULT_STATE);
  Object.keys(DEFAULT_STATE).forEach((key) => {
    const v = parsed[key];
    if (v === undefined || v === null) return;
    const soll = DEFAULT_STATE[key];
    if (Array.isArray(soll) !== Array.isArray(v)) return;
    if (soll !== null && typeof soll !== typeof v) return;
    fresh[key] = v;

  emit();

  state = clone(DEFAULT_STATE);
  try { localStorage.removeItem(KEY); } catch { /* ignorieren */ }
  persist();
  emit();
}

/* ===== js/app.js ===== */
/* ------------------------------------------------------------------ *
 * Hilfsfunktionen
 * ------------------------------------------------------------------ */

/* Trainingsfokus: js/data.js liefert alle Varianten mit (PLANS) und wählt beim
 * Laden aus, welche gilt – PLAN, TARGET und REST kommen von dort und meinen
 * überall dasselbe. Der Wechsel lädt die Seite neu, siehe 'set-focus'. */

const EX_BY_ID = new Map(EXERCISES.map((e) => [e.id, e]));
const view = document.getElementById('view');
const tabbar = document.getElementById('tabbar');
const modeSwitch = document.getElementById('modeSwitch');
const toastEl = document.getElementById('toast');

const MODE_LABEL = { db: 'Hanteln', bw: 'Bodyweight' };

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/**
 * Tatsächlicher Termin einer Einheit.
 *
 * Bereits begonnene Einheiten bleiben auf dem Tag, an dem trainiert wurde –
 * die Historie darf sich nicht rückwirkend verschieben. Alles Offene liegt
 * auf seinem Plandatum plus der aktuellen Verschiebung.
 */
function effDate(w) {
  // Eigene Einheiten hängen an keinem Plantermin: Sie sind an dem Tag, an dem
  // man sie macht, und verschieben sich mit dem Plan nicht mit.
  if (istCustom(w.n)) return store.startedOn(w.n) || todayISO();
  return store.startedOn(w.n) || addDays(w.date, store.getState().shift);
}

/** Eigene Einheiten haben eine Kennung statt einer Nummer. */
const istCustom = (n) => typeof n === 'string' && n.startsWith('c');

/**
 * Verpasste Tage nachtragen: Ist der Termin der frühesten noch nicht
 * begonnenen Einheit verstrichen, wandert der gesamte Restplan um genau so
 * viele Tage nach hinten, bis diese Einheit auf heute fällt. Die Abstände
 * zwischen den Einheiten bleiben dabei erhalten.
 */
function catchUpPlan() {
  const s = store.getState();
  const open = PLAN.find((w) => !store.isStarted(w.n));
  if (!open) return 0;
  const missed = daysBetween(effDate(open), todayISO());
  if (missed <= 0) return 0;
  store.setShift(s.shift + missed);
  return missed;
}

/** Die erste Einheit, die noch nicht angefangen wurde – die, die dran wäre. */
function firstOpen() {
  return PLAN.find((w) => !store.isStarted(w.n)) || PLAN[PLAN.length - 1];
}

/**
 * Verschiebung, die die nächste offene Einheit auf heute legt – in beide
 * Richtungen.
 *
 * Die Termine stammen aus der Excel und liegen unter Umständen in der Zukunft.
 * Nachrücken allein half da nicht: Es schiebt nur, was verstrichen ist. Wer
 * heute anfangen will, braucht den Weg nach vorn genauso.
 */
function shiftToToday() {
  return store.getState().shift + daysBetween(effDate(firstOpen()), todayISO());
}

/**
 * Knopf „Heute anfangen“ – nur, wenn es etwas vorzuziehen gibt.
 *
 * Sichtbar an genau der Einheit, die als Nächstes offen ist: An Workout 40
 * angetippt würde er den halben Plan um Monate verschieben, und das will
 * niemand aus Versehen.
 */
function startTodayRow(n) {
  const offen = firstOpen();
  if (store.getState().session || offen.n !== n) return '';
  const tage = daysBetween(todayISO(), effDate(offen));
  if (tage <= 0) return '';
  return `<div class="btn-row">
      <button type="button" class="btn btn-ghost btn-block" data-act="start-today">
        Heute anfangen – Plan ${esc(plural(tage, 'Tag', 'Tage'))} vorziehen
      </button>
    </div>`;
}

/** Die Einheit, die als Nächstes ansteht: die erste noch nicht abgeschlossene. */
function defaultWorkoutNo() {
  const open = PLAN.find((w) => !completedMode(w.n));
  return open ? open.n : PLAN[PLAN.length - 1].n;
}

/** Angehakte Verletzungen. */
function activeInjuries() { return store.getState().injuries || []; }

/** Muskelgruppen, für die eine Übung da ist – dieselbe Schwelle wie im Plan. */
function directOf(exId) {
  const ex = EX_BY_ID.get(exId);
  if (!ex) return [];
  return Object.entries(ex.db.shares).filter(([, v]) => v >= REST.direct).map(([m]) => m);
}

const directSets = (items) => new Set(items.flatMap((it) => directOf(it.id)));

/**
 * Der ganze Plan unter den angehakten Beschwerden – einmal gerechnet, gemerkt.
 *
 * Ein Tausch darf die Erholung nicht aushebeln: Der Plan ist so gebaut, dass
 * keine Muskelgruppe innerhalb von REST.days Tagen zweimal direkt drankommt,
 * und ein Ersatz, der genau das täte, ist keiner – dann fällt die Übung lieber
 * ersatzlos weg. Geprüft wird gegen beide Nachbarn: den Vortag in der bereits
 * angepassten Fassung und den Folgetag so, wie er im Plan steht. Dessen eigene
 * Tausche werden dann ihrerseits gegen diesen Tag geprüft.
 */
const planCache = { key: null, list: null, notes: null };

// Jede Zustandsänderung verwirft den Zwischenstand. Die Anpassung hängt an den
// tatsächlichen Terminen, und die ändern sich auch, wenn eine Einheit begonnen
// wird – das ließe sich am Schlüssel kaum zuverlässig ablesen. Ein Neuaufbau
// kostet unter einer Millisekunde, die Ersparnis liegt in den vielen Aufrufen
// innerhalb *eines* Renderdurchlaufs.
store.subscribe(() => { planCache.key = null; });

function adjustedPlan() {
  const act = activeInjuries();
  // Der Schlüssel nennt nur, was die Anpassung selbst bestimmt. Die Termine
  // hängen zusätzlich daran, wann tatsächlich trainiert wurde – deshalb wird
  // der Zwischenstand bei jeder Zustandsänderung verworfen (siehe unten),
  // statt hier eine Signatur über den ganzen Verlauf zu bilden.
  const key = `${act.join(',')}|${store.getState().shift}`;
  if (planCache.key === key) return planCache.list;

  const list = [];
  const notes = [];
  PLAN.forEach((w, i) => {
    if (!act.length) {
      list.push(w.ex);
      notes.push({ dropped: [], swapped: [] });
      return;
    }
    const eng = (a, b) => a && b && Math.abs(daysBetween(effDate(a), effDate(b))) < REST.days;
    const meide = new Set();
    if (eng(PLAN[i - 1], w)) directSets(list[i - 1]).forEach((m) => meide.add(m));
    if (eng(w, PLAN[i + 1])) directSets(PLAN[i + 1].ex).forEach((m) => meide.add(m));
    const taboo = new Set(EXERCISES
      .filter((e) => directOf(e.id).some((m) => meide.has(m)))
      .map((e) => e.id));
    const r = applyInjuries(w.ex, act, taboo);
    list.push(r.items);
    notes.push({ dropped: r.dropped, swapped: r.swapped });
  });
  planCache.key = key;
  planCache.list = list;
  planCache.notes = notes;
  return list;
}

/** Was an einem Plantag getauscht wurde und was wegfiel. */
function injuryNotes(n) {
  adjustedPlan();
  return planCache.notes[n - 1] || { dropped: [], swapped: [] };
}

/**
 * Übungsliste eines Plantags, angepasst an die angehakten Verletzungen.
 *
 * Alles in der App geht durch diese Stelle – Übersicht, Fokus, Statistik,
 * Steigerungsvorschlag. So kann es gar nicht passieren, dass an einer Stelle
 * eine gesperrte Übung auftaucht und an einer anderen nicht.
 */
function exOf(w) {
  if (istCustom(w.n)) return w.ex;
  const geplant = adjustedPlan()[w.n - 1] || w.ex;
  // Erfahrung: gleich viele Übungen, andere Satzzahl. Siehe satzZahl().
  const items = satzFaktor() === 1 ? geplant
    : geplant.map((it) => ({ ...it, sets: satzZahl(it.sets) }));
  // Nur bei den Hanteln: Im Bodyweight-Modus gibt es nichts umzubauen, und die
  // Reihenfolge soll dann die des Plans bleiben.
  return store.workoutMode(w.n) === 'db' ? ruestOrderStabil(items, w.n, 'db') : items;
}

function workoutByNo(n) {
  if (istCustom(n)) {
    const c = store.customById(n);
    if (c) return { n, date: todayISO(), name: c.name, ex: c.ex, custom: true };
  }
  const w = PLAN.find((x) => x.n === n) || PLAN[0];
  const ex = exOf(w);
  return ex === w.ex ? w : { ...w, ex };
}

/** Untere Grenze eines Wiederholungsbereichs, z. B. "8–12" -> 8. */
function plannedReps(reps) {
  const m = String(reps).match(/\d+/);
  return m ? Number(m[0]) : 0;
}

/** Variante (db/bw) einer geplanten Übung inkl. Sätze. */
function resolve(item, mode) {
  const ex = EX_BY_ID.get(item.id);
  const v = ex[mode];
  return {
    id: item.id, sets: item.sets, group: ex.group,
    name: v.name, reps: v.reps, equip: v.equip, cue: v.cue, rest: v.rest, pattern: v.pattern, muscles: v.muscles,
    // Die ausführliche Erklärung hängt an der Übung, nicht an der Variante:
    // Griff, Aufbau und typische Fehler sind in beiden Fassungen dieselben.
    detail: ex.detail,
    // Zusatzgewicht gibt es nur in der Hantel-Variante und nur, wo die Übung
    // eines kennt – Chin-ups und Sliding Leg Curls etwa nicht.
    weight: mode === 'db' ? ex.weight : null,
    // Gerät der Figur. Bodyweight heißt nicht gerätelos: Ein Loop-Band ist in
    // beiden Varianten dasselbe Gerät, und seit die Bodyweight-Fassungen von
    // Curls, Trizepsdrücken und Schulterdrücken am Band hängen, wäre eine Figur
    // ohne Band schlicht falsch.
    gear: mode === 'db' ? ex.equip : (/band/i.test(v.equip) ? 'band' : null),
    weightNote: ex.weightNote,
  };
}

/* ------------------------------------------------------------------ *
 * Erfahrung
 *
 * Die Startgewichte in tools/exercise-meta.json sind die eines Menschen, der
 * seit einer Weile trainiert: 40 kg Floor Press, 20 kg Goblet Squat. Für jemand
 * anderen, der den Link bekommt, ist das entweder zu viel oder zu wenig – und
 * beides führt zum selben Ergebnis, nämlich dass die erste Einheit nichts taugt.
 *
 * Die Erfahrung skaliert deshalb die Startwerte, gerundet auf die Schrittweite
 * der jeweiligen Übung. Mehr nicht: Der Plan selbst, die Sätze, die Pausen und
 * die Erholungsregel sind für Anfänger dieselben wie für alle anderen – daran
 * ist nichts anfängerspezifisch. Und sobald jemand ein Gewicht selbst einstellt,
 * gilt seins; die Erfahrung ist ein Startpunkt, keine Obergrenze.
 * ------------------------------------------------------------------ */

const LEVELS = [
  ['anfaenger', 'Anfänger', 'Neu im Krafttraining oder lange raus. Startgewichte auf der '
    + 'Hälfte und zwei Sätze je Übung statt drei: Wer neu anfängt, wächst schon bei wenig '
    + 'Volumen – die ersten Wochen entscheidet die Technik, nicht die Scheibe.', 0.5],
  ['geuebt', 'Geübt', 'Du weißt, wie sich ein sauberer Satz anfühlt, und trainierst schon '
    + 'eine Weile. Startgewichte und drei Sätze je Übung passen so.', 1],
  ['fortgeschritten', 'Fortgeschritten', 'Jahre im Training, die Technik sitzt. Startgewichte '
    + 'um die Hälfte höher und vier Sätze je Übung – dein Reiz liegt weiter oben.', 1.5],
];

/** Zwei Beispiele, damit die Wahl nicht abstrakt bleibt. */
function levelBeispiel(faktor, key) {
  const zeig = ['floor-press', 'goblet-squat']
    .map((id) => EX_BY_ID.get(id))
    .filter((ex) => ex && ex.weight)
    .map((ex) => {
      const step = ex.step || 2.5;
      const kg = faktor === 1 ? ex.weight
        : Math.max(step, Math.round((ex.weight * faktor) / step) * step);
      return `${ex.db.name} ${fmtNum(kg)} kg`;
    });
  // Die Satzzahl gehört dazu: Sie ist seit Neuestem der größere Unterschied
  // zwischen den Stufen – die Gewichte stellt man sich ohnehin selbst ein.
  const saetze = SAETZE_JE_STUFE[key] || 3;
  return `${plural(saetze, 'Satz', 'Sätze')} je Übung · ${zeig.join(' · ')}`;
}

const levelFaktor = () => {
  const eintrag = LEVELS.find(([key]) => key === (store.getState().level || 'geuebt'));
  return eintrag ? eintrag[3] : 1;
};

/**
 * Sätze je Übung nach Erfahrung.
 *
 * Die Stufe skalierte lange nur die Startgewichte. Dabei ist das *Volumen* die
 * Größe, die sich zwischen Anfänger und Fortgeschrittenem am deutlichsten
 * unterscheidet: Wer neu anfängt, wächst schon bei drei bis fünf Sätzen je
 * Muskel und Woche fast maximal – die Dosis-Wirkungs-Kurve ist dort oben flach.
 * Mehr bringt kaum etwas und kostet das, woran es bei Anfängern wirklich hängt:
 * saubere Technik in den letzten Sätzen, erträglicher Muskelkater, und eine
 * Einheit, die man ein halbes Jahr lang durchhält.
 *
 * Skaliert wird **gleichmäßig über alle Übungen**. Das ist der Grund, warum es
 * die exakte Rechnung des Generators nicht kaputt macht: Bekommt jede Übung
 * zwei Drittel ihrer Sätze, bekommt auch jede Muskelgruppe exakt zwei Drittel
 * ihres Ziels. Die Verteilung bleibt dieselbe, nur die Höhe ändert sich – und
 * targetOf() rechnet mit demselben Faktor, damit "Soll gegen Ist" weiter stimmt.
 *
 * Eigene Workouts bleiben außen vor: Was jemand selbst zusammenstellt, hat er
 * so gemeint (siehe exOf()).
 */
const SAETZE_JE_STUFE = { anfaenger: 2, geuebt: 3, fortgeschritten: 4 };
const satzFaktor = () => (SAETZE_JE_STUFE[store.getState().level || 'geuebt'] || 3) / 3;
const satzZahl = (n) => Math.max(1, Math.round(n * satzFaktor()));

/** Startgewicht einer Übung, auf die Erfahrung umgerechnet. */
function startWeight(ex) {
  if (ex.weight === null) return null;
  const f = levelFaktor();
  // 0 kg heißt "ohne Zusatzlast" (Klimmzüge) – das bleibt 0, egal wer trainiert.
  if (!ex.weight || f === 1) return ex.weight;
  const step = ex.step || 2.5;
  return Math.max(step, Math.round((ex.weight * f) / step) * step);
}

/** Gewicht, mit dem diese Übung heute gearbeitet wird. */
function workingWeight(exId) {
  const ex = EX_BY_ID.get(exId);
  if (ex.weight === null) return null;
  const own = store.weightOf(exId);
  return own === null ? startWeight(ex) : own;
}

/**
 * Womit die schon abgehakten Sätze gemacht wurden, wenn es abweicht.
 *
 * Jeder Satz merkt sich sein eigenes Gewicht, sobald er abgehakt wird. Das ist
 * der Grund, warum sich mitten im Training umentscheiden lässt: Wer nach dem
 * ersten Satz merkt, dass 40 kg zu viel sind, stellt auf 35 und macht die
 * restlichen Sätze damit. Die schon abgehakten bleiben, wie sie waren – nichts
 * wird rückwirkend umgeschrieben.
 *
 * Früher stand deshalb das *zuerst* benutzte Gewicht groß in der Zeile und jede
 * Änderung galt "nächstes Mal". Das war beim Erhöhen richtig und beim Senken
 * falsch: Man senkt es ja gerade, weil der nächste Satz jetzt dran ist. Jetzt
 * steht dort das Gewicht für den nächsten Satz, und diese Zeile sagt, womit die
 * bisherigen gemacht wurden.
 */
function doneWeightNote(n, mode, exId) {
  const arr = store.peekSets(n, mode, exId) || [];
  const jetzt = workingWeight(exId);
  const andere = [];
  arr.forEach((x, i) => {
    if (!x.done || x.w === '') return;
    const kg = parseFloat(String(x.w).replace(',', '.'));
    if (Number.isNaN(kg) || Math.abs(kg - jetzt) < 0.01) return;
    andere.push({ i: i + 1, kg });
  });
  if (!andere.length) return '';
  const gruppen = new Map();
  andere.forEach(({ i, kg }) => gruppen.set(kg, (gruppen.get(kg) || []).concat(i)));
  return [...gruppen.entries()]
    .map(([kg, saetze]) => `Satz ${saetze.join(', ')} mit ${fmtNum(kg)} kg`)
    .join(' · ');
}

/* ------------------------------------------------------------------ *
 * Rüstzeit: Reihenfolge nach Gerät und Gewicht
 *
 * Zwischen zwei Übungen steht oft nicht die Pause, sondern der Umbau: Scheiben
 * abziehen, andere aufstecken, Verschlüsse zu. Das ist die Zeit, die eine
 * Einheit in der Wohnung wirklich lang macht, und sie steht in keinem Plan.
 *
 * Die Reihenfolge innerhalb einer Einheit ist dafür der ganze Hebel. Welche
 * Übungen an einem Tag stehen, entscheidet tools/build-plan.py nach dem
 * Wochenvolumen – daran wird hier nichts geändert. Aber ob die beiden
 * Langhantel-Übungen hintereinander kommen oder eine Kurzhantelübung dazwischen
 * liegt, kostet einen kompletten Auf- und Abbau.
 *
 * Sortiert wird deshalb nach Gerät und innerhalb des Geräts absteigend nach
 * Gewicht: Jedes Gerät wird einmal aufgebaut, und die Last geht in kleinen
 * Schritten nach unten statt hin und her. Am Plan gemessen sind das rund 30 %
 * weniger Kilo, die in einer Einheit bewegt werden – und schwer zuerst ist
 * ohnehin die richtige Reihenfolge fürs Training.
 *
 * Warum in der App und nicht im Generator: Hier stehen die *aktuellen*
 * Arbeitsgewichte. Der Generator kennt nur die Startwerte, und die stimmen nach
 * dem dritten Steigerungsvorschlag nicht mehr.
 *
 * Die Plätze der Übungen ohne Aufbau (Klimmzüge, Band, Bodyweight) bleiben, wo
 * sie sind: Sie kosten keinen Umbau, also darf zwischen zwei Langhantelübungen
 * ruhig ein Satz Pull-Apart liegen – die Stange bleibt ja geladen.
 * ------------------------------------------------------------------ */

const RUEST_FAM = {
  barbell: 'lh', hipbar: 'lh',          // dieselbe Stange, nur einmal mit Polster
  dumbbells: 'kh2',                     // beide Kurzhanteln auf dasselbe Gewicht
  goblet: 'kh1', onehand: 'kh1', plate: 'kh1',
  backpack: 'ruck',
};
const FAM_LABEL = { lh: 'Stange', kh2: 'Kurzhanteln', kh1: 'Kurzhantel', ruck: 'Rucksack' };

/** Was für eine Übung aufzubauen ist – oder null, wenn nichts zu schleppen ist. */
function setupOf(exId, kg) {
  const ex = EX_BY_ID.get(exId);
  const fam = ex && RUEST_FAM[ex.equip];
  if (!fam || !kg) return null;   // Klimmzüge stehen mit 0 kg im Rucksack: nichts zu tun
  return { fam, kg, label: FAM_LABEL[fam], note: ex.weightNote };
}

/**
 * Übungen einer Einheit nach Rüstaufwand ordnen.
 *
 * Die Reihenfolge der Geräte bleibt die des Plans – das erste Vorkommen eines
 * Geräts bestimmt seinen Platz. Damit steht vorn weiter, was der Generator nach
 * vorn gestellt hat (schwere Grundübung zuerst), und nur das Verstreute rückt
 * zusammen.
 */
const ruestCache = new Map();   // "Nummer|Modus|Übungen" -> Reihenfolge der IDs

/**
 * Wie ruestOrder(), aber die einmal gefundene Reihenfolge bleibt stehen.
 *
 * Ohne das springen die Karten unter dem Finger: Wer das Gewicht einer Übung
 * ändert, ändert damit ihren Platz in der Sortierung – und schon steht die
 * Übung, die man gerade bearbeitet, zwei Zeilen weiter oben. Die Reihenfolge
 * ist ein Plan für diese Einheit, keine ständig nachgeführte Sortierung; sie
 * wird beim ersten Ansehen festgelegt und beim nächsten Laden neu berechnet.
 *
 * Der Schlüssel enthält die Übungen selbst: Hakt jemand eine Verletzung an,
 * fällt eine Übung weg – dann ist es eine andere Einheit und wird neu sortiert.
 */
function ruestOrderStabil(items, n, mode) {
  const key = `${n}|${mode}|${items.map((i) => i.id).join(',')}`;
  const gemerkt = ruestCache.get(key);
  if (gemerkt) {
    const byId = new Map(items.map((i) => [i.id, i]));
    return gemerkt.map((id) => byId.get(id));
  }
  const out = ruestOrder(items);
  ruestCache.set(key, out.map((i) => i.id));
  return out;
}

/**
 * Zieht diese Reihenfolge eine kleine Übung vor eine schwere am selben Muskel?
 *
 * Gibt beide Plätze zurück, sonst null. Zwei Übungen sind "am selben Muskel",
 * wenn beide ihn direkt treffen (Anteil ab 0,5) – der Trizepsstrecker vor den
 * Liegestützen ist der Fall, der Beinbeuger vor dem Drücken nicht.
 */
function vorgezogen(liste) {
  const direkt = (it) => {
    const ex = EX_BY_ID.get(it.id);
    const sh = (ex && ex.db && ex.db.shares) || {};
    return new Set(Object.keys(sh).filter((m) => sh[m] >= 0.5));
  };
  const stufe = (it) => (EX_BY_ID.get(it.id) || {}).tier || 1;
  for (let a = 0; a < liste.length; a++) {
    for (let b = a + 1; b < liste.length; b++) {
      if (stufe(liste[a]) <= stufe(liste[b])) continue;
      const ma = direkt(liste[a]);
      if ([...direkt(liste[b])].some((m) => ma.has(m))) return [a, b];
    }
  }
  return null;
}

function ruestOrder(items) {
  const geladen = [];
  items.forEach((it, i) => {
    const s = setupOf(it.id, workingWeight(it.id));
    if (s) geladen.push({ it, s, i });
  });
  if (geladen.length < 3) return items;   // darunter gibt es nichts zu gewinnen

  // `fest` sind Übungen, die auf ihrem Platz bleiben müssen. Anfangs keine;
  // wer eine Grundübung überholt hat, kommt dazu und wird neu sortiert.
  const fest = new Set();
  const bauen = () => {
    const platz = new Map();
    const key = (g) => (fest.has(g.i) ? `#${g.i}` : g.s.fam);
    geladen.forEach((g) => { if (!platz.has(key(g))) platz.set(key(g), g.i); });
    const sortiert = geladen.slice().sort((a, b) => (
      platz.get(key(a)) - platz.get(key(b)) || b.s.kg - a.s.kg || a.i - b.i));
    const out = items.slice();
    geladen.forEach((g, k) => { out[g.i] = sortiert[k].it; });
    return out;
  };

  // Höchstens so viele Durchgänge, wie es Übungen gibt: Jeder setzt eine fest,
  // und mit allen festgesetzten steht wieder die Reihenfolge des Plans da.
  let out = bauen();
  for (let runde = 0; runde < geladen.length; runde++) {
    const paar = vorgezogen(out);
    if (!paar) break;
    // Festsetzen lässt sich nur, was überhaupt verschoben wurde. Drei Fälle,
    // in dieser Reihenfolge:
    //   1. die kleine Übung ist nach vorn gerutscht – sie bleibt stehen;
    //   2. sie stand schon immer da (Beinbeuger ohne Gewicht), und die schwere
    //      wurde nach hinten geschoben: dann bleibt das stehen, was ihren
    //      Platz eingenommen hat;
    //   3. sonst die schwere Übung selbst.
    const schwer = geladen.find((x) => x.it === out[paar[1]]);
    const kandidaten = [out[paar[0]], schwer ? out[schwer.i] : null, out[paar[1]]];
    const g = kandidaten.reduce((gefunden, it) => gefunden
      || (it ? geladen.find((x) => x.it === it && !fest.has(x.i)) : null), null);
    if (!g) break;
    fest.add(g.i);
    out = bauen();
  }
  return out;
}

/** Zeile über der Gewichtsangabe: was vor dieser Übung umzubauen ist. */
function ruestHint(n, mode, list, i) {
  if (mode !== 'db') return '';
  const cur = setupOf(list[i].id, workingWeight(list[i].id));
  if (!cur) return '';
  let prev = null;
  for (let k = i - 1; k >= 0 && !prev; k--) prev = setupOf(list[k].id, workingWeight(list[k].id));
  const kg = `${fmtNum(cur.kg)} kg${cur.note ? ` ${cur.note}` : ''}`;
  if (prev && prev.fam === cur.fam && Math.abs(prev.kg - cur.kg) < 0.01) {
    return `<div class="ruest gleich">✓ ${esc(cur.label)} bleibt bei ${esc(kg)} – nichts umbauen</div>`;
  }
  if (prev && prev.fam === cur.fam) {
    return `<div class="ruest">Umbauen: ${esc(cur.label)} von ${esc(fmtNum(prev.kg))} auf ${esc(kg)}</div>`;
  }
  return `<div class="ruest">Aufbauen: ${esc(cur.label)} auf ${esc(kg)}</div>`;
}

/**
 * Wie viel eine Steigerung ausmacht, steht je Übung in exercise-meta.json.
 *
 * Fest 2,5 kg war für den Goblet Squat richtig (20 → 22,5, also ein Achtel
 * mehr) und für das Seitheben Unsinn: 6 → 8,5 kg je Hand sind über vierzig
 * Prozent auf einmal. Die Schrittweite der Knöpfe hängt deshalb an der Übung.
 */
const stepOf = (exId) => {
  const ex = EX_BY_ID.get(exId);
  return (ex && ex.step) || 2.5;
};
/**
 * Sicherung als Datei. Alles liegt nur im Speicher dieses Browsers – Android
 * räumt den bei Platzmangel weg, und "Websitedaten löschen" reicht ebenfalls.
 * Deshalb wird der Stand mitgeschrieben, um später erinnern zu können.
 */
function downloadBackup() {
  const json = store.exportJSON();
  // Manche Umgebungen – eingebettete Ansichten, strenge Browser – lassen den
  // Download stillschweigend fallen. Deshalb steht der Export danach immer
  // auch im Textfeld zum Kopieren.
  const io = document.getElementById('io');
  if (io) io.value = json;
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workout-backup-${todayISO()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  store.markBackup(doneCount());
  toast('Gesichert – falls kein Download kam: Text in „Mehr“ kopieren');
}

/**
 * Trainingstermine als Kalenderdatei.
 *
 * Geschrieben werden die *tatsächlichen* Termine – verschobene inbegriffen –
 * mit fester Kennung je Workout. Wird die Datei nach einer Verschiebung erneut
 * eingelesen, wandern dieselben Termine mit, statt sich zu verdoppeln.
 */
function downloadICS() {
  const vorher = store.getState().lastIcs;
  const stand = store.markIcs(PLAN.length);
  // Was beim letzten Mal exportiert wurde und diesmal nicht mehr vorkommt, muss
  // aus dem Kalender wieder heraus: ein anderer Trainingsfokus hat womöglich
  // weniger Einheiten, und ein Tag, an dem Verletzungen alles sperren, hat gar
  // keinen Termin mehr.
  const jetzt = new Set(PLAN.filter((w) => exOf(workoutByNo(w.n)).length).map((w) => w.n));
  const cancel = [];
  for (let n = 1; n <= Math.max((vorher && vorher.count) || 0, PLAN.length); n++) {
    if (!jetzt.has(n)) cancel.push(n);
  }
  const text = buildICS(
    PLAN.map((w) => ({ n: w.n, date: effDate(w) })),
    (w) => exOf(workoutByNo(w.n)).map((it) => resolve(it, store.workoutMode(w.n))),
    { hour: 18, seq: stand.seq, cancel },
  );
  const blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workout-termine-${todayISO()}.ics`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Kalenderdatei erstellt – in Google Kalender importieren');
}

/** Stimmen die Termine im Kalender noch, oder hat sich der Plan seither verschoben? */
function icsStale() {
  const s = store.getState();
  return !!s.lastIcs && s.lastIcs.shift !== s.shift;
}

/** Zahl der abgeschlossenen Einheiten in dieser Runde. */
function doneCount() {
  return PLAN.filter((w) => completedMode(w.n)).length;
}

/** Wie viele Einheiten seit der letzten Sicherung dazugekommen sind. */
const BACKUP_EVERY = 8;

function backupDue() {
  const done = doneCount();
  const last = store.getState().lastBackup;
  if (!last) return done >= 3 ? done : 0;
  return done - last.done >= BACKUP_EVERY ? done - last.done : 0;
}

/**
 * Abschluss eines laufenden Trainings: zwei Wege, klar getrennt.
 *
 * "Abschließen" behält, was abgehakt ist – auch wenn nicht alles steht.
 * "Abbrechen" verwirft die Einheit ganz, damit sie als nicht trainiert gilt
 * und der Plan sie behandelt wie einen verpassten Tag. Ohne diese Trennung
 * blieb nach jedem Abbruch ein halb abgehaktes Workout stehen.
 */
function sessionButtons(n, mode) {
  const prog = progressOf(n, mode);
  return `
    <div class="btn-row nav">
      <button type="button" class="btn btn-danger" data-act="discard-session">Abbrechen</button>
      <button type="button" class="btn btn-ok" data-act="finish-session">
        ✓ Abschließen${prog.done ? ` (${prog.done}/${prog.total})` : ''}
      </button>
    </div>`;
}

/** Zahl in deutscher Schreibweise, ohne unnötige Null hinter dem Komma.
 *
 * Zwei Nachkommastellen, nicht eine: seit die Gewichtsschritte je Übung gehen,
 * gibt es 1,25-kg-Sprünge, und 21,25 kg als "21,3" anzuzeigen wäre schlicht
 * falsch – die Zahl steht am Knopf, nach dem man greift.
 */
function fmtNum(n) {
  return Number.isInteger(n) ? String(n) : String(+n.toFixed(2)).replace('.', ',');
}

/** Pausenlänge für eine Übung – empfohlen oder fest, je nach Einstellung. */
function restFor(item) {
  const s = store.getState();
  if (!s.useExerciseRest) return s.restSeconds;
  return item.rest;
}

function progressOf(n, mode) {
  const w = workoutByNo(n);
  let done = 0;
  let total = 0;
  w.ex.forEach((item) => {
    const arr = store.peekSets(n, mode, item.id) || [];
    total += item.sets;
    done += arr.slice(0, item.sets).filter((s) => s.done).length;
  });
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0, complete: total > 0 && done === total };
}

/** Ist das Workout in irgendeinem Modus abgeschlossen? Gibt den Modus zurück. */
function completedMode(n) {
  const st = store.getState().log[n];
  if (!st) return null;
  for (const m of ['db', 'bw']) {
    if (progressOf(n, m).complete) return m;
  }
  // Von Hand abgeschlossen: "Abschließen" heißt, dass die Einheit fertig ist –
  // auch wenn der letzte Satz Wadenheben fehlt. Ohne das stand im Kalender ein
  // ausgefallener Tag, obwohl 16 von 18 Sätzen standen.
  return st.done && hasAnyEntry(n, st.done) ? st.done : null;
}

function hasAnyEntry(n, mode) {
  const w = workoutByNo(n);
  return w.ex.some((item) => (store.peekSets(n, mode, item.id) || [])
    .some((s) => s.done || s.w !== ''));
}

/* ------------------------------------------------------------------ *
 * Pausentimer
 * ------------------------------------------------------------------ */

const restBar = document.getElementById('restBar');
const restTime = document.getElementById('restTime');
const restNext = document.getElementById('restNext');
const restFill = document.getElementById('restFill');
const restLive = document.getElementById('restLive');
const restLabel = document.getElementById('restLabel');

/** Ansage für Screenreader – nur zum Anfang und Ende, nicht im Sekundentakt. */
function announce(text) {
  if (restLive) restLive.textContent = text;
}

let restTicker = null;
let wakeLock = null;
let restArmed = false;   // liegt das Pausensignal schon auf der Audio-Uhr?

/**
 * Vorwarnung vor dem Ende der Pause.
 *
 * Zwischen dem Signal und dem ersten Wiederholung liegen sonst noch der Weg zur
 * Hantel und das Zurechtlegen – die Pause ist damit in Wahrheit länger als
 * geplant. Fünf Sekunden vorher kommt deshalb ein leiserer, tieferer Ton, und
 * die Leiste schaltet auf "Fertig machen" um. Beim Signal selbst steht man dann
 * schon an der Stange.
 */
const VORLAUF = 5;

/**
 * Ton zu einem Ereignis – Training starten, Satz abhaken, Übung fertig,
 * Workout komplett. Die Töne selbst stehen in js/audio.js.
 *
 * Der Tupfer beim Abhaken hat einen eigenen Schalter: Er kommt in einem
 * Training zwanzigmal, und ob man das mag, ist Geschmackssache – die
 * Ereignisse drumherum kommen ein- bis zweimal und stören niemanden.
 */
function sound(name) {
  const s = store.getState();
  if (!s.sound) return;
  if (name === 'set' && !s.soundSets) return;
  playSound(name);
}

/* Hinweis zum Pausenende, wenn die App gerade nicht im Vordergrund ist.
 *
 * Der Ton allein reicht dafür nicht immer: Schaltet man während der Pause zu
 * einer anderen App, darf der Browser die Seite einfrieren. Der vorausgelegte
 * Ton übersteht das meistens (siehe js/audio.js), eine Systemmeldung kommt
 * zusätzlich auch dann noch an, wenn er es nicht tut – und sie ist sichtbar,
 * nicht nur hörbar. Sie braucht eine Erlaubnis, deshalb ein eigener Schalter
 * unter Mehr statt einer Nachfrage beim ersten Start.
 *
 * Was auch das nicht kann: die App komplett schließen und trotzdem klingeln.
 * Dafür bräuchte es einen Server, der eine Push-Nachricht schickt – die App
 * hat keinen und soll keinen haben. */
const NOTE_TAG = 'workout-pause';
let noteTimer = null;

/** Registrierung des Service Workers, immer als Promise – auch ohne ihn. */
function swReg() {
  try {
    return navigator.serviceWorker?.getRegistration() || Promise.resolve(null);
  } catch {
    return Promise.resolve(null);
  }
}

/** Vom Browser blockiert – dann hilft kein Schalter in der App mehr. */
function notifyDenied() {
  return 'Notification' in window && Notification.permission === 'denied';
}

function noteAllowed() {
  return store.getState().notify && 'Notification' in window
    && Notification.permission === 'granted';
}

function planNote(secs, text) {
  dropNote();
  if (!noteAllowed()) return;
  noteTimer = setTimeout(() => {
    noteTimer = null;
    // Nur, wenn die App gerade nicht zu sehen ist: Wer davorsitzt, hört den Ton
    // und sieht die Leiste – eine Systemmeldung wäre da nur Lärm.
    if (!document.hidden) return;
    const opt = {
      body: text,
      tag: NOTE_TAG,          // ersetzt eine ältere, statt sie zu stapeln
      icon: './icon-192.png',
      badge: './icon-192.png',
      vibrate: [180, 90, 180],
    };
    swReg().then((reg) => {
      if (reg) reg.showNotification('Pause vorbei', opt);
      else new Notification('Pause vorbei', opt);
    }).catch(() => {});
  }, Math.max(0, secs) * 1000);
}

/** Wecker abbestellen und eine schon sichtbare Meldung schließen. */
function dropNote() {
  clearTimeout(noteTimer);
  noteTimer = null;
  swReg()
    .then((reg) => (reg ? reg.getNotifications({ tag: NOTE_TAG }) : []))
    .then((list) => list.forEach((nt) => nt.close()))
    .catch(() => {});
}

/**
 * Ton und Hinweis auf das Ende der laufenden Pause legen.
 *
 * Bei jeder Änderung neu: Start, „+30 s", und auch beim Umlegen der Schalter,
 * damit eine schon laufende Pause der neuen Einstellung folgt.
 */
function armRest() {
  const rest = store.getState().rest;
  if (!rest) {
    cancelSound();
    dropNote();
    restArmed = false;
    return;
  }
  const left = (rest.endsAt - Date.now()) / 1000;
  if (store.getState().sound) {
    restArmed = scheduleSound([['ready', left - VORLAUF], ['rest', left]]);
  } else {
    cancelSound();
    restArmed = false;
  }
  planNote(left, rest.next);
}

/**
 * Displaysperre während der Pause. Ohne sie schläft das Handy ein, der Browser
 * friert die Seite ein – und der Ton käme zu spät oder gar nicht.
 */
async function holdScreen(on) {
  try {
    if (on) {
      if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    } else if (wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch {
    wakeLock = null; // nicht unterstützt oder abgelehnt – kein Beinbruch
  }
}

function startRest(exName, setIndex, sets, secs) {
  if (!secs) return;
  store.setRest({
    endsAt: Date.now() + secs * 1000,
    total: secs,
    next: `Satz ${setIndex + 2} von ${sets} · ${exName}`,
  });
  announce(`Pause ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} Minuten, `
    + `danach Satz ${setIndex + 2} von ${sets}, ${exName}`);
  holdScreen(true);
  armRest();
  tickRest();
}

function endRest(withSignal) {
  if (!restBar) return;
  if (restTicker) { clearInterval(restTicker); restTicker = null; }
  holdScreen(false);
  store.setRest(null);
  restBar.hidden = true;
  restBar.classList.remove('ready');
  document.body.classList.remove('resting');
  // Das Signal liegt längst auf der Audio-Uhr und hat gerade selbst gespielt –
  // hier noch einmal anzustoßen, gäbe ein Echo. Nur wenn das Voraussetzen nicht
  // geklappt hat (kein Ton freigeschaltet, Browser ohne Web Audio), kommt der
  // Ton jetzt. cancelSound() lässt ein bereits laufendes Signal ausklingen.
  if (withSignal && !restArmed) sound('rest');
  cancelSound();
  // Bei einer abgebrochenen Pause den Hinweis abbestellen – bei einer
  // abgelaufenen gerade nicht: Diese Zeile läuft bis zu eine halbe Sekunde vor
  // dem Ende (der Timer prüft im Vierteltakt und rundet), der Wecker soll aber
  // noch losgehen, falls die App im Hintergrund ist.
  if (!withSignal) dropNote();
  restArmed = false;
  if (withSignal) {
    if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
    announce('Pause vorbei, nächster Satz');
  } else {
    announce('');
  }
}

function tickRest() {
  // Sollten Seite und Skript aus unterschiedlich alten Zwischenspeichern
  // stammen, fehlt die Leiste - dann lieber ohne Timer weiterlaufen als alles
  // mit einem Fehler anhalten.
  if (!restBar) return;
  const rest = store.getState().rest;
  if (!rest) { restBar.hidden = true; document.body.classList.remove('resting'); return; }

  const left = Math.round((rest.endsAt - Date.now()) / 1000);
  if (left <= 0) {
    endRest(true);
    toast('Pause vorbei – nächster Satz');
    return;
  }

  restBar.hidden = false;
  document.body.classList.add('resting');
  // Die letzten Sekunden gehören dem Weg zur Hantel, nicht mehr der Pause.
  const gleich = left <= VORLAUF;
  restBar.classList.toggle('ready', gleich);
  if (restLabel) restLabel.textContent = gleich ? 'Fertig machen' : 'Pause';
  restTime.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  restNext.textContent = rest.next;
  restFill.style.width = `${Math.max(0, (left / rest.total) * 100)}%`;

  if (!restTicker) restTicker = setInterval(tickRest, 250);
}

/** Laufzeit des Trainings im Kopfbereich mitzählen, ohne neu zu rendern. */
setInterval(() => {
  const badge = document.getElementById('sessionBadge');
  if (!badge || !store.getState().session) return;
  const secs = store.sessionSeconds();
  badge.textContent = `⏱ ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
}, 1000);

document.getElementById('restSkip')?.addEventListener('click', () => endRest(false));
document.getElementById('restPlus')?.addEventListener('click', () => {
  const rest = store.getState().rest;
  if (!rest) return;
  store.setRest({ ...rest, endsAt: rest.endsAt + 30000, total: rest.total + 30 });
  armRest(); // Signal 30 s weiter hinten neu auflegen
  tickRest();
});

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/** Index der ersten Übung, in der noch ein Satz offen ist. */
function firstOpenExercise(n, mode) {
  const w = workoutByNo(n);
  const idx = w.ex.findIndex((item) => {
    const arr = store.peekSets(n, mode, item.id) || [];
    return arr.slice(0, item.sets).filter((s) => s.done).length < item.sets;
  });
  return idx === -1 ? w.ex.length - 1 : idx;
}

/** Zur nächsten offenen Übung rücken und sagen, welche das ist. */
function weiterZurNaechsten(n, mode) {
  const nextIdx = firstOpenExercise(n, mode);
  if (nextIdx === ui.focusIdx) return;
  ui.focusIdx = nextIdx;
  toast(`Weiter: ${resolve(workoutByNo(n).ex[nextIdx], mode).name}`);
}

/**
 * Fortschrittsleiste über der Fokus-Ansicht.
 *
 * Ein Feld je Satz, in Gruppen zu je einer Übung. Damit steht die ganze Einheit
 * auf einen Blick da: was schon steht, wo man gerade ist, was noch kommt – und
 * ein Tipp auf eine Gruppe springt dorthin. Die Breite folgt der Satzzahl,
 * sonst sähe eine Übung mit drei Sätzen so groß aus wie eine mit einem.
 *
 * Über den Sätzen stand zuerst noch ein Balken je Übung. Der sagte nichts, was
 * die Felder darunter nicht schon sagen – drei grüne Felder sind eine fertige
 * Übung. Die laufende Übung erkennt man jetzt an den umrandeten Feldern.
 */
function progressStrip(n, mode, w, cur) {
  return `
    <div class="prog">
      ${w.ex.map((item, k) => {
        const v = resolve(item, mode);
        const arr = store.peekSets(n, mode, v.id) || [];
        const done = arr.slice(0, v.sets).filter((x) => x.done).length;
        return `
        <button type="button" class="prog-ex ${k === cur ? 'cur' : ''} ${done === v.sets ? 'done' : ''}"
                style="flex-grow:${v.sets}" data-act="focus-goto" data-i="${k}"
                aria-label="Übung ${k + 1}, ${esc(v.name)}, ${done} von ${v.sets} Sätzen"
                aria-current="${k === cur}">
          <span class="prog-sets">
            ${Array.from({ length: v.sets }, (_, x) => `<i class="${x < done ? 'on' : ''}"></i>`).join('')}
          </span>
        </button>`;
      }).join('')}
    </div>`;
}

/**

  if (!w.ex.length) {

/* ------------------------------------------------------------------ *
 * Rückkanal
 *
 * Ohne Eintrag in js/config.js gibt es ihn nicht: keine Frage, kein Schalter,
 * keine Verbindung. Mit Eintrag meldet jedes Gerät einmal am Tag denselben
 * Stand, der auch im Vergleich steht, plus Sätze je Übung – damit der Betreiber
 * sieht, wie die App bei den Leuten läuft, denen er den Link geschickt hat.
 *
 * Was hier *nicht* passiert: heimlich sammeln. Der Einstieg sagt in einem Satz,
 * was rausgeht und an wen, mit dem Schalter daneben; unter Mehr steht dasselbe
 * noch einmal, mitsamt dem Zeitpunkt der letzten Meldung und einem Knopf, der
 * die eigene Zeile wieder löscht.
 * ------------------------------------------------------------------ */

/**
 * Was die Antwort des Servers bedeutet, in einem Satz.
 *
 * Der Wortlaut von PostgREST ist genau, aber nur für den lesbar, der ihn schon
 * kennt. Wer die App gerade einrichtet, soll den nächsten Schritt lesen können,
 * ohne die README zu suchen.
 */
function serverHinweis(msg) {
  const m = String(msg || '');
  if (/row-level security|violates row/i.test(m)) {
    return 'Die Tabelle nimmt die Zeile nicht an – die Regeln greifen nicht für die '
      + 'anonyme Rolle. Einmal den SQL-Block aus der README ausführen: Danach läuft '
      + 'das Schreiben über eine Funktion und hängt an keiner Regel mehr.';
  }
  if (/permission denied for function/i.test(m)) {
    return 'Der Funktion melde fehlt das Ausführungsrecht: grant execute … to anon.';
  }
  // Reihenfolge zählt: PostgREST schreibt in alle drei Fällen "schema cache",
  // der Code dahinter trennt sie. Erst der genaue, dann der allgemeine Fall.
  if (/PGRST204/i.test(m)) {
    return 'Der Tabelle fehlt eine Spalte – den Block aus der README noch einmal ausführen.';
  }
  if (/PGRST205/i.test(m)) {
    return 'Die Tabelle nutzung gibt es dort nicht.';
  }
  if (/PGRST202|function.*(does not exist|not found)|Could not find the function/i.test(m)) {
    return 'Die Funktion melde gibt es dort nicht – der SQL-Block aus der README ist '
      + 'nicht (vollständig) gelaufen. Direkt danach kann es auch heißen: ein paar '
      + 'Sekunden warten, der Server kennt sie noch nicht.';
  }
  if (/invalid api key|JWS|JWT|apikey/i.test(m)) {
    return 'Der Schlüssel in js/config.js gehört nicht zu diesem Projekt.';
  }
  if (/^\s*404|Not Found/i.test(m)) {
    return 'Unter dieser Adresse antwortet weder die Funktion noch die Tabelle – '
      + 'die Projekt-Adresse in js/config.js prüfen.';
  }
  if (/column|Spalte/i.test(m)) {
    return 'Der Tabelle fehlt eine Spalte – den Block aus der README noch einmal ausführen.';
  }
  if (/Keine Verbindung/i.test(m)) {
    return 'Kein Netz – oder die Projekt-Adresse in js/config.js stimmt nicht.';
  }
  return '';
}

/**
 * Der eine Satz, der aus Sammeln eine Absprache macht.
 *
 * Er steht im Einstieg und unter Mehr, wortgleich, mit dem Schalter daneben.
 * Ohne Server in js/config.js gibt es ihn nicht – dann gibt es auch nichts zu

 */
