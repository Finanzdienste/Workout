8%22%20rx%3D%2222%22%2F%3E%0A%20%20%20%20%3Crect%20x%3D%2268%22%20%20y%3D%22208%22%20width%3D%2234%22%20height%3D%2296%22%20%20rx%3D%2215%22%2F%3E%0A%20%20%20%20%3Crect%20x%3D%22410%22%20y%3D%22208%22%20width%3D%2234%22%20height%3D%2296%22%20%20rx%3D%2215%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A">
<style>
:root {
  --bg: #0f1115;
  --bg-elev: #171a21;
  --bg-elev-2: #1f232c;
  --line: #2a2f3a;
  --text: #e8eaed;
  --muted: #9aa3b2;
  --accent: #ff7a45;
  --accent-2: #4ea1ff;
  --ok: #3ecf8e;
  --radius: 14px;
  --tabbar-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

body.mode-bw {
  --accent: #4ea1ff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

button { font: inherit; color: inherit; }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(15, 17, 21, .92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-in {
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .3px;
}
.brand::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
  transition: background .2s;
}

.mode-switch {
  margin-left: auto;
  display: flex;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: background .18s, color .18s;
}
.mode-btn[aria-pressed="true"] {
  background: var(--accent);
  color: #10131a;
}

/* ---------- View / layout ---------- */
.view {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 14px calc(var(--tabbar-h) + var(--safe-b) + 28px);
}

.section-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
  margin: 26px 0 10px;
  font-weight: 700;
}
.section-title:first-child { margin-top: 4px; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- Dashboard hero ---------- */
.hero-eyebrow {
  font-size: 12px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
.hero-title {
  margin: 4px 0 2px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.4px;
}
.hero-sub {
  color: var(--muted);
  font-size: 14px;
}
.hero-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.badge {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.badge.accent {
  border-color: var(--accent);
  color: var(--accent);
}
.badge.done {
  border-color: var(--ok);
  color: var(--ok);
}

.progress {
  height: 8px;
  background: var(--bg-elev-2);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 14px;
}
.progress > i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width .3s ease;
}

/* ---------- Exercise cards ---------- */
.ex {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.ex.complete { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }

.ex-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  cursor: pointer;
  user-select: none;
}
.ex-idx {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--bg-elev-2);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.ex.complete .ex-idx { background: var(--ok); color: #0d1b14; }
.ex-main { min-width: 0; }
.ex-name {
  display: block;
  font-weight: 650;
  font-size: 15.5px;
  line-height: 1.3;
}
.ex-meta {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 3px;
}
.ex-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.chev {
  color: var(--muted);
  font-size: 12px;
  transition: transform .2s;
}
.ex.open .chev { transform: rotate(180deg); }

/* Gewichtszeile: ein Arbeitsgewicht je Übung. */
.ex-weight {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px 10px;
}
.kg-step {
  flex: none;
  width: 46px; height: 46px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--text);
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.kg-plus {
  background: color-mix(in srgb, var(--accent) 22%, var(--bg-elev-2));
  border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
  color: var(--accent);
}
.kg-step:active { transform: scale(.95); }
.kg-main {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
}
.kg-val {
  width: 3.6em;
  background: transparent;
  border: 0;
  border-bottom: 1px dashed var(--line);
  color: var(--text);
  font-size: 24px;
  font-weight: 800;
  text-align: right;
  padding: 2px 2px 3px;
  font-variant-numeric: tabular-nums;
}
.kg-val:focus { outline: none; border-bottom-color: var(--accent); }
.kg-unit { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.kg-next {
  margin: -4px 14px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}

.ex-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  font-size: 12px;
  color: var(--muted);
}
.ex-facts span {
  background: var(--bg-elev-2);
  border-radius: 999px;
  padding: 4px 10px;
}

/* Satz-Knöpfe: immer sichtbar, daumengroß. */
.ex-sets {
  display: flex;
  gap: 8px;
  padding: 0 14px 14px;
}
.set-btn {
  flex: 1 1 0;
  min-width: 0;
  height: 48px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--muted);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s, color .12s, border-color .12s;
}
.set-btn.on {
  background: var(--ok);
  border-color: var(--ok);
  color: #0d1b14;
}
.set-btn:active { transform: scale(.97); }

.ex-body {
  display: none;
  border-top: 1px solid var(--line);
  padding: 12px 14px 14px;
}
.ex.open .ex-body { display: block; }

.cue {
  font-size: 13.5px;
  color: var(--muted);
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 12px;
}

.set-row {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.set-row .set-no {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}
.set-row input {
  width: 100%;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 10px;
  font-size: 14px;
  min-width: 0;
}
.set-row input:focus {
  outline: none;
  border-color: var(--accent);
}
.set-row input::placeholder { color: #5d6675; }

.chk {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--muted);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 15px;
  padding: 0;
}
.chk[aria-pressed="true"] {
  background: var(--ok);
  border-color: var(--ok);
  color: #0d1b14;
}

.set-legend {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 700;
}

.last-time {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  border-radius: 11px;
  padding: 12px 16px;
  font-size: 14.5px;
  font-weight: 650;
  cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #10131a;
}
.btn-ghost { background: transparent; }
.btn-danger { color: #ff6b6b; border-color: #4a2a2f; }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn-row .btn { flex: 1 1 140px; }
.btn-row.nav { flex-wrap: nowrap; }
.btn-row.nav .btn { flex: 1 1 0; min-width: 0; padding: 11px 4px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }

/* ---------- Plan list ---------- */
.plan-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.plan-item.is-today { border-color: var(--accent); }
.plan-item.is-done .plan-n { background: var(--ok); color: #0d1b14; }
.plan-n {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--bg-elev-2);
  display: grid; place-items: center;
  font-weight: 700; font-size: 13px;
  color: var(--muted);
}
.plan-main { min-width: 0; }
.plan-date { display: block; font-size: 14.5px; font-weight: 600; }
.plan-sub {
  display: block;
  font-size: 12.5px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.plan-flag { margin-left: auto; font-size: 11px; color: var(--muted); flex: none; }

.filter-row {
  display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
}
.filter-btn {
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.filter-btn[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
}

/* ---------- Exercise library ---------- */
.lib-item { padding: 14px; }
.lib-group {
  font-size: 11px; letter-spacing: .7px; text-transform: uppercase;
  color: var(--muted); font-weight: 700;
}
.swap {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
  margin-top: 10px;
}
.swap-side {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
}
.swap-side.active { border-color: var(--accent); }
.swap-label {
  font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted); font-weight: 700; margin-bottom: 4px;
}
.swap-name { font-size: 14px; font-weight: 650; line-height: 1.3; }
.swap-reps { font-size: 12px; color: var(--muted); margin-top: 3px; }
.swap-arrow {
  display: grid; place-items: center;
  color: var(--muted); font-size: 15px;
}
.cue-pair { margin-top: 10px; font-size: 13px; color: var(--muted); }
.cue-pair b { color: var(--text); font-weight: 600; }

/* ---------- Stats ---------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.stat {
  background: var(--bg-elev);

/* ===== js/dates.js ===== */
const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
  'August', 'September', 'Oktober', 'November', 'Dezember'];

const pad = (n) => String(n).padStart(2, '0');

function toISO(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function todayISO() {
  return toISO(new Date());
}

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function addDays(iso, days) {
  if (!days) return iso;
  const d = parseISO(iso);
  d.setDate(d.getDate() + days);
  return toISO(d);
}

/** Ganze Tage von isoA bis isoB; positiv, wenn isoB später liegt. */
function daysBetween(isoA, isoB) {
  return Math.round((parseISO(isoB) - parseISO(isoA)) / 86400000);
}

function fmtDate(iso, long) {
  const d = parseISO(iso);
  const wd = WEEKDAYS[d.getDay()];
  if (long) return `${wd}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return `${wd}, ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
}

function plural(n, one, many) {
  return `${n} ${n === 1 ? one : many}`;
}

/*
 * Bewegungsabläufe als drehbare 3D-Figur.
 *
 * Statt fester Punkte hält eine Stellung nur Gelenkwinkel; daraus rechnet
 * solve() das Skelett. Das ist nicht bloß kürzer, sondern hält die Figur
 * anatomisch beisammen: ein Knie kann nicht versehentlich neben der Hüfte
 * landen, und dieselbe Stellung stimmt aus jedem Blickwinkel.
 *
 * Koordinaten: x nach rechts, y nach oben, z nach vorn (zum Betrachter); die
 * Figur schaut nach +z. Gezeichnet wird mit schwacher Perspektive und
 * Maleralgorithmus – was hinten liegt, kommt zuerst. Ziehen dreht frei:
 * waagerecht um die Hochachse, senkrecht um die Querachse, beides unbegrenzt.
 * Auch Boden und Klimmzugstange liegen im Raum und kippen deshalb mit.
 *
 * Winkel in Grad:
 *   lean      Rumpfneigung nach vorn
 *   tilt      ganze Figur um die Blickachse – 90 = liegend, Kopf links
 *   arm.p     Schulter nach vorn (0 = Arm hängt)
 *   arm.a     Arm zur Seite abgespreizt
 *   arm.e     Ellenbogen gebeugt
 *   leg.p     Hüfte gebeugt (Knie nach vorn)
 *   leg.a     Bein zur Seite
 *   leg.k     Knie gebeugt (Ferse nach hinten)
 */

const RIG = {
  hipW: 0.10, shoulderW: 0.20, shoulderY: 0.42,
  chestY: 0.28, neckY: 0.46, headY: 0.62, headR: 0.105,
  upperArm: 0.27, foreArm: 0.25, hand: 0.06,
  thigh: 0.44, shin: 0.42, foot: 0.15,
};

const rad = (d) => (d * Math.PI) / 180;
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (v, s) => [v[0] * s, v[1] * s, v[2] * s];

function rotX(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c];
}
function rotY(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c];
}
function rotZ(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]];
}

const A = (p = 0, a = 0, e = 0) => ({ p, a, e });
const L = (p = 0, a = 0, k = 0) => ({ p, a, k });

/** Gelenkpunkte einer Stellung, Hüftmitte im Ursprung. */
function solve(pose) {
  const R = RIG;
  const lean = pose.lean || 0;
  const up = rotX([0, 1, 0], lean);           // Rumpfachse, +lean = nach vorn
  const side = [1, 0, 0];                     // Schulterachse, von lean unberührt

  const hipC = [0, 0, 0];
  const chest = mul(up, R.chestY);
  const neck = mul(up, R.neckY);
  const head = mul(up, R.headY);
  const shoulderMid = mul(up, R.shoulderY);

  const joints = { hipC, chest, neck, head };

  ['L', 'R'].forEach((s) => {
    const sign = s === 'L' ? -1 : 1;

    // Arm: Richtung aus Neigung und Abspreizung, dann Ellenbogen beugen
    const arm = pose[`arm${s}`] || pose.arm || A();
    const shoulder = add(shoulderMid, mul(side, sign * R.shoulderW));
    const upperDir = rotX(rotZ([0, -1, 0], sign * arm.a), -arm.p + lean);
    const elbow = add(shoulder, mul(upperDir, R.upperArm));
    const foreDir = rotX(upperDir, -arm.e);
    const hand = add(elbow, mul(foreDir, R.foreArm));

    // Bein: Hüfte beugen, dann Knie
    const leg = pose[`leg${s}`] || pose.leg || L();
    const hip = add(hipC, mul(side, sign * R.hipW));
    const thighDir = rotX(rotZ([0, -1, 0], sign * leg.a), -leg.p);
    const knee = add(hip, mul(thighDir, R.thigh));
    const shinDir = rotX(thighDir, leg.k);
    const ankle = add(knee, mul(shinDir, R.shin));
    const toe = add(ankle, mul(rotX(shinDir, -80 - leg.k * 0.25), R.foot));

    Object.assign(joints, {
      [`shoulder${s}`]: shoulder, [`elbow${s}`]: elbow, [`hand${s}`]: hand,
      [`hip${s}`]: hip, [`knee${s}`]: knee, [`ankle${s}`]: ankle, [`toe${s}`]: toe,
    });
  });

  // Erst um die Längsachse rollen (Brust nach unten/oben), dann kippen.
  // Die Reihenfolge ist entscheidend: umgekehrt liegt die Figur falsch herum.
  if (pose.roll) {
    Object.keys(joints).forEach((k) => { joints[k] = rotY(joints[k], pose.roll); });
  }
  if (pose.tilt) {
    Object.keys(joints).forEach((k) => { joints[k] = rotZ(joints[k], pose.tilt); });
  }
  return joints;
}

 * Geräte

/** Aus dem Hinweis im Plan ableiten, was in der Hand liegt. */
function equipFor(note) {
  if (!note) return null;
  if (note.includes('je Hand')) return 'dumbbells';
  if (note.includes('eine Hantel')) return 'goblet';
  if (note.includes('Stange')) return 'barbell';
  if (note.includes('Zusatzgewicht')) return 'plate';
  if (note.includes('Hüfte')) return 'hipbar';
  return null;
}

const NS = 'http://www.w3.org/2000/svg';
const CYCLE_MS = 3200;
const el = (name, attrs = {}) => {
  const node = document.createElementNS(NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
};

const active = new Set();

/** Schwache Perspektive: weiter hinten = kleiner. */
function project(p, yaw, pitch, scale, cx, cy) {
  const r = rotX(rotY(p, yaw), pitch);
  const f = 3.4;
  const k = f / (f - r[2]);
  return { x: cx + r[0] * scale * k, y: cy - r[1] * scale * k, z: r[2], k };
}

function mountFigure(host, pattern, weight, equip) {
  const spec = PATTERNS[pattern];
  host.textContent = '';
  if (!spec) return () => {};

  const svg = el('svg', { viewBox: '0 0 100 100', class: 'fig' });
  const scene = el('g');
  svg.appendChild(scene);
  host.appendChild(svg);

  const hint = document.createElement('span');
  hint.className = 'fig-hint';
  hint.textContent = '↕↔ ziehen zum Drehen';
  host.appendChild(hint);

  let yaw = 25;          // Dreiviertelansicht steht der Figur am besten
  let pitch = 8;         // leicht von oben
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  let lastT = 0;         // zuletzt gezeichneter Punkt der Bewegung

  const onDown = (e) => {
    dragging = true;
    const t = e.touches ? e.touches[0] : e;
    lastX = t.clientX;
    lastY = t.clientY;
    hint.classList.add('gone');
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    yaw = (yaw + (t.clientX - lastX) * 0.6) % 360;
    pitch = (pitch + (t.clientY - lastY) * 0.6) % 360;   // bewusst ohne Grenze
    lastX = t.clientX;
    lastY = t.clientY;
    draw(lastT);   // sofort neu zeichnen, statt auf die Animation zu warten
    e.preventDefault();
  };
  const onUp = () => { dragging = false; };

  host.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  const [a, b] = spec.poses;
  const blend = (t) => {
    const mix = (x, y) => x + (y - x) * t;
    const mixA = (x = A(), y = A()) => A(mix(x.p, y.p), mix(x.a, y.a), mix(x.e, y.e));
    const mixL = (x = L(), y = L()) => L(mix(x.p, y.p), mix(x.a, y.a), mix(x.k, y.k));
    return {
      lean: mix(a.lean || 0, b.lean || 0),
      tilt: mix(a.tilt || 0, b.tilt || 0),
      roll: mix(a.roll || 0, b.roll || 0),
      heel: mix(a.heel || 0, b.heel || 0),
      armL: mixA(a.armL || a.arm, b.armL || b.arm),
      armR: mixA(a.armR || a.arm, b.armR || b.arm),
      legL: mixL(a.legL || a.leg, b.legL || b.leg),
      legR: mixL(a.legR || a.leg, b.legR || b.leg),
    };
  };

  const draw = (t) => {
    lastT = t;
    const pose = blend(t);
    const j = solve(pose);

    // Auf den Boden setzen bzw. an der Stange aufhängen
    let shift;
    if (spec.anchor === 'bar') {
      shift = -Math.max(j.handL[1], j.handR[1]) + 0.52;   // haengt an der Stange
    } else {
      shift = -Math.min(...Object.values(j).map((q) => q[1])) - 0.62;
      if (pose.heel) shift += pose.heel * 0.10;           // Ferse hebt ab
    }
    Object.keys(j).forEach((k) => { j[k] = [j[k][0], j[k][1] + shift, j[k][2]]; });

    scene.textContent = '';
    const P = (p) => project(p, yaw, pitch, 44, 50, 52);
    const pts = {};
    Object.entries(j).forEach(([k, v]) => { pts[k] = P(v); });

    const parts = [];
    const bone = (from, to, w, cls = 'fig-limb') => parts.push({
      z: (from.z + to.z) / 2,
      node: el('line', {
        x1: from.x.toFixed(1), y1: from.y.toFixed(1), x2: to.x.toFixed(1), y2: to.y.toFixed(1),
        'stroke-width': (w * (from.k + to.k) / 2).toFixed(2), class: cls,
      }),
    });

    // Rumpf als Fläche zwischen Schultern und Hüften
    const quad = [pts.shoulderL, pts.shoulderR, pts.hipR, pts.hipL];
    parts.push({
      z: quad.reduce((s, p) => s + p.z, 0) / 4,
      node: el('polygon', {
        points: quad.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '),
        class: 'fig-torso',
      }),
    });
    bone(pts.hipC, pts.neck, 7.5, 'fig-spine');

    ['L', 'R'].forEach((s) => {
      bone(pts[`shoulder${s}`], pts[`elbow${s}`], 5.6);
      bone(pts[`elbow${s}`], pts[`hand${s}`], 4.4);
      bone(pts[`hip${s}`], pts[`knee${s}`], 7.2);
      bone(pts[`knee${s}`], pts[`ankle${s}`], 5.4);
      bone(pts[`ankle${s}`], pts[`toe${s}`], 3.8, 'fig-limb fig-foot');
    });

    parts.push({
      z: pts.head.z,
      node: el('circle', {
        cx: pts.head.x.toFixed(1), cy: pts.head.y.toFixed(1),
        r: (RIG.headR * 46 * pts.head.k).toFixed(1), class: 'fig-head',
      }),
    });

    // Gerät
    const gear = (from, to, w, cls) => parts.push({
      z: (from.z + to.z) / 2,
      node: el('line', {
        x1: from.x.toFixed(1), y1: from.y.toFixed(1), x2: to.x.toFixed(1), y2: to.y.toFixed(1),
        'stroke-width': w, class: cls,
      }),
    });
    const plateAt = (p, r) => parts.push({
      z: p.z + 0.01,
      node: el('circle', { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r, class: 'fig-plate' }),
    });

    if (equip === 'dumbbells' || equip === 'goblet') {
      const hands = equip === 'goblet' ? [pts.handL] : [pts.handL, pts.handR];
      hands.forEach((h) => {
        const off = 0.085 * 46 * h.k;
        const dir = rotY([1, 0, 0], yaw);
        const dx = dir[0] * off; const dy = 0;
        gear({ x: h.x - dx, y: h.y - dy, z: h.z, k: h.k }, { x: h.x + dx, y: h.y + dy, z: h.z, k: h.k }, 2.2, 'fig-bar');
        plateAt({ x: h.x - dx, y: h.y - dy, z: h.z }, 3.4 * h.k);
        plateAt({ x: h.x + dx, y: h.y + dy, z: h.z }, 3.4 * h.k);
      });
    } else if (equip === 'barbell') {
      const dir = rotY([1, 0, 0], yaw);
      const ext = 0.30 * 46;
      const mid = { x: (pts.handL.x + pts.handR.x) / 2, y: (pts.handL.y + pts.handR.y) / 2, z: (pts.handL.z + pts.handR.z) / 2, k: 1 };
      const e1 = { x: mid.x - dir[0] * ext, y: mid.y, z: mid.z };
      const e2 = { x: mid.x + dir[0] * ext, y: mid.y, z: mid.z };
      gear({ ...e1, k: 1 }, { ...e2, k: 1 }, 2.4, 'fig-bar');
      plateAt(e1, 5); plateAt(e2, 5);
    } else if (equip === 'hipbar') {
      const dir = rotY([1, 0, 0], yaw);
      const hipMid = { x: (pts.hipL.x + pts.hipR.x) / 2, y: (pts.hipL.y + pts.hipR.y) / 2, z: (pts.hipL.z + pts.hipR.z) / 2 };
      const ext = 0.24 * 46;
      gear({ x: hipMid.x - dir[0] * ext, y: hipMid.y, z: hipMid.z, k: 1 },
        { x: hipMid.x + dir[0] * ext, y: hipMid.y, z: hipMid.z, k: 1 }, 2.4, 'fig-bar');
      plateAt({ x: hipMid.x - dir[0] * ext, y: hipMid.y, z: hipMid.z }, 4.6);
      plateAt({ x: hipMid.x + dir[0] * ext, y: hipMid.y, z: hipMid.z }, 4.6);
    } else if (equip === 'plate') {
      const back = P(add(j.chest, rotY([0, 0, -0.12], 0)));
      plateAt(back, 5.5 * back.k);
    }

    if (spec.bar) {
      const barY = Math.max(j.handL[1], j.handR[1]);
      const a1 = P([-0.75, barY, 0]); const a2 = P([0.75, barY, 0]);
      parts.push({
        z: (a1.z + a2.z) / 2 - 0.02,
        node: el('line', {
          x1: a1.x.toFixed(1), y1: a1.y.toFixed(1), x2: a2.x.toFixed(1), y2: a2.y.toFixed(1),
          class: 'fig-bar-fixed',
        }),
      });
    } else {
      // Bodenscheibe statt Strich: ein Strich unten am Rand sieht aus wie ein
      // Schieberegler; eine Fläche im Raum liest sich als Boden und kippt mit.
      const ring = [];
      for (let a = 0; a < 360; a += 15) {
        ring.push(P([Math.cos(rad(a)) * 0.62, -0.62, Math.sin(rad(a)) * 0.34]));
      }
      parts.push({
        z: Math.min(...ring.map((q) => q.z)) - 0.02,
        node: el('polygon', {
          points: ring.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-ground',
        }),
      });
    }

    // Maleralgorithmus: hinten zuerst
    parts.sort((p, q) => p.z - q.z).forEach((p) => scene.appendChild(p.node));
  };

  const entry = { draw };
  draw(0);
  active.add(entry);
  return {
    draw,
    setView: (y, pi = 0) => { yaw = y; pitch = pi; draw(lastT); },
    stop: () => {
      active.delete(entry);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    },
  };
}

function clearFigures() {
  active.clear();
}

function frame(now) {
  if (document.visibilityState === 'visible' && active.size) {
    const t = (now % CYCLE_MS) / CYCLE_MS;
    const tri = t < 0.5 ? t * 2 : (1 - t) * 2;
    active.forEach((f) => f.draw(tri * tri * (3 - 2 * tri)));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/*
 * Körperkarte: zeigt in Vorder- und Rückansicht, was heute drankommt.
 *
 * Der Körper ist aus den Muskelregionen selbst zusammengesetzt – dadurch ist
 * Hervorheben nur eine Frage der Füllfarbe, und es braucht keine zweite
 * Zeichnung darunter. Was keine Trainingsregion ist (Kopf, Unterarme, Hände,
 * Füße), liegt als neutrales Beiwerk daneben.
 *
 * Gezeichnet wird in einem Feld von 100 × 220 je Ansicht, symmetrisch um
 * x = 50. Seitenpaare werden nur einmal angegeben und automatisch gespiegelt.

const MUSCLE_LABEL = {

const E = (cx, cy, rx, ry) => ['e', cx, cy, rx, ry];

/*
 * Durchgehende Silhouette unter den Muskelregionen. Ohne sie zerfällt der
 * Körper in einzelne Flecken; die Regionen liegen darauf und heben sich nur
 * noch farblich ab.
 */
const FILLER = [
  E(50, 20, 11.5, 13),                     // Kopf
  ['p', 'M45 29 H55 V42 H45 Z'],           // Hals
  ['p', 'M36 45 Q34 70 38 100 H62 Q66 70 64 45 Z'], // Rumpf
  E(26, 64, 8.5, 22), E(74, 64, 8.5, 22),  // Oberarme

const BODY_NS = 'http://www.w3.org/2000/svg';

function shapeEl(shape, mirrored) {
  if (shape[0] === 'e') {
    const [, cx, cy, rx, ry] = shape;
    const node = document.createElementNS(BODY_NS, 'ellipse');
    node.setAttribute('cx', mirrored ? 100 - cx : cx);
    node.setAttribute('cy', cy);
    node.setAttribute('rx', rx);
    node.setAttribute('ry', ry);
    return node;
  }
  const node = document.createElementNS(BODY_NS, 'path');
  node.setAttribute('d', shape[1]);
  if (mirrored) node.setAttribute('transform', 'translate(100,0) scale(-1,1)');
  return node;
}

function halfView(regions, active, label) {
  const g = document.createElementNS(BODY_NS, 'g');

  FILLER.forEach((shape) => {
    const node = shapeEl(shape, false);
    node.setAttribute('class', 'bm-filler');
    g.appendChild(node);
  });

  regions.forEach(([muscle, shapes, mirror]) => {
    const on = active.has(muscle);
    shapes.forEach((shape) => {
      [false, ...(mirror ? [true] : [])].forEach((m) => {
        const node = shapeEl(shape, m);
        node.setAttribute('class', `bm-part${on ? ' on' : ''}`);
        if (on) {
          const title = document.createElementNS(BODY_NS, 'title');
          title.textContent = MUSCLE_LABEL[muscle] || muscle;
          node.appendChild(title);
        }
        g.appendChild(node);
      });
    });
  });

  const text = document.createElementNS(BODY_NS, 'text');
  text.setAttribute('x', 50);
  text.setAttribute('y', 216);
  text.setAttribute('class', 'bm-label');
  text.textContent = label;
  g.appendChild(text);
  return g;
}

/**
 * Zeichnet Vorder- und Rückansicht nebeneinander.
 *
 * @param {Element} host   Zielelement, wird geleert
 * @param {Set}     active Muskelregionen, die hervorgehoben werden
 */
function mountBody(host, active) {
  host.textContent = '';
  const svg = document.createElementNS(BODY_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 210 224');
  svg.setAttribute('class', 'bodymap');
  svg.setAttribute('role', 'img');

  const names = [...active].map((m) => MUSCLE_LABEL[m] || m);
  svg.setAttribute('aria-label', names.length
    ? `Heute beansprucht: ${names.join(', ')}`
    : 'Keine Muskelgruppen hervorgehoben');

  const front = halfView(FRONT, active, 'vorn');
  const back = halfView(BACK, active, 'hinten');
  back.setAttribute('transform', 'translate(110,0)');
  svg.append(front, back);
  host.appendChild(svg);
}

/* ===== js/chart.js ===== */
/*
 * Kleine Verlaufskarten für die Statistik.
 *
 * Bewusst Small Multiples statt eines Diagramms mit vielen Linien: Bei zwölf
 * Muskelgruppen wären zwölf Farben nicht mehr auseinanderzuhalten – schon gar
 * nicht für Farbfehlsichtige. Eine Karte je Reihe braucht dagegen nur eine
 * Farbe, und die Überschrift ersetzt die Legende.
 *
 * Je Karte: Fläche als 10-%-Hauch, Linie 2 px, Endpunkt als Punkt mit Ring in
 * der Untergrundfarbe. Beschriftet wird nur der Endwert – eine Zahl an jedem
 * Punkt liest niemand. Beim Ziehen über die Karte wandert der Punkt mit und
 * die Kopfzeile zeigt den Wert des Tages; die vollständige Reihe steht im
 * aria-label, damit sie auch ohne Sehen zugänglich ist.
 */

const CHART_NS = 'http://www.w3.org/2000/svg';
const VW = 100;
const VH = 30;

const svgEl = (name, attrs = {}) => {
  const node = document.createElementNS(CHART_NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
};

/**
 * Eine Verlaufskarte.
 *
 * @param {object} o
 * @param {string} o.label   Überschrift, ersetzt die Legende
 * @param {Array}  o.points  [{ label, value }] in zeitlicher Reihenfolge
 * @param {string} o.unit    Einheit für die Beschriftung
 * @param {Function} o.fmt   Zahlformatierung
 */
function sparkPanel({ label, points, unit = '', fmt = (v) => String(Math.round(v)) }) {
  const fig = document.createElement('figure');
  fig.className = 'spark';

  const cap = document.createElement('figcaption');
  const name = document.createElement('span');
  name.className = 'spark-name';
  name.textContent = label;
  const val = document.createElement('span');
  val.className = 'spark-val';
  cap.append(name, val);
  fig.appendChild(cap);

  const last = points[points.length - 1];
  const first = points[0];
  const setVal = (p) => { val.textContent = `${fmt(p.value)}${unit ? ` ${unit}` : ''}`; };
  setVal(last);

  const values = points.map((p) => p.value);
  const lo = Math.min(...values);
  const hi = Math.max(...values);
  const span = hi - lo || 1;
  // Bei nur einem Punkt gibt es keine Strecke – dann in die Mitte setzen.
  const xy = points.map((p, i) => [
    points.length === 1 ? VW / 2 : (i / (points.length - 1)) * VW,
    VH - ((p.value - lo) / span) * (VH - 6) - 3,
  ]);

  const svg = svgEl('svg', {
    viewBox: `0 0 ${VW} ${VH}`, class: 'spark-svg', preserveAspectRatio: 'none',
    role: 'img',
    'aria-label': `${label}: ${points.map((p) => `${p.label} ${fmt(p.value)}${unit ? ` ${unit}` : ''}`).join(', ')}`,
  });

  const d = xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  svg.appendChild(svgEl('path', { d: `${d} L${VW} ${VH} L0 ${VH} Z`, class: 'spark-area' }));
  svg.appendChild(svgEl('path', { d, class: 'spark-line' }));

  const dot = svgEl('circle', { cx: xy[xy.length - 1][0], cy: xy[xy.length - 1][1], r: 2.6, class: 'spark-dot' });
  svg.appendChild(dot);
  fig.appendChild(svg);

  const foot = document.createElement('div');
  foot.className = 'spark-foot';
  const delta = last.value - first.value;
  foot.textContent = points.length > 1
    ? `${fmt(first.value)} → ${fmt(last.value)}${unit ? ` ${unit}` : ''}${delta ? ` (${delta > 0 ? '+' : '−'}${fmt(Math.abs(delta))})` : ''}`
    : `einmal · ${first.label}`;
  fig.appendChild(foot);

  // Ziehen über die Karte zeigt den Wert des jeweiligen Tages
  const pick = (e) => {
    const box = svg.getBoundingClientRect();
    const rel = ((e.touches ? e.touches[0] : e).clientX - box.left) / box.width;
    const i = Math.max(0, Math.min(points.length - 1, Math.round(rel * (points.length - 1))));
    dot.setAttribute('cx', xy[i][0]);
    dot.setAttribute('cy', xy[i][1]);
    setVal(points[i]);
    foot.textContent = points[i].label;
  };
  const reset = () => {
    dot.setAttribute('cx', xy[xy.length - 1][0]);
    dot.setAttribute('cy', xy[xy.length - 1][1]);
    setVal(last);
    foot.textContent = points.length > 1
      ? `${fmt(first.value)} → ${fmt(last.value)}${unit ? ` ${unit}` : ''}${delta ? ` (${delta > 0 ? '+' : '−'}${fmt(Math.abs(delta))})` : ''}`
      : `einmal · ${first.label}`;
  };
  fig.addEventListener('pointermove', pick);
  fig.addEventListener('pointerleave', reset);

  return fig;
}

/* ===== js/store.js ===== */
const KEY = 'workout.state.v1';

const DEFAULT_STATE = {
  mode: 'db',            // global default: 'db' (Hanteln) | 'bw' (Bodyweight)
  keepModePerWorkout: true,
  autoShift: true,       // verpasste Tage schieben den Restplan nach hinten
  shift: 0,              // Tage, um die der noch offene Plan verschoben ist
  useExerciseRest: true, // Pause je Übung statt einer festen Länge
  restSeconds: 90,       // feste Pause, wenn useExerciseRest aus ist; 0 = keine
  sound: true,           // Ton am Ende der Pause
  rest: null,            // laufende Pause: { endsAt, total, next }
  weights: {},           // Arbeitsgewicht je Übung in kg, vom Nutzer gepflegt
  session: null,         // laufendes Training: { n, startedAt }
  // { [workoutNo]: { db: {exId: [{w,r,done}]}, bw: {...}, mode, startedOn } }
  log: {},
};

function clone(o) { return JSON.parse(JSON.stringify(o)); }

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return clone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return Object.assign(clone(DEFAULT_STATE), parsed);
  } catch {
    return clone(DEFAULT_STATE);
  }
}

let saveTimer = null;

/**
 * Einmal vorab prüfen, statt auf den ersten fehlgeschlagenen Schreibvorgang zu
 * warten: In privaten Fenstern und manchen eingebetteten Ansichten ist der
 * Speicher gesperrt, und dann darf die App das nicht stillschweigend schlucken.
 */
let storageOk = (() => {
  try {
    localStorage.setItem(`${KEY}.probe`, '1');
    localStorage.removeItem(`${KEY}.probe`);
    return true;
  } catch {
    return false;
  }
})();

/** false, wenn der Browser nichts speichern kann – Eintragungen sind flüchtig. */
function canPersist() { return storageOk; }

function write() {
  saveTimer = null;
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageOk = true;
  } catch {
    storageOk = false; // Speicher voll oder gesperrt
  }
}

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(write, 120);
}

/**
 * Ausstehenden Schreibvorgang sofort ausführen. Nötig, bevor die App in den
 * Hintergrund geht: mobile Browser verwerfen die Seite dort ohne Vorwarnung,
 * und der letzte abgehakte Satz wäre sonst verloren.
 */
function flush() {
  if (saveTimer === null) return;
  clearTimeout(saveTimer);
  write();
}

function emit() {
  listeners.forEach((fn) => fn(state));
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function getState() { return state; }

function setMode(mode) {
  state.mode = mode === 'bw' ? 'bw' : 'db';
  persist();
  emit();
}

/** Modus, in dem ein konkretes Workout bearbeitet wird. */
function workoutMode(n) {
  const entry = state.log[n];
  if (state.keepModePerWorkout && entry && entry.mode) return entry.mode;
  return state.mode;
}

function setWorkoutMode(n, mode) {
  const entry = ensure(n);
  entry.mode = mode;
  state.mode = mode;
  persist();
  emit();
}

function ensure(n) {
  if (!state.log[n]) state.log[n] = { db: {}, bw: {}, mode: state.mode };
  const e = state.log[n];
  if (!e.db) e.db = {};
  if (!e.bw) e.bw = {};
  return e;
}

/** Satz-Array für eine Übung in einem Workout; legt es bei Bedarf an. */
function getSets(n, mode, exId, setCount) {
  const bucket = ensure(n)[mode];
  let arr = bucket[exId];
  if (!Array.isArray(arr)) arr = bucket[exId] = [];
  while (arr.length < setCount) arr.push({ w: '', r: '', done: false });
  if (arr.length > setCount) arr.length = setCount;
  return arr;
}

/** Wurde an diesem Workout überhaupt schon etwas eingetragen oder abgehakt? */
function isStarted(n) {
  const e = state.log[n];
  if (!e) return false;
  return ['db', 'bw'].some((m) => Object.values(e[m] || {}).some(
    (arr) => Array.isArray(arr) && arr.some((s) => s.done || s.w !== '' || s.r !== ''),
  ));
}

/** Tag, an dem tatsächlich trainiert wurde – oder null, solange nichts erfasst ist. */
function startedOn(n) {
  const e = state.log[n];
  return (e && e.startedOn) || null;
}

/** Hält fest, wann eine Einheit begonnen wurde, bzw. löst die Markierung wieder. */
function syncStartedOn(n) {
  const e = state.log[n];
  if (!e) return;
  if (isStarted(n)) {
    if (!e.startedOn) e.startedOn = todayISO();
  } else {
    delete e.startedOn;
  }
}

/**
 * Laufende Pause setzen oder beenden. Gespeichert wird der Endzeitpunkt, nicht
 * die Restdauer – so stimmt die Anzeige auch, wenn das Handy zwischendurch
 * gesperrt war und die App erst später wieder in den Vordergrund kommt.
 */
function setRest(rest) {
  state.rest = rest;
  persist();
  emit();
}

/** Arbeitsgewicht einer Übung; null, solange der Nutzer nichts geändert hat. */
function weightOf(exId) {
  const w = state.weights[exId];
  return typeof w === 'number' ? w : null;
}

function setWeight(exId, kg) {
  const v = Math.max(0, Math.round(kg * 2) / 2); // auf halbe Kilo runden
  state.weights[exId] = v;
  persist();
  emit();
  return v;
}

function startSession(n) {
  state.session = { n, startedAt: Date.now() };
  persist();
  emit();
}

function endSession() {
  state.session = null;
  persist();
  emit();
}

function setShift(days) {
  const v = Math.max(0, Math.round(Number(days) || 0));
  if (v === state.shift) return;
  state.shift = v;
  persist();
  emit();
}

/** Nur lesen – legt nichts an, damit reines Blättern den Speicher nicht füllt. */
function peekSets(n, mode, exId) {
  const e = state.log[n];
  const arr = e && e[mode] && e[mode][exId];
  return Array.isArray(arr) ? arr : null;
}

function updateSet(n, mode, exId, setCount, index, patch) {
  const arr = getSets(n, mode, exId, setCount);
  Object.assign(arr[index], patch);
  ensure(n).mode = mode;
  syncStartedOn(n);
  persist();
  emit();
}

function resetWorkout(n, mode) {
  const e = state.log[n];
  if (!e) return;
  e[mode] = {};
  syncStartedOn(n);
  persist();
  emit();
}

function completeWorkout(n, mode, exList) {
  const e = ensure(n);
  e.mode = mode;
  exList.forEach((item) => {
    const arr = getSets(n, mode, item.id, item.sets);
    arr.forEach((s) => { s.done = true; });
  });
  syncStartedOn(n);
  persist();
  emit();
}

function setSetting(key, value) {
  state[key] = value;
  persist();
  emit();
}

function exportJSON() {
  return JSON.stringify(state, null, 2);
}

function importJSON(text) {
  const parsed = JSON.parse(text);
  if (!parsed || typeof parsed !== 'object' || typeof parsed.log !== 'object') {
    throw new Error('Unerwartetes Format – "log" fehlt.');
  }
  state = Object.assign(clone(DEFAULT_STATE), parsed);
  persist();
  emit();
}

function resetAll() {
  state = clone(DEFAULT_STATE);
  try { localStorage.removeItem(KEY); } catch { /* ignorieren */ }
  persist();
  emit();
}

const store = { canPersist, completeWorkout, endSession, exportJSON, flush, getSets, getState, importJSON, isStarted, peekSets, resetAll, resetWorkout, setMode, setRest, setSetting, setShift, setWeight, setWorkoutMode, startSession, startedOn, subscribe, updateSet, weightOf, workoutMode };

/* ===== js/app.js ===== */
/* ------------------------------------------------------------------ *
 * Hilfsfunktionen
 * ------------------------------------------------------------------ */

const EX_BY_ID = new Map(EXERCISES.map((e) => [e.id, e]));
const view = document.getElementById('view');
const tabbar = document.getElementById('tabbar');
const modeSwitch = document.getElementById('modeSwitch');
const toastEl = document.getElementById('toast');

const MODE_LABEL = { db: 'Hanteln', bw: 'Bodyweight' };

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/**
 * Tatsächlicher Termin einer Einheit.
 *
 * Bereits begonnene Einheiten bleiben auf dem Tag, an dem trainiert wurde –
 * die Historie darf sich nicht rückwirkend verschieben. Alles Offene liegt
 * auf seinem Plandatum plus der aktuellen Verschiebung.
 */
function effDate(w) {
  return store.startedOn(w.n) || addDays(w.date, store.getState().shift);
}

/**
 * Verpasste Tage nachtragen: Ist der Termin der frühesten noch nicht
 * begonnenen Einheit verstrichen, wandert der gesamte Restplan um genau so
 * viele Tage nach hinten, bis diese Einheit auf heute fällt. Die Abstände
 * zwischen den Einheiten bleiben dabei erhalten.
 */
function catchUpPlan() {
  const s = store.getState();
  if (!s.autoShift) return 0;
  const open = PLAN.find((w) => !store.isStarted(w.n));
  if (!open) return 0;
  const missed = daysBetween(effDate(open), todayISO());
  if (missed <= 0) return 0;
  store.setShift(s.shift + missed);
  return missed;
}

/** Die Einheit, die als Nächstes ansteht: die erste noch nicht abgeschlossene. */
function defaultWorkoutNo() {
  const open = PLAN.find((w) => !completedMode(w.n));
  return open ? open.n : PLAN[PLAN.length - 1].n;
}

function workoutByNo(n) {
  return PLAN.find((w) => w.n === n) || PLAN[0];
}

/** Untere Grenze eines Wiederholungsbereichs, z. B. "8–12" -> 8. */
function plannedReps(reps) {
  const m = String(reps).match(/\d+/);
  return m ? Number(m[0]) : 0;
}

/** Variante (db/bw) einer geplanten Übung inkl. Sätze. */
function resolve(item, mode) {
  const ex = EX_BY_ID.get(item.id);
  const v = ex[mode];
  return {
    id: item.id, sets: item.sets, group: ex.group,
    name: v.name, reps: v.reps, equip: v.equip, cue: v.cue, rest: v.rest, pattern: v.pattern, muscles: v.muscles,
    // Zusatzgewicht gibt es nur in der Hantel-Variante und nur, wo die Übung
    // eines kennt – Chin-ups und Sliding Leg Curls etwa nicht.
    weight: mode === 'db' ? ex.weight : null,
    weightNote: ex.weightNote,
  };
}

/** Gewicht, mit dem diese Übung heute gearbeitet wird. */
function workingWeight(exId) {
  const ex = EX_BY_ID.get(exId);
  if (ex.weight === null) return null;
  const own = store.weightOf(exId);
  return own === null ? ex.weight : own;
}

/**
 * Gewicht, das in diesem Workout tatsächlich benutzt wurde. Sobald der erste
 * Satz steht, ist es festgeschrieben – ein späteres "+2,5 kg" gilt dann fürs
 * nächste Mal und schreibt die heutige Einheit nicht rückwirkend um.
 */
function usedWeight(n, mode, exId) {
  const logged = (store.peekSets(n, mode, exId) || []).find((s) => s.w !== '');
  if (logged) return parseFloat(logged.w);
  return workingWeight(exId);
}

function fmtKg(kg) {
  return Number.isInteger(kg) ? String(kg) : kg.toFixed(1).replace('.', ',');
}

/** Pausenlänge für eine Übung – empfohlen oder fest, je nach Einstellung. */
function restFor(item) {
  const s = store.getState();
  if (!s.useExerciseRest) return s.restSeconds;
  return item.rest;
}

function progressOf(n, mode) {
  const w = workoutByNo(n);
  let done = 0;
  let total = 0;
  w.ex.forEach((item) => {
    const arr = store.peekSets(n, mode, item.id) || [];
    total += item.sets;
    done += arr.slice(0, item.sets).filter((s) => s.done).length;
  });
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0, complete: total > 0 && done === total };
}

/** Ist das Workout in irgendeinem Modus abgeschlossen? Gibt den Modus zurück. */
function completedMode(n) {
  const st = store.getState().log[n];
  if (!st) return null;
  for (const m of ['db', 'bw']) {
    if (progressOf(n, m).complete) return m;
  }
  return null;
}

function hasAnyEntry(n, mode) {
  const w = workoutByNo(n);
  return w.ex.some((item) => (store.peekSets(n, mode, item.id) || [])
    .some((s) => s.done || s.w !== ''));
}

/* ------------------------------------------------------------------ *
 * Pausentimer
 * ------------------------------------------------------------------ */

const restBar = document.getElementById('restBar');
const restTime = document.getElementById('restTime');
const restNext = document.getElementById('restNext');
const restFill = document.getElementById('restFill');

let audioCtx = null;
let restTicker = null;
let wakeLock = null;

/**
 * Kurzes Doppelsignal zum Ende der Pause – erzeugt statt geladen, damit die
 * App ohne Netz und ohne zusätzliche Datei auskommt.
 *
 * Der AudioContext entsteht erst beim ersten Abhaken. Mobile Browser lassen
 * Ton nur zu, wenn er auf eine Berührung zurückgeht; genau die ist das.
 */
function initAudio() {
  if (audioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try { audioCtx = new Ctx(); } catch { audioCtx = null; }
}

function beep() {
  if (!store.getState().sound || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  const now = audioCtx.currentTime;
  [0, 0.28].forEach((offset, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = i === 0 ? 880 : 1320;
    gain.gain.setValueAtTime(0.0001, now + offset);
    gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now + offset);
    osc.stop(now + offset + 0.24);
  });
}

/**
 * Displaysperre während der Pause. Ohne sie schläft das Handy ein, der Browser
 * friert die Seite ein – und der Ton käme zu spät oder gar nicht.
 */
async function holdScreen(on) {
  try {
    if (on) {
      if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    } else if (wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch {
    wakeLock = null; // nicht unterstützt oder abgelehnt – kein Beinbruch
  }
}

function startRest(exName, setIndex, sets, secs) {
  if (!secs) return;
  store.setRest({
    endsAt: Date.now() + secs * 1000,
    total: secs,
    next: `Satz ${setIndex + 2} von ${sets} · ${exName}`,
  });
  holdScreen(true);
  tickRest();
}

function endRest(withSignal) {
  if (!restBar) return;
  if (restTicker) { clearInterval(restTicker); restTicker = null; }
  holdScreen(false);
  store.setRest(null);
  restBar.hidden = true;
  document.body.classList.remove('resting');
  if (withSignal) {
    beep();
    if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
  }
}

function tickRest() {
  // Sollten Seite und Skript aus unterschiedlich alten Zwischenspeichern
  // stammen, fehlt die Leiste - dann lieber ohne Timer weiterlaufen als alles
  // mit einem Fehler anhalten.
  if (!restBar) return;
  const rest = store.getState().rest;
  if (!rest) { restBar.hidden = true; document.body.classList.remove('resting'); return; }

  const left = Math.round((rest.endsAt - Date.now()) / 1000);
  if (left <= 0) {
    endRest(true);
    toast('Pause vorbei – nächster Satz');
    return;
  }

  restBar.hidden = false;
  document.body.classList.add('resting');
  restTime.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  restNext.textContent = rest.next;
  restFill.style.width = `${Math.max(0, (left / rest.total) * 100)}%`;

  if (!restTicker) restTicker = setInterval(tickRest, 250);
}

/** Laufzeit des Trainings im Kopfbereich mitzählen, ohne neu zu rendern. */
setInterval(() => {
  const badge = document.getElementById('sessionBadge');
  const sess = store.getState().session;
  if (!badge || !sess) return;
  const secs = Math.floor((Date.now() - sess.startedAt) / 1000);
  badge.textContent = `⏱ ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
}, 1000);

document.getElementById('restSkip')?.addEventListener('click', () => endRest(false));
document.getElementById('restPlus')?.addEventListener('click', () => {
  const rest = store.getState().rest;
  if (!rest) return;
  store.setRest({ ...rest, endsAt: rest.endsAt + 30000, total: rest.total + 30 });
  tickRest();
});

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ------------------------------------------------------------------ *
 * UI-Zustand (nicht persistiert)

const ui = {
  tab: 'dashboard',
  workoutNo: defaultWorkoutNo(),
  openEx: new Set(),
  planFilter: 'all',
  focus: false,    // Fokus-Ansicht: eine Übung groß
  listView: false, // Übungsliste statt Startansicht
  focusIdx: 0,
};

 * Dashboard

/** Index der ersten Übung, in der noch ein Satz offen ist. */
function firstOpenExercise(n, mode) {
  const w = workoutByNo(n);
  const idx = w.ex.findIndex((item) => {
    const arr = store.peekSets(n, mode, item.id) || [];
    return arr.slice(0, item.sets).filter((s) => s.done).length < item.sets;
  });
  return idx === -1 ? w.ex.length - 1 : idx;
}

/**
 * Fokus-Ansicht: eine Übung groß, mit vorgeführter Bewegung. Sobald alle Sätze
 * stehen, rückt die App von selbst zur nächsten offenen Übung weiter.
 */
function renderFocus() {
  const n = ui.workoutNo;
  const w = workoutByNo(n);
  const mode = store.workoutMode(n);
  const prog = progressOf(n, mode);

  const i = Math.min(ui.focusIdx, w.ex.length - 1);
  const item = w.ex[i];
  const it = resolve(item, mode);
  const sets = store.getSets(n, mode, it.id, it.sets);
  const doneCount = sets.filter((s) => s.done).length;
  const kg = it.weight === null ? null : usedWeight(n, mode, it.id);
  const next = it.weight === null ? null : workingWeight(it.id);
  const frozen = kg !== null && next !== null && Math.abs(kg - next) > 0.01;

  view.innerHTML = `
    <div class="focus-top">
      <button type="button" class="back-link" data-act="focus-list">☰ Übersicht</button>
      <span class="focus-count">
        <span id="sessionBadge">⏱ 0:00</span> · Übung ${i + 1} von ${w.ex.length} · ${prog.done}/${prog.total} Sätze
      </span>
    </div>

    <div class="focus-fig" id="focusFig"></div>

    <h2 class="focus-name">${esc(it.name)}</h2>
    <div class="focus-meta">${it.sets} Sätze × ${esc(it.reps)} Wdh. · ${esc(it.group)} · ${esc(it.equip)}</div>

    ${kg === null ? '' : `
      <div class="ex-weight focus-weight">
        <button type="button" class="kg-step" data-act="weight-step" data-ex="${it.id}" data-d="-2.5" aria-label="2,5 Kilo weniger">−</button>
        <div class="kg-main">
          <input type="text" inputmode="decimal" class="kg-val" value="${fmtKg(kg)}"
                 data-act="weight-input" data-ex="${it.id}" aria-label="Gewicht in Kilo">
          <span class="kg-unit">kg${it.weightNote ? ` · ${esc(it.weightNote)}` : ''}</span>
        </div>
        <button type="button" class="kg-step kg-plus" data-act="weight-step" data-ex="${it.id}" data-d="2.5" aria-label="2,5 Kilo mehr">+</button>
      </div>
      ${frozen ? `<div class="kg-next focus-next">Nächstes Mal: ${esc(fmtKg(next))} kg</div>` : ''}`}

    <div class="focus-sets">
      ${sets.map((s, idx) => `

/** Letzter protokollierter Eintrag derselben Übung im selben Modus. */
function lastLoggedFor(exId, mode, beforeN) {
  for (let i = PLAN.length - 1; i >= 0; i--) {
    const w = PLAN[i];
    if (w.n >= beforeN) continue;
    const item = w.ex.find((x) => x.id === exId);
    if (!item) continue;
    const arr = store.peekSets(w.n, mode, exId);
    if (!arr) continue;
    const filled = arr.filter((s) => s.w !== '');
    if (!filled.length) continue;
    return { n: w.n, text: filled.map((s) => s.w).join(' · ') };
  }
  return null;
}

/**
 * Zeitreihen aus dem Protokoll: je Übung das benutzte Gewicht, je
 * Muskelgruppe das Volumen (Gewicht × geplante Wdh. × Sätze) einer Einheit.
 *
 * Nur abgehakte Sätze zählen, und nur die Hantel-Variante trägt Kilo bei –
 * Bodyweight-Einheiten haben schlicht kein Gewicht, das man summieren könnte.
 */
function progressSeries() {
  const perExercise = new Map();
  const perMuscle = new Map();

  PLAN.forEach((w) => {
    const day = fmtDate(effDate(w));
    const muscleDay = new Map();

    w.ex.forEach((item) => {
      const arr = store.peekSets(w.n, 'db', item.id);
      if (!arr) return;
      const done = arr.slice(0, item.sets).filter((x) => x.done && x.w !== '');
      if (!done.length) return;

      const kg = parseFloat(String(done[0].w).replace(',', '.'));
      if (Number.isNaN(kg) || kg <= 0) return;

      const ex = EX_BY_ID.get(item.id);
      if (!perExercise.has(item.id)) perExercise.set(item.id, []);
      perExercise.get(item.id).push({ label: day, value: kg });

      const vol = kg * plannedReps(ex.db.reps) * done.length;
      ex.db.muscles.forEach((m) => muscleDay.set(m, (muscleDay.get(m) || 0) + vol));
    });

    muscleDay.forEach((vol, m) => {
      if (!perMuscle.has(m)) perMuscle.set(m, []);
      perMuscle.get(m).push({ label: day, value: vol });
    });
  });

  return { perExercise, perMuscle };
}

function renderStats() {
  const log = store.getState().log;
  const today = todayISO();

  let setsDone = 0;
  let repsTotal = 0;
  let volume = 0;
  let doneDb = 0;
  let doneBw = 0;
  const perEx = new Map();

  PLAN.forEach((w) => {
    const entry = log[w.n];
    if (!entry) return;
    ['db', 'bw'].forEach((m) => {
      w.ex.forEach((item) => {
        const arr = entry[m] && entry[m][item.id];
        if (!Array.isArray(arr)) return;
        // Wiederholungen werden nicht mehr erfasst; gerechnet wird deshalb mit
        // dem geplanten Wert – der unteren Grenze des Bereichs, also bewusst
        // eher zu niedrig als zu hoch.
        const planned = plannedReps(EX_BY_ID.get(item.id)[m].reps);
        arr.forEach((s) => {
          if (!s.done) return;
          setsDone++;
          repsTotal += planned;
          const kg = parseFloat(String(s.w).replace(',', '.'));
          if (m === 'db' && !Number.isNaN(kg)) volume += kg * planned;
          perEx.set(item.id, (perEx.get(item.id) || 0) + 1);
        });
      });
    });
    const cm = completedMode(w.n);
    if (cm === 'db') doneDb++;
    else if (cm === 'bw') doneBw++;
  });

  const workoutsDone = doneDb + doneBw;

  // Aktuelle Serie: rückwärts ab dem letzten fälligen Workout
  let streak = 0;
  const past = PLAN.filter((w) => effDate(w) <= today);
  for (let i = past.length - 1; i >= 0; i--) {
    if (completedMode(past[i].n)) streak++;
    else break;
  }

  const upcoming = PLAN.find((w) => !completedMode(w.n));

  const topEx = [...perEx.entries()]
    .map(([id, c]) => ({ ex: EX_BY_ID.get(id), c }))
    .sort((a, b) => b.c - a.c)
    .slice(0, 8);
  const max = topEx.length ? topEx[0].c : 1;

  view.innerHTML = `
    <div class="section-title">Überblick</div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-v">${workoutsDone}<span class="muted" style="font-size:15px">/${PLAN.length}</span></div><div class="stat-l">Workouts erledigt</div></div>
      <div class="stat"><div class="stat-v">${streak}</div><div class="stat-l">Serie in Folge</div></div>
      <div class="stat"><div class="stat-v">${setsDone}</div><div class="stat-l">Sätze abgehakt</div></div>
      <div class="stat"><div class="stat-v">${repsTotal ? `ca. ${Math.round(repsTotal)}` : '–'}</div><div class="stat-l">Wiederholungen (geplant)</div></div>
      <div class="stat"><div class="stat-v">${volume ? `ca. ${Math.round(volume).toLocaleString('de-DE')}` : '–'}</div><div class="stat-l">Volumen kg (Hanteln)</div></div>
      <div class="stat"><div class="stat-v">🏋️ ${doneDb} · 🤸 ${doneBw}</div><div class="stat-l">Modus-Verteilung</div></div>
    </div>

    <div class="section-title">Nächste Einheit</div>
    <div class="card">
      ${upcoming
        ? `<div class="plan-date">Workout ${upcoming.n} · ${esc(fmtDate(effDate(upcoming), true))}</div>
           <div class="small muted" style="margin-top:4px">${esc(upcoming.ex.map((i) => resolve(i, store.workoutMode(upcoming.n)).name).join(' · '))}</div>
           <div class="btn-row"><button type="button" class="btn btn-primary" data-act="open-workout" data-n="${upcoming.n}">Öffnen</button></div>`
        : '<div class="muted">Alle Einheiten des Plans sind abgeschlossen. Stark.</div>'}
    </div>

    <div class="section-title">Gewicht je Übung</div>
    <div class="spark-grid" id="sparkEx"></div>

    <div class="section-title">Volumen je Muskelgruppe</div>
    <div class="spark-grid" id="sparkMus"></div>

    <div class="section-title">Meist trainierte Übungen</div>
    <div class="card">
      ${topEx.length ? `<div class="bars">${topEx.map((t) => `
        <div class="bar-row">
          <div>
            <div class="bar-name">${esc(t.ex.db.name)} <span class="muted">/ ${esc(t.ex.bw.name)}</span></div>
            <div class="bar-track"><i style="width:${Math.round((t.c / max) * 100)}%"></i></div>
          </div>
          <div class="bar-val">${t.c}</div>
        </div>`).join('')}</div>`
        : '<div class="muted small">Noch keine Sätze protokolliert – hak im Dashboard den ersten Satz ab.</div>'}
    </div>
  `;

  const { perExercise, perMuscle } = progressSeries();
  const kgFmt = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.', ','));

  const fill = (id, entries, label, unit, fmt, empty) => {
    const host = document.getElementById(id);
    if (!host) return;
    if (!entries.length) {
      host.innerHTML = `<div class="card muted small">${empty}</div>`;
      return;
    }
    entries.forEach(([key, points]) => {
      host.appendChild(sparkPanel({ label: label(key), points, unit, fmt }));
    });
  };

  fill('sparkEx',
    [...perExercise.entries()].sort((a, b) => b[1].length - a[1].length),
    (id) => EX_BY_ID.get(id).db.name, 'kg', kgFmt,
    'Sobald du mit Hanteln trainierst, steht hier der Verlauf je Übung.');

  fill('sparkMus',
    [...perMuscle.entries()].sort((a, b) => b[1].length - a[1].length),
    (m) => MUSCLE_LABEL[m] || m, 'kg', (v) => Math.round(v).toLocaleString('de-DE'),
    'Noch kein Volumen erfasst. Nur Hantel-Einheiten tragen Kilo bei.');
}

            2:30 beim Squat, 0:45 bei Crunches. Aus schaltet auf eine feste Länge um.</div>
        </div>
        <button type="button" class="toggle" aria-pressed="${s.useExerciseRest}" data-act="toggle-ex-rest" aria-label="Pause je Übung"></button>
      </div>
      ${s.useExerciseRest ? '' : `
      <div class="btn-row nav">
        ${[60, 90, 120, 180].map((sec) => `
          <button type="button" class="btn ${s.restSeconds === sec ? 'btn-primary' : ''}"
                  data-act="set-rest" data-sec="${sec}">${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}</button>`).join('')}
      </div>`}
      <div class="switch-row">
        <div>
          <div class="lbl">Signalton</div>
          <div class="hint">Zusätzlich vibriert das Handy. Der Ton wird erzeugt, nicht geladen – funktioniert also auch ohne Netz.</div>
        </div>
        <button type="button" class="toggle" aria-pressed="${s.sound}" data-act="toggle-sound" aria-label="Signalton"></button>
      </div>
      <div class="switch-row">
        <div>
          <div class="lbl">Pause abschalten</div>
          <div class="hint">Kein Timer, kein Ton – Sätze nur abhaken.</div>
        </div>
        <button type="button" class="toggle" aria-pressed="${!s.useExerciseRest && !s.restSeconds}" data-act="toggle-rest-off" aria-label="Pause abschalten"></button>
      </div>
    </div>

    <div class="section-title">Plan-Verschiebung</div>
    <div class="card">
      <div class="stat-v">${s.shift ? `+${esc(plural(s.shift, 'Tag', 'Tage'))}` : 'Im Plan'}</div>
      <div class="small muted" style="margin-top:2px">
        ${s.shift
          ? `Der offene Plan endet am ${esc(fmtDate(effDate(PLAN[PLAN.length - 1]), true))} statt am ${esc(fmtDate(PLAN[PLAN.length - 1].date, true))}.`
          : 'Der Plan läuft genau nach Excel-Termin.'}
      </div>
      <div class="btn-row nav">
        <button type="button" class="btn" data-act="shift-minus" ${s.shift ? '' : 'disabled'}>− 1 Tag</button>
        <button type="button" class="btn" data-act="shift-plus">+ 1 Tag</button>
        <button type="button" class="btn btn-ghost" data-act="shift-reset" ${s.shift ? '' : 'disabled'}>Auf Original</button>
      </div>
    </div>

    <div class="section-title">Daten</div>
    <div class="card">
      <div class="small muted">Alles liegt lokal im Browser. Sicherung als Text kopieren oder hier wieder einfügen.</div>
      <div class="btn-row">
        <button type="button" class="btn" data-act="export">Export anzeigen</button>
        <button type="button" class="btn" data-act="download">Als Datei sichern</button>
      </div>
      <textarea class="io" id="io" placeholder="Hier JSON einfügen und auf „Importieren“ tippen…" style="margin-top:10px"></textarea>
      <div class="btn-row">
        <button type="button" class="btn" data-act="import">Importieren</button>
        <button type="button" class="btn btn-danger" data-act="reset-all">Alle Daten löschen</button>
      </div>
    </div>


    <div class="section-title">Über den Plan</div>
    <div class="card small muted">
      ${PLAN.length} Einheiten, ursprünglich vom ${esc(fmtDate(PLAN[0].date, true))} bis ${esc(fmtDate(PLAN[PLAN.length - 1].date, true))},
      aufgebaut auf ${EXERCISES.length} Grundübungen. Zu jeder Hantelübung gehört ein
      Bodyweight-Äquivalent mit gleicher Satzzahl und angepasstem Wiederholungsbereich.
    </div>
  `;
}

/* ------------------------------------------------------------------ *
 * Rendering / Routing
 * ------------------------------------------------------------------ */

const RENDERERS = {
  dashboard: () => {
    const sess = store.getState().session;
    if (ui.focus && sess && sess.n === ui.workoutNo) renderFocus();
    else if (ui.listView) renderDashboard();
    else renderOverview();
  },
  plan: renderPlan,
  stats: renderStats,
  settings: renderSettings,
};

function render() {
  const mode = ui.tab === 'dashboard' ? store.workoutMode(ui.workoutNo) : store.getState().mode;
  document.body.classList.toggle('mode-bw', mode === 'bw');
  modeSwitch.querySelectorAll('.mode-btn').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
  });
  tabbar.querySelectorAll('.tab').forEach((b) => {
    b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab));
  });
  clearFigures(); // alte Animationen abmelden, bevor das DOM ersetzt wird
  (RENDERERS[ui.tab] || renderDashboard)();
}

function go(tab) {
  ui.tab = tab;
  render();
  window.scrollTo({ top: 0 });
}

/* ------------------------------------------------------------------ *
 * Events
 * ------------------------------------------------------------------ */

tabbar.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (btn) go(btn.dataset.tab);
});

modeSwitch.addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-btn');
  if (!btn) return;
  const mode = btn.dataset.mode;
  if (ui.tab === 'dashboard') store.setWorkoutMode(ui.workoutNo, mode);
  else store.setMode(mode);
  render();
  toast(mode === 'bw' ? '🤸 Bodyweight-Variante' : '🏋️ Hantel-Variante');
});

view.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const n = ui.workoutNo;
  const mode = store.workoutMode(n);

  switch (act) {
    case 'toggle-ex': {
      const id = t.dataset.ex;
      if (ui.openEx.has(id)) ui.openEx.delete(id); else ui.openEx.add(id);
      render();
      break;
    }
    case 'toggle-set': {
      const id = t.dataset.ex;
      const i = Number(t.dataset.i);
      const item = workoutByNo(n).ex.find((x) => x.id === id);
      const cur = store.getSets(n, mode, id, item.sets)[i].done;
      const variant = resolve(item, mode);
      initAudio(); // Berührung nutzen, solange der Browser Ton noch erlaubt

      // Beim Abhaken das benutzte Gewicht mitschreiben – daraus speist sich
      // später der Vergleich "Zuletzt" und die Volumenrechnung.
      const patch = { done: !cur };
      if (!cur && variant.weight !== null) patch.w = fmtKg(usedWeight(n, mode, id));
      else if (cur) patch.w = '';
      store.updateSet(n, mode, id, item.sets, i, patch);

      const done = !cur;
      const workoutComplete = done && progressOf(n, mode).complete;
      const exDone = done && i === item.sets - 1
        && store.getSets(n, mode, id, item.sets).every((s) => s.done);

      // In der Fokus-Ansicht von selbst zur nächsten offenen Übung rücken.
      if (ui.focus && exDone && !workoutComplete) {
        const nextIdx = firstOpenExercise(n, mode);
        if (nextIdx !== ui.focusIdx) {
          ui.focusIdx = nextIdx;
          toast(`Weiter: ${resolve(workoutByNo(n).ex[nextIdx], mode).name}`);
        }
      }
      render();
      // Pause nur nach einem gesetzten Haken und nie nach dem letzten Satz
      // einer Übung – und auch nicht, wenn das Workout damit fertig ist.
      if (done && !workoutComplete && i < item.sets - 1) {
        startRest(variant.name, i, item.sets, restFor(variant));
      } else if (store.getState().rest) {
        endRest(false);
      }
      if (workoutComplete) toast('Workout abgeschlossen 🎉');
      break;
    }
    case 'weight-step': {
      const id = t.dataset.ex;
      const kg = store.setWeight(id, (workingWeight(id) || 0) + Number(t.dataset.d));
      render();
      // Steht heute schon ein Satz, gilt die Änderung erst beim nächsten Mal.
      const started = (store.peekSets(n, mode, id) || []).some((s) => s.w !== '');
      toast(started ? `Nächstes Mal ${fmtKg(kg)} kg` : `${fmtKg(kg)} kg`);
      break;
    }
    case 'start-session':
      initAudio(); // Ton jetzt freischalten, damit das erste Pausensignal sitzt
      store.startSession(n);
      ui.focus = true;
      ui.listView = false;
      ui.focusIdx = firstOpenExercise(n, mode);
      render();
      toast('Los geht’s 💪');
      break;
    case 'end-session':
      store.endSession();
      ui.focus = false;
      ui.listView = false;
      if (store.getState().rest) endRest(false);
      render();
      toast('Training beendet');
      break;
    case 'focus-list':
      ui.focus = false;
      ui.listView = true;
      render();
      break;
    case 'show-list':
      ui.listView = true;
      render();
      break;
    case 'focus-back': // aus der Liste zurück in die laufende Übung
      ui.focus = true;
      ui.listView = false;
      render();
      break;
    case 'hide-list':
      ui.listView = false;
      render();
      break;
    case 'focus-step':
      ui.focusIdx = Math.max(0, Math.min(workoutByNo(n).ex.length - 1, ui.focusIdx + Number(t.dataset.d)));
      render();
      break;
    case 'complete-workout':
      store.completeWorkout(n, mode, workoutByNo(n).ex);
      if (store.getState().rest) endRest(false);
      render();
      toast('Alle Sätze abgehakt 🎉');
      break;
    case 'reset-workout':
      if (!hasAnyEntry(n, mode) || confirm(`Workout ${n} (${MODE_LABEL[mode]}) wirklich zurücksetzen?`)) {
        store.resetWorkout(n, mode);
        if (store.getState().rest) endRest(false);
        render();
        toast('Zurückgesetzt');
      }
      break;
    case 'nav-workout': {
      const next = n + Number(t.dataset.delta);
      if (PLAN.some((w) => w.n === next)) {
        ui.workoutNo = next;
        ui.openEx.clear();
        ui.listView = false;
        render();
      }
      break;
    }
    case 'nav-today':
      ui.workoutNo = defaultWorkoutNo();
      ui.openEx.clear();
      ui.listView = false;
      render();
      break;
    case 'open-workout':
      ui.workoutNo = Number(t.dataset.n);
      ui.openEx.clear();
      ui.listView = false;
      go('dashboard');
      break;
    case 'plan-filter':
      ui.planFilter = t.dataset.f;
      render();
      break;
    case 'toggle-default-mode':
      store.setMode(store.getState().mode === 'bw' ? 'db' : 'bw');
      render();
      break;
    case 'toggle-keep-mode':
      store.setSetting('keepModePerWorkout', !store.getState().keepModePerWorkout);
      render();
      break;
    case 'toggle-auto-shift': {
      const on = !store.getState().autoShift;
      store.setSetting('autoShift', on);
      if (on) catchUpPlan();
      render();
      toast(on ? 'Verpasste Tage rücken nach' : 'Plan bleibt auf den Original-Terminen');
      break;
    }
    case 'set-rest':
      initAudio();
      store.setSetting('restSeconds', Number(t.dataset.sec));
      render();
      break;
    case 'toggle-sound': {
      initAudio();
      const on = !store.getState().sound;
      store.setSetting('sound', on);
      render();
      if (on) beep();
      break;
    }
    case 'toggle-ex-rest':
      store.setSetting('useExerciseRest', !store.getState().useExerciseRest);
      render();
      break;
    case 'toggle-rest-off': {
      const off = !store.getState().useExerciseRest && !store.getState().restSeconds;
      store.setSetting('useExerciseRest', off);
      store.setSetting('restSeconds', off ? 90 : 0);
      if (store.getState().rest) endRest(false);
      render();
      break;
    }
    case 'shift-plus':
    case 'shift-minus':
      store.setShift(store.getState().shift + (act === 'shift-plus' ? 1 : -1));
      render();
      break;
    case 'shift-reset':
      store.setShift(0);
      render();
      toast('Original-Termine wiederhergestellt');
      break;
    case 'export': {
      const io = document.getElementById('io');
      io.value = store.exportJSON();
      io.select();
      toast('Export erzeugt – kopieren und sicher ablegen.');
      break;
    }
    case 'download': {
      const json = store.exportJSON();
      // Manche Umgebungen – eingebettete Ansichten, strenge Browser – lassen
      // den Download stillschweigend fallen. Deshalb steht der Export danach
      // immer auch im Textfeld zum Kopieren.
      document.getElementById('io').value = json;
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `workout-backup-${todayISO()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Gesichert – falls kein Download kam: Text unten kopieren');
      break;
    }
    case 'import': {
      const io = document.getElementById('io');
      try {
        store.importJSON(io.value);
        render();
        toast('Import erfolgreich');
      } catch (err) {
        toast(`Import fehlgeschlagen: ${err.message}`);
      }
      break;
    }
    case 'reset-all':
      if (confirm('Wirklich alle protokollierten Sätze und Einstellungen löschen?')) {
        store.resetAll();
        ui.workoutNo = defaultWorkoutNo();
        render();
        toast('Alle Daten gelöscht');
      }
      break;
    default:
      break;
  }
});

view.addEventListener('keydown', (e) => {
  const head = e.target.closest('.ex-head');
  if (head && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    head.click();
  }
});

// Texteingaben: still speichern, damit der Fokus beim Tippen erhalten bleibt.
view.addEventListener('input', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.dataset.act === 'weight-input') {
    const kg = parseFloat(t.value.replace(',', '.'));
    if (!Number.isNaN(kg)) store.setWeight(t.dataset.ex, kg);
  } else if (t.dataset.act === 'set-input') {
    const n = ui.workoutNo;
    const mode = store.workoutMode(n);
    const item = workoutByNo(n).ex.find((x) => x.id === t.dataset.ex);
    store.updateSet(n, mode, t.dataset.ex, item.sets, Number(t.dataset.i), { [t.dataset.field]: t.value });
  }
});

/* ------------------------------------------------------------------ *
 * Start
 * ------------------------------------------------------------------ */

// Bleibt die App über Mitternacht offen, muss der Plan beim Zurückkommen
// nachgezogen werden – sonst steht dort weiter das Datum von gestern.
let lastSeenDay = todayISO();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    store.flush();
    return;
  }
  tickRest(); // war das Handy gesperrt, ist die Pause womöglich abgelaufen
  const day = todayISO();
  const shifted = catchUpPlan();
  if (shifted || day !== lastSeenDay) {
    lastSeenDay = day;
    render();
  }
});

window.addEventListener('pagehide', store.flush);

// Offline-Betrieb. Nur über http(s) – unter file:// gibt es keine Service
// Worker, und die gebündelte Einzeldatei braucht sie ohnehin nicht.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // Kein Offline-Betrieb, aber die App läuft normal weiter.
    });
  });
}

const missedAtStart = catchUpPlan();
render();
tickRest(); // eine Pause, die einen Neustart der Seite überdauert hat
if (missedAtStart) {
  toast(`↷ ${plural(missedAtStart, 'Tag', 'Tage')} verpasst – Plan nachgerückt`);
}
</script>
</body>
</html>
