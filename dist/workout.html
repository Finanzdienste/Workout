<style>
:root {
  --bg: #0f1115;
  --bg-elev: #171a21;
  --bg-elev-2: #1f232c;
  --line: #2a2f3a;
  --text: #e8eaed;
  --muted: #9aa3b2;
  /* Zwei Akzentfarben, nicht eine: Die Hantel-Variante ist warm, die
     Bodyweight-Variante kühl – daran erkennt man den Modus, ohne den Schalter
     zu lesen. Beide kommen aus dem gewählten Farbdesign (siehe unten). */
  --accent-db: #ff7a45;
  --accent-bw: #4ea1ff;
  --accent: var(--accent-db);
  --accent-2: #4ea1ff;
  --ok: #3ecf8e;
  --radius: 14px;
  --tabbar-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

body.mode-bw {
  --accent: var(--accent-bw);
}

/* Farbdesign. Nur die beiden Akzente ändern sich – Hintergrund, Linien und das
   Grün für "erledigt" bleiben, damit die App überall gleich lesbar ist.
   Am <html>, nicht am <body>: --accent wird oben auf :root aus --accent-db
   abgeleitet und würde sonst weiter den Standardwert von dort nehmen. */
:root[data-theme="rosa"]    { --accent-db: #ff6fae; --accent-bw: #b98cff; --accent-2: #b98cff; }
:root[data-theme="blau"]    { --accent-db: #4ea1ff; --accent-bw: #4ecfd0; --accent-2: #4ecfd0; }
:root[data-theme="gruen"]   { --accent-db: #3ecf8e; --accent-bw: #7ad0ff; --accent-2: #7ad0ff; }
:root[data-theme="violett"] { --accent-db: #a78bfa; --accent-bw: #f0abfc; --accent-2: #f0abfc; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  /* Kein Ziehen-zum-Neuladen. Am oberen Rand nach unten zu wischen lud sonst
     die Seite neu, und das warf einen aus jedem Tab zurück aufs Dashboard –
     mitten im Training genau die falsche Geste. */
  overscroll-behavior-y: contain;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

button { font: inherit; color: inherit; }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(15, 17, 21, .92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-in {
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .3px;
}
.brand::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
  transition: background .2s;
}

.mode-switch {
  margin-left: auto;
  display: flex;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
/* [hidden] allein reicht nicht, sobald display gesetzt ist. */
.mode-switch[hidden] { display: none; }
.mode-btn {
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: background .18s, color .18s;
}
.mode-btn[aria-pressed="true"] {
  background: var(--accent);
  color: #10131a;
}

/* ---------- View / layout ---------- */
.view {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 14px calc(var(--tabbar-h) + var(--safe-b) + 28px);
}

.section-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
  margin: 26px 0 10px;
  font-weight: 700;
}
.section-title:first-child { margin-top: 4px; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- Dashboard hero ---------- */
.hero-eyebrow {
  font-size: 12px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
.hero-title {
  margin: 4px 0 2px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.4px;
}
.hero-sub {
  color: var(--muted);
  font-size: 14px;
}
.hero-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.badge {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.badge.accent {
  border-color: var(--accent);
  color: var(--accent);
}
.badge.done {
  border-color: var(--ok);
  color: var(--ok);
}

.progress {
  height: 8px;
  background: var(--bg-elev-2);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 14px;
}
.progress > i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width .3s ease;
}

/* ---------- Exercise cards ---------- */
.ex {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.ex.complete { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }

.ex-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  cursor: pointer;
  user-select: none;
}
.ex-idx {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--bg-elev-2);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.ex.complete .ex-idx { background: var(--ok); color: #0d1b14; }
.ex-main { min-width: 0; }
.ex-name {
  display: block;
  font-weight: 650;
  font-size: 15.5px;
  line-height: 1.3;
}
.ex-meta {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 3px;
}
.ex-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.chev {
  color: var(--muted);
  font-size: 12px;
  transition: transform .2s;
}
.ex.open .chev { transform: rotate(180deg); }

/* Gewichtszeile: ein Arbeitsgewicht je Übung. */
.ex-weight {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px 10px;
}
.kg-step {
  flex: none;
  width: 46px; height: 46px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--text);
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.kg-plus {
  background: color-mix(in srgb, var(--accent) 22%, var(--bg-elev-2));
  border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
  color: var(--accent);
}
.kg-step:active { transform: scale(.95); }
.kg-main {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
}
.kg-val {
  width: 3.6em;
  background: transparent;
  border: 0;
  border-bottom: 1px dashed var(--line);
  color: var(--text);
  font-size: 24px;
  font-weight: 800;
  text-align: right;
  padding: 2px 2px 3px;
  font-variant-numeric: tabular-nums;
}
.kg-val:focus { outline: none; border-bottom-color: var(--accent); }
/* Derselbe Platz, aber nichts zum Hineinschreiben: der Wiederholungsbereich. */
.kg-fest { width: auto; border-bottom-color: transparent; white-space: nowrap; }
.kg-unit { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.kg-next {
  margin: -4px 14px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}

.ex-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  font-size: 12px;
  color: var(--muted);
}
.ex-facts span {
  background: var(--bg-elev-2);
  border-radius: 999px;
  padding: 4px 10px;
}

/* Satz-Knöpfe: immer sichtbar, daumengroß. */
.ex-sets {
  display: flex;
  gap: 8px;
  padding: 0 14px 14px;
}
.set-btn {
  flex: 1 1 0;
  min-width: 0;
  height: 48px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--muted);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s, color .12s, border-color .12s;
}
.set-btn.on {
  background: var(--ok);
  border-color: var(--ok);
  color: #0d1b14;
}
.set-btn:active { transform: scale(.97); }

.ex-body {
  display: none;
  border-top: 1px solid var(--line);
  padding: 12px 14px 14px;
}
.ex.open .ex-body { display: block; }

.cue {
  font-size: 13.5px;
  color: var(--muted);
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 12px;
}

.set-row {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.set-row .set-no {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}
.set-row input {
  width: 100%;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 10px;
  font-size: 14px;
  min-width: 0;
}
.set-row input:focus {
  outline: none;
  border-color: var(--accent);
}
.set-row input::placeholder { color: #5d6675; }

.chk {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--muted);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 15px;
  padding: 0;
}
.chk[aria-pressed="true"] {
  background: var(--ok);
  border-color: var(--ok);
  color: #0d1b14;
}

.set-legend {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 700;
}

.last-time {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  border-radius: 11px;
  padding: 12px 16px;
  font-size: 14.5px;
  font-weight: 650;
  cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #10131a;
}
.btn-ghost { background: transparent; }
.btn-danger { color: #ff6b6b; border-color: #4a2a2f; }
/* Abschließen ist der übliche Weg und darf das auch aussehen. */
.btn-ok {
  color: #0d1b14;
  background: var(--ok);
  border-color: var(--ok);
  font-weight: 800;
}
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn-row .btn { flex: 1 1 140px; }
.btn-row.nav { flex-wrap: nowrap; }
.btn-row.nav .btn { flex: 1 1 0; min-width: 0; padding: 11px 4px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }

.plan-date { display: block; font-size: 14.5px; font-weight: 600; }

.done-notice { border-color: var(--ok); color: var(--ok); }

/* ---------- Exercise library ---------- */
.lib-item { padding: 14px; }
.lib-group {
  font-size: 11px; letter-spacing: .7px; text-transform: uppercase;
  color: var(--muted); font-weight: 700;
}
.swap {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
  margin-top: 10px;
}
.swap-side {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
}
.swap-side.active { border-color: var(--accent); }
.swap-label {
  font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted); font-weight: 700; margin-bottom: 4px;
}
.swap-name { font-size: 14px; font-weight: 650; line-height: 1.3; }
.swap-reps { font-size: 12px; color: var(--muted); margin-top: 3px; }
.swap-arrow {
  display: grid; place-items: center;
  color: var(--muted); font-size: 15px;
}
.cue-pair { margin-top: 10px; font-size: 13px; color: var(--muted); }
.cue-pair b { color: var(--text); font-weight: 600; }

/* ---------- Stats ---------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.stat {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.stat-v { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.stat-l { font-size: 12px; color: var(--muted); margin-top: 2px; }

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 1fr 44px; gap: 10px; align-items: center; }
.bar-name { font-size: 13px; }
.bar-track {
  height: 6px; background: var(--bg-elev-2); border-radius: 999px;
  overflow: hidden; margin-top: 4px;
}
.bar-track > i { display: block; height: 100%; background: var(--accent-2); }
.bar-val { font-size: 12px; color: var(--muted); text-align: right; }

/* ---------- Fokus-Ansicht ---------- */
.focus-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}
.focus-count { font-size: 12.5px; color: var(--muted); font-weight: 600; text-align: right; }

/* Zwei Startknöpfe: die Variante wird beim Starten gewählt, nicht danach. */
/* Nebeneinander, nicht untereinander: Die Startansicht soll auf einen
   Bildschirm passen, und die Körperkarte darüber braucht den Platz. */
.start-paar { display: flex; gap: 8px; }
.start-paar .btn-start { flex: 1 1 0; margin: 0; min-width: 0; }
.btn-start.zweit {
  background: var(--bg-elev-2); color: var(--text);
  border: 1px solid var(--line);
}

/* Trainingsfokus: eine Karte je Variante */
.fokus-liste { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.fokus-btn {
  display: flex; flex-direction: column; gap: 3px; width: 100%;
  padding: 12px; text-align: left;
  background: var(--bg-elev-2); border: 1px solid var(--line);
  border-radius: 10px; color: var(--text);
}
.fokus-btn.on { border-color: var(--accent); }
.fokus-btn .lbl { font-size: 15px; }
.fokus-zahl { font-size: 12px; color: var(--muted); font-weight: 600; }

/* Farbwahl in den Einstellungen */
.farben { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.farb-btn {
  flex: 1 1 60px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 4px; font-size: 12px; font-weight: 600;
  color: var(--muted); background: var(--bg-elev-2);
  border: 1px solid var(--line); border-radius: 10px;
}
.farb-btn.on { color: var(--text); border-color: var(--accent); }
.farb-punkt {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%);
}

/* Baukasten für eigene Workouts */
.cx-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.cx-row:first-child { border-top: 0; }
.cx-main { flex: 1; min-width: 0; }
.cx-sets { display: flex; align-items: center; gap: 6px; flex: none; }
.cx-num { min-width: 20px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.cx-del { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 4px; flex: none; }
.cx-group {
  font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); font-weight: 700; margin: 12px 0 6px;
}
.cx-group:first-child { margin-top: 0; }

/* Vergleich mit Freunden */
.vgl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.vgl th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); font-weight: 700; padding: 0 6px 6px 0;
}
.vgl td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
.vgl tr.ich td { color: var(--accent); }
.vgl-rang { font-weight: 800; color: var(--muted); width: 18px; }
.vgl-weg { background: none; border: 0; color: var(--muted); font-size: 15px; padding: 0 2px; }

/* Bandstärke statt Gewicht: gelb leicht, rot schwer. */
.band-row { display: flex; gap: 8px; padding: 0 0 10px; }
.band-btn {
  flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 8px; font-size: 14px; font-weight: 700;
  color: var(--muted); background: var(--bg-elev-2);
  border: 1px solid var(--line); border-radius: 10px;
}
.band-wie { font-size: 12px; font-weight: 600; opacity: .7; }
.band-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.band-gelb .band-dot { background: #f2c14e; }
.band-rot .band-dot { background: #e2564d; }
.band-btn.on { color: var(--text); }
.band-gelb.on { border-color: #f2c14e; }
.band-rot.on { border-color: #e2564d; }
.ex-weight + .band-row, .focus-weight + .band-row { margin-top: 0; }

/* Einstiege oben unter Mehr: Kalender und Verletzungen. */
.kachel-karte { padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.kachel {
  display: flex; align-items: flex-start; gap: 12px; width: 100%;
  padding: 12px 10px; text-align: left;
  background: none; border: 0; border-radius: 10px; color: var(--text);
}
.kachel + .kachel { border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; }
.kachel-i { font-size: 20px; line-height: 1.2; }
.kachel .lbl { display: block; }
.kachel .hint { display: block; }

/* Ausführliche Erklärung, aufklappbar */
.detail-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; margin: 0 0 10px;
  padding: 10px 12px; font-size: 13px; font-weight: 600;
  color: var(--muted); background: var(--bg-elev-2);
  border: 1px solid var(--line); border-radius: 10px;
}
.detail-toggle .chev { font-size: 10px; transition: transform .15s; }
.detail-toggle.on { color: var(--text); }
.detail-toggle.on .chev { transform: rotate(180deg); }
.detail {
  margin: 0 0 12px; padding: 2px 12px 10px;
  border-left: 2px solid var(--line);
}
.detail-h { font-size: 13px; font-weight: 700; margin-top: 12px; }
.detail-h:first-child { margin-top: 2px; }
.detail p { margin: 3px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }

/* Namensfeld auf der Willkommensseite und in den Einstellungen. */
.name-input {
  width: 100%; margin-top: 10px;
  padding: 12px; font-size: 16px; font-weight: 600;
  color: var(--text); background: var(--bg-elev-2);
  border: 1px solid var(--line); border-radius: 10px;
}
.name-input.schmal { width: 120px; margin: 0; text-align: right; padding: 8px 10px; }
.welcome .card p { margin: 0 0 10px; }
.welcome .card p:last-of-type { margin-bottom: 0; }

/* Rüstzeile: was vor dieser Übung umzubauen ist. */
.ruest {
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  margin: 0 0 8px;
}
.ruest.gleich { color: var(--ok); }

/* Fortschrittsleiste: ein Kasten je Übung, darunter ein Feld je Satz.
   flex-grow steht am Element und kommt aus der Satzzahl. */
.prog { display: flex; gap: 7px; margin: 0 0 12px; }
.prog-ex {
  flex: 1 1 0; min-width: 0;
  display: flex; padding: 0; border: 0; background: none;
}
.prog-sets { display: flex; gap: 2px; width: 100%; }
.prog-sets i { flex: 1 1 0; height: 10px; border-radius: 3px; background: var(--line); }
.prog-sets i.on { background: var(--ok); }
/* Die laufende Übung: ihre offenen Felder sind umrandet. Ein eigener Balken
   darüber sagte nichts, was die Felder nicht schon sagen. */
.prog-ex.cur .prog-sets i { box-shadow: inset 0 0 0 1.5px var(--accent); }

.focus-fig {
  position: relative;
  height: 270px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px;
  margin-bottom: 14px;
}
/* Dieselbe Figur in der aufgeklappten Karte der Übungsliste, nur flacher –
   dort teilt sie sich den Platz mit Hinweis, Pause und letztem Mal. */
.ex-fig {
  position: relative;
  height: 210px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px;
  margin-bottom: 10px;
}
.focus-name {
  margin: 0 0 3px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.5px;
  line-height: 1.15;
}
.focus-meta { font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
.focus-weight { padding: 0 0 10px; }
.focus-next { margin: -4px 0 10px; }
.focus-sets { display: flex; gap: 10px; margin-bottom: 14px; }
.focus-set { height: 68px; font-size: 22px; }
.focus-cue { margin-bottom: 4px; }

/* ---------- Verlaufskarten ---------- */
.spark-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.spark {
  margin: 0;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 10px 8px;
  touch-action: pan-y;
}
.spark figcaption {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
}
.spark-name {
  font-size: 12px;
  color: var(--muted);
  font-weight: 650;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.spark-val {
  font-size: 15px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  flex: none;
}
.spark-svg { display: block; width: 100%; height: 46px; }
.spark-area { fill: var(--accent); opacity: .10; stroke: none; }
.spark-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.spark-dot {
  fill: var(--accent);
  stroke: var(--bg-elev);        /* Ring in der Untergrundfarbe */
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}
.spark-foot {
  margin-top: 6px;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-height: 14px;
}

/* ---------- Tabbar ---------- */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  background: rgba(15, 17, 21, .96);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b);
}
.tab {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 600;
  padding: 8px 2px;
  height: var(--tabbar-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
}
.tab .ti { font-size: 19px; line-height: 1; filter: grayscale(1) opacity(.65); }
.tab[aria-selected="true"] { color: var(--accent); }
.tab[aria-selected="true"] .ti { filter: none; }

/* ---------- Körperkarte ---------- */
.bm-wrap {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 10px 6px;
  margin-bottom: 10px;
}
.bodymap { display: block; width: 100%; height: auto; }
.bm-filler { fill: #333a48; }
.bm-part {
  fill: #454e5f;
  transition: fill .25s ease;
}
.bm-part.on { fill: var(--accent); }
/* Mitarbeitende Gruppen blasser – sonst sagt die Karte an einem
   Ganzkörpertag nichts mehr aus, weil alles gleich hell leuchtet. */
.bm-part.on.sub { fill: color-mix(in srgb, var(--accent) 52%, var(--bg-elev)); }
/* Dünne Trennlinie in Hintergrundfarbe: ohne sie verschmelzen benachbarte
   Bereiche an einem Ganzkörpertag zu einem einzigen orangen Fleck. */
.bm-part { stroke: var(--bg-elev); stroke-width: .8; }
.bm-label {
  fill: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  text-anchor: middle;
}
.bm-legend {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}
.bm-legend span.sub {
  background: transparent;
  border-color: var(--line);
  color: var(--muted);
}
.bm-legend span {
  background: color-mix(in srgb, var(--accent) 16%, var(--bg-elev));
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  color: var(--accent);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 650;
}

/* ---------- Startansicht ---------- */
/* Eine Bildschirmseite ohne Scrollen: Kopf und Fuss nehmen, was sie brauchen,
   der Koerper bekommt den Rest. */
.ov {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: calc(100vh - 158px);
  min-height: calc(100dvh - 158px);
}
.ov-top { flex: none; }
.ov-top .hero-title { font-size: 28px; margin: 2px 0 3px; }
.ov-prog { font-size: 12.5px; color: var(--muted); margin-top: 6px; font-weight: 600; }

.ov-body {
  flex: 1 1 auto;
  min-height: 170px;
  position: relative;   /* damit die Karte den Rahmen ausfuellt, statt ihn
                           ueber ihr Seitenverhaeltnis aufzublaehen */
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.ov-body .bodymap {
  position: absolute;
  inset: 12px 10px 6px;
  width: calc(100% - 20px);
  height: calc(100% - 18px);
}

.btn-start {
  flex: none;
  height: 60px;
  font-size: 17.5px;
  margin: 0;
}

.ov-foot {
  flex: none;
  display: flex;
  gap: 8px;
}
.ov-nav {
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--muted);
  border-radius: 11px;
  height: 44px;
  min-width: 52px;
  font-size: 15px;
  font-weight: 650;
  cursor: pointer;
}
.ov-nav.wide { flex: 1; }
.ov-nav:disabled { opacity: .35; }

/* ---------- Bewegungsablauf ---------- */
.fig {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;    /* Ziehen dreht die Figur, in jede Richtung */
  cursor: grab;
  user-select: none;
}
.fig:active { cursor: grabbing; }

.fig-hint {
  position: absolute;
  right: 14px;
  bottom: 10px;
  font-size: 11px;
  font-weight: 650;
  color: var(--muted);
  pointer-events: none;
  transition: opacity .4s;
}
.fig-hint.gone { opacity: 0; }

/* Gliedmaßen sind Flächen, keine Striche: nur so lassen sie sich zum Gelenk
   hin verjüngen und je nach Tiefe abdunkeln. Die Trennlinie in Hintergrundfarbe
   hält sie auseinander – in der tiefen Hocke lag sonst alles als ein Klumpen
   übereinander. Der Rumpf bleibt ohne, seine Flächen gehören zusammen. */
.fig-limb, .fig-spine, .fig-torso, .fig-head {
  fill: var(--accent);
  stroke: none;
}
.fig-limb, .fig-spine, .fig-head {
  stroke: var(--bg-elev);
  stroke-width: .9;
  stroke-linejoin: round;
}

.fig-plate { fill: #e8eaed; }
.fig-bar { stroke: #e8eaed; stroke-linecap: round; }
.fig-bar-fixed { stroke: var(--line); stroke-width: 2.5; stroke-linecap: round; }
.fig-ground { fill: var(--line); opacity: .55; }
.fig-bench { fill: #4a5468; }
.fig-bench-leg { stroke: #3b4354; stroke-linecap: round; }

/* ---------- Pausentimer ---------- */
.rest-bar {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--tabbar-h) + var(--safe-b));
  z-index: 35;
  background: var(--bg-elev-2);
  border-top: 1px solid var(--accent);
  box-shadow: 0 -8px 24px rgba(0, 0, 0, .45);
}
.rest-bar[hidden] { display: none; }
/* Die letzten fünf Sekunden: Zeit, zur Hantel zu gehen. */
.rest-bar.ready { border-top-color: var(--ok); }
.rest-bar.ready .rest-time, .rest-bar.ready .rest-label { color: var(--ok); }
.rest-bar.ready .rest-track > i { background: var(--ok); }
.rest-in {
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;

<script type="module">
/* ===== js/dates.js ===== */
const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
  'August', 'September', 'Oktober', 'November', 'Dezember'];

const pad = (n) => String(n).padStart(2, '0');

function toISO(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function todayISO() {
  return toISO(new Date());
}

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function addDays(iso, days) {
  if (!days) return iso;
  const d = parseISO(iso);
  d.setDate(d.getDate() + days);
  return toISO(d);
}

/** Ganze Tage von isoA bis isoB; positiv, wenn isoB später liegt. */
function daysBetween(isoA, isoB) {
  return Math.round((parseISO(isoB) - parseISO(isoA)) / 86400000);
}

function fmtDate(iso, long) {
  const d = parseISO(iso);
  const wd = WEEKDAYS[d.getDay()];
  if (long) return `${wd}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return `${wd}, ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
}

function plural(n, one, many) {
  return `${n} ${n === 1 ? one : many}`;
}

/** Kürzel der Wochentage, montags zuerst – so steht ein Kalender hierzulande. */
const WEEK_HEAD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

function fmtMonth(iso) {
  const d = parseISO(iso);
  return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

/** Erster Tag des Monats, in dem `iso` liegt. */
function monthStart(iso) {
  return `${iso.slice(0, 7)}-01`;
}

/** `n` Monate weiter, immer auf den Ersten. Über Jahresgrenzen hinweg. */
function addMonths(iso, n) {
  const d = parseISO(monthStart(iso));
  d.setMonth(d.getMonth() + n);
  return toISO(d);
}

/**
 * Alle Tage, die ein Monatsraster zeigt: ganze Wochen von Montag bis Sonntag,
 * vorn und hinten mit den Nachbarmonaten aufgefüllt.
 */
function monthGrid(iso) {
  const first = parseISO(monthStart(iso));
  const lead = (first.getDay() + 6) % 7;          // Mo = 0
  // Monatslänge über den Abstand zum nächsten Ersten. Math.round, weil eine
  // Zeitumstellung im Monat sonst eine Stunde fehlen ließe.
  const len = Math.round((parseISO(addMonths(iso, 1)) - first) / 86400000);
  const cells = Math.ceil((lead + len) / 7) * 7;
  const out = [];
  for (let i = 0; i < cells; i++) {
    const d = new Date(first);
    d.setDate(d.getDate() - lead + i);
    out.push(toISO(d));
  }
  return out;
}

/* ===== js/figure.js ===== */
/*
 * Bewegungsabläufe als drehbare 3D-Figur.
 *
 * Statt fester Punkte hält eine Stellung nur Gelenkwinkel; daraus rechnet
 * solve() das Skelett. Das ist nicht bloß kürzer, sondern hält die Figur
 * anatomisch beisammen: ein Knie kann nicht versehentlich neben der Hüfte
 * landen, und dieselbe Stellung stimmt aus jedem Blickwinkel.
 *
 * Koordinaten: x nach rechts, y nach oben, z nach vorn (zum Betrachter); die
 * Figur schaut nach +z. Gezeichnet wird mit schwacher Perspektive und
 * Maleralgorithmus – was hinten liegt, kommt zuerst. Ziehen dreht frei:
 * waagerecht um die Hochachse, senkrecht um die Querachse, beides unbegrenzt.
 * Auch Boden und Klimmzugstange liegen im Raum und kippen deshalb mit.
 *
 * Winkel in Grad:
 *   lean      Rumpfneigung nach vorn
 *   lie       'supine' oder 'prone' – Figur liegt, Kopf links
 *   tilt      Neigung der liegenden Figur, + hebt das Fußende
 *   arm.p     Schulter nach vorn (0 = Arm hängt)
 *   arm.a     Arm zur Seite abgespreizt
 *   arm.e     Ellenbogen gebeugt
 *   arm.i     Unterarm zur Körpermitte gedreht (beidhändiger Griff)
 *   leg.p     Hüfte gebeugt (Knie nach vorn)
 *   leg.a     Bein zur Seite
 *   leg.k     Knie gebeugt (Ferse nach hinten)
 */

const RIG = {
  hipW: 0.10, shoulderW: 0.215, shoulderY: 0.42,
  chestY: 0.28, neckY: 0.47, headY: 0.63, headR: 0.115,
  upperArm: 0.27, foreArm: 0.25, hand: 0.06,
  thigh: 0.44, shin: 0.42, foot: 0.15,
};

const rad = (d) => (d * Math.PI) / 180;
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (v, s) => [v[0] * s, v[1] * s, v[2] * s];

function rotX(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c];
}
function rotY(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c];
}
function rotZ(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]];
}

/** Punkt zwischen zwei projizierten Punkten. */
const mixPt = (p, q, f) => ({
  x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f, z: p.z + (q.z - p.z) * f,
});

const A = (p = 0, a = 0, e = 0, i = 0) => ({ p, a, e, i });
const L = (p = 0, a = 0, k = 0) => ({ p, a, k });

/** Gelenkpunkte einer Stellung, Hüftmitte im Ursprung. */
function solve(pose) {
  const R = RIG;
  const lean = pose.lean || 0;
  const up = rotX([0, 1, 0], lean);           // Rumpfachse, +lean = nach vorn
  const side = [1, 0, 0];                     // Schulterachse, von lean unberührt

  const hipC = [0, 0, 0];
  const chest = mul(up, R.chestY);
  const neck = mul(up, R.neckY);
  const head = mul(up, R.headY);
  const shoulderMid = mul(up, R.shoulderY);

  const joints = { hipC, chest, neck, head };

  ['L', 'R'].forEach((s) => {
    const sign = s === 'L' ? -1 : 1;

    // Arm: Richtung aus Neigung und Abspreizung, dann Ellenbogen beugen
    const arm = pose[`arm${s}`] || pose.arm || A();
    const shoulder = add(shoulderMid, mul(side, sign * R.shoulderW));
    const upperDir = rotX(rotZ([0, -1, 0], sign * arm.a), -arm.p + lean);
    const elbow = add(shoulder, mul(upperDir, R.upperArm));
    // arm.i dreht den Unterarm zur Körpermitte – nötig, wo beide Hände
    // dasselbe Gerät fassen, etwa die Hantel beim Goblet Squat.
    const foreDir = rotZ(rotX(upperDir, -arm.e), sign * (arm.i || 0));
    const hand = add(elbow, mul(foreDir, R.foreArm));

    // Bein: Hüfte beugen, dann Knie
    const leg = pose[`leg${s}`] || pose.leg || L();
    const hip = add(hipC, mul(side, sign * R.hipW));
    const thighDir = rotX(rotZ([0, -1, 0], sign * leg.a), -leg.p);
    const knee = add(hip, mul(thighDir, R.thigh));
    const shinDir = rotX(thighDir, leg.k);
    const ankle = add(knee, mul(shinDir, R.shin));
    const toe = add(ankle, mul(rotX(shinDir, -80 - leg.k * 0.25), R.foot));

    Object.assign(joints, {
      [`shoulder${s}`]: shoulder, [`elbow${s}`]: elbow, [`hand${s}`]: hand,
      [`hip${s}`]: hip, [`knee${s}`]: knee, [`ankle${s}`]: ankle, [`toe${s}`]: toe,
    });
  });

  // Wadenheben: der Körper steigt, die Zehen bleiben liegen. Nur so sieht man
  // die Ferse abheben – hebt man alles zusammen an, wandert bloß die ganze
  // Figur nach oben und die Bewegung ist unsichtbar.
  if (pose.heel) {
    // stance nennt das Standbein: beim einbeinigen Wadenheben darf nur dessen
    // Zeh liegen bleiben, sonst zieht sich das freie Bein in die Länge.
    const planted = pose.stance ? [`toe${pose.stance}`] : ['toeL', 'toeR'];
    Object.keys(joints).forEach((k) => {
      if (planted.includes(k)) return;
      joints[k] = [joints[k][0], joints[k][1] + pose.heel * 0.16, joints[k][2]];
    });
  }

  // Hinlegen. Früher wurde die stehende Figur mit zwei Winkeln (roll/tilt)
  // schräg gedreht, bis sie aus einem bestimmten Blickwinkel lag – aus jedem
  // anderen sah sie umgekippt aus. Jetzt ist es eine echte Lage: die Längsachse
  // des Körpers zeigt nach links (Kopf links, Füße rechts), der Bauch nach oben
  // (Rücklage) oder nach unten (Bauchlage).
  if (pose.lie) {
    const belly = pose.lie === 'prone' ? 90 : -90;
    Object.keys(joints).forEach((k) => { joints[k] = rotX(rotZ(joints[k], 90), belly); });
  }
  // Neigung der ganzen Figur um die Blickachse: bei liegenden Übungen hebt ein
  // positiver Wert das Fußende, so entsteht die Brücke beim Hip Thrust.
  if (pose.tilt) {
    Object.keys(joints).forEach((k) => { joints[k] = rotZ(joints[k], pose.tilt); });
  }
  return joints;
}

const NS = 'http://www.w3.org/2000/svg';
const CYCLE_MS = 4200;   // eine Wiederholung; das Tempo darin ist unsymmetrisch
const el = (name, attrs = {}) => {
  const node = document.createElementNS(NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
};

const active = new Set();

/**
 * Nur zeichnen, was zu sehen ist.
 *
 * In der Übungsliste können acht Karten gleichzeitig offen stehen, und jede
 * hat ihre Figur. Alle acht in jedem Bild neu zu zeichnen kostete auf einem
 * gedrosselten Gerät jede zehnte Bildwiedergabe – sichtbar als Ruckeln beim
 * Scrollen, für Figuren, die gerade gar nicht im Bild sind. Ein Beobachter
 * schaltet die Unsichtbaren ab; `sichtbar` bleibt true, wo es den Beobachter
 * nicht gibt, damit die Figur dort nicht stillsteht.
 */
const sichtbarkeit = typeof IntersectionObserver === 'function'
  ? new IntersectionObserver((eintraege) => {
    eintraege.forEach((e) => {
      const entry = e.target.__figEntry;
      if (entry) entry.sichtbar = e.isIntersecting;
    });
  }, { rootMargin: '80px' })
  : null;

/* ------------------------------------------------------------------ *
 * Stellen am Körper
 *
 * Für die Verletzungskarte: ein Name wie 'knie' muss zu Punkten im Raum
 * werden. Alles, was es doppelt gibt, wird auch doppelt markiert – der Plan
 * unterscheidet die Seiten nicht, und eine einseitige Marke würde eine
 * Genauigkeit vortäuschen, die nicht dahintersteckt.
 * ------------------------------------------------------------------ */

const between = (a, b, t) => [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t);

const SPOTS = {
  shoulder: (j) => [j.shoulderL, j.shoulderR],
  upperArm: (j) => [between(j.shoulderL, j.elbowL, 0.3), between(j.shoulderR, j.elbowR, 0.3)],
  elbow: (j) => [j.elbowL, j.elbowR],
  wrist: (j) => [between(j.elbowL, j.handL, 0.86), between(j.elbowR, j.handR, 0.86)],
  hand: (j) => [j.handL, j.handR],
  neck: (j) => [j.neck],
  chest: (j) => [j.chest],
  ribs: (j) => [between(j.chest, j.hipC, 0.35)],
  abs: (j) => [between(j.chest, j.hipC, 0.62)],
  lowerBack: (j) => [between(j.hipC, j.chest, 0.24)],
  pelvis: (j) => [j.hipC],
  groin: (j) => [between(j.hipC, between(j.kneeL, j.kneeR, 0.5), 0.16)],
  hip: (j) => [j.hipL, j.hipR],
  knee: (j) => [j.kneeL, j.kneeR],
  hamstring: (j) => [between(j.hipL, j.kneeL, 0.55), between(j.hipR, j.kneeR, 0.55)],
  calf: (j) => [between(j.kneeL, j.ankleL, 0.38), between(j.kneeR, j.ankleR, 0.38)],
  shin: (j) => [between(j.kneeL, j.ankleL, 0.5), between(j.kneeR, j.ankleR, 0.5)],
  achilles: (j) => [between(j.kneeL, j.ankleL, 0.9), between(j.kneeR, j.ankleR, 0.9)],
  ankle: (j) => [j.ankleL, j.ankleR],
};

/** Schwache Perspektive: weiter hinten = kleiner. */
function project(p, yaw, pitch, scale, cx, cy) {
  const r = rotX(rotY(p, yaw), pitch);
  const f = 3.4;
  const k = f / (f - r[2]);
  return { x: cx + r[0] * scale * k, y: cy - r[1] * scale * k, z: r[2], k };
}

function mountFigure(host, pattern, weight, equip, marks = []) {
  const spec = PATTERNS[pattern];
  host.textContent = '';
  if (!spec) return () => {};

  // Sichtfeld in der Form des Kastens: bei festem Quadrat blieb links und
  // rechts breiter Rand ungenutzt, und die Figur wirkte verloren.
  const box = host.getBoundingClientRect();
  const VBW = 100;
  const VBH = box.width > 0 ? Math.max(50, Math.min(160, Math.round((100 * box.height) / box.width))) : 100;
  // Mit Verletzungsmarken wird der Körper neutral gefärbt – sonst hebt sich
  // die Marke nicht ab, beides wäre in der Akzentfarbe.
  // Für Screenreader ist die Figur nichts wert: Sie besteht aus zwei Dutzend
  // namenlosen Formen, und was sie zeigt, steht als Text direkt daneben. Ohne
  // aria-hidden liest die Sprachausgabe hier eine Grafik nach der anderen vor,
  // ohne je etwas zu sagen.
  const svg = el('svg', {
    viewBox: `0 0 ${VBW} ${VBH}`,
    class: marks.length ? 'fig hurt-mode' : 'fig',
    'aria-hidden': 'true',
  });
  const scene = el('g');
  svg.appendChild(scene);
  host.appendChild(svg);

  // In den kleinen Verletzungskarten ist für den Hinweis kein Platz; dort
  // steht er im Fließtext daneben.
  const hint = document.createElement('span');
  hint.className = 'fig-hint';
  hint.textContent = '↕↔ ziehen zum Drehen';
  hint.setAttribute('aria-hidden', 'true');   // Drehen geht nur mit dem Finger
  if (!host.classList.contains('no-hint')) host.appendChild(hint);

  // Dreiviertelansicht steht der stehenden Figur am besten. Eine liegende ist
  // von der Seite dagegen zwangsläufig ein Strich – Rumpf, Arme und Beine
  // liegen in einer Linie. Dort schaut die Kamera von schräg oben auf den
  // Körper, dann trennen sich die Glieder wieder.
  let yaw = spec.view ? spec.view[0] : 25;
  let pitch = spec.view ? spec.view[1] : 8;
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  let lastT = 0;         // zuletzt gezeichneter Punkt der Bewegung

  const onDown = (e) => {
    dragging = true;
    const t = e.touches ? e.touches[0] : e;
    lastX = t.clientX;
    lastY = t.clientY;
    hint.classList.add('gone');
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    yaw = (yaw + (t.clientX - lastX) * 0.6) % 360;
    pitch = (pitch + (t.clientY - lastY) * 0.6) % 360;   // bewusst ohne Grenze
    lastX = t.clientX;
    lastY = t.clientY;
    draw(lastT);   // sofort neu zeichnen, statt auf die Animation zu warten
    e.preventDefault();
  };
  const onUp = () => { dragging = false; };

  host.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  const [a, b] = spec.poses;
  const blend = (t) => {
    const mix = (x, y) => x + (y - x) * t;
    const mixA = (x = A(), y = A()) => A(mix(x.p, y.p), mix(x.a, y.a), mix(x.e, y.e), mix(x.i || 0, y.i || 0));
    const mixL = (x = L(), y = L()) => L(mix(x.p, y.p), mix(x.a, y.a), mix(x.k, y.k));
    return {
      lie: spec.lie,                       // Lage gilt fürs ganze Muster
      stance: spec.stance,
      lean: mix(a.lean || 0, b.lean || 0),
      tilt: mix(a.tilt || 0, b.tilt || 0),
      heel: mix(a.heel || 0, b.heel || 0),
      armL: mixA(a.armL || a.arm, b.armL || b.arm),
      armR: mixA(a.armR || a.arm, b.armR || b.arm),
      legL: mixL(a.legL || a.leg, b.legL || b.leg),
      legR: mixL(a.legR || a.leg, b.legR || b.leg),
    };
  };

  /** Skelett einer Stellung, schon auf den Boden gesetzt. */
  const skeleton = (t) => {
    const j = solve(blend(t));
    // An der Stange festhalten oder auf den Boden setzen. Beim Griff an eine
    // Stange bleiben die Hände stehen und der Körper bewegt sich – andersherum
    // wanderte die Stange mit den Händen mit, was sofort als Fehler auffällt.
    if (spec.anchor === 'bar') {
      const barY = spec.barY === undefined ? 0.52 : spec.barY;
      const hand = [0, 1, 2].map((i) => (j.handL[i] + j.handR[i]) / 2);
      const d = [-hand[0], barY - hand[1], -hand[2]];
      Object.keys(j).forEach((k) => { j[k] = [j[k][0] + d[0], j[k][1] + d[1], j[k][2] + d[2]]; });
      return j;
    }
    const shift = -Math.min(...Object.values(j).map((q) => q[1])) - 0.62;
    Object.keys(j).forEach((k) => { j[k] = [j[k][0], j[k][1] + shift, j[k][2]]; });
    return j;
  };

  // Ausschnitt einmal für das ganze Muster festlegen, aus beiden Endstellungen.
  // Eine feste Größe ließ liegende Übungen klein in einem halbleeren Kasten
  // stehen; ein Maß je Einzelbild würde die Figur beim Abspielen atmen lassen.
  // Radius statt Rechteck, damit auch das Drehen nichts daran ändert.
  const fit = (() => {
    const all = [skeleton(0), skeleton(1)].flatMap((j) => Object.values(j));
    const mid = [0, 1, 2].map((i) => (Math.min(...all.map((q) => q[i])) + Math.max(...all.map((q) => q[i]))) / 2);
    // Radius statt Rechteck: so ändert das Drehen die Größe nicht, und die
    // Figur kann in keiner Lage über den Rand ragen.
    const r = Math.max(...all.map((q) => Math.hypot(q[0] - mid[0], q[1] - mid[1], q[2] - mid[2])));
    // Bodenhöhe einmal aus der Startstellung: bei einem Griff an die Stange
    // liegt der Körper nicht mehr fest auf dem Boden auf, der Boden darf aber
    // trotzdem nicht bei jedem Einzelbild auf und ab wandern.
    const groundY = Math.min(...Object.values(skeleton(0)).map((q) => q[1]));
    return { mid, groundY, scale: (Math.min(VBW, VBH) / 2) * 0.94 / Math.max(r, 0.1) };
  })();
  const gearScale = fit.scale / 40;

  const draw = (t) => {
    lastT = t;
    const pose = blend(t);
    const j = skeleton(t);

    scene.textContent = '';
    const P = (p) => project(
      [p[0] - fit.mid[0], p[1] - fit.mid[1], p[2] - fit.mid[2]], yaw, pitch, fit.scale, VBW / 2, VBH / 2,
    );
    const pts0 = j;   // Weltkoordinaten, für die Ausrichtung der Geräte
    const pts = {};
    Object.entries(j).forEach(([k, v]) => { pts[k] = P(v); });

    const parts = [];

    // Achsen des Skeletts selbst – schon gedreht und gekippt, anders als eine
    // nachgerechnete Näherung. Rumpf und Gerät richten sich danach aus.
    const norm = (v) => {
      const n = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / n, v[1] / n, v[2] / n];
    };
    const midOf = (a2, b2) => [(a2[0] + b2[0]) / 2, (a2[1] + b2[1]) / 2, (a2[2] + b2[2]) / 2];
    const sideAxis = norm([j.shoulderR[0] - j.shoulderL[0], j.shoulderR[1] - j.shoulderL[1], j.shoulderR[2] - j.shoulderL[2]]);
    const upAxis = norm([j.neck[0] - j.hipC[0], j.neck[1] - j.hipC[1], j.neck[2] - j.hipC[2]]);
    // Blickrichtung des Rumpfes: gilt auch im Liegen, wo "vorn" nicht mehr zum
    // Betrachter zeigt.
    const frontAxis = norm([
      sideAxis[1] * upAxis[2] - sideAxis[2] * upAxis[1],
      sideAxis[2] * upAxis[0] - sideAxis[0] * upAxis[2],
      sideAxis[0] * upAxis[1] - sideAxis[1] * upAxis[0],
    ]);

    // Tiefe als Helligkeit: was hinten liegt, wird etwas dunkler. Der
    // Maleralgorithmus allein sagt nur, was verdeckt – nicht, was weiter weg
    // ist; bei gedrehter Figur überlagern sich sonst gleich helle Glieder.
    const depth = (z) => (0.74 + 0.26 * Math.min(1, Math.max(0, (z + 0.9) / 1.8))).toFixed(3);

    /**
     * Gliedmaße als eine einzige Fläche: von w1 auf w2 verjüngt, an beiden
     * Enden halbrund. Ein gleich dicker Strich sieht aus wie ein
     * Strichmännchen – ein Muskel wird zum Gelenk hin schmaler.
     *
     * Bewusst ein Pfad und nicht Viereck plus zwei Kreise: nur so lässt sich
     * eine Trennlinie außen herum ziehen, ohne dass innen Nähte auftauchen.
     */
    const limb = (from, to, w1, w2, cls = 'fig-limb') => {
      const dx = to.x - from.x; const dy = to.y - from.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len; const ny = dx / len;
      const a = Math.max(0.4, w1 * gearScale * from.k);
      const b = Math.max(0.4, w2 * gearScale * to.k);
      const f = (v) => v.toFixed(1);
      const d = `M${f(from.x + nx * a)} ${f(from.y + ny * a)}`
        + ` A${f(a)} ${f(a)} 0 0 1 ${f(from.x - nx * a)} ${f(from.y - ny * a)}`
        + ` L${f(to.x - nx * b)} ${f(to.y - ny * b)}`
        + ` A${f(b)} ${f(b)} 0 0 1 ${f(to.x + nx * b)} ${f(to.y + ny * b)} Z`;
      const z = (from.z + to.z) / 2;
      parts.push({ z, node: el('path', { d, class: cls, opacity: depth(z) }) });
    };

    // Rumpf als Körper mit Tiefe. Eine einzelne Fläche zwischen Schultern und
    // Hüften war von der Seite papierdünn und hatte keine Taille. Drei Ringe
    // (Schulter, Taille, Becken) aus je vier Ecken ergeben einen Rumpf, der aus
    // jeder Richtung Volumen hat.
    const ring = (centre, w, d) => [[1, 1], [1, -1], [-1, -1], [-1, 1]]
      .map(([a2, b2]) => P(add(add(centre, mul(sideAxis, a2 * w)), mul(frontAxis, b2 * d))));
    const shoulderMid = midOf(j.shoulderL, j.shoulderR);
    const hipMid = midOf(j.hipL, j.hipR);
    const waistMid = midOf(midOf(shoulderMid, hipMid), hipMid);   // 75 % Richtung Becken
    const rings = [ring(shoulderMid, 0.200, 0.098), ring(waistMid, 0.125, 0.075), ring(hipMid, 0.150, 0.090)];
    const face = (quad) => {
      const z = quad.reduce((acc, q) => acc + q.z, 0) / quad.length;
      parts.push({
        z,
        node: el('polygon', {
          points: quad.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-torso', opacity: depth(z),
        }),
      });
    };
    face(rings[0]);                                        // Schulterdeckel
    face(rings[2]);                                        // Beckenboden
    [0, 1].forEach((r) => [0, 1, 2, 3].forEach((c) => {
      const d2 = (c + 1) % 4;
      face([rings[r][c], rings[r][d2], rings[r + 1][d2], rings[r + 1][c]]);
    }));
    limb(pts.hipC, pts.neck, 4.2, 3.4, 'fig-spine');
    limb(pts.neck, pts.head, 2.6, 2.2, 'fig-spine');   // Hals schließt die Lücke

    ['L', 'R'].forEach((s) => {
      limb(pts[`shoulder${s}`], pts[`elbow${s}`], 3.4, 2.5);
      limb(pts[`elbow${s}`], pts[`hand${s}`], 2.5, 1.8);
      // Hand als eigener Ballen: sonst hört der Unterarm einfach auf und es
      // ist nicht zu sehen, dass die Figur etwas greift.
      parts.push({
        z: pts[`hand${s}`].z + 0.002,
        node: el('circle', {
          cx: pts[`hand${s}`].x.toFixed(1), cy: pts[`hand${s}`].y.toFixed(1),
          r: (2.4 * gearScale * pts[`hand${s}`].k).toFixed(1),
          class: 'fig-limb', opacity: depth(pts[`hand${s}`].z),
        }),
      });
      limb(pts[`hip${s}`], pts[`knee${s}`], 4.6, 3.1);
      limb(pts[`knee${s}`], pts[`ankle${s}`], 3.1, 1.9);
      limb(pts[`ankle${s}`], pts[`toe${s}`], 1.9, 1.5, 'fig-limb fig-foot');
    });

    // Kopf als Ei entlang der Rumpfachse statt als Kreis
    const headR = RIG.headR * 46 * gearScale * pts.head.k;
    const axis = Math.atan2(pts.head.y - pts.neck.y, pts.head.x - pts.neck.x) * 180 / Math.PI + 90;
    parts.push({
      z: pts.head.z + 0.001,
      node: el('ellipse', {
        cx: pts.head.x.toFixed(1), cy: pts.head.y.toFixed(1),
        rx: (headR * 0.86).toFixed(1), ry: headR.toFixed(1),
        transform: `rotate(${axis.toFixed(1)} ${pts.head.x.toFixed(1)} ${pts.head.y.toFixed(1)})`,
        class: 'fig-head', opacity: depth(pts.head.z),
      }),
    });

    // Gerät, ausgerichtet an den Achsen des Skeletts selbst
    /** Stange samt Scheiben entlang einer Achse im Raum. */
    const barAt = (centre, axis, half, plate) => {
      // Eine Stange ist ein starrer, gerader Gegenstand. Projiziert man ihre
      // Enden einzeln, bekommt das nähere einen größeren Perspektivfaktor als
      // das fernere – bei einer Kurzhantel unsichtbar, bei 1,2 m Langhantel
      // kippt sie sichtbar wie eine Wippe, obwohl sie waagerecht liegt. Beide
      // Enden rechnen deshalb mit dem Faktor der Stangenmitte: Die Verkürzung
      // beim Drehen bleibt, die falsche Neigung verschwindet.
      const c = P(centre);
      const end = (s) => {
        const q = P(add(centre, mul(axis, s * half)));
        return {
          x: VBW / 2 + (q.x - VBW / 2) * (c.k / q.k),
          y: VBH / 2 + (q.y - VBH / 2) * (c.k / q.k),
          z: q.z, k: c.k,
        };
      };
      const e1 = end(-1);
      const e2 = end(1);
      parts.push({
        z: (e1.z + e2.z) / 2,
        node: el('line', {
          x1: e1.x.toFixed(1), y1: e1.y.toFixed(1), x2: e2.x.toFixed(1), y2: e2.y.toFixed(1),
          'stroke-width': (2.2 * gearScale * (e1.k + e2.k) / 2).toFixed(2), class: 'fig-bar',
        }),
      });
      [e1, e2].forEach((q) => parts.push({
        z: q.z + 0.01,
        node: el('circle', { cx: q.x.toFixed(1), cy: q.y.toFixed(1), r: (plate * gearScale * q.k).toFixed(1), class: 'fig-plate' }),
      }));
    };

    if (equip === 'dumbbells') {
      // 0.085 waren 19 cm – so kurz, dass sich die beiden Scheiben aus den
      // meisten Blickwinkeln zu einem einzigen Fleck überdeckten.
      [pts0.handL, pts0.handR].forEach((h) => barAt(h, sideAxis, 0.13, 3.4));
    } else if (equip === 'onehand') {
      barAt(pts0.handR, sideAxis, 0.13, 3.4);
    } else if (equip === 'goblet') {
      // Eine Hantel, senkrecht, von beiden Händen vor der Brust gehalten
      barAt(midOf(pts0.handL, pts0.handR), upAxis, 0.105, 4.4);
    } else if (equip === 'barbell') {
      // Eine Langhantel ist doppelt so breit wie die Schultern, und zwischen
      // Hand und Scheibe liegt ein gutes Stück blanke Stange. Mit dem alten
      // half = 0.34 war sie 75 cm lang: Die Scheiben klebten an den Händen und
      // das Ganze sah aus wie eine Kurzhantelstange. 0.56 ist immer noch kürzer
      // als in Wirklichkeit – weiter geht es nicht, ohne dass die Enden aus dem
      // Kasten laufen, denn der Ausschnitt richtet sich nach der Figur.
      barAt(midOf(pts0.handL, pts0.handR), sideAxis, 0.56, 4.4);
    } else if (equip === 'hipbar') {
      barAt(midOf(pts0.hipL, pts0.hipR), sideAxis, 0.56, 4.4);
    } else if (equip === 'band') {
      // Ein Loop-Band hängt nicht überall gleich. Beim Pull-Apart und beim
      // Reverse Fly hält man es wirklich zwischen beiden Händen – dort ist eine
      // Linie von Hand zu Hand richtig. Bei allen übrigen Bandübungen steht man
      // darauf: Curls, Seitheben, Schulterdrücken, Rudern, Überkopfstrecken.
      // Dort lief die Linie bisher trotzdem von Hand zu Hand, und die Figur sah
      // aus, als hielte sie ein schlaffes Springseil vor sich. Jetzt geht das
      // Band von jeder Hand hinunter zum Fuß, wo es auch wirklich verankert ist.
      // Leicht durchhängend, damit es nicht wie eine Stange wirkt.
      const bogen = (a, b, sag) => parts.push({
        z: (a.z + b.z) / 2 + 0.01,
        node: el('path', {
          d: `M${a.x.toFixed(1)} ${a.y.toFixed(1)} Q${((a.x + b.x) / 2 + sag.x).toFixed(1)} `
             + `${((a.y + b.y) / 2 + sag.y).toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`,
          class: 'fig-band',
        }),
      });
      if (spec.band === 'hands') {
        const a = P(pts0.handL);
        const b = P(pts0.handR);
        const span = Math.hypot(a.x - b.x, a.y - b.y);
        bogen(a, b, { x: 0, y: Math.max(0, 26 * gearScale - span * 0.22) });
      } else {
        // Verankert unter den Füßen: zwei Stränge, je einer zur nächstgelegenen
        // Ferse. Der Bauch des Bogens geht nach außen, sonst schneidet das Band
        // durch die Beine.
        ['L', 'R'].forEach((s) => {
          const hand = P(pts0[`hand${s}`]);
          const fuss = P(pts0[`ankle${s}`]);
          bogen(hand, fuss, { x: (s === 'L' ? -1 : 1) * 5 * gearScale, y: 0 });
        });
      }
    } else if (equip === 'plate') {
      // Scheibe oder Hantel auf der Brust (Crunches). Sie liegt weiter vorn als
      // die Unterarme, sonst verschwindet sie dahinter – bei 0.155 blieb von
      // ihr ein weißer Keil zwischen den Armen übrig, aus jedem Blickwinkel.
      const q = P(add(j.chest, mul(frontAxis, 0.26)));
      parts.push({
        z: q.z + 0.01,
        node: el('circle', { cx: q.x.toFixed(1), cy: q.y.toFixed(1), r: (5.4 * gearScale * q.k).toFixed(1), class: 'fig-plate' }),
      });
    } else if (equip === 'backpack') {
      // Rucksack auf dem oberen Rücken. Vorher lag hier eine Scheibe – die
      // sieht man in jedem Trainingsvideo, nur bekommt man sie ohne zweite
      // Person nicht auf den eigenen Rücken. Ein Rucksack schon, und er sieht
      // auch anders aus: ein Kasten, keine Scheibe.
      // Mitte zwischen Brust und Becken: auf Brusthöhe säße er im Nacken.
      const q = P(add(midOf(j.chest, j.hipC), mul(frontAxis, -0.12)));
      const w = 7.6 * gearScale * q.k;
      const h = 9.0 * gearScale * q.k;
      parts.push({
        z: q.z + 0.01,
        node: el('rect', {
          x: (q.x - w / 2).toFixed(1), y: (q.y - h / 2).toFixed(1),
          width: w.toFixed(1), height: h.toFixed(1), rx: (w * 0.28).toFixed(1),
          class: 'fig-pack',
        }),
      });
    }

    if (spec.step) {
      // Kasten unter den Füßen: ohne ihn stünde nur eine schräge Figur da und
      // man sähe nicht, dass die Füße erhöht stehen.
      const heel = midOf(j.ankleL, j.ankleR);
      const top = Math.min(j.toeL[1], j.toeR[1]) - 0.02;
      const zc = heel[2]; const xc = heel[0];
      const corner = (sx, sz, y) => P([xc + sx * 0.16, y, zc + sz * 0.26]);
      const face = (quad) => parts.push({
        z: quad.reduce((acc, q) => acc + q.z, 0) / quad.length - 0.05,
        node: el('polygon', {
          points: quad.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-bench',
        }),
      });
      face([corner(-1, -1, top), corner(1, -1, top), corner(1, 1, top), corner(-1, 1, top)]);
      face([corner(-1, 1, top), corner(1, 1, top), corner(1, 1, -0.62), corner(-1, 1, -0.62)]);
      face([corner(1, -1, top), corner(1, 1, top), corner(1, 1, -0.62), corner(1, -1, -0.62)]);
      face([corner(-1, -1, top), corner(-1, 1, top), corner(-1, 1, -0.62), corner(-1, -1, -0.62)]);
    }

    if (spec.seat) {
      // Bank: Sitzfläche knapp unter der Hüfte, zwei Beine bis auf den Boden.
      // Sie liegt im Raum und kippt deshalb beim Drehen mit.
      const top = j.hipC[1] - 0.085;
      const halfW = 0.24; const back = -0.24; const front = 0.30; const thick = 0.055;
      const slab = (y, zs) => zs.map(([sx, sz]) => P([sx * halfW, y, sz]));
      const quad = (pts4, dz) => parts.push({
        z: pts4.reduce((acc, q) => acc + q.z, 0) / 4 + dz,
        node: el('polygon', {
          points: pts4.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-bench',
        }),
      });
      // Sitzfläche und Vorderkante: eine einzelne Fläche sähe von vorn aus wie
      // ein Strich, die Bank hätte keine Dicke.
      quad(slab(top, [[-1, back], [1, back], [1, front], [-1, front]]), -0.04);
      quad([...slab(top, [[-1, front], [1, front]]), ...slab(top - thick, [[1, front], [-1, front]])], -0.03);
      quad([...slab(top, [[1, back], [1, front]]), ...slab(top - thick, [[1, front], [1, back]])], -0.03);
      quad([...slab(top, [[-1, back], [-1, front]]), ...slab(top - thick, [[-1, front], [-1, back]])], -0.03);
      [-0.16, 0.22].forEach((sz) => [-0.18, 0.18].forEach((sx) => {
        const a1 = P([sx, top - thick, sz]); const a2 = P([sx, -0.62, sz]);
        parts.push({
          z: (a1.z + a2.z) / 2 - 0.06,
          node: el('line', {
            x1: a1.x.toFixed(1), y1: a1.y.toFixed(1), x2: a2.x.toFixed(1), y2: a2.y.toFixed(1),
            'stroke-width': (3 * gearScale).toFixed(2), class: 'fig-bench-leg',
          }),
        });
      }));
    }

    if (spec.bar) {
      // Entlang der Schulterachse durch beide Hände: so liegt sie beim Klimmzug
      // quer vor dem Körper und bei den Inverted Rows quer über ihm.
      const centre = midOf(j.handL, j.handR);
      const a1 = P(add(centre, mul(sideAxis, -0.8)));
      const a2 = P(add(centre, mul(sideAxis, 0.8)));
      parts.push({
        z: (a1.z + a2.z) / 2 - 0.02,
        node: el('line', {
          x1: a1.x.toFixed(1), y1: a1.y.toFixed(1), x2: a2.x.toFixed(1), y2: a2.y.toFixed(1),
          class: 'fig-bar-fixed',
        }),
      });
    }
    if (!spec.float) {
      // Bodenscheibe statt Strich: ein Strich unten am Rand sieht aus wie ein
      // Schieberegler; eine Fläche im Raum liest sich als Boden und kippt mit.
      // Mittig unter der Figur, nicht am Ursprung: wer an einer Stange hängt,
      // steht nicht über dem Nullpunkt, und die Scheibe lag dann daneben.
      const gy = spec.anchor === 'bar' ? fit.groundY : -0.62;
      const ring = [];
      for (let a = 0; a < 360; a += 15) {
        ring.push(P([fit.mid[0] + Math.cos(rad(a)) * 0.62, gy, fit.mid[2] + Math.sin(rad(a)) * 0.34]));
      }
      // Immer ganz nach hinten. Sortiert man den Boden wie ein Körperteil ein,
      // legt er sich beim Blick von oben über das hintere Bein und färbt es
      // durch seine halbe Deckkraft braun.
      parts.push({
        z: -Infinity,
        node: el('polygon', {
          points: ring.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-ground',
        }),
      });
    }

    // Verletzungsmarken ganz oben: sie sollen auch dann zu sehen sein, wenn
    // die Stelle gerade hinten liegt – sonst muss man die Figur erst drehen,
    // um zu erkennen, worum es geht.
    marks.forEach(({ spot, kind }) => {
      const at = SPOTS[spot];
      if (!at) return;
      at(j).forEach((p3) => {
        const q = P(p3);
        // Etwas schmaler als ein Oberarm: eine Marke soll die Stelle zeigen,
        // nicht die Figur darunter verdecken.
        const r = Math.max(1.2, 2.6 * gearScale * q.k);
        const f = (v) => v.toFixed(1);
        parts.push({
          z: Infinity,
          node: el('circle', { cx: f(q.x), cy: f(q.y), r: f(r * 1.75), class: 'fig-hurt-halo' }),
        });
        parts.push({
          z: Infinity,
          node: el('circle', { cx: f(q.x), cy: f(q.y), r: f(r), class: 'fig-hurt' }),
        });
        // Bruch und Riss bekommen einen Zackenblitz, damit sich die Art der
        // Verletzung schon am Bild unterscheiden lässt.
        if (kind === 'bruch' || kind === 'riss') {
          const pts = [[-0.7, -1], [0.1, -0.2], [-0.3, 0.15], [0.6, 1]]
            .map(([dx, dy]) => `${f(q.x + dx * r)},${f(q.y + dy * r)}`).join(' ');
          parts.push({ z: Infinity, node: el('polyline', { points: pts, class: 'fig-hurt-crack' }) });
        }
      });
    });

    // Maleralgorithmus: hinten zuerst
    parts.sort((p, q) => p.z - q.z).forEach((p) => scene.appendChild(p.node));
  };

  // Die beiden Listener hängen am Fenster, nicht am Kasten – sonst bräche das
  // Drehen ab, sobald der Finger die Figur verlässt. Genau deshalb müssen sie
  // aber auch wieder weg, wenn die Figur verschwindet: die Ansicht wird bei
  // jedem abgehakten Satz neu geschrieben, und die alten Listener blieben
  // sonst samt ihrer Zeichendaten liegen.
  const off = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    if (sichtbarkeit) sichtbarkeit.unobserve(host);
    delete host.__figEntry;
  };
  const entry = { draw, off, effortAt1: !LOWER_TO_1.includes(pattern), sichtbar: true };
  if (sichtbarkeit) {
    host.__figEntry = entry;
    sichtbarkeit.observe(host);
  }
  // Bei ausgeschalteter Bewegung eine mittlere Stellung zeigen statt der
  // Ausgangsstellung – sonst sieht man von der Übung nichts.
  draw(reduceMotion.matches ? 0.55 : 0);
  active.add(entry);
  return {
    draw,
    setView: (y, pi = 0) => { yaw = y; pitch = pi; draw(lastT); },
    stop: () => {
      active.delete(entry);
      off();
    },
  };
}

/**
 * Alle Figuren abmelden – vor jedem Neuaufbau der Ansicht.
 *
 * Nicht nur aus der Zeichenschleife nehmen, sondern auch die Fenster-Listener
 * lösen. Ohne das kamen bei einem Training gut fünfzig zusammen, jeder mit
 * seiner SVG im Gepäck.
 */
function clearFigures() {
  active.forEach((f) => f.off && f.off());
  active.clear();
}

/**
 * Tempo einer Wiederholung.
 *
 * Hin und zurück gleich schnell sieht aus wie ein Pendel, nicht wie Training.
 * Echte Wiederholungen sind unsymmetrisch: kurz halten, zügig in die
 * Anstrengung, oben oder unten einen Moment stehen, deutlich langsamer zurück.
 * Genau so steht es auch in den Hinweisen ("3 Sekunden kontrolliert ablassen").
 *
 * u läuft von 0 bis 1 durch einen Zyklus, zurück kommt die Stellung zwischen
 * den beiden Endlagen. Welche der beiden die anstrengende ist, hängt von der
 * Übung ab: bei der Kniebeuge ist Stellung 1 unten (die Anstrengung geht
 * zurück nach 0), beim Curl ist Stellung 1 oben.
 */
const ease = (x) => x * x * (3 - 2 * x);
const span = (u, a, b) => ease(Math.min(1, Math.max(0, (u - a) / (b - a))));

function tempo(u, effortAt1) {
  if (effortAt1) {
    if (u < 0.06) return 0;                 // Ausgangsstellung halten
    if (u < 0.34) return span(u, 0.06, 0.34);      // zügig in die Anstrengung
    if (u < 0.44) return 1;                 // oben kurz halten
    return 1 - span(u, 0.44, 1);            // langsam zurück
  }
  if (u < 0.06) return 0;                   // oben stehen
  if (u < 0.62) return span(u, 0.06, 0.62); // langsam ablassen
  if (u < 0.70) return 1;                   // unten kurz halten
  return 1 - span(u, 0.70, 1);              // zügig hoch
}

// Muster, bei denen Stellung 1 das Ende des Ablassens ist, nicht die
// Anstrengung: dort läuft das Tempo andersherum.
const LOWER_TO_1 = ['squat', 'squatbw', 'pushup', 'pushupfeet', 'pike', 'tricepsbar',
  'hinge', 'hinge1', 'splitsquat'];

const reduceMotion = window.matchMedia
  ? window.matchMedia('(prefers-reduced-motion: reduce)')
  : { matches: false };

function frame(now) {
  if (document.visibilityState === 'visible' && active.size && !reduceMotion.matches) {
    const u = (now % CYCLE_MS) / CYCLE_MS;
    active.forEach((f) => { if (f.sichtbar) f.draw(tempo(u, f.effortAt1)); });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/*
 * Körperkarte: zeigt in Vorder- und Rückansicht, was heute drankommt.
 *
 * Der Körper entsteht aus einem Skelett, nicht aus einzeln hingelegten Ovalen.
 * Aus denselben Gelenkpunkten werden Silhouette und Muskeln gerechnet: die
 * Gliedmaßen als zum Gelenk hin schmaler werdende Flächen, die Muskeln als
 * Spindeln entlang genau desselben Knochens. Dadurch sitzt der Bizeps
 * zwangsläufig auf dem Oberarm und nicht daneben, und eine Änderung an den
 * Proportionen zieht beides zugleich nach.
 *
 * Rumpf, Brust, Rücken und Gesäß haben keine Knochenachse, die sie beschreiben
 * würde – die sind als Pfade gezeichnet.
 *
 * Feld je Ansicht: 100 × 220, symmetrisch um x = 50.
 */

const MUSCLE_LABEL = {
  chest: 'Brust',
  frontDelts: 'vordere Schulter',
  sideDelts: 'seitliche Schulter',
  rearDelts: 'hintere Schulter',
  biceps: 'Bizeps',
  triceps: 'Trizeps',
  abs: 'Bauch',
  lats: 'Rücken',
  traps: 'Nacken',
  glutes: 'Gesäß',
  quads: 'Oberschenkel',
  hamstringsKnee: 'Beinbeuger Knie',
  hamstringsHip: 'Beinbeuger Hüfte',
  calves: 'Waden',
};

const BODY_NS = 'http://www.w3.org/2000/svg';

/* ------------------------------------------------------------------ *
 * Skelett – rechte Körperhälfte, die linke wird gespiegelt
 * ------------------------------------------------------------------ */

const J = {
  head: [50, 22], neckTop: [50, 32], neckBase: [50, 45],
  // Arme leicht abgespreizt: liegen sie am Rumpf an, verschmelzen Schulter und
  // Brust zu einem Fleck und man sieht nicht, was hervorgehoben ist.
  shoulder: [70, 53], elbow: [78, 96], wrist: [83, 134], hand: [84, 143],
  hip: [58, 114], knee: [59.5, 162], ankle: [59, 201], toe: [63, 210],
};

const HEAD_RX = 10.8;
const HEAD_RY = 13.4;

const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

/* ------------------------------------------------------------------ *
 * Formen
 * ------------------------------------------------------------------ */

/**
 * Gliedmaße von a nach b, an den Enden wa bzw. wb breit. Zwei Kreise an den
 * Gelenken runden ab und decken zugleich die Naht zum nächsten Glied.
 */
function limb(a, b, wa, wb) {
  const dx = b[0] - a[0]; const dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len; const ny = dx / len;
  const quad = [
    [a[0] + nx * wa, a[1] + ny * wa], [b[0] + nx * wb, b[1] + ny * wb],
    [b[0] - nx * wb, b[1] - ny * wb], [a[0] - nx * wa, a[1] - ny * wa],
  ];
  return [
    ['poly', quad],
    ['e', a[0], a[1], wa, wa, 0],
    ['e', b[0], b[1], wb, wb, 0],
  ];
}

/**
 * Muskelbauch als Spindel entlang des Knochens a–b, von Anteil t0 bis t1 und
 * halb so breit wie w. Liegt damit immer auf dem Glied, dem er gehört.
 */
function belly(a, b, t0, t1, w) {
  const c = lerp(lerp(a, b, t0), lerp(a, b, t1), 0.5);
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const angle = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI - 90;
  return ['e', c[0], c[1], w, (len * (t1 - t0)) / 2, angle];
}

const P = (d) => ['p', d];

/* ------------------------------------------------------------------ *
 * Silhouette
 * ------------------------------------------------------------------ */

const TORSO = P(
  'M50 41 C59 41 66 44 70.5 50 C72.5 57 71 65 69 73 '
  + 'C67 81 64.5 89 64 97 C63.5 105 63.5 111 63.5 116 '
  + 'L36.5 116 C36.5 111 36.5 105 36 97 C35.5 89 33 81 31 73 '
  + 'C29 65 27.5 57 29.5 50 C34 44 41 41 50 41 Z',

const PELVIS = P('M36.5 113 H63.5 L62 124 C58.5 130 54 132.5 50 132.5 C46 132.5 41.5 130 38 124 Z');

const FOOT = P('M55.5 197 H63 C64 203 66 208 67 211 C67 213.5 65 214.5 62 214.5 H56 Z');

/** Alles, was kein Trainingsbereich ist: Kopf, Hals, Unterarme, Hände, Füße. */

  ...limb(J.shoulder, J.elbow, 8.8, 6.2),

/* ------------------------------------------------------------------ *

// [Muskel, Formen, auch gespiegelt]
const FRONT = [

  ['sideDelts', [belly(J.shoulder, J.elbow, -0.10, 0.09, 6.9)], true],
  ['frontDelts', [belly(J.shoulder, J.elbow, 0.11, 0.30, 5.9)], true],

  ['chest', [P('M50.5 55 C58 54 64.5 57 68 62 C68.5 69 65 75 59 77.5 C55 79 52 78.5 50.5 78 Z')], true],

  ['abs', [

const BACK = [

  ['hamstringsHip', [belly(J.hip, J.knee, 0.14, 0.55, 9.6)], true],

/* ------------------------------------------------------------------ *
 * Zeichnen
 * ------------------------------------------------------------------ */

function shapeEl(shape, mirrored) {
  const mx = (x) => (mirrored ? 100 - x : x);
  if (shape[0] === 'e') {
    const [, cx, cy, rx, ry, rot] = shape;
    const node = document.createElementNS(BODY_NS, 'ellipse');
    node.setAttribute('cx', mx(cx).toFixed(2));
    node.setAttribute('cy', cy.toFixed(2));
    node.setAttribute('rx', rx.toFixed(2));
    node.setAttribute('ry', ry.toFixed(2));
    if (rot) {
      const a = mirrored ? -rot : rot;
      node.setAttribute('transform', `rotate(${a.toFixed(1)} ${mx(cx).toFixed(2)} ${cy.toFixed(2)})`);
    }
    return node;
  }
  if (shape[0] === 'poly') {
    const node = document.createElementNS(BODY_NS, 'polygon');
    node.setAttribute('points', shape[1].map(([x, y]) => `${mx(x).toFixed(2)},${y.toFixed(2)}`).join(' '));
    return node;
  }
  const node = document.createElementNS(BODY_NS, 'path');
  node.setAttribute('d', shape[1]);
  if (mirrored) node.setAttribute('transform', 'translate(100,0) scale(-1,1)');
  return node;
}

function halfView(regions, active, primary, label) {
  const g = document.createElementNS(BODY_NS, 'g');

  // Silhouette einmal rechts, einmal gespiegelt – der Rumpf ist schon
  // symmetrisch gezeichnet und käme sonst doppelt.
  FILLER.forEach((shape) => {
    const both = shape === TORSO || shape === PELVIS ? [false] : [false, true];
    both.forEach((m) => {
      const node = shapeEl(shape, m);
      node.setAttribute('class', 'bm-filler');
      g.appendChild(node);
    });
  });

  regions.forEach(([muscle, shapes, mirror]) => {
    const on = active.has(muscle);
    // Zwei Stufen: was eine Übung zuerst trifft, leuchtet voll; was nebenbei
    // mitarbeitet, blasser. Alles gleich hell hieß an einem Ganzkörpertag,
    // dass die Karte nichts mehr aussagt.
    const level = !on ? '' : (primary.has(muscle) ? ' on' : ' on sub');
    shapes.forEach((shape) => {
      [false, ...(mirror ? [true] : [])].forEach((m) => {
        const node = shapeEl(shape, m);
        node.setAttribute('class', `bm-part${level}`);
        if (on) {
          const title = document.createElementNS(BODY_NS, 'title');
          title.textContent = `${MUSCLE_LABEL[muscle] || muscle}${primary.has(muscle) ? '' : ' (mitarbeitend)'}`;
          node.appendChild(title);
        }
        g.appendChild(node);
      });
    });
  });

  const text = document.createElementNS(BODY_NS, 'text');
  text.setAttribute('x', 50);
  text.setAttribute('y', 219);
  text.setAttribute('class', 'bm-label');
  text.textContent = label;
  g.appendChild(text);
  return g;
}

/**
 * Zeichnet Vorder- und Rückansicht nebeneinander.
 *
 * @param {Element} host    Zielelement, wird geleert
 * @param {Set}     active  Muskelregionen, die hervorgehoben werden
 * @param {Set}     primary davon die zuerst beanspruchten; der Rest blasser
 */
function mountBody(host, active, primary = active) {
  host.textContent = '';
  const svg = document.createElementNS(BODY_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 210 226');
  svg.setAttribute('class', 'bodymap');
  svg.setAttribute('role', 'img');

  const label = (m) => MUSCLE_LABEL[m] || m;
  const haupt = [...active].filter((m) => primary.has(m)).map(label);
  const neben = [...active].filter((m) => !primary.has(m)).map(label);
  svg.setAttribute('aria-label', active.size
    ? `Heute vor allem: ${haupt.join(', ') || '–'}${neben.length ? `. Mitarbeitend: ${neben.join(', ')}` : ''}`
    : 'Keine Muskelgruppen hervorgehoben');

  const front = halfView(FRONT, active, primary, 'vorn');
  const back = halfView(BACK, active, primary, 'hinten');
  back.setAttribute('transform', 'translate(110,0)');
  svg.append(front, back);
  host.appendChild(svg);
}

/* ===== js/chart.js ===== */
/*
 * Kleine Verlaufskarten für die Statistik.
 *
 * Bewusst Small Multiples statt eines Diagramms mit vielen Linien: Bei zwölf
 * Muskelgruppen wären zwölf Farben nicht mehr auseinanderzuhalten – schon gar
 * nicht für Farbfehlsichtige. Eine Karte je Reihe braucht dagegen nur eine
 * Farbe, und die Überschrift ersetzt die Legende.
 *
 * Je Karte: Fläche als 10-%-Hauch, Linie 2 px, Endpunkt als Punkt mit Ring in
 * der Untergrundfarbe. Beschriftet wird nur der Endwert – eine Zahl an jedem
 * Punkt liest niemand. Beim Ziehen über die Karte wandert der Punkt mit und
 * die Kopfzeile zeigt den Wert des Tages; die vollständige Reihe steht im
 * aria-label, damit sie auch ohne Sehen zugänglich ist.
 */

const CHART_NS = 'http://www.w3.org/2000/svg';
const VW = 100;
const VH = 30;

const svgEl = (name, attrs = {}) => {
  const node = document.createElementNS(CHART_NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
};

/**
 * Eine Verlaufskarte.
 *
 * @param {object} o
 * @param {string} o.label   Überschrift, ersetzt die Legende
 * @param {Array}  o.points  [{ label, value }] in zeitlicher Reihenfolge
 * @param {string} o.unit    Einheit für die Beschriftung
 * @param {Function} o.fmt   Zahlformatierung
 */
function sparkPanel({ label, points, unit = '', fmt = (v) => String(Math.round(v)) }) {
  const fig = document.createElement('figure');
  fig.className = 'spark';

  const cap = document.createElement('figcaption');
  const name = document.createElement('span');
  name.className = 'spark-name';
  name.textContent = label;
  const val = document.createElement('span');
  val.className = 'spark-val';
  cap.append(name, val);
  fig.appendChild(cap);

  const last = points[points.length - 1];
  const first = points[0];
  const setVal = (p) => { val.textContent = `${fmt(p.value)}${unit ? ` ${unit}` : ''}`; };
  setVal(last);

  const values = points.map((p) => p.value);
  const lo = Math.min(...values);
  const hi = Math.max(...values);
  const span = hi - lo || 1;
  // Bei nur einem Punkt gibt es keine Strecke – dann in die Mitte setzen.
  const xy = points.map((p, i) => [
    points.length === 1 ? VW / 2 : (i / (points.length - 1)) * VW,
    VH - ((p.value - lo) / span) * (VH - 6) - 3,
  ]);

  const svg = svgEl('svg', {
    viewBox: `0 0 ${VW} ${VH}`, class: 'spark-svg', preserveAspectRatio: 'none',
    role: 'img',
    'aria-label': `${label}: ${points.map((p) => `${p.label} ${fmt(p.value)}${unit ? ` ${unit}` : ''}`).join(', ')}`,
  });

  const d = xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  svg.appendChild(svgEl('path', { d: `${d} L${VW} ${VH} L0 ${VH} Z`, class: 'spark-area' }));
  svg.appendChild(svgEl('path', { d, class: 'spark-line' }));

  const dot = svgEl('circle', { cx: xy[xy.length - 1][0], cy: xy[xy.length - 1][1], r: 2.6, class: 'spark-dot' });
  svg.appendChild(dot);
  fig.appendChild(svg);

  const foot = document.createElement('div');
  foot.className = 'spark-foot';
  const delta = last.value - first.value;
  foot.textContent = points.length > 1
    ? `${fmt(first.value)} → ${fmt(last.value)}${unit ? ` ${unit}` : ''}${delta ? ` (${delta > 0 ? '+' : '−'}${fmt(Math.abs(delta))})` : ''}`
    : `einmal · ${first.label}`;
  fig.appendChild(foot);

  // Ziehen über die Karte zeigt den Wert des jeweiligen Tages
  const pick = (e) => {
    const box = svg.getBoundingClientRect();
    const rel = ((e.touches ? e.touches[0] : e).clientX - box.left) / box.width;
    const i = Math.max(0, Math.min(points.length - 1, Math.round(rel * (points.length - 1))));
    dot.setAttribute('cx', xy[i][0]);
    dot.setAttribute('cy', xy[i][1]);
    setVal(points[i]);
    foot.textContent = points[i].label;
  };
  const reset = () => {
    dot.setAttribute('cx', xy[xy.length - 1][0]);
    dot.setAttribute('cy', xy[xy.length - 1][1]);
    setVal(last);
    foot.textContent = points.length > 1
      ? `${fmt(first.value)} → ${fmt(last.value)}${unit ? ` ${unit}` : ''}${delta ? ` (${delta > 0 ? '+' : '−'}${fmt(Math.abs(delta))})` : ''}`
      : `einmal · ${first.label}`;
  };
  fig.addEventListener('pointermove', pick);
  fig.addEventListener('pointerleave', reset);

  return fig;
}

const BY_ID = new Map(INJURIES.map((i) => [i.id, i]));

function injuryById(id) { return BY_ID.get(id) || null; }

/**
 * Von Hand notierte Wechselwirkungen. Alles, was sich ausrechnen lässt –
 * welche Übung wegfällt, welcher Ersatz nicht greift –, steht nicht hier,
 * sondern wird gerechnet. Hier stehen nur Dinge, die man wissen muss und die
 * keine Formel hergibt.
 */
const COMBOS = [
  {

  {

    text: 'Becken und Hüfte zusammen nehmen sowohl die Kniebeuge als auch den Hip '
