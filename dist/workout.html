8%22%20rx%3D%2222%22%2F%3E%0A%20%20%20%20%3Crect%20x%3D%2268%22%20%20y%3D%22208%22%20width%3D%2234%22%20height%3D%2296%22%20%20rx%3D%2215%22%2F%3E%0A%20%20%20%20%3Crect%20x%3D%22410%22%20y%3D%22208%22%20width%3D%2234%22%20height%3D%2296%22%20%20rx%3D%2215%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A">
<style>
:root {
  --bg: #0f1115;
  --bg-elev: #171a21;
  --bg-elev-2: #1f232c;
  --line: #2a2f3a;
  --text: #e8eaed;
  --muted: #9aa3b2;
  --accent: #ff7a45;
  --accent-2: #4ea1ff;
  --ok: #3ecf8e;
  --radius: 14px;
  --tabbar-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

body.mode-bw {
  --accent: #4ea1ff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

button { font: inherit; color: inherit; }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(15, 17, 21, .92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-in {
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .3px;
}
.brand::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
  transition: background .2s;
}

.mode-switch {
  margin-left: auto;
  display: flex;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: background .18s, color .18s;
}
.mode-btn[aria-pressed="true"] {
  background: var(--accent);
  color: #10131a;
}

/* ---------- View / layout ---------- */
.view {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 14px calc(var(--tabbar-h) + var(--safe-b) + 28px);
}

.section-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--muted);
  margin: 26px 0 10px;
  font-weight: 700;
}
.section-title:first-child { margin-top: 4px; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- Dashboard hero ---------- */
.hero-eyebrow {
  font-size: 12px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
.hero-title {
  margin: 4px 0 2px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.4px;
}
.hero-sub {
  color: var(--muted);
  font-size: 14px;
}
.hero-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.badge {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.badge.accent {
  border-color: var(--accent);
  color: var(--accent);
}
.badge.done {
  border-color: var(--ok);
  color: var(--ok);
}

.progress {
  height: 8px;
  background: var(--bg-elev-2);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 14px;
}
.progress > i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width .3s ease;
}

/* ---------- Exercise cards ---------- */
.ex {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.ex.complete { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }

.ex-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  cursor: pointer;
  user-select: none;
}
.ex-idx {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--bg-elev-2);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.ex.complete .ex-idx { background: var(--ok); color: #0d1b14; }
.ex-main { min-width: 0; }
.ex-name {
  display: block;
  font-weight: 650;
  font-size: 15.5px;
  line-height: 1.3;
}
.ex-meta {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 3px;
}
.ex-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.chev {
  color: var(--muted);
  font-size: 12px;
  transition: transform .2s;
}
.ex.open .chev { transform: rotate(180deg); }

/* Gewichtszeile: ein Arbeitsgewicht je Übung. */
.ex-weight {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px 10px;
}
.kg-step {
  flex: none;
  width: 46px; height: 46px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--text);
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.kg-plus {
  background: color-mix(in srgb, var(--accent) 22%, var(--bg-elev-2));
  border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
  color: var(--accent);
}
.kg-step:active { transform: scale(.95); }
.kg-main {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
}
.kg-val {
  width: 3.6em;
  background: transparent;
  border: 0;
  border-bottom: 1px dashed var(--line);
  color: var(--text);
  font-size: 24px;
  font-weight: 800;
  text-align: right;
  padding: 2px 2px 3px;
  font-variant-numeric: tabular-nums;
}
.kg-val:focus { outline: none; border-bottom-color: var(--accent); }
.kg-unit { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.kg-next {
  margin: -4px 14px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}

.ex-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  font-size: 12px;
  color: var(--muted);
}
.ex-facts span {
  background: var(--bg-elev-2);
  border-radius: 999px;
  padding: 4px 10px;
}

/* Satz-Knöpfe: immer sichtbar, daumengroß. */
.ex-sets {
  display: flex;
  gap: 8px;
  padding: 0 14px 14px;
}
.set-btn {
  flex: 1 1 0;
  min-width: 0;
  height: 48px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--muted);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s, color .12s, border-color .12s;
}
.set-btn.on {
  background: var(--ok);
  border-color: var(--ok);
  color: #0d1b14;
}
.set-btn:active { transform: scale(.97); }

.ex-body {
  display: none;
  border-top: 1px solid var(--line);
  padding: 12px 14px 14px;
}
.ex.open .ex-body { display: block; }

.cue {
  font-size: 13.5px;
  color: var(--muted);
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 12px;
}

.set-row {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.set-row .set-no {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}
.set-row input {
  width: 100%;
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 10px;
  font-size: 14px;
  min-width: 0;
}
.set-row input:focus {
  outline: none;
  border-color: var(--accent);
}
.set-row input::placeholder { color: #5d6675; }

.chk {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--muted);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 15px;
  padding: 0;
}
.chk[aria-pressed="true"] {
  background: var(--ok);
  border-color: var(--ok);
  color: #0d1b14;
}

.set-legend {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 700;
}

.last-time {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  border-radius: 11px;
  padding: 12px 16px;
  font-size: 14.5px;
  font-weight: 650;
  cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #10131a;
}
.btn-ghost { background: transparent; }
.btn-danger { color: #ff6b6b; border-color: #4a2a2f; }
/* Abschließen ist der übliche Weg und darf das auch aussehen. */
.btn-ok {
  color: #0d1b14;
  background: var(--ok);
  border-color: var(--ok);
  font-weight: 800;
}
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn-row .btn { flex: 1 1 140px; }
.btn-row.nav { flex-wrap: nowrap; }
.btn-row.nav .btn { flex: 1 1 0; min-width: 0; padding: 11px 4px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }

.plan-date { display: block; font-size: 14.5px; font-weight: 600; }

/* Steigerungsvorschlag: sichtbar, aber kein Alarm – es bleibt ein Angebot. */
.kg-bump {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 9px 12px;
  border: 1px solid color-mix(in srgb, var(--ok) 55%, var(--line));
  background: color-mix(in srgb, var(--ok) 14%, var(--bg-elev));
  color: var(--ok);
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}
.done-notice { border-color: var(--ok); color: var(--ok); }

/* ---------- Exercise library ---------- */
.lib-item { padding: 14px; }
.lib-group {
  font-size: 11px; letter-spacing: .7px; text-transform: uppercase;
  color: var(--muted); font-weight: 700;
}
.swap {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
  margin-top: 10px;
}
.swap-side {
  background: var(--bg-elev-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
}
.swap-side.active { border-color: var(--accent); }
.swap-label {
  font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted); font-weight: 700; margin-bottom: 4px;
}
.swap-name { font-size: 14px; font-weight: 650; line-height: 1.3; }
.swap-reps { font-size: 12px; color: var(--muted); margin-top: 3px; }
.swap-arrow {
  display: grid; place-items: center;
  color: var(--muted); font-size: 15px;
}
.cue-pair { margin-top: 10px; font-size: 13px; color: var(--muted); }
.cue-pair b { color: var(--text); font-weight: 600; }

/* ---------- Stats ---------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.stat {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.stat-v { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.stat-l { font-size: 12px; color: var(--muted); margin-top: 2px; }

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 1fr 44px; gap: 10px; align-items: center; }
.bar-name { font-size: 13px; }
.bar-track {
  height: 6px; background: var(--bg-elev-2); border-radius: 999px;
  overflow: hidden; margin-top: 4px;
}
.bar-track > i { display: block; height: 100%; background: var(--accent-2); }
.bar-val { font-size: 12px; color: var(--muted); text-align: right; }

/* ===== js/dates.js ===== */
const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
  'August', 'September', 'Oktober', 'November', 'Dezember'];

const pad = (n) => String(n).padStart(2, '0');

function toISO(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function todayISO() {
  return toISO(new Date());
}

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function addDays(iso, days) {
  if (!days) return iso;
  const d = parseISO(iso);
  d.setDate(d.getDate() + days);
  return toISO(d);
}

/** Ganze Tage von isoA bis isoB; positiv, wenn isoB später liegt. */
function daysBetween(isoA, isoB) {
  return Math.round((parseISO(isoB) - parseISO(isoA)) / 86400000);
}

function fmtDate(iso, long) {
  const d = parseISO(iso);
  const wd = WEEKDAYS[d.getDay()];
  if (long) return `${wd}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return `${wd}, ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
}

function plural(n, one, many) {
  return `${n} ${n === 1 ? one : many}`;

/* ===== js/figure.js ===== */
/*
 * Bewegungsabläufe als drehbare 3D-Figur.
 *
 * Statt fester Punkte hält eine Stellung nur Gelenkwinkel; daraus rechnet
 * solve() das Skelett. Das ist nicht bloß kürzer, sondern hält die Figur
 * anatomisch beisammen: ein Knie kann nicht versehentlich neben der Hüfte
 * landen, und dieselbe Stellung stimmt aus jedem Blickwinkel.
 *
 * Koordinaten: x nach rechts, y nach oben, z nach vorn (zum Betrachter); die
 * Figur schaut nach +z. Gezeichnet wird mit schwacher Perspektive und
 * Maleralgorithmus – was hinten liegt, kommt zuerst. Ziehen dreht frei:
 * waagerecht um die Hochachse, senkrecht um die Querachse, beides unbegrenzt.
 * Auch Boden und Klimmzugstange liegen im Raum und kippen deshalb mit.
 *
 * Winkel in Grad:
 *   lean      Rumpfneigung nach vorn
 *   lie       'supine' oder 'prone' – Figur liegt, Kopf links
 *   tilt      Neigung der liegenden Figur, + hebt das Fußende
 *   arm.p     Schulter nach vorn (0 = Arm hängt)
 *   arm.a     Arm zur Seite abgespreizt
 *   arm.e     Ellenbogen gebeugt
 *   arm.i     Unterarm zur Körpermitte gedreht (beidhändiger Griff)
 *   leg.p     Hüfte gebeugt (Knie nach vorn)
 *   leg.a     Bein zur Seite
 *   leg.k     Knie gebeugt (Ferse nach hinten)
 */

const RIG = {
  hipW: 0.10, shoulderW: 0.215, shoulderY: 0.42,
  chestY: 0.28, neckY: 0.47, headY: 0.63, headR: 0.115,
  upperArm: 0.27, foreArm: 0.25, hand: 0.06,
  thigh: 0.44, shin: 0.42, foot: 0.15,
};

const rad = (d) => (d * Math.PI) / 180;
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (v, s) => [v[0] * s, v[1] * s, v[2] * s];

function rotX(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c];
}
function rotY(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c];
}
function rotZ(v, deg) {
  const c = Math.cos(rad(deg)); const s = Math.sin(rad(deg));
  return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]];
}

/** Punkt zwischen zwei projizierten Punkten. */
const mixPt = (p, q, f) => ({
  x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f, z: p.z + (q.z - p.z) * f,
});

const A = (p = 0, a = 0, e = 0, i = 0) => ({ p, a, e, i });
const L = (p = 0, a = 0, k = 0) => ({ p, a, k });

/** Gelenkpunkte einer Stellung, Hüftmitte im Ursprung. */
function solve(pose) {
  const R = RIG;
  const lean = pose.lean || 0;
  const up = rotX([0, 1, 0], lean);           // Rumpfachse, +lean = nach vorn
  const side = [1, 0, 0];                     // Schulterachse, von lean unberührt

  const hipC = [0, 0, 0];
  const chest = mul(up, R.chestY);
  const neck = mul(up, R.neckY);
  const head = mul(up, R.headY);
  const shoulderMid = mul(up, R.shoulderY);

  const joints = { hipC, chest, neck, head };

  ['L', 'R'].forEach((s) => {
    const sign = s === 'L' ? -1 : 1;

    // Arm: Richtung aus Neigung und Abspreizung, dann Ellenbogen beugen
    const arm = pose[`arm${s}`] || pose.arm || A();
    const shoulder = add(shoulderMid, mul(side, sign * R.shoulderW));
    const upperDir = rotX(rotZ([0, -1, 0], sign * arm.a), -arm.p + lean);
    const elbow = add(shoulder, mul(upperDir, R.upperArm));
    // arm.i dreht den Unterarm zur Körpermitte – nötig, wo beide Hände
    // dasselbe Gerät fassen, etwa die Hantel beim Goblet Squat.
    const foreDir = rotZ(rotX(upperDir, -arm.e), sign * (arm.i || 0));
    const hand = add(elbow, mul(foreDir, R.foreArm));

    // Bein: Hüfte beugen, dann Knie
    const leg = pose[`leg${s}`] || pose.leg || L();
    const hip = add(hipC, mul(side, sign * R.hipW));
    const thighDir = rotX(rotZ([0, -1, 0], sign * leg.a), -leg.p);
    const knee = add(hip, mul(thighDir, R.thigh));
    const shinDir = rotX(thighDir, leg.k);
    const ankle = add(knee, mul(shinDir, R.shin));
    const toe = add(ankle, mul(rotX(shinDir, -80 - leg.k * 0.25), R.foot));

    Object.assign(joints, {
      [`shoulder${s}`]: shoulder, [`elbow${s}`]: elbow, [`hand${s}`]: hand,
      [`hip${s}`]: hip, [`knee${s}`]: knee, [`ankle${s}`]: ankle, [`toe${s}`]: toe,
    });
  });

  // Wadenheben: der Körper steigt, die Zehen bleiben liegen. Nur so sieht man
  // die Ferse abheben – hebt man alles zusammen an, wandert bloß die ganze
  // Figur nach oben und die Bewegung ist unsichtbar.
  if (pose.heel) {
    // stance nennt das Standbein: beim einbeinigen Wadenheben darf nur dessen
    // Zeh liegen bleiben, sonst zieht sich das freie Bein in die Länge.
    const planted = pose.stance ? [`toe${pose.stance}`] : ['toeL', 'toeR'];
    Object.keys(joints).forEach((k) => {
      if (planted.includes(k)) return;
      joints[k] = [joints[k][0], joints[k][1] + pose.heel * 0.16, joints[k][2]];
    });
  }

  // Hinlegen. Früher wurde die stehende Figur mit zwei Winkeln (roll/tilt)
  // schräg gedreht, bis sie aus einem bestimmten Blickwinkel lag – aus jedem
  // anderen sah sie umgekippt aus. Jetzt ist es eine echte Lage: die Längsachse
  // des Körpers zeigt nach links (Kopf links, Füße rechts), der Bauch nach oben
  // (Rücklage) oder nach unten (Bauchlage).
  if (pose.lie) {
    const belly = pose.lie === 'prone' ? 90 : -90;
    Object.keys(joints).forEach((k) => { joints[k] = rotX(rotZ(joints[k], 90), belly); });
  }
  // Neigung der ganzen Figur um die Blickachse: bei liegenden Übungen hebt ein
  // positiver Wert das Fußende, so entsteht die Brücke beim Hip Thrust.
  if (pose.tilt) {
    Object.keys(joints).forEach((k) => { joints[k] = rotZ(joints[k], pose.tilt); });
  }
  return joints;
}

const NS = 'http://www.w3.org/2000/svg';
const CYCLE_MS = 4200;   // eine Wiederholung; das Tempo darin ist unsymmetrisch
const el = (name, attrs = {}) => {
  const node = document.createElementNS(NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
};

const active = new Set();

/** Schwache Perspektive: weiter hinten = kleiner. */
function project(p, yaw, pitch, scale, cx, cy) {
  const r = rotX(rotY(p, yaw), pitch);
  const f = 3.4;
  const k = f / (f - r[2]);
  return { x: cx + r[0] * scale * k, y: cy - r[1] * scale * k, z: r[2], k };
}

function mountFigure(host, pattern, weight, equip) {
  const spec = PATTERNS[pattern];
  host.textContent = '';
  if (!spec) return () => {};

  // Sichtfeld in der Form des Kastens: bei festem Quadrat blieb links und
  // rechts breiter Rand ungenutzt, und die Figur wirkte verloren.
  const box = host.getBoundingClientRect();
  const VBW = 100;
  const VBH = box.width > 0 ? Math.max(50, Math.min(160, Math.round((100 * box.height) / box.width))) : 100;
  const svg = el('svg', { viewBox: `0 0 ${VBW} ${VBH}`, class: 'fig' });
  const scene = el('g');
  svg.appendChild(scene);
  host.appendChild(svg);

  const hint = document.createElement('span');
  hint.className = 'fig-hint';
  hint.textContent = '↕↔ ziehen zum Drehen';
  host.appendChild(hint);

  // Dreiviertelansicht steht der stehenden Figur am besten. Eine liegende ist
  // von der Seite dagegen zwangsläufig ein Strich – Rumpf, Arme und Beine
  // liegen in einer Linie. Dort schaut die Kamera von schräg oben auf den
  // Körper, dann trennen sich die Glieder wieder.
  let yaw = spec.view ? spec.view[0] : 25;
  let pitch = spec.view ? spec.view[1] : 8;
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  let lastT = 0;         // zuletzt gezeichneter Punkt der Bewegung

  const onDown = (e) => {
    dragging = true;
    const t = e.touches ? e.touches[0] : e;
    lastX = t.clientX;
    lastY = t.clientY;
    hint.classList.add('gone');
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    yaw = (yaw + (t.clientX - lastX) * 0.6) % 360;
    pitch = (pitch + (t.clientY - lastY) * 0.6) % 360;   // bewusst ohne Grenze
    lastX = t.clientX;
    lastY = t.clientY;
    draw(lastT);   // sofort neu zeichnen, statt auf die Animation zu warten
    e.preventDefault();
  };
  const onUp = () => { dragging = false; };

  host.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  const [a, b] = spec.poses;
  const blend = (t) => {
    const mix = (x, y) => x + (y - x) * t;
    const mixA = (x = A(), y = A()) => A(mix(x.p, y.p), mix(x.a, y.a), mix(x.e, y.e), mix(x.i || 0, y.i || 0));
    const mixL = (x = L(), y = L()) => L(mix(x.p, y.p), mix(x.a, y.a), mix(x.k, y.k));
    return {
      lie: spec.lie,                       // Lage gilt fürs ganze Muster
      stance: spec.stance,
      lean: mix(a.lean || 0, b.lean || 0),
      tilt: mix(a.tilt || 0, b.tilt || 0),
      heel: mix(a.heel || 0, b.heel || 0),
      armL: mixA(a.armL || a.arm, b.armL || b.arm),
      armR: mixA(a.armR || a.arm, b.armR || b.arm),
      legL: mixL(a.legL || a.leg, b.legL || b.leg),
      legR: mixL(a.legR || a.leg, b.legR || b.leg),
    };
  };

  /** Skelett einer Stellung, schon auf den Boden gesetzt. */
  const skeleton = (t) => {
    const j = solve(blend(t));
    // An der Stange festhalten oder auf den Boden setzen. Beim Griff an eine
    // Stange bleiben die Hände stehen und der Körper bewegt sich – andersherum
    // wanderte die Stange mit den Händen mit, was sofort als Fehler auffällt.
    if (spec.anchor === 'bar') {
      const barY = spec.barY === undefined ? 0.52 : spec.barY;
      const hand = [0, 1, 2].map((i) => (j.handL[i] + j.handR[i]) / 2);
      const d = [-hand[0], barY - hand[1], -hand[2]];
      Object.keys(j).forEach((k) => { j[k] = [j[k][0] + d[0], j[k][1] + d[1], j[k][2] + d[2]]; });
      return j;
    }
    const shift = -Math.min(...Object.values(j).map((q) => q[1])) - 0.62;
    Object.keys(j).forEach((k) => { j[k] = [j[k][0], j[k][1] + shift, j[k][2]]; });
    return j;
  };

  // Ausschnitt einmal für das ganze Muster festlegen, aus beiden Endstellungen.
  // Eine feste Größe ließ liegende Übungen klein in einem halbleeren Kasten
  // stehen; ein Maß je Einzelbild würde die Figur beim Abspielen atmen lassen.
  // Radius statt Rechteck, damit auch das Drehen nichts daran ändert.
  const fit = (() => {
    const all = [skeleton(0), skeleton(1)].flatMap((j) => Object.values(j));
    const mid = [0, 1, 2].map((i) => (Math.min(...all.map((q) => q[i])) + Math.max(...all.map((q) => q[i]))) / 2);
    // Radius statt Rechteck: so ändert das Drehen die Größe nicht, und die
    // Figur kann in keiner Lage über den Rand ragen.
    const r = Math.max(...all.map((q) => Math.hypot(q[0] - mid[0], q[1] - mid[1], q[2] - mid[2])));
    // Bodenhöhe einmal aus der Startstellung: bei einem Griff an die Stange
    // liegt der Körper nicht mehr fest auf dem Boden auf, der Boden darf aber
    // trotzdem nicht bei jedem Einzelbild auf und ab wandern.
    const groundY = Math.min(...Object.values(skeleton(0)).map((q) => q[1]));
    return { mid, groundY, scale: (Math.min(VBW, VBH) / 2) * 0.94 / Math.max(r, 0.1) };
  })();
  const gearScale = fit.scale / 40;

  const draw = (t) => {
    lastT = t;
    const pose = blend(t);
    const j = skeleton(t);

    scene.textContent = '';
    const P = (p) => project(
      [p[0] - fit.mid[0], p[1] - fit.mid[1], p[2] - fit.mid[2]], yaw, pitch, fit.scale, VBW / 2, VBH / 2,
    );
    const pts0 = j;   // Weltkoordinaten, für die Ausrichtung der Geräte
    const pts = {};
    Object.entries(j).forEach(([k, v]) => { pts[k] = P(v); });

    const parts = [];

    // Achsen des Skeletts selbst – schon gedreht und gekippt, anders als eine
    // nachgerechnete Näherung. Rumpf und Gerät richten sich danach aus.
    const norm = (v) => {
      const n = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / n, v[1] / n, v[2] / n];
    };
    const midOf = (a2, b2) => [(a2[0] + b2[0]) / 2, (a2[1] + b2[1]) / 2, (a2[2] + b2[2]) / 2];
    const sideAxis = norm([j.shoulderR[0] - j.shoulderL[0], j.shoulderR[1] - j.shoulderL[1], j.shoulderR[2] - j.shoulderL[2]]);
    const upAxis = norm([j.neck[0] - j.hipC[0], j.neck[1] - j.hipC[1], j.neck[2] - j.hipC[2]]);
    // Blickrichtung des Rumpfes: gilt auch im Liegen, wo "vorn" nicht mehr zum
    // Betrachter zeigt.
    const frontAxis = norm([
      sideAxis[1] * upAxis[2] - sideAxis[2] * upAxis[1],
      sideAxis[2] * upAxis[0] - sideAxis[0] * upAxis[2],
      sideAxis[0] * upAxis[1] - sideAxis[1] * upAxis[0],
    ]);

    // Tiefe als Helligkeit: was hinten liegt, wird etwas dunkler. Der
    // Maleralgorithmus allein sagt nur, was verdeckt – nicht, was weiter weg
    // ist; bei gedrehter Figur überlagern sich sonst gleich helle Glieder.
    const depth = (z) => (0.74 + 0.26 * Math.min(1, Math.max(0, (z + 0.9) / 1.8))).toFixed(3);

    /**
     * Gliedmaße als eine einzige Fläche: von w1 auf w2 verjüngt, an beiden
     * Enden halbrund. Ein gleich dicker Strich sieht aus wie ein
     * Strichmännchen – ein Muskel wird zum Gelenk hin schmaler.
     *
     * Bewusst ein Pfad und nicht Viereck plus zwei Kreise: nur so lässt sich
     * eine Trennlinie außen herum ziehen, ohne dass innen Nähte auftauchen.
     */
    const limb = (from, to, w1, w2, cls = 'fig-limb') => {
      const dx = to.x - from.x; const dy = to.y - from.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len; const ny = dx / len;
      const a = Math.max(0.4, w1 * gearScale * from.k);
      const b = Math.max(0.4, w2 * gearScale * to.k);
      const f = (v) => v.toFixed(1);
      const d = `M${f(from.x + nx * a)} ${f(from.y + ny * a)}`
        + ` A${f(a)} ${f(a)} 0 0 1 ${f(from.x - nx * a)} ${f(from.y - ny * a)}`
        + ` L${f(to.x - nx * b)} ${f(to.y - ny * b)}`
        + ` A${f(b)} ${f(b)} 0 0 1 ${f(to.x + nx * b)} ${f(to.y + ny * b)} Z`;
      const z = (from.z + to.z) / 2;
      parts.push({ z, node: el('path', { d, class: cls, opacity: depth(z) }) });
    };

    // Rumpf als Körper mit Tiefe. Eine einzelne Fläche zwischen Schultern und
    // Hüften war von der Seite papierdünn und hatte keine Taille. Drei Ringe
    // (Schulter, Taille, Becken) aus je vier Ecken ergeben einen Rumpf, der aus
    // jeder Richtung Volumen hat.
    const ring = (centre, w, d) => [[1, 1], [1, -1], [-1, -1], [-1, 1]]
      .map(([a2, b2]) => P(add(add(centre, mul(sideAxis, a2 * w)), mul(frontAxis, b2 * d))));
    const shoulderMid = midOf(j.shoulderL, j.shoulderR);
    const hipMid = midOf(j.hipL, j.hipR);
    const waistMid = midOf(midOf(shoulderMid, hipMid), hipMid);   // 75 % Richtung Becken
    const rings = [ring(shoulderMid, 0.200, 0.098), ring(waistMid, 0.125, 0.075), ring(hipMid, 0.150, 0.090)];
    const face = (quad) => {
      const z = quad.reduce((acc, q) => acc + q.z, 0) / quad.length;
      parts.push({
        z,
        node: el('polygon', {
          points: quad.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-torso', opacity: depth(z),
        }),
      });
    };
    face(rings[0]);                                        // Schulterdeckel
    face(rings[2]);                                        // Beckenboden
    [0, 1].forEach((r) => [0, 1, 2, 3].forEach((c) => {
      const d2 = (c + 1) % 4;
      face([rings[r][c], rings[r][d2], rings[r + 1][d2], rings[r + 1][c]]);
    }));
    limb(pts.hipC, pts.neck, 4.2, 3.4, 'fig-spine');
    limb(pts.neck, pts.head, 2.6, 2.2, 'fig-spine');   // Hals schließt die Lücke

    ['L', 'R'].forEach((s) => {
      limb(pts[`shoulder${s}`], pts[`elbow${s}`], 3.4, 2.5);
      limb(pts[`elbow${s}`], pts[`hand${s}`], 2.5, 1.8);
      // Hand als eigener Ballen: sonst hört der Unterarm einfach auf und es
      // ist nicht zu sehen, dass die Figur etwas greift.
      parts.push({
        z: pts[`hand${s}`].z + 0.002,
        node: el('circle', {
          cx: pts[`hand${s}`].x.toFixed(1), cy: pts[`hand${s}`].y.toFixed(1),
          r: (2.4 * gearScale * pts[`hand${s}`].k).toFixed(1),
          class: 'fig-limb', opacity: depth(pts[`hand${s}`].z),
        }),
      });
      limb(pts[`hip${s}`], pts[`knee${s}`], 4.6, 3.1);
      limb(pts[`knee${s}`], pts[`ankle${s}`], 3.1, 1.9);
      limb(pts[`ankle${s}`], pts[`toe${s}`], 1.9, 1.5, 'fig-limb fig-foot');
    });

    // Kopf als Ei entlang der Rumpfachse statt als Kreis
    const headR = RIG.headR * 46 * gearScale * pts.head.k;
    const axis = Math.atan2(pts.head.y - pts.neck.y, pts.head.x - pts.neck.x) * 180 / Math.PI + 90;
    parts.push({
      z: pts.head.z + 0.001,
      node: el('ellipse', {
        cx: pts.head.x.toFixed(1), cy: pts.head.y.toFixed(1),
        rx: (headR * 0.86).toFixed(1), ry: headR.toFixed(1),
        transform: `rotate(${axis.toFixed(1)} ${pts.head.x.toFixed(1)} ${pts.head.y.toFixed(1)})`,
        class: 'fig-head', opacity: depth(pts.head.z),
      }),
    });

    // Gerät, ausgerichtet an den Achsen des Skeletts selbst
    /** Stange samt Scheiben entlang einer Achse im Raum. */
    const barAt = (centre, axis, half, plate) => {
      const e1 = P(add(centre, mul(axis, -half)));
      const e2 = P(add(centre, mul(axis, half)));
      parts.push({
        z: (e1.z + e2.z) / 2,
        node: el('line', {
          x1: e1.x.toFixed(1), y1: e1.y.toFixed(1), x2: e2.x.toFixed(1), y2: e2.y.toFixed(1),
          'stroke-width': (2.2 * gearScale * (e1.k + e2.k) / 2).toFixed(2), class: 'fig-bar',
        }),
      });
      [e1, e2].forEach((q) => parts.push({
        z: q.z + 0.01,
        node: el('circle', { cx: q.x.toFixed(1), cy: q.y.toFixed(1), r: (plate * gearScale * q.k).toFixed(1), class: 'fig-plate' }),
      }));
    };

    if (equip === 'dumbbells') {
      [pts0.handL, pts0.handR].forEach((h) => barAt(h, sideAxis, 0.085, 3.4));
    } else if (equip === 'onehand') {
      barAt(pts0.handR, sideAxis, 0.085, 3.4);
    } else if (equip === 'goblet') {
      // Eine Hantel, senkrecht, von beiden Händen vor der Brust gehalten
      barAt(midOf(pts0.handL, pts0.handR), upAxis, 0.105, 4.4);
    } else if (equip === 'barbell') {
      barAt(midOf(pts0.handL, pts0.handR), sideAxis, 0.34, 5.2);
    } else if (equip === 'hipbar') {
      barAt(midOf(pts0.hipL, pts0.hipR), sideAxis, 0.26, 4.8);
    } else if (equip === 'plate' || equip === 'backplate') {
      // Scheibe auf der Brust (Crunches) bzw. auf dem Rücken (Liegestütze)
      // Die gehaltene Scheibe liegt etwas weiter vorn als die Unterarme,
      // sonst verschwindet sie dahinter.
      const side = equip === 'plate' ? 0.155 : -0.11;
      const q = P(add(j.chest, mul(frontAxis, side)));
      parts.push({
        z: q.z + 0.01,
        node: el('circle', { cx: q.x.toFixed(1), cy: q.y.toFixed(1), r: (5.4 * gearScale * q.k).toFixed(1), class: 'fig-plate' }),
      });
    }

    if (spec.step) {
      // Kasten unter den Füßen: ohne ihn stünde nur eine schräge Figur da und
      // man sähe nicht, dass die Füße erhöht stehen.
      const heel = midOf(j.ankleL, j.ankleR);
      const top = Math.min(j.toeL[1], j.toeR[1]) - 0.02;
      const zc = heel[2]; const xc = heel[0];
      const corner = (sx, sz, y) => P([xc + sx * 0.16, y, zc + sz * 0.26]);
      const face = (quad) => parts.push({
        z: quad.reduce((acc, q) => acc + q.z, 0) / quad.length - 0.05,
        node: el('polygon', {
          points: quad.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-bench',
        }),
      });
      face([corner(-1, -1, top), corner(1, -1, top), corner(1, 1, top), corner(-1, 1, top)]);
      face([corner(-1, 1, top), corner(1, 1, top), corner(1, 1, -0.62), corner(-1, 1, -0.62)]);
      face([corner(1, -1, top), corner(1, 1, top), corner(1, 1, -0.62), corner(1, -1, -0.62)]);
      face([corner(-1, -1, top), corner(-1, 1, top), corner(-1, 1, -0.62), corner(-1, -1, -0.62)]);
    }

    if (spec.seat) {
      // Bank: Sitzfläche knapp unter der Hüfte, zwei Beine bis auf den Boden.
      // Sie liegt im Raum und kippt deshalb beim Drehen mit.
      const top = j.hipC[1] - 0.085;
      const halfW = 0.24; const back = -0.24; const front = 0.30; const thick = 0.055;
      const slab = (y, zs) => zs.map(([sx, sz]) => P([sx * halfW, y, sz]));
      const quad = (pts4, dz) => parts.push({
        z: pts4.reduce((acc, q) => acc + q.z, 0) / 4 + dz,
        node: el('polygon', {
          points: pts4.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-bench',
        }),
      });
      // Sitzfläche und Vorderkante: eine einzelne Fläche sähe von vorn aus wie
      // ein Strich, die Bank hätte keine Dicke.
      quad(slab(top, [[-1, back], [1, back], [1, front], [-1, front]]), -0.04);
      quad([...slab(top, [[-1, front], [1, front]]), ...slab(top - thick, [[1, front], [-1, front]])], -0.03);
      quad([...slab(top, [[1, back], [1, front]]), ...slab(top - thick, [[1, front], [1, back]])], -0.03);
      quad([...slab(top, [[-1, back], [-1, front]]), ...slab(top - thick, [[-1, front], [-1, back]])], -0.03);
      [-0.16, 0.22].forEach((sz) => [-0.18, 0.18].forEach((sx) => {
        const a1 = P([sx, top - thick, sz]); const a2 = P([sx, -0.62, sz]);
        parts.push({
          z: (a1.z + a2.z) / 2 - 0.06,
          node: el('line', {
            x1: a1.x.toFixed(1), y1: a1.y.toFixed(1), x2: a2.x.toFixed(1), y2: a2.y.toFixed(1),
            'stroke-width': (3 * gearScale).toFixed(2), class: 'fig-bench-leg',
          }),
        });
      }));
    }

    if (spec.bar) {
      // Entlang der Schulterachse durch beide Hände: so liegt sie beim Klimmzug
      // quer vor dem Körper und bei den Inverted Rows quer über ihm.
      const centre = midOf(j.handL, j.handR);
      const a1 = P(add(centre, mul(sideAxis, -0.8)));
      const a2 = P(add(centre, mul(sideAxis, 0.8)));
      parts.push({
        z: (a1.z + a2.z) / 2 - 0.02,
        node: el('line', {
          x1: a1.x.toFixed(1), y1: a1.y.toFixed(1), x2: a2.x.toFixed(1), y2: a2.y.toFixed(1),
          class: 'fig-bar-fixed',
        }),
      });
    }
    if (!spec.float) {
      // Bodenscheibe statt Strich: ein Strich unten am Rand sieht aus wie ein
      // Schieberegler; eine Fläche im Raum liest sich als Boden und kippt mit.
      // Mittig unter der Figur, nicht am Ursprung: wer an einer Stange hängt,
      // steht nicht über dem Nullpunkt, und die Scheibe lag dann daneben.
      const gy = spec.anchor === 'bar' ? fit.groundY : -0.62;
      const ring = [];
      for (let a = 0; a < 360; a += 15) {
        ring.push(P([fit.mid[0] + Math.cos(rad(a)) * 0.62, gy, fit.mid[2] + Math.sin(rad(a)) * 0.34]));
      }
      // Immer ganz nach hinten. Sortiert man den Boden wie ein Körperteil ein,
      // legt er sich beim Blick von oben über das hintere Bein und färbt es
      // durch seine halbe Deckkraft braun.
      parts.push({
        z: -Infinity,
        node: el('polygon', {
          points: ring.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),
          class: 'fig-ground',
        }),
      });
    }

    // Maleralgorithmus: hinten zuerst
    parts.sort((p, q) => p.z - q.z).forEach((p) => scene.appendChild(p.node));
  };

  const entry = { draw, effortAt1: !LOWER_TO_1.includes(pattern) };
  // Bei ausgeschalteter Bewegung eine mittlere Stellung zeigen statt der
  // Ausgangsstellung – sonst sieht man von der Übung nichts.
  draw(reduceMotion.matches ? 0.55 : 0);
  active.add(entry);
  return {
    draw,
    setView: (y, pi = 0) => { yaw = y; pitch = pi; draw(lastT); },
    stop: () => {
      active.delete(entry);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    },
  };
}

function clearFigures() {
  active.clear();
}

/**
 * Tempo einer Wiederholung.
 *
 * Hin und zurück gleich schnell sieht aus wie ein Pendel, nicht wie Training.
 * Echte Wiederholungen sind unsymmetrisch: kurz halten, zügig in die
 * Anstrengung, oben oder unten einen Moment stehen, deutlich langsamer zurück.
 * Genau so steht es auch in den Hinweisen ("3 Sekunden kontrolliert ablassen").
 *
 * u läuft von 0 bis 1 durch einen Zyklus, zurück kommt die Stellung zwischen
 * den beiden Endlagen. Welche der beiden die anstrengende ist, hängt von der
 * Übung ab: bei der Kniebeuge ist Stellung 1 unten (die Anstrengung geht
 * zurück nach 0), beim Curl ist Stellung 1 oben.
 */
const ease = (x) => x * x * (3 - 2 * x);
const span = (u, a, b) => ease(Math.min(1, Math.max(0, (u - a) / (b - a))));

function tempo(u, effortAt1) {
  if (effortAt1) {
    if (u < 0.06) return 0;                 // Ausgangsstellung halten
    if (u < 0.34) return span(u, 0.06, 0.34);      // zügig in die Anstrengung
    if (u < 0.44) return 1;                 // oben kurz halten
    return 1 - span(u, 0.44, 1);            // langsam zurück
  }
  if (u < 0.06) return 0;                   // oben stehen
  if (u < 0.62) return span(u, 0.06, 0.62); // langsam ablassen
  if (u < 0.70) return 1;                   // unten kurz halten
  return 1 - span(u, 0.70, 1);              // zügig hoch
}

// Muster, bei denen Stellung 1 das Ende des Ablassens ist, nicht die
// Anstrengung: dort läuft das Tempo andersherum.
const LOWER_TO_1 = ['squat', 'squatbw', 'pushup', 'pushupfeet', 'pike', 'tricepsbar'];

const reduceMotion = window.matchMedia
  ? window.matchMedia('(prefers-reduced-motion: reduce)')
  : { matches: false };

function frame(now) {
  if (document.visibilityState === 'visible' && active.size && !reduceMotion.matches) {
    const u = (now % CYCLE_MS) / CYCLE_MS;
    active.forEach((f) => f.draw(tempo(u, f.effortAt1)));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===== js/body.js ===== */
/*
 * Körperkarte: zeigt in Vorder- und Rückansicht, was heute drankommt.
 *
 * Der Körper entsteht aus einem Skelett, nicht aus einzeln hingelegten Ovalen.
 * Aus denselben Gelenkpunkten werden Silhouette und Muskeln gerechnet: die
 * Gliedmaßen als zum Gelenk hin schmaler werdende Flächen, die Muskeln als
 * Spindeln entlang genau desselben Knochens. Dadurch sitzt der Bizeps
 * zwangsläufig auf dem Oberarm und nicht daneben, und eine Änderung an den
 * Proportionen zieht beides zugleich nach.
 *
 * Rumpf, Brust, Rücken und Gesäß haben keine Knochenachse, die sie beschreiben
 * würde – die sind als Pfade gezeichnet.
 *
 * Feld je Ansicht: 100 × 220, symmetrisch um x = 50.
 */

const MUSCLE_LABEL = {
  chest: 'Brust',
  delts: 'Schultern',
  rearDelts: 'hintere Schulter',
  biceps: 'Bizeps',
  triceps: 'Trizeps',
  abs: 'Bauch',
  lats: 'Rücken',
  traps: 'Nacken',
  glutes: 'Gesäß',
  quads: 'Oberschenkel',
  hamstrings: 'Beinbeuger',
  calves: 'Waden',
};

const BODY_NS = 'http://www.w3.org/2000/svg';

/* ------------------------------------------------------------------ *
 * Skelett – rechte Körperhälfte, die linke wird gespiegelt
 * ------------------------------------------------------------------ */

const J = {
  head: [50, 22], neckTop: [50, 32], neckBase: [50, 45],
  // Arme leicht abgespreizt: liegen sie am Rumpf an, verschmelzen Schulter und
  // Brust zu einem Fleck und man sieht nicht, was hervorgehoben ist.
  shoulder: [70, 53], elbow: [78, 96], wrist: [83, 134], hand: [84, 143],
  hip: [58, 114], knee: [59.5, 162], ankle: [59, 201], toe: [63, 210],
};

const HEAD_RX = 10.8;
const HEAD_RY = 13.4;

const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

/* ------------------------------------------------------------------ *
 * Formen
 * ------------------------------------------------------------------ */

/**
 * Gliedmaße von a nach b, an den Enden wa bzw. wb breit. Zwei Kreise an den
 * Gelenken runden ab und decken zugleich die Naht zum nächsten Glied.
 */
function limb(a, b, wa, wb) {
  const dx = b[0] - a[0]; const dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len; const ny = dx / len;
  const quad = [
    [a[0] + nx * wa, a[1] + ny * wa], [b[0] + nx * wb, b[1] + ny * wb],
    [b[0] - nx * wb, b[1] - ny * wb], [a[0] - nx * wa, a[1] - ny * wa],
  ];
  return [
    ['poly', quad],
    ['e', a[0], a[1], wa, wa, 0],
    ['e', b[0], b[1], wb, wb, 0],
  ];
}

/**
 * Muskelbauch als Spindel entlang des Knochens a–b, von Anteil t0 bis t1 und
 * halb so breit wie w. Liegt damit immer auf dem Glied, dem er gehört.
 */
function belly(a, b, t0, t1, w) {
  const c = lerp(lerp(a, b, t0), lerp(a, b, t1), 0.5);
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const angle = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI - 90;
  return ['e', c[0], c[1], w, (len * (t1 - t0)) / 2, angle];
}

const P = (d) => ['p', d];

/* ------------------------------------------------------------------ *
 * Silhouette
 * ------------------------------------------------------------------ */

const TORSO = P(
  'M50 41 C59 41 66 44 70.5 50 C72.5 57 71 65 69 73 '
  + 'C67 81 64.5 89 64 97 C63.5 105 63.5 111 63.5 116 '
  + 'L36.5 116 C36.5 111 36.5 105 36 97 C35.5 89 33 81 31 73 '
  + 'C29 65 27.5 57 29.5 50 C34 44 41 41 50 41 Z',
);

const PELVIS = P('M36.5 113 H63.5 L62 124 C58.5 130 54 132.5 50 132.5 C46 132.5 41.5 130 38 124 Z');

const FOOT = P('M55.5 197 H63 C64 203 66 208 67 211 C67 213.5 65 214.5 62 214.5 H56 Z');

/** Alles, was kein Trainingsbereich ist: Kopf, Hals, Unterarme, Hände, Füße. */
const FILLER = [
  ['e', J.head[0], J.head[1], HEAD_RX, HEAD_RY, 0],
  ...limb(J.neckTop, J.neckBase, 6.4, 7.6),
  TORSO,
  PELVIS,
  ...limb(J.shoulder, J.elbow, 8.8, 6.2),
  ...limb(J.elbow, J.wrist, 6.2, 4.2),
  ['e', J.hand[0] + 0.4, J.hand[1] - 2, 4.4, 6.4, -6],
  ...limb(J.hip, J.knee, 11.5, 7.6),
  ...limb(J.knee, J.ankle, 7.6, 4.4),
  FOOT,
];

/* ------------------------------------------------------------------ *
 * Muskeln
 * ------------------------------------------------------------------ */

// [Muskel, Formen, auch gespiegelt]
const FRONT = [
  ['traps', [P('M50 41 C56 41 61 43 65.5 47.5 C60 50.5 55 52.5 50 52.5 C45 52.5 40 50.5 34.5 47.5 C39 43 44 41 50 41 Z')], false],
  ['delts', [belly(J.shoulder, J.elbow, -0.08, 0.24, 6.9)], true],
  ['biceps', [belly(J.shoulder, J.elbow, 0.28, 0.90, 5.4)], true],
  ['chest', [P('M50.5 55 C58 54 64.5 57 68 62 C68.5 69 65 75 59 77.5 C55 79 52 78.5 50.5 78 Z')], true],
  // Sechs Felder statt eines Blocks: die Trennlinien zwischen den Formen
  // zeichnen das Muster von selbst, weil jede Fläche ihre eigene Kontur hat.
  ['abs', [
    P('M50.4 81 H56.4 C57 85 57.2 88 57.3 90.6 H50.4 Z'),
    P('M50.4 91.6 H57.3 C57.4 95 57.4 98 57.2 100.8 H50.4 Z'),
    P('M50.4 101.8 H57.2 C57 105 56.5 108.4 55.8 110 C54.2 112.4 52 112.8 50.4 112.6 Z'),
  ], true],
  ['quads', [belly(J.hip, J.knee, 0.02, 0.93, 9.8)], true],
  ['calves', [belly(J.knee, J.ankle, 0.02, 0.52, 6.9)], true],
];

const BACK = [
  ['traps', [P('M50 40 C57 40 63 43 67 47.5 C64 60 60 69 57 74 H43 C40 69 36 60 33 47.5 C37 43 43 40 50 40 Z')], false],
  ['rearDelts', [belly(J.shoulder, J.elbow, -0.08, 0.24, 6.9)], true],
  ['lats', [P('M52 64 C60 65 67 71 69 79 C68 90 62 100 54 107 C53 96 52 80 52 64 Z')], true],
  ['triceps', [belly(J.shoulder, J.elbow, 0.26, 0.90, 5.8)], true],
  ['glutes', [['e', 57, 124, 9.4, 11.5, -12]], true],
  ['hamstrings', [belly(J.hip, J.knee, 0.14, 0.94, 9.4)], true],
  ['calves', [belly(J.knee, J.ankle, 0.02, 0.54, 7.1)], true],
];

/* ------------------------------------------------------------------ *
 * Zeichnen
 * ------------------------------------------------------------------ */

function shapeEl(shape, mirrored) {
  const mx = (x) => (mirrored ? 100 - x : x);
  if (shape[0] === 'e') {
    const [, cx, cy, rx, ry, rot] = shape;
    const node = document.createElementNS(BODY_NS, 'ellipse');
    node.setAttribute('cx', mx(cx).toFixed(2));
    node.setAttribute('cy', cy.toFixed(2));
    node.setAttribute('rx', rx.toFixed(2));
    node.setAttribute('ry', ry.toFixed(2));
    if (rot) {
      const a = mirrored ? -rot : rot;
      node.setAttribute('transform', `rotate(${a.toFixed(1)} ${mx(cx).toFixed(2)} ${cy.toFixed(2)})`);
    }
    return node;
  }
  if (shape[0] === 'poly') {
    const node = document.createElementNS(BODY_NS, 'polygon');
    node.setAttribute('points', shape[1].map(([x, y]) => `${mx(x).toFixed(2)},${y.toFixed(2)}`).join(' '));
    return node;
  }
  const node = document.createElementNS(BODY_NS, 'path');
  node.setAttribute('d', shape[1]);
  if (mirrored) node.setAttribute('transform', 'translate(100,0) scale(-1,1)');
  return node;
}

function halfView(regions, active, primary, label) {
  const g = document.createElementNS(BODY_NS, 'g');

  // Silhouette einmal rechts, einmal gespiegelt – der Rumpf ist schon
  // symmetrisch gezeichnet und käme sonst doppelt.
  FILLER.forEach((shape) => {
    const both = shape === TORSO || shape === PELVIS ? [false] : [false, true];
    both.forEach((m) => {
      const node = shapeEl(shape, m);
      node.setAttribute('class', 'bm-filler');
      g.appendChild(node);
    });
  });

  regions.forEach(([muscle, shapes, mirror]) => {
    const on = active.has(muscle);
    // Zwei Stufen: was eine Übung zuerst trifft, leuchtet voll; was nebenbei
    // mitarbeitet, blasser. Alles gleich hell hieß an einem Ganzkörpertag,
    // dass die Karte nichts mehr aussagt.
    const level = !on ? '' : (primary.has(muscle) ? ' on' : ' on sub');
    shapes.forEach((shape) => {
      [false, ...(mirror ? [true] : [])].forEach((m) => {
        const node = shapeEl(shape, m);
        node.setAttribute('class', `bm-part${level}`);
        if (on) {
          const title = document.createElementNS(BODY_NS, 'title');
          title.textContent = `${MUSCLE_LABEL[muscle] || muscle}${primary.has(muscle) ? '' : ' (mitarbeitend)'}`;
          node.appendChild(title);
        }
        g.appendChild(node);
      });
    });
  });

  const text = document.createElementNS(BODY_NS, 'text');
  text.setAttribute('x', 50);
  text.setAttribute('y', 219);
  text.setAttribute('class', 'bm-label');
  text.textContent = label;
  g.appendChild(text);
  return g;
}

/**
 * Zeichnet Vorder- und Rückansicht nebeneinander.
 *
 * @param {Element} host    Zielelement, wird geleert
 * @param {Set}     active  Muskelregionen, die hervorgehoben werden
 * @param {Set}     primary davon die zuerst beanspruchten; der Rest blasser
 */
function mountBody(host, active, primary = active) {
  host.textContent = '';
  const svg = document.createElementNS(BODY_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 210 226');
  svg.setAttribute('class', 'bodymap');
  svg.setAttribute('role', 'img');

  const label = (m) => MUSCLE_LABEL[m] || m;
  const haupt = [...active].filter((m) => primary.has(m)).map(label);
  const neben = [...active].filter((m) => !primary.has(m)).map(label);
  svg.setAttribute('aria-label', active.size
    ? `Heute vor allem: ${haupt.join(', ') || '–'}${neben.length ? `. Mitarbeitend: ${neben.join(', ')}` : ''}`
    : 'Keine Muskelgruppen hervorgehoben');

  const front = halfView(FRONT, active, primary, 'vorn');
  const back = halfView(BACK, active, primary, 'hinten');
  back.setAttribute('transform', 'translate(110,0)');
  svg.append(front, back);
  host.appendChild(svg);
}

/* ===== js/chart.js ===== */
/*
 * Kleine Verlaufskarten für die Statistik.
 *
 * Bewusst Small Multiples statt eines Diagramms mit vielen Linien: Bei zwölf
 * Muskelgruppen wären zwölf Farben nicht mehr auseinanderzuhalten – schon gar
 * nicht für Farbfehlsichtige. Eine Karte je Reihe braucht dagegen nur eine
 * Farbe, und die Überschrift ersetzt die Legende.
 *
 * Je Karte: Fläche als 10-%-Hauch, Linie 2 px, Endpunkt als Punkt mit Ring in
 * der Untergrundfarbe. Beschriftet wird nur der Endwert – eine Zahl an jedem
 * Punkt liest niemand. Beim Ziehen über die Karte wandert der Punkt mit und
 * die Kopfzeile zeigt den Wert des Tages; die vollständige Reihe steht im
 * aria-label, damit sie auch ohne Sehen zugänglich ist.
 */

const CHART_NS = 'http://www.w3.org/2000/svg';
const VW = 100;
const VH = 30;

const svgEl = (name, attrs = {}) => {
  const node = document.createElementNS(CHART_NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
};

/**
 * Eine Verlaufskarte.
 *
 * @param {object} o
 * @param {string} o.label   Überschrift, ersetzt die Legende
 * @param {Array}  o.points  [{ label, value }] in zeitlicher Reihenfolge
 * @param {string} o.unit    Einheit für die Beschriftung
 * @param {Function} o.fmt   Zahlformatierung
 */
function sparkPanel({ label, points, unit = '', fmt = (v) => String(Math.round(v)) }) {
  const fig = document.createElement('figure');
  fig.className = 'spark';

  const cap = document.createElement('figcaption');
  const name = document.createElement('span');
  name.className = 'spark-name';
  name.textContent = label;
  const val = document.createElement('span');
  val.className = 'spark-val';
  cap.append(name, val);
  fig.appendChild(cap);

  const last = points[points.length - 1];
  const first = points[0];
  const setVal = (p) => { val.textContent = `${fmt(p.value)}${unit ? ` ${unit}` : ''}`; };
  setVal(last);

  const values = points.map((p) => p.value);
  const lo = Math.min(...values);
  const hi = Math.max(...values);
  const span = hi - lo || 1;
  // Bei nur einem Punkt gibt es keine Strecke – dann in die Mitte setzen.
  const xy = points.map((p, i) => [
    points.length === 1 ? VW / 2 : (i / (points.length - 1)) * VW,
    VH - ((p.value - lo) / span) * (VH - 6) - 3,
  ]);

  const svg = svgEl('svg', {
    viewBox: `0 0 ${VW} ${VH}`, class: 'spark-svg', preserveAspectRatio: 'none',
    role: 'img',
    'aria-label': `${label}: ${points.map((p) => `${p.label} ${fmt(p.value)}${unit ? ` ${unit}` : ''}`).join(', ')}`,
  });

  const d = xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  svg.appendChild(svgEl('path', { d: `${d} L${VW} ${VH} L0 ${VH} Z`, class: 'spark-area' }));
  svg.appendChild(svgEl('path', { d, class: 'spark-line' }));

  const dot = svgEl('circle', { cx: xy[xy.length - 1][0], cy: xy[xy.length - 1][1], r: 2.6, class: 'spark-dot' });
  svg.appendChild(dot);
  fig.appendChild(svg);

  const foot = document.createElement('div');
  foot.className = 'spark-foot';
  const delta = last.value - first.value;
  foot.textContent = points.length > 1
    ? `${fmt(first.value)} → ${fmt(last.value)}${unit ? ` ${unit}` : ''}${delta ? ` (${delta > 0 ? '+' : '−'}${fmt(Math.abs(delta))})` : ''}`
    : `einmal · ${first.label}`;
  fig.appendChild(foot);

  // Ziehen über die Karte zeigt den Wert des jeweiligen Tages
  const pick = (e) => {
    const box = svg.getBoundingClientRect();
    const rel = ((e.touches ? e.touches[0] : e).clientX - box.left) / box.width;
    const i = Math.max(0, Math.min(points.length - 1, Math.round(rel * (points.length - 1))));
    dot.setAttribute('cx', xy[i][0]);
    dot.setAttribute('cy', xy[i][1]);
    setVal(points[i]);
    foot.textContent = points[i].label;
  };
  const reset = () => {
    dot.setAttribute('cx', xy[xy.length - 1][0]);
    dot.setAttribute('cy', xy[xy.length - 1][1]);
    setVal(last);
    foot.textContent = points.length > 1
      ? `${fmt(first.value)} → ${fmt(last.value)}${unit ? ` ${unit}` : ''}${delta ? ` (${delta > 0 ? '+' : '−'}${fmt(Math.abs(delta))})` : ''}`
      : `einmal · ${first.label}`;
  };
  fig.addEventListener('pointermove', pick);
  fig.addEventListener('pointerleave', reset);

  return fig;
}

/* ===== js/store.js ===== */
const KEY = 'workout.state.v1';

const DEFAULT_STATE = {
  mode: 'db',            // global default: 'db' (Hanteln) | 'bw' (Bodyweight)
  keepModePerWorkout: true,
  autoShift: true,       // verpasste Tage schieben den Restplan nach hinten
  shift: 0,              // Tage, um die der noch offene Plan verschoben ist
  useExerciseRest: true, // Pause je Übung statt einer festen Länge
  restSeconds: 90,       // feste Pause, wenn useExerciseRest aus ist; 0 = keine
  sound: true,           // Ton am Ende der Pause
  rest: null,            // laufende Pause: { endsAt, total, next }
  weights: {},           // Arbeitsgewicht je Übung in kg, vom Nutzer gepflegt
  session: null,         // laufendes Training: { n, startedAt }
  lastBackup: null,      // { on, done } – Stand der letzten Sicherung
  rounds: [],            // abgeschlossene Durchläufe: [{ finishedOn, log }]
  // { [workoutNo]: { db: {exId: [{w,r,done}]}, bw: {...}, mode, startedOn } }
  log: {},
};

function clone(o) { return JSON.parse(JSON.stringify(o)); }

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return clone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return Object.assign(clone(DEFAULT_STATE), parsed);
  } catch {
    return clone(DEFAULT_STATE);
  }
}

let saveTimer = null;

/**
 * Einmal vorab prüfen, statt auf den ersten fehlgeschlagenen Schreibvorgang zu
 * warten: In privaten Fenstern und manchen eingebetteten Ansichten ist der
 * Speicher gesperrt, und dann darf die App das nicht stillschweigend schlucken.
 */
let storageOk = (() => {
  try {
    localStorage.setItem(`${KEY}.probe`, '1');
    localStorage.removeItem(`${KEY}.probe`);
    return true;
  } catch {
    return false;
  }
})();

/** false, wenn der Browser nichts speichern kann – Eintragungen sind flüchtig. */
function canPersist() { return storageOk; }

function write() {
  saveTimer = null;
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageOk = true;
  } catch {
    storageOk = false; // Speicher voll oder gesperrt
  }
}

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(write, 120);
}

/**
 * Ausstehenden Schreibvorgang sofort ausführen. Nötig, bevor die App in den
 * Hintergrund geht: mobile Browser verwerfen die Seite dort ohne Vorwarnung,
 * und der letzte abgehakte Satz wäre sonst verloren.
 */
function flush() {
  if (saveTimer === null) return;
  clearTimeout(saveTimer);
  write();
}

function emit() {
  listeners.forEach((fn) => fn(state));
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function getState() { return state; }

function setMode(mode) {
  state.mode = mode === 'bw' ? 'bw' : 'db';
  persist();
  emit();
}

/** Modus, in dem ein konkretes Workout bearbeitet wird. */
function workoutMode(n) {
  const entry = state.log[n];
  if (state.keepModePerWorkout && entry && entry.mode) return entry.mode;
  return state.mode;
}

function setWorkoutMode(n, mode) {
  const entry = ensure(n);
  entry.mode = mode;
  state.mode = mode;
  persist();
  emit();
}

function ensure(n) {
  if (!state.log[n]) state.log[n] = { db: {}, bw: {}, mode: state.mode };
  const e = state.log[n];
  if (!e.db) e.db = {};
  if (!e.bw) e.bw = {};
  return e;
}

/** Satz-Array für eine Übung in einem Workout; legt es bei Bedarf an. */
function getSets(n, mode, exId, setCount) {
  const bucket = ensure(n)[mode];
  let arr = bucket[exId];
  if (!Array.isArray(arr)) arr = bucket[exId] = [];
  while (arr.length < setCount) arr.push({ w: '', r: '', done: false });
  if (arr.length > setCount) arr.length = setCount;
  return arr;
}

/** Wurde an diesem Workout überhaupt schon etwas eingetragen oder abgehakt? */
function isStarted(n) {
  const e = state.log[n];
  if (!e) return false;
  return ['db', 'bw'].some((m) => Object.values(e[m] || {}).some(
    (arr) => Array.isArray(arr) && arr.some((s) => s.done || s.w !== '' || s.r !== ''),
  ));
}

/** Tag, an dem tatsächlich trainiert wurde – oder null, solange nichts erfasst ist. */
function startedOn(n) {
  const e = state.log[n];
  return (e && e.startedOn) || null;
}

/** Hält fest, wann eine Einheit begonnen wurde, bzw. löst die Markierung wieder. */
function syncStartedOn(n) {
  const e = state.log[n];
  if (!e) return;
  if (isStarted(n)) {
    if (!e.startedOn) e.startedOn = todayISO();
  } else {
    delete e.startedOn;
  }
}

/**
 * Laufende Pause setzen oder beenden. Gespeichert wird der Endzeitpunkt, nicht
 * die Restdauer – so stimmt die Anzeige auch, wenn das Handy zwischendurch
 * gesperrt war und die App erst später wieder in den Vordergrund kommt.
 */
function setRest(rest) {
  state.rest = rest;
  persist();
  emit();
}

/** Arbeitsgewicht einer Übung; null, solange der Nutzer nichts geändert hat. */
function weightOf(exId) {
  const w = state.weights[exId];
  return typeof w === 'number' ? w : null;
}

function setWeight(exId, kg) {
  const v = Math.max(0, Math.round(kg * 2) / 2); // auf halbe Kilo runden
  state.weights[exId] = v;
  persist();
  emit();
  return v;
}

function startSession(n) {
  state.session = { n, startedAt: Date.now() };
  persist();
  emit();
}

function endSession() {
  state.session = null;
  persist();
  emit();
}

function setShift(days) {
  const v = Math.max(0, Math.round(Number(days) || 0));
  if (v === state.shift) return;
  state.shift = v;
  persist();
  emit();
}

/** Nur lesen – legt nichts an, damit reines Blättern den Speicher nicht füllt. */
function peekSets(n, mode, exId) {
  const e = state.log[n];
  const arr = e && e[mode] && e[mode][exId];
  return Array.isArray(arr) ? arr : null;
}

function updateSet(n, mode, exId, setCount, index, patch) {
  const arr = getSets(n, mode, exId, setCount);
  Object.assign(arr[index], patch);
  ensure(n).mode = mode;
  syncStartedOn(n);
  persist();
  emit();
}

function resetWorkout(n, mode) {
  const e = state.log[n];
  if (!e) return;
  e[mode] = {};
  syncStartedOn(n);
  persist();
  emit();
}

function completeWorkout(n, mode, exList) {
  const e = ensure(n);
  e.mode = mode;
  exList.forEach((item) => {
    const arr = getSets(n, mode, item.id, item.sets);
    arr.forEach((s) => { s.done = true; });
  });
  syncStartedOn(n);
  persist();
  emit();
}

function setSetting(key, value) {
  state[key] = value;
  persist();
  emit();
}

/** Hält fest, dass gesichert wurde – gemessen an der Zahl erledigter Einheiten. */
function markBackup(done) {
  state.lastBackup = { on: todayISO(), done };
  persist();
  emit();
}

/**
 * Plan von vorn beginnen. Der bisherige Verlauf wandert in `rounds`, die
 * Gewichte bleiben stehen – Runde zwei startet also auf dem erreichten Stand
 * und nicht wieder bei den Anfangswerten.
 */
function restartPlan(shiftDays) {
  if (Object.keys(state.log).length) {
    state.rounds.push({ finishedOn: todayISO(), log: state.log });
  }
  state.log = {};
  state.session = null;
  state.rest = null;
  state.shift = Math.max(0, Math.round(Number(shiftDays) || 0));
  persist();
  emit();
}

function exportJSON() {
  return JSON.stringify(state, null, 2);
}

function importJSON(text) {
  const parsed = JSON.parse(text);
  if (!parsed || typeof parsed !== 'object' || typeof parsed.log !== 'object') {
    throw new Error('Unerwartetes Format – "log" fehlt.');
  }
  state = Object.assign(clone(DEFAULT_STATE), parsed);
  persist();
  emit();
}

function resetAll() {
  state = clone(DEFAULT_STATE);
  try { localStorage.removeItem(KEY); } catch { /* ignorieren */ }
  persist();
  emit();
}

const store = { canPersist, completeWorkout, endSession, exportJSON, flush, getSets, getState, importJSON, isStarted, markBackup, peekSets, resetAll, resetWorkout, restartPlan, setMode, setRest, setSetting, setShift, setWeight, setWorkoutMode, startSession, startedOn, subscribe, updateSet, weightOf, workoutMode };

/* ===== js/app.js ===== */
/* ------------------------------------------------------------------ *
 * Hilfsfunktionen
 * ------------------------------------------------------------------ */

const EX_BY_ID = new Map(EXERCISES.map((e) => [e.id, e]));
const view = document.getElementById('view');
const tabbar = document.getElementById('tabbar');
const modeSwitch = document.getElementById('modeSwitch');
const toastEl = document.getElementById('toast');

const MODE_LABEL = { db: 'Hanteln', bw: 'Bodyweight' };

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/**
 * Tatsächlicher Termin einer Einheit.
 *
 * Bereits begonnene Einheiten bleiben auf dem Tag, an dem trainiert wurde –
 * die Historie darf sich nicht rückwirkend verschieben. Alles Offene liegt
 * auf seinem Plandatum plus der aktuellen Verschiebung.
 */
function effDate(w) {
  return store.startedOn(w.n) || addDays(w.date, store.getState().shift);
}

/**
 * Verpasste Tage nachtragen: Ist der Termin der frühesten noch nicht
 * begonnenen Einheit verstrichen, wandert der gesamte Restplan um genau so
 * viele Tage nach hinten, bis diese Einheit auf heute fällt. Die Abstände
 * zwischen den Einheiten bleiben dabei erhalten.
 */
function catchUpPlan() {
  const s = store.getState();
  if (!s.autoShift) return 0;
  const open = PLAN.find((w) => !store.isStarted(w.n));
  if (!open) return 0;
  const missed = daysBetween(effDate(open), todayISO());
  if (missed <= 0) return 0;
  store.setShift(s.shift + missed);
  return missed;
}

/** Die Einheit, die als Nächstes ansteht: die erste noch nicht abgeschlossene. */
function defaultWorkoutNo() {
  const open = PLAN.find((w) => !completedMode(w.n));
  return open ? open.n : PLAN[PLAN.length - 1].n;
}

function workoutByNo(n) {
  return PLAN.find((w) => w.n === n) || PLAN[0];
}

/** Untere Grenze eines Wiederholungsbereichs, z. B. "8–12" -> 8. */
function plannedReps(reps) {
  const m = String(reps).match(/\d+/);
  return m ? Number(m[0]) : 0;
}

/** Variante (db/bw) einer geplanten Übung inkl. Sätze. */
function resolve(item, mode) {
  const ex = EX_BY_ID.get(item.id);
  const v = ex[mode];
  return {
    id: item.id, sets: item.sets, group: ex.group,
    name: v.name, reps: v.reps, equip: v.equip, cue: v.cue, rest: v.rest, pattern: v.pattern, muscles: v.muscles,
    // Zusatzgewicht gibt es nur in der Hantel-Variante und nur, wo die Übung
    // eines kennt – Chin-ups und Sliding Leg Curls etwa nicht.
    weight: mode === 'db' ? ex.weight : null,
    gear: mode === 'db' ? ex.equip : null,    // Gerät der Figur; Bodyweight hat keins
    weightNote: ex.weightNote,
  };
}

/** Gewicht, mit dem diese Übung heute gearbeitet wird. */
function workingWeight(exId) {
  const ex = EX_BY_ID.get(exId);
  if (ex.weight === null) return null;
  const own = store.weightOf(exId);
  return own === null ? ex.weight : own;
}

/**
 * Gewicht, das in diesem Workout tatsächlich benutzt wurde. Sobald der erste
 * Satz steht, ist es festgeschrieben – ein späteres "+2,5 kg" gilt dann fürs
 * nächste Mal und schreibt die heutige Einheit nicht rückwirkend um.
 */
function usedWeight(n, mode, exId) {
  const logged = (store.peekSets(n, mode, exId) || []).find((s) => s.w !== '');
  if (logged) return parseFloat(logged.w);
  return workingWeight(exId);
}

/**
 * Vorschlag, das Gewicht zu erhöhen – doppelte Progression ohne Eingabe.
 *
 * Bedingung: die letzten beiden Male wurde diese Übung mit genau diesem
 * Gewicht komplett durchgezogen. Dann ist sie kein Reiz mehr. Gezählt werden
 * nur die Hantel-Variante und nur Einheiten, in denen wirklich alle Sätze
 * stehen – ein abgebrochenes Workout ist kein Beweis.
 *
 * Bewusst nur ein Vorschlag: ob der Satz sauber war, weiß die App nicht.
 */
const BUMP_KG = 2.5;
const BUMP_NEEDED = 2;

function bumpHint(exId) {
  const ex = EX_BY_ID.get(exId);
  if (!ex || ex.weight === null) return null;
  const current = workingWeight(exId);

  let streak = 0;
  for (let i = PLAN.length - 1; i >= 0; i--) {
    const w = PLAN[i];
    const item = w.ex.find((x) => x.id === exId);
    if (!item) continue;
    const sets = store.peekSets(w.n, 'db', exId);
    if (!sets || !sets.length) continue;
    const complete = sets.length >= item.sets && sets.slice(0, item.sets).every((x) => x.done);
    if (!complete) break;                       // Lücke beendet die Serie
    const used = parseFloat(String(sets[0].w).replace(',', '.'));
    if (!(Math.abs(used - current) < 0.01)) break;   // anderes Gewicht: Serie neu
    streak += 1;
    if (streak >= BUMP_NEEDED) return { from: current, to: current + BUMP_KG, streak };
  }
  return null;
}

/**
 * Sicherung als Datei. Alles liegt nur im Speicher dieses Browsers – Android
 * räumt den bei Platzmangel weg, und "Websitedaten löschen" reicht ebenfalls.
 * Deshalb wird der Stand mitgeschrieben, um später erinnern zu können.
 */
function downloadBackup() {
  const json = store.exportJSON();
  // Manche Umgebungen – eingebettete Ansichten, strenge Browser – lassen den
  // Download stillschweigend fallen. Deshalb steht der Export danach immer
  // auch im Textfeld zum Kopieren.
  const io = document.getElementById('io');
  if (io) io.value = json;
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workout-backup-${todayISO()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  store.markBackup(doneCount());
  toast('Gesichert – falls kein Download kam: Text in „Mehr“ kopieren');
}

/** Zahl der abgeschlossenen Einheiten in dieser Runde. */
function doneCount() {
  return PLAN.filter((w) => completedMode(w.n)).length;
}

/** Wie viele Einheiten seit der letzten Sicherung dazugekommen sind. */
const BACKUP_EVERY = 8;

function backupDue() {
  const done = doneCount();
  const last = store.getState().lastBackup;
  if (!last) return done >= 3 ? done : 0;
  return done - last.done >= BACKUP_EVERY ? done - last.done : 0;
}

/**
 * Abschluss eines laufenden Trainings: zwei Wege, klar getrennt.
 *
 * "Abschließen" behält, was abgehakt ist – auch wenn nicht alles steht.
 * "Abbrechen" verwirft die Einheit ganz, damit sie als nicht trainiert gilt
 * und der Plan sie behandelt wie einen verpassten Tag. Ohne diese Trennung
 * blieb nach jedem Abbruch ein halb abgehaktes Workout stehen.
 */
function sessionButtons(n, mode) {
  const prog = progressOf(n, mode);
  return `
    <div class="btn-row nav">
      <button type="button" class="btn btn-danger" data-act="discard-session">Abbrechen</button>
      <button type="button" class="btn btn-ok" data-act="finish-session">
        ✓ Abschließen${prog.done ? ` (${prog.done}/${prog.total})` : ''}
      </button>
    </div>`;
}

/** Knopf, der den Vorschlag annimmt – oder nichts, wenn keiner ansteht. */
function bumpChip(exId, mode) {
  if (mode !== 'db') return '';
  const hint = bumpHint(exId);
  if (!hint) return '';
  return `<button type="button" class="kg-bump" data-act="accept-bump" data-ex="${exId}" data-kg="${hint.to}">
      ${hint.streak}× alles geschafft · auf ${esc(fmtKg(hint.to))} kg?
    </button>`;
}

function fmtKg(kg) {
  return Number.isInteger(kg) ? String(kg) : kg.toFixed(1).replace('.', ',');
}

/** Pausenlänge für eine Übung – empfohlen oder fest, je nach Einstellung. */
function restFor(item) {
  const s = store.getState();
  if (!s.useExerciseRest) return s.restSeconds;
  return item.rest;
}

function progressOf(n, mode) {
  const w = workoutByNo(n);
  let done = 0;
  let total = 0;
  w.ex.forEach((item) => {
    const arr = store.peekSets(n, mode, item.id) || [];
    total += item.sets;
    done += arr.slice(0, item.sets).filter((s) => s.done).length;
  });
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0, complete: total > 0 && done === total };
}

/** Ist das Workout in irgendeinem Modus abgeschlossen? Gibt den Modus zurück. */
function completedMode(n) {
  const st = store.getState().log[n];
  if (!st) return null;
  for (const m of ['db', 'bw']) {
    if (progressOf(n, m).complete) return m;
  }
  return null;
}

function hasAnyEntry(n, mode) {
  const w = workoutByNo(n);
  return w.ex.some((item) => (store.peekSets(n, mode, item.id) || [])
    .some((s) => s.done || s.w !== ''));
}

/* ------------------------------------------------------------------ *
 * Pausentimer
 * ------------------------------------------------------------------ */

const restBar = document.getElementById('restBar');
const restTime = document.getElementById('restTime');
const restNext = document.getElementById('restNext');
const restFill = document.getElementById('restFill');

let audioCtx = null;
let restTicker = null;
let wakeLock = null;

/**
 * Kurzes Doppelsignal zum Ende der Pause – erzeugt statt geladen, damit die
 * App ohne Netz und ohne zusätzliche Datei auskommt.
 *
 * Der AudioContext entsteht erst beim ersten Abhaken. Mobile Browser lassen
 * Ton nur zu, wenn er auf eine Berührung zurückgeht; genau die ist das.
 */
function initAudio() {
  if (audioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try { audioCtx = new Ctx(); } catch { audioCtx = null; }
}

function beep() {
  if (!store.getState().sound || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  const now = audioCtx.currentTime;
  [0, 0.28].forEach((offset, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = i === 0 ? 880 : 1320;
    gain.gain.setValueAtTime(0.0001, now + offset);
    gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now + offset);
    osc.stop(now + offset + 0.24);
  });
}

/**
 * Displaysperre während der Pause. Ohne sie schläft das Handy ein, der Browser
 * friert die Seite ein – und der Ton käme zu spät oder gar nicht.
 */
async function holdScreen(on) {
  try {
    if (on) {
      if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    } else if (wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch {
    wakeLock = null; // nicht unterstützt oder abgelehnt – kein Beinbruch
  }
}

function startRest(exName, setIndex, sets, secs) {
  if (!secs) return;
  store.setRest({
    endsAt: Date.now() + secs * 1000,
    total: secs,
    next: `Satz ${setIndex + 2} von ${sets} · ${exName}`,
  });
  holdScreen(true);
  tickRest();
}

function endRest(withSignal) {
  if (!restBar) return;
  if (restTicker) { clearInterval(restTicker); restTicker = null; }
  holdScreen(false);
  store.setRest(null);
  restBar.hidden = true;
  document.body.classList.remove('resting');
  if (withSignal) {
    beep();
    if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
  }
}

function tickRest() {
  // Sollten Seite und Skript aus unterschiedlich alten Zwischenspeichern
  // stammen, fehlt die Leiste - dann lieber ohne Timer weiterlaufen als alles
  // mit einem Fehler anhalten.
  if (!restBar) return;
  const rest = store.getState().rest;
  if (!rest) { restBar.hidden = true; document.body.classList.remove('resting'); return; }

  const left = Math.round((rest.endsAt - Date.now()) / 1000);
  if (left <= 0) {
    endRest(true);
    toast('Pause vorbei – nächster Satz');
    return;
  }

  restBar.hidden = false;
  document.body.classList.add('resting');
  restTime.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  restNext.textContent = rest.next;
  restFill.style.width = `${Math.max(0, (left / rest.total) * 100)}%`;

  if (!restTicker) restTicker = setInterval(tickRest, 250);
}

/** Laufzeit des Trainings im Kopfbereich mitzählen, ohne neu zu rendern. */
setInterval(() => {
  const badge = document.getElementById('sessionBadge');
  const sess = store.getState().session;
  if (!badge || !sess) return;
  const secs = Math.floor((Date.now() - sess.startedAt) / 1000);
  badge.textContent = `⏱ ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
}, 1000);

document.getElementById('restSkip')?.addEventListener('click', () => endRest(false));
document.getElementById('restPlus')?.addEventListener('click', () => {
  const rest = store.getState().rest;
  if (!rest) return;
  store.setRest({ ...rest, endsAt: rest.endsAt + 30000, total: rest.total + 30 });
  tickRest();
});

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ------------------------------------------------------------------ *
 * UI-Zustand (nicht persistiert)

const ui = {
  tab: 'dashboard',
  workoutNo: defaultWorkoutNo(),
  openEx: new Set(),
  focus: false,    // Fokus-Ansicht: eine Übung groß
  listView: false, // Übungsliste statt Startansicht

};

 * Dashboard

/** Index der ersten Übung, in der noch ein Satz offen ist. */
function firstOpenExercise(n, mode) {
  const w = workoutByNo(n);
  const idx = w.ex.findIndex((item) => {
    const arr = store.peekSets(n, mode, item.id) || [];
    return arr.slice(0, item.sets).filter((s) => s.done).length < item.sets;
  });
  return idx === -1 ? w.ex.length - 1 : idx;
}

/**
 * Fokus-Ansicht: eine Übung groß, mit vorgeführter Bewegung. Sobald alle Sätze
 * stehen, rückt die App von selbst zur nächsten offenen Übung weiter.
 */
function renderFocus() {
  const n = ui.workoutNo;
  const w = workoutByNo(n);
  const mode = store.workoutMode(n);
  const prog = progressOf(n, mode);

  const i = Math.min(ui.focusIdx, w.ex.length - 1);
  const item = w.ex[i];
  const it = resolve(item, mode);
  const sets = store.getSets(n, mode, it.id, it.sets);
  const doneCount = sets.filter((s) => s.done).length;
  const kg = it.weight === null ? null : usedWeight(n, mode, it.id);
  const next = it.weight === null ? null : workingWeight(it.id);
  const frozen = kg !== null && next !== null && Math.abs(kg - next) > 0.01;

  view.innerHTML = `
    <div class="focus-top">
      <button type="button" class="back-link" data-act="focus-list">☰ Übersicht</button>
      <span class="focus-count">
        <span id="sessionBadge">⏱ 0:00</span> · Übung ${i + 1} von ${w.ex.length} · ${prog.done}/${prog.total} Sätze
      </span>
    </div>

    <div class="focus-fig" id="focusFig"></div>

    <h2 class="focus-name">${esc(it.name)}</h2>
    <div class="focus-meta">${it.sets} Sätze × ${esc(it.reps)} Wdh. · ${esc(it.group)} · ${esc(it.equip)}</div>

    ${kg === null ? '' : `
      <div class="ex-weight focus-weight">
        <button type="button" class="kg-step" data-act="weight-step" data-ex="${it.id}" data-d="-2.5" aria-label="2,5 Kilo weniger">−</button>
        <div class="kg-main">
          <input type="text" inputmode="decimal" class="kg-val" value="${fmtKg(kg)}"
                 data-act="weight-input" data-ex="${it.id}" aria-label="Gewicht in Kilo">
          <span class="kg-unit">kg${it.weightNote ? ` · ${esc(it.weightNote)}` : ''}</span>
        </div>
        <button type="button" class="kg-step kg-plus" data-act="weight-step" data-ex="${it.id}" data-d="2.5" aria-label="2,5 Kilo mehr">+</button>
      </div>
      ${frozen ? `<div class="kg-next focus-next">Nächstes Mal: ${esc(fmtKg(next))} kg</div>` : bumpChip(it.id, mode)}`}

    <div class="focus-sets">
      ${sets.map((s, idx) => `
        <button type="button" class="set-btn focus-set ${s.done ? 'on' : ''}" aria-pressed="${s.done}"
                aria-label="Satz ${idx + 1} von ${it.sets} erledigt"
                data-act="toggle-set" data-ex="${it.id}" data-i="${idx}">${s.done ? '✓' : idx + 1}</button>`).join('')}
    </div>

    <div class="cue focus-cue">${esc(it.cue)}</div>

    <div class="btn-row nav">

/** Letzter protokollierter Eintrag derselben Übung im selben Modus. */
function lastLoggedFor(exId, mode, beforeN) {
  for (let i = PLAN.length - 1; i >= 0; i--) {
    const w = PLAN[i];
    if (w.n >= beforeN) continue;
    const item = w.ex.find((x) => x.id === exId);
    if (!item) continue;
    const arr = store.peekSets(w.n, mode, exId);
    if (!arr) continue;
    const filled = arr.filter((s) => s.w !== '');
    if (!filled.length) continue;
    return { n: w.n, text: filled.map((s) => s.w).join(' · ') };
  }
  return null;
}

 * Statistik
