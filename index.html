<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Workout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <h1 class="brand">Workout</h1>
    <div class="mode-switch" id="modeSwitch" role="group" aria-label="Trainingsmodus">
      <button type="button" class="mode-btn" data-mode="db" aria-pressed="true">🏋️ Hanteln</button>
      <button type="button" class="mode-btn" data-mode="bw" aria-pressed="false">🤸 Bodyweight</button>
    </div>
  </div>
</header>

<main id="view" class="view" role="tabpanel" tabindex="-1" aria-labelledby="tab-dashboard"></main>

<nav class="tabbar" id="tabbar" role="tablist">
  <button type="button" class="tab" id="tab-dashboard" data-tab="dashboard" role="tab" aria-controls="view"><span class="ti">🏠</span><span>Dashboard</span></button>
  <button type="button" class="tab" id="tab-calendar" data-tab="calendar" role="tab" aria-controls="view"><span class="ti">📅</span><span>Kalender</span></button>
  <button type="button" class="tab" id="tab-stats" data-tab="stats" role="tab" aria-controls="view"><span class="ti">📈</span><span>Statistik</span></button>
  <button type="button" class="tab" id="tab-injuries" data-tab="injuries" role="tab" aria-controls="view"><span class="ti">🩹</span><span>Verletzt</span></button>
  <button type="button" class="tab" id="tab-settings" data-tab="settings" role="tab" aria-controls="view"><span class="ti">⚙️</span><span>Mehr</span></button>
</nav>

<div class="rest-bar" id="restBar" hidden>
  <div class="rest-in">
    <div class="rest-time" id="restTime">1:30</div>
    <div class="rest-txt">
      <div class="rest-label" id="restLabel">Pause</div>
      <div class="rest-next" id="restNext"></div>
    </div>
    <button type="button" class="rest-btn" id="restPlus" aria-label="30 Sekunden mehr">+30 s</button>
    <button type="button" class="rest-btn rest-skip" id="restSkip">Fertig</button>
  </div>
  <div class="rest-track"><i id="restFill"></i></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- Die Pause meldet sich mit Ton und Vibration; lautlos braucht es eine Ansage. -->
<div id="restLive" class="sr-only" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
