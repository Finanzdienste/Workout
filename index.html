<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Workout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <h1 class="brand">Workout</h1>
    <div class="mode-switch" id="modeSwitch" role="group" aria-label="Trainingsmodus">
      <button type="button" class="mode-btn" data-mode="db" aria-pressed="true">🏋️ Hanteln</button>
      <button type="button" class="mode-btn" data-mode="bw" aria-pressed="false">🤸 Bodyweight</button>
    </div>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar" role="tablist">
  <button type="button" class="tab" data-tab="dashboard" role="tab"><span class="ti">🏠</span><span>Dashboard</span></button>
  <button type="button" class="tab" data-tab="plan" role="tab"><span class="ti">📅</span><span>Plan</span></button>
  <button type="button" class="tab" data-tab="exercises" role="tab"><span class="ti">💪</span><span>Übungen</span></button>
  <button type="button" class="tab" data-tab="stats" role="tab"><span class="ti">📈</span><span>Statistik</span></button>
  <button type="button" class="tab" data-tab="settings" role="tab"><span class="ti">⚙️</span><span>Mehr</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
