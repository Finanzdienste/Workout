# Bestellt nach jedem Push auf main einen Bau von GitHub Pages.
#
# Pushes aus Claude-Sitzungen lösen den Pages-Bau nicht immer aus: Am 26.10.
# liefen für 99fe79d und 9e43a06 die Prüfungen, aber kein „pages build and
# deployment" – die Seite blieb auf dem alten Stand. Die geplanten Datenläufe
# der Freizeit-App (freizeit/daten/) pushen genauso; ohne diesen Lauf käme
# ihre Woche nie beim Handy an. Hier wird der Bau deshalb ausdrücklich
# bestellt. Hat der Push ihn schon selbst ausgelöst, baut Pages eben zweimal
# denselben Stand – das schadet nicht.
name: Pages anstoßen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  bestellen:
    name: Pages-Bau bestellen
    runs-on: ubuntu-latest
    steps:
      - name: Bau anfordern
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq '.status'
